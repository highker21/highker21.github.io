<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NP國考 內分泌新陳代謝 互動練習</title>
<style>
:root {
  --primary: #2563eb;
  --primary-light: #dbeafe;
  --success: #16a34a;
  --success-light: #dcfce7;
  --danger: #dc2626;
  --danger-light: #fee2e2;
  --warning: #d97706;
  --warning-light: #fef3c7;
  --bg: #f8fafc;
  --card: #ffffff;
  --border: #e2e8f0;
  --text: #1e293b;
  --muted: #64748b;
  --radius: 12px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
header { background: var(--primary); color: white; padding: 1rem 1.5rem; display: flex; align-items: center; gap: 1rem; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,.2); }
header h1 { font-size: clamp(1rem, 2.5vw, 1.3rem); font-weight: 700; }
header .badge { background: rgba(255,255,255,.2); border-radius: 999px; padding: .2rem .8rem; font-size: .8rem; }
.container { max-width: 900px; margin: 0 auto; padding: 1.5rem 1rem; }

/* Setup Panel */
#setup-panel { background: var(--card); border-radius: var(--radius); padding: 1.5rem; box-shadow: 0 1px 4px rgba(0,0,0,.08); margin-bottom: 1.5rem; }
#setup-panel h2 { font-size: 1.1rem; margin-bottom: 1rem; color: var(--primary); }
.filter-group { margin-bottom: 1rem; }
.filter-group label { font-size: .85rem; color: var(--muted); display: block; margin-bottom: .5rem; font-weight: 600; }
.topic-btns { display: flex; flex-wrap: wrap; gap: .5rem; }
.topic-btn { background: white; border: 2px solid var(--border); border-radius: 999px; padding: .35rem .9rem; font-size: .82rem; cursor: pointer; transition: all .15s; }
.topic-btn.active { background: var(--primary); border-color: var(--primary); color: white; }
.topic-btn:hover { border-color: var(--primary); color: var(--primary); }
.topic-btn.active:hover { color: white; }
.mode-btns { display: flex; gap: .5rem; flex-wrap: wrap; }
.mode-btn { background: white; border: 2px solid var(--border); border-radius: 999px; padding: .35rem 1rem; font-size: .85rem; cursor: pointer; transition: all .15s; }
.mode-btn.active { background: var(--primary); border-color: var(--primary); color: white; }
.start-btn { background: var(--primary); color: white; border: none; border-radius: var(--radius); padding: .75rem 2rem; font-size: 1rem; font-weight: 700; cursor: pointer; display: block; width: 100%; margin-top: 1rem; transition: opacity .15s; }
.start-btn:hover { opacity: .9; }

/* Progress */
#progress-bar-wrap { background: var(--border); border-radius: 999px; height: 6px; margin-bottom: 1rem; overflow: hidden; }
#progress-bar { height: 100%; background: var(--primary); transition: width .3s; border-radius: 999px; }
.progress-info { display: flex; justify-content: space-between; align-items: center; font-size: .85rem; color: var(--muted); margin-bottom: .5rem; }

/* Question Card */
#quiz-area { display: none; }
.q-card { background: var(--card); border-radius: var(--radius); padding: 1.5rem; box-shadow: 0 1px 4px rgba(0,0,0,.08); margin-bottom: 1rem; }
.q-meta { display: flex; gap: .75rem; align-items: center; flex-wrap: wrap; margin-bottom: 1rem; }
.q-num { font-weight: 700; color: var(--primary); font-size: 1rem; }
.q-year { background: var(--primary-light); color: var(--primary); border-radius: 999px; padding: .2rem .7rem; font-size: .8rem; }
.q-topic { background: var(--warning-light); color: var(--warning); border-radius: 999px; padding: .2rem .7rem; font-size: .8rem; }
.q-text { font-size: 1rem; line-height: 1.75; margin-bottom: 1.25rem; }
.options { display: grid; gap: .6rem; }
.opt-btn { background: white; border: 2px solid var(--border); border-radius: 10px; padding: .75rem 1rem; text-align: left; cursor: pointer; font-size: .95rem; line-height: 1.5; transition: all .15s; display: flex; gap: .75rem; align-items: flex-start; }
.opt-btn:hover:not(:disabled) { border-color: var(--primary); background: var(--primary-light); }
.opt-btn .key { font-weight: 700; min-width: 1.5rem; color: var(--muted); }
.opt-btn.correct { border-color: var(--success); background: var(--success-light); }
.opt-btn.correct .key { color: var(--success); }
.opt-btn.wrong { border-color: var(--danger); background: var(--danger-light); }
.opt-btn.wrong .key { color: var(--danger); }
.opt-btn:disabled { cursor: default; }

/* Result badge */
.result-badge { display: inline-flex; align-items: center; gap: .4rem; padding: .4rem 1rem; border-radius: 999px; font-weight: 700; font-size: .9rem; margin: .75rem 0 .5rem; }
.result-badge.correct { background: var(--success-light); color: var(--success); }
.result-badge.wrong { background: var(--danger-light); color: var(--danger); }

/* Explanation */
.explanation { background: #f8fafc; border-left: 4px solid var(--primary); border-radius: 0 8px 8px 0; padding: 1rem 1.2rem; margin-top: .75rem; font-size: .92rem; line-height: 1.8; }

/* Markdown Table styles */
.md-table-wrap { overflow-x: auto; margin: .6rem 0; border-radius: 8px; border: 1px solid var(--border); }
.md-table { width: 100%; border-collapse: collapse; font-size: .88rem; min-width: 320px; }
.md-table th { background: var(--primary); color: white; padding: .45rem .75rem; text-align: center; font-weight: 600; border: 1px solid rgba(255,255,255,.2); white-space: nowrap; }
.md-table td { padding: .4rem .75rem; border: 1px solid var(--border); vertical-align: top; line-height: 1.5; }
.md-table tr:nth-child(even) td { background: #f1f5f9; }
.md-table tr:hover td { background: var(--primary-light); }

/* Navigation */
.nav-row { display: flex; gap: .5rem; justify-content: space-between; align-items: center; flex-wrap: wrap; }
.nav-btn { background: white; border: 2px solid var(--border); border-radius: 8px; padding: .5rem 1.1rem; cursor: pointer; font-size: .9rem; transition: all .15s; }
.nav-btn:hover { border-color: var(--primary); color: var(--primary); }
.nav-btn:disabled { opacity: .4; cursor: default; }
.finish-btn { background: var(--success); color: white; border: none; border-radius: 8px; padding: .5rem 1.2rem; cursor: pointer; font-size: .9rem; font-weight: 600; }
.finish-btn:hover { opacity: .9; }

/* Score Panel */
#score-panel { display: none; background: var(--card); border-radius: var(--radius); padding: 1.5rem; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
.score-header { text-align: center; margin-bottom: 1.5rem; }
.score-circle { width: 120px; height: 120px; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 0 auto 1rem; font-weight: 700; }
.score-num { font-size: 2rem; }
.score-label { font-size: .8rem; color: var(--muted); }
.score-pass { background: var(--success-light); border: 4px solid var(--success); color: var(--success); }
.score-fail { background: var(--danger-light); border: 4px solid var(--danger); color: var(--danger); }
.score-table { width: 100%; border-collapse: collapse; margin-top: 1rem; font-size: .9rem; }
.score-table th { background: var(--primary); color: white; padding: .5rem .75rem; text-align: left; }
.score-table td { padding: .5rem .75rem; border-bottom: 1px solid var(--border); }
.score-table tr:nth-child(even) td { background: var(--bg); }
.retry-btn { background: var(--primary); color: white; border: none; border-radius: var(--radius); padding: .75rem 1.5rem; font-size: .95rem; font-weight: 700; cursor: pointer; margin-top: 1rem; margin-right: .5rem; }
.retry-wrong-btn { background: var(--danger); color: white; border: none; border-radius: var(--radius); padding: .75rem 1.5rem; font-size: .95rem; font-weight: 700; cursor: pointer; margin-top: 1rem; }

/* Dot navigator */
.dot-nav { display: flex; flex-wrap: wrap; gap: 4px; margin: 1rem 0; }
.dot { width: 20px; height: 20px; border-radius: 50%; background: var(--border); cursor: pointer; transition: all .15s; border: 2px solid transparent; }
.dot.current { border-color: var(--primary); }
.dot.answered-correct { background: var(--success); }
.dot.answered-wrong { background: var(--danger); }
.dot:hover { transform: scale(1.2); }

@media (max-width: 600px) {
  header { padding: .75rem 1rem; }
  .container { padding: 1rem .75rem; }
  .q-card { padding: 1rem; }
  .opt-btn { font-size: .88rem; }
  .md-table { font-size: .8rem; }
  .md-table th, .md-table td { padding: .35rem .5rem; }
}
</style>
</head>
<body>
<header>
  <div>
    <h1>🩺 NP國考 內分泌新陳代謝 互動練習</h1>
  </div>
  <div class="badge" id="header-count">103–114年 · 121題</div>
</header>
<div class="container">

  <!-- Setup Panel -->
  <div id="setup-panel">
    <h2>📋 選擇練習範圍</h2>
    <div class="filter-group">
      <label>主題篩選</label>
      <div class="topic-btns">
        <button class="topic-btn active" data-topic="all" onclick="toggleTopic(this)">全部主題</button>
        <button class="topic-btn" data-topic="一、糖尿病（Diabetes Mellitus）" onclick="toggleTopic(this)">一、糖尿病</button>
        <button class="topic-btn" data-topic="二、甲狀腺疾病（Thyroid Disorders）" onclick="toggleTopic(this)">二、甲狀腺疾病</button>
        <button class="topic-btn" data-topic="三、副甲狀腺疾病（Parathyroid Disorders）" onclick="toggleTopic(this)">三、副甲狀腺疾病</button>
        <button class="topic-btn" data-topic="四、腎上腺疾病（Adrenal Disorders）" onclick="toggleTopic(this)">四、腎上腺疾病</button>
        <button class="topic-btn" data-topic="五、腦垂體疾病（Pituitary Disorders）" onclick="toggleTopic(this)">五、腦垂體疾病</button>
        <button class="topic-btn" data-topic="六、高血脂（Dyslipidemia）" onclick="toggleTopic(this)">六、高血脂</button>
        <button class="topic-btn" data-topic="七、電解質異常（Electrolyte Disorders）" onclick="toggleTopic(this)">七、電解質異常</button>
        <button class="topic-btn" data-topic="八、痛風（Gout）" onclick="toggleTopic(this)">八、痛風</button>
        <button class="topic-btn" data-topic="九、肥胖／代謝症候群（Obesity / Metabolic Syndrome）" onclick="toggleTopic(this)">九、肥胖／代謝症候群</button>
        <button class="topic-btn" data-topic="十、其他內分泌（Other Endocrine）" onclick="toggleTopic(this)">十、其他內分泌</button>
      </div>
    </div>
    <div class="filter-group">
      <label>出題方式</label>
      <div class="mode-btns">
        <button class="mode-btn active" data-mode="sequential" onclick="selectMode(this)">📖 順序練習</button>
        <button class="mode-btn" data-mode="random" onclick="selectMode(this)">🔀 隨機出題</button>
      </div>
    </div>
    <button class="start-btn" onclick="startQuiz()">開始練習 ▶</button>
  </div>

  <!-- Quiz Area -->
  <div id="quiz-area">
    <div class="progress-info">
      <span id="progress-text">第 1 題 / 共 121 題</span>
      <span id="score-text">✓ 0 &nbsp; ✗ 0</span>
    </div>
    <div id="progress-bar-wrap"><div id="progress-bar" style="width:0%"></div></div>
    <div class="dot-nav" id="dot-nav"></div>
    <div id="q-card-area"></div>
    <div class="nav-row" style="margin-top:.75rem">
      <button class="nav-btn" onclick="goTo(currentIdx-1)" id="btn-prev">← 上一題</button>
      <button class="nav-btn" onclick="goTo(currentIdx+1)" id="btn-next">下一題 →</button>
      <button class="finish-btn" onclick="showScore()">🏁 結束並計分</button>
    </div>
  </div>

  <!-- Score Panel -->
  <div id="score-panel">
    <div class="score-header">
      <div class="score-circle" id="score-circle">
        <div class="score-num" id="score-num">--</div>
        <div class="score-label">正確率</div>
      </div>
      <div id="score-summary"></div>
    </div>
    <table class="score-table">
      <thead><tr><th>主題</th><th>答對</th><th>答錯/未答</th><th>正確率</th></tr></thead>
      <tbody id="score-tbody"></tbody>
    </table>
    <div style="display:flex;flex-wrap:wrap;gap:.5rem;margin-top:1rem">
      <button class="retry-btn" onclick="restartQuiz()">🔄 重新練習</button>
      <button class="retry-wrong-btn" id="retry-wrong-btn" onclick="retryWrong()">❌ 練習錯題</button>
    </div>
  </div>
</div>

    "explanation": "胰島素幫浦（CSII，持續皮下胰島素輸注）的優點：\n- 可設定持續基礎速率（basal rate）+ 餐前追加劑量（bolus），模擬正常胰臟分泌\n- 改善HbA1c控制、減少血糖波動（尤其黎明現象）\n- 因飲食彈性較大（可彈性設定追加劑量），生活品質較佳\n\n但胰島素幫浦**無法完全消除低血糖風險**，低血糖仍可發生（尤其劑量設定不當、管路問題時）。\n\n- **(A) 正確**：基礎速率+餐前追加劑量確實模擬生理性胰島素分泌，此為優點。\n- **(B) 正確**：相較每日多次注射（MDI），幫浦可更精細調整，減少血糖大幅波動。\n- **(C) 錯誤（本題答案）**：胰島素幫浦**無法「完全消除」低血糖**，只能降低低血糖發生率，仍有低血糖風險。\n- **(D) 正確**：幫浦可依據進食量彈性追加劑量，飲食選擇較靈活，為其優點。\n\n\n---"

let filteredQ = [];
let queue = [];
let currentIdx = 0;
let answered = {};
let wrongIds = new Set();
let selectedTopics = new Set(['all']);
let quizMode = 'sequential';

function toggleTopic(btn) {
  const topic = btn.dataset.topic;
  if (topic === 'all') {
    selectedTopics = new Set(['all']);
    document.querySelectorAll('.topic-btn[data-topic]').forEach(b => {
      b.classList.toggle('active', b.dataset.topic === 'all');
    });
  } else {
    selectedTopics.delete('all');
    document.querySelector('.topic-btn[data-topic="all"]').classList.remove('active');
    if (selectedTopics.has(topic)) {
      selectedTopics.delete(topic);
      btn.classList.remove('active');
    } else {
      selectedTopics.add(topic);
      btn.classList.add('active');
    }
    if (selectedTopics.size === 0) {
      selectedTopics.add('all');
      document.querySelector('.topic-btn[data-topic="all"]').classList.add('active');
    }
  }
}

function selectMode(btn) {
  quizMode = btn.dataset.mode;
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

function startQuiz() {
  if (selectedTopics.has('all')) {
    filteredQ = [...ALL_QUESTIONS];
  } else {
    filteredQ = ALL_QUESTIONS.filter(q => selectedTopics.has(q.topic));
  }
  if (quizMode === 'random') {
    filteredQ = [...filteredQ].sort(() => Math.random() - .5);
  }
  queue = filteredQ;
  currentIdx = 0;
  answered = {};
  wrongIds = new Set();
  document.getElementById('setup-panel').style.display = 'none';
  document.getElementById('quiz-area').style.display = 'block';
  document.getElementById('score-panel').style.display = 'none';
  buildDots();
  renderQuestion();
}

function buildDots() {
  const nav = document.getElementById('dot-nav');
  nav.innerHTML = '';
  queue.forEach((q, idx) => {
    const dot = document.createElement('div');
    dot.className = 'dot';
    dot.title = q.title;
    dot.id = 'dot-' + idx;
    dot.onclick = () => goTo(idx);
    nav.appendChild(dot);
  });
}

function goTo(idx) {
  if (idx < 0 || idx >= queue.length) return;
  currentIdx = idx;
  renderQuestion();
}

function escHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function inlineMd(s) {
  // Escape HTML first, then apply inline markdown
  return escHtml(s)
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/(?<!\*)\*(?!\*)(.+?)(?<!\*)\*(?!\*)/g, '<em>$1</em>')
    .replace(/`([^`]+)`/g, '<code style="background:#e2e8f0;padding:.1em .4em;border-radius:4px;font-size:.9em">$1</code>');
}

// Check if a line looks like a markdown table row
function isTableRow(line) {
  return line.trim().startsWith('|') && line.trim().endsWith('|');
}

// Check if a line is a separator row (|---|---|)
function isSeparatorRow(line) {
  return /^\|[\s\-:]+(\|[\s\-:]+)*\|$/.test(line.trim());
}

// Parse a table row into cells
function parseTableRow(line) {
  return line.trim()
    .replace(/^\|/, '').replace(/\|$/, '')
    .split('|')
    .map(cell => cell.trim());
}

// Main markdown to HTML converter with full table support
function mdToHtml(text) {
  const lines = text.split('\n');
  let html = '';
  let i = 0;

  while (i < lines.length) {
    const line = lines[i];

    // ── Detect Markdown table ──
    if (isTableRow(line)) {
      // Collect consecutive table lines
      const tableLines = [];
      while (i < lines.length && isTableRow(lines[i])) {
        tableLines.push(lines[i]);
        i++;
      }

      // Find header / separator / body
      let headerIdx = -1, sepIdx = -1;
      for (let j = 0; j < tableLines.length; j++) {
        if (isSeparatorRow(tableLines[j])) { sepIdx = j; break; }
      }
      if (sepIdx > 0) headerIdx = sepIdx - 1;

      let tableHtml = '<div class="md-table-wrap"><table class="md-table">';

      // Header rows (everything before separator)
      if (headerIdx >= 0) {
        tableHtml += '<thead>';
        for (let j = 0; j <= headerIdx; j++) {
          const cells = parseTableRow(tableLines[j]);
          tableHtml += '<tr>' + cells.map(c => `<th>${inlineMd(c)}</th>`).join('') + '</tr>';
        }
        tableHtml += '</thead>';
      }

      // Body rows (everything after separator)
      const bodyStart = sepIdx >= 0 ? sepIdx + 1 : 0;
      if (bodyStart < tableLines.length) {
        tableHtml += '<tbody>';
        for (let j = bodyStart; j < tableLines.length; j++) {
          const cells = parseTableRow(tableLines[j]);
          tableHtml += '<tr>' + cells.map(c => `<td>${inlineMd(c)}</td>`).join('') + '</tr>';
        }
        tableHtml += '</tbody>';
      }

      tableHtml += '</table></div>';
      html += tableHtml;
      continue;
    }

    // ── List item: - **Label**：text ──
    if (/^- \*\*/.test(line)) {
      // Check if this starts a list block
      let listHtml = '<ul style="list-style:none;padding:0;margin:.5rem 0">';
      while (i < lines.length && /^- /.test(lines[i]) && !isTableRow(lines[i])) {
        const m = lines[i].match(/^- \*\*(.+?)\*\*[：:](.*)/);
        if (m) {
          listHtml += '<li style="margin:.3rem 0;padding:.4rem .75rem;border-radius:6px;background:#f1f5f9;display:flex;gap:.5rem">'
            + '<strong style="white-space:nowrap">' + escHtml(m[1]) + '</strong>'
            + '<span>：' + inlineMd(m[2].trim()) + '</span></li>';
        } else {
          listHtml += '<li style="margin:.3rem 0;padding:.2rem 0">' + inlineMd(lines[i].slice(2)) + '</li>';
        }
        i++;
      }
      listHtml += '</ul>';
      html += listHtml;
      continue;
    }

    // ── Plain list item ──
    if (/^- /.test(line) && !isTableRow(line)) {
      let listHtml = '<ul style="padding-left:1.3rem;margin:.4rem 0">';
      while (i < lines.length && /^- /.test(lines[i]) && !isTableRow(lines[i])) {
        listHtml += '<li style="margin:.2rem 0">' + inlineMd(lines[i].slice(2)) + '</li>';
        i++;
      }
      listHtml += '</ul>';
      html += listHtml;
      continue;
    }

    // ── Heading (###) ──
    if (/^#{1,4} /.test(line)) {
      const m = line.match(/^(#{1,4}) (.+)/);
      const level = m[1].length;
      const sz = ['1.1rem','1rem','.95rem','.9rem'][level-1] || '.9rem';
      html += `<p style="font-weight:700;font-size:${sz};margin:.6rem 0 .3rem;color:var(--primary)">${inlineMd(m[2])}</p>`;
      i++;
      continue;
    }

    // ── Blank line ──
    if (line.trim() === '') { i++; continue; }

    // ── Paragraph ──
    html += '<p style="margin:.4rem 0">' + inlineMd(line) + '</p>';
    i++;
  }

  return html;
}

function renderQuestion() {
  const q = queue[currentIdx];
  const a = answered[q.id];
  const total = queue.length;

  // Update progress
  const answeredCount = Object.keys(answered).length;
  const correctCount = Object.values(answered).filter(x => x.correct).length;
  document.getElementById('progress-text').textContent = `第 ${currentIdx+1} 題 / 共 ${total} 題`;
  document.getElementById('score-text').innerHTML = `✓ ${correctCount} &nbsp; ✗ ${answeredCount - correctCount}`;
  const pct = total > 0 ? (currentIdx / total * 100).toFixed(0) : 0;
  document.getElementById('progress-bar').style.width = pct + '%';

  // Update dots
  document.querySelectorAll('.dot').forEach((d, i) => {
    const dq = queue[i];
    const da = answered[dq.id];
    d.className = 'dot'
      + (i === currentIdx ? ' current' : '')
      + (da ? (da.correct ? ' answered-correct' : ' answered-wrong') : '');
  });

  document.getElementById('btn-prev').disabled = currentIdx === 0;
  document.getElementById('btn-next').disabled = currentIdx === queue.length - 1;

  const topicShort = q.topic.replace(/（.+?）/, '').trim();

  let optHtml = '';
  q.options.forEach(opt => {
    let cls = 'opt-btn';
    if (a) {
      if (opt.key === q.answer) cls += ' correct';
      else if (opt.key === a.selected) cls += ' wrong';
    }
    optHtml += `<button class="${cls}" ${a ? 'disabled' : ''} onclick="selectOption(${q.id}, '${opt.key}')">
      <span class="key">${opt.key}</span>
      <span>${inlineMd(opt.text)}</span>
    </button>`;
  });

  let resultHtml = '';
  let expHtml = '';
  if (a) {
    resultHtml = `<div class="result-badge ${a.correct ? 'correct' : 'wrong'}">${a.correct ? '✅ 答對了！' : '❌ 答錯了'}</div>`;
    expHtml = `<div class="explanation">${mdToHtml(q.explanation)}</div>`;
  }

  document.getElementById('q-card-area').innerHTML = `<div class="q-card">
    <div class="q-meta">
      <span class="q-num">第 ${q.num} 題</span>
      <span class="q-year">🗓 ${escHtml(q.year)}</span>
      <span class="q-topic">📚 ${escHtml(topicShort)}</span>
    </div>
    <div class="q-text">${inlineMd(q.question)}</div>
    <div class="options">${optHtml}</div>
    ${resultHtml}
    ${expHtml}
  </div>`;
}

function selectOption(qId, selected) {
  const q = queue.find(x => x.id === qId);
  if (!q || answered[qId]) return;
  const correct = selected === q.answer;
  answered[qId] = { selected, correct };
  if (!correct) wrongIds.add(qId);
  renderQuestion();
}

function showScore() {
  document.getElementById('quiz-area').style.display = 'none';
  document.getElementById('score-panel').style.display = 'block';

  const total = queue.length;
  const answeredCount = Object.keys(answered).length;
  const correctCount = Object.values(answered).filter(x => x.correct).length;
  const allPct = total > 0 ? Math.round(correctCount / total * 100) : 0;

  const circle = document.getElementById('score-circle');
  circle.className = 'score-circle ' + (allPct >= 60 ? 'score-pass' : 'score-fail');
  document.getElementById('score-num').textContent = allPct + '%';
  document.getElementById('score-summary').innerHTML =
    `<p style="margin-top:.5rem">答題 <strong>${answeredCount}</strong> / ${total} 題 &nbsp;｜&nbsp; 答對 <strong>${correctCount}</strong> 題 &nbsp;｜&nbsp; 答錯 <strong>${answeredCount - correctCount}</strong> 題</p>`;

  const topics = {};
  queue.forEach(q => {
    const t = q.topic.replace(/（.+?）/, '').trim();
    if (!topics[t]) topics[t] = { total: 0, correct: 0 };
    topics[t].total++;
    const a = answered[q.id];
    if (a && a.correct) topics[t].correct++;
  });

  let rows = '';
  Object.entries(topics).forEach(([t, s]) => {
    const tp = s.total > 0 ? Math.round(s.correct / s.total * 100) : 0;
    const bar = `<div style="background:#e2e8f0;border-radius:4px;height:6px;margin-top:3px">
      <div style="background:${tp>=60?'var(--success)':'var(--danger)'};width:${tp}%;height:100%;border-radius:4px"></div></div>`;
    rows += `<tr><td>${escHtml(t)}</td><td>${s.correct}</td><td>${s.total - s.correct}</td><td>${tp}%${bar}</td></tr>`;
  });
  document.getElementById('score-tbody').innerHTML = rows;
  document.getElementById('retry-wrong-btn').style.display = wrongIds.size > 0 ? 'inline-block' : 'none';
}

function restartQuiz() {
  document.getElementById('score-panel').style.display = 'none';
  document.getElementById('setup-panel').style.display = 'block';
}

function retryWrong() {
  queue = ALL_QUESTIONS.filter(q => wrongIds.has(q.id));
  if (queue.length === 0) return;
  currentIdx = 0;
  answered = {};
  wrongIds = new Set();
  document.getElementById('score-panel').style.display = 'none';
  document.getElementById('quiz-area').style.display = 'block';
  buildDots();
  renderQuestion();
}
</script>
