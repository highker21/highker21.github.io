   ['During an attack, <b>do not stop your medication yourself</b>','Keep taking the urate-lowering drug you are on. For the acute phase use ice, rest, and the anti-inflammatory or colchicine your doctor prescribed. A normal uric acid level does not mean you can stop the drug.'],
  ],
  foodhead:['Light','Category','What it covers'],
  food:[

   ['g','Fine','Vegetables','All of them, including shiitake, asparagus, spinach and bean sprouts, which are often wrongly said to be off limits'],
   ['g','Fine','Beans &amp; soy foods','Tofu, soy milk, soybeans, edamame; they do not increase attacks and can serve as your protein'],

   ['g','Fine','Fruit','2 servings of whole fruit a day &mdash; do not blend it into juice'],

   ['y','In moderation','Ordinary fish','Sea bass, sea bream, salmon and mackerel in moderation; do not drink the fish soup'],
   ['y','In moderation','Nuts','One serving a day (about 10 g, 1 disposable soup spoon); moderate in purine, good fats'],

   ['r','Avoid','Concentrated soups &amp; broth bases','Bone broth, chicken essence, gravy, hotpot bases, braising liquid &mdash; the purines all dissolve into the liquid'],

  mythtitle:'These claims are not supported by guidelines or research',
  mythhead:['What you often hear','What is actually true'],
  myths:[
   ['&ldquo;You can&rsquo;t have tofu or soy milk&rdquo;','Plant purines are not linked to gout attacks, and several cohort studies show soy foods do not raise the risk. Soy foods are fine and can replace some meat.'],
   ['&ldquo;Avoid shiitake, asparagus and spinach&rdquo;','Same as above. The guidelines explicitly place no restriction on vegetables; a number on a purine-content table is not the same as an effect on blood uric acid.'],
   ['&ldquo;Just cut out seafood and you&rsquo;re fine&rdquo;','Alcohol and sugary drinks affect uric acid and attacks more than seafood does. Many people give up seafood while still having bubble tea and beer daily. Change those two first.'],
   ['&ldquo;Cherries or vitamin C will lower uric acid&rdquo;','The 2020 ACR guideline does not recommend vitamin C supplements; the cherry studies are not good enough to support a recommendation. Uric acid comes down with medication; diet&rsquo;s job is less alcohol and less sugar.'],
   ['&ldquo;Stop the urate-lowering drug during an attack&rdquo;','Keep taking it during an acute attack. Stopping makes uric acid swing and drags the attack out longer. Stopping or adjusting is your doctor&rsquo;s decision.'],
   ['&ldquo;My uric acid is normal now, so I can stop the drug&rdquo;','It is normal because of the drug. After stopping, uric acid rises again and tophi and joint damage continue. The goal is staying below 6 long term.'],
   ['&ldquo;Gout is just joint pain&rdquo;','High uric acid is linked to kidney stones, chronic kidney disease, high blood pressure and metabolic syndrome. The weight, sugar and alcohol advice on this card is looking after those at the same time.'],
   ['&ldquo;Crash dieting will bring uric acid down&rdquo;','Weight loss works, but it has to be slow. Fasting and keto raise uric acid in the short term and trigger attacks. Keep it under 1 kg a month.'],
  ],
  notes:{
   core:'The 2022 Taiwan guideline and the 2020 ACR guideline list dietary advice as a conditional recommendation &mdash; it helps, but only so much, and medication decisions belong to your doctor. Start with the first three on this card, then work down.',
   food:'Serving sizes: one serving of low-fat dairy is about 240 mL; a palm-sized piece of meat is about 110 g. Three things when eating out: skip the soup, switch to unsweetened drinks, no alcohol.',
   myth:'Sources: 2022 Taiwan guideline for gout and hyperuricaemia (Taiwan Rheumatology Association); 2020 ACR gout management guideline (dietary items are conditional recommendations); 2016 EULAR gout guideline; 2022 comparison of national guidelines in the Journal of Internal Medicine of Taiwan.'},

  views:{core:'9 việc cần làm　·　bắt đầu từ ba thứ quan trọng nhất: rượu bia, đồ uống ngọt, cân nặng',food:'Đèn giao thông thực phẩm　·　ăn được, vừa phải, tránh',myth:'Những hiểu lầm thường gặp　·　không có bằng chứng ủng hộ'},
  lead:'Chế độ ăn hạ acid uric được khoảng <b>1 mg/dL</b>; mục tiêu điều trị là acid uric <b>dưới 6 mg/dL</b> (dưới 5 nếu đã có hạt tophi), và đa số người phải dùng thuốc mới đạt được. Giá trị của ăn uống là <b>ít lên cơn hơn</b> và giúp thuốc phát huy ổn định.',
  cards:[
   ['<b>Rượu bia</b> đứng đầu','Bia và rượu mạnh hại nhất, rượu vang cũng không ngoại lệ. Uống 1–2 phần trong 24 giờ đã làm nguy cơ lên cơn tăng khoảng 40%, uống càng nhiều càng cao. Trong đợt cấp thì tuyệt đối không uống.'],
   ['<b>Đồ uống ngọt, trà sữa, nước ép</b> quan trọng hơn hải sản','Chuyển hóa fructose sinh ra acid uric trực tiếp: mỗi kg cân nặng ăn 1 g fructose thì trong 2 giờ acid uric tăng 1–2 mg/dL. Đồ uống và món ngọt có siro ngô nhiều fructose là nguồn chính.'],
   ['Hạn chế <b>thực phẩm động vật nhiều purin</b>','Nội tạng, cá khô nhỏ, cá hố, cá mòi, tôm cua sò ốc, nước hầm thịt đậm và nước lẩu. Thịt đỏ vừa phải, mỗi bữa bằng lòng bàn tay; đạm khoảng 1 g mỗi kg cân nặng mỗi ngày là đủ.'],
   ['<b>Purin thực vật không đáng ngại</b>','Các loại đậu, đậu phụ, sữa đậu nành, nấm hương, măng tây, rau bina. Nghiên cứu cho thấy những thứ này không làm tăng cơn gút, hướng dẫn cũng không hạn chế rau và chế phẩm đậu nành.'],
   ['<b>Sữa ít béo</b> mỗi ngày 1–2 phần','Sữa ít béo và sữa chua không đường giúp đào thải acid uric — một trong số ít thực phẩm càng ăn càng tốt.'],
   ['Cà phê uống được, <b>nước</b> trên 2.000 mL mỗi ngày','Cà phê vừa phải liên quan đến acid uric thấp hơn; đủ nước giúp thải acid uric, người từng bị sỏi thận càng phải uống đủ.'],
   ['Giảm cân <b>từ từ</b>, mỗi tháng không quá 1 kg','Người thừa cân giảm cân thì acid uric hạ; nhưng giảm cân nhanh, nhịn ăn, ăn keto làm mô phân hủy khiến acid uric vọt lên và gây lên cơn.'],
   ['Không cần mua <b>vitamin C hay quả anh đào</b>','Hướng dẫn ACR 2020: không khuyến cáo bổ sung vitamin C để hạ acid uric; bằng chứng về anh đào chưa đủ nên không có khuyến cáo.'],
   ['Khi lên cơn <b>đừng tự ngừng thuốc</b>','Thuốc hạ acid uric đang uống thì cứ uống tiếp; đợt cấp thì chườm lạnh, nghỉ ngơi, dùng thuốc kháng viêm hoặc colchicine theo đơn bác sĩ. Acid uric bình thường không có nghĩa là được ngừng thuốc.'],
  ],

   ['g','Ăn được','Rau','Tất cả đều được, kể cả nấm hương, măng tây, rau bina, giá đỗ vốn hay bị đồn là phải kiêng'],
   ['g','Ăn được','Đậu và chế phẩm từ đậu nành','Đậu phụ, sữa đậu nành, đậu nành, đậu edamame; không làm tăng cơn và dùng làm nguồn đạm được'],

   ['y','Vừa phải','Cá thông thường','Cá vược, cá tráp, cá hồi, cá thu vừa phải; không uống nước canh cá'],

  mythtitle:'Những câu này không được hướng dẫn và nghiên cứu ủng hộ',
  mythhead:['Câu thường nghe','Thực tế'],
  myths:[
   ['“Không được ăn đậu phụ, sữa đậu nành”','Purin thực vật không liên quan đến cơn gút, nhiều nghiên cứu đoàn hệ cho thấy chế phẩm đậu nành không làm tăng nguy cơ. Đậu nành ăn được và còn thay được một phần thịt.'],
   ['“Phải kiêng nấm hương, măng tây, rau bina”','Như trên. Hướng dẫn ghi rõ không hạn chế rau; con số trên bảng hàm lượng purin không đồng nghĩa với ảnh hưởng lên acid uric trong máu.'],
   ['“Chỉ cần bỏ hải sản là được”','Rượu bia và đồ uống ngọt ảnh hưởng đến acid uric và cơn gút nhiều hơn hải sản. Nhiều người bỏ hải sản nhưng ngày nào cũng trà sữa và bia. Hãy đổi hai thứ đó trước.'],
   ['“Ăn nhiều anh đào hay vitamin C sẽ hạ acid uric”','Hướng dẫn ACR 2020 không khuyến cáo bổ sung vitamin C; nghiên cứu về anh đào chất lượng chưa đủ nên không có khuyến cáo. Hạ acid uric dựa vào thuốc, ăn uống thì bớt rượu bớt đường.'],
   ['“Lên cơn thì ngừng thuốc hạ acid uric”','Trong đợt cấp, thuốc đang uống thì cứ uống tiếp; ngừng thuốc làm acid uric dao động và kéo dài cơn. Ngừng hay chỉnh liều do bác sĩ quyết định.'],
   ['“Acid uric bình thường rồi thì ngừng thuốc được”','Bình thường là nhờ thuốc. Ngừng rồi acid uric tăng lại, hạt tophi và tổn thương khớp vẫn tiếp diễn; mục tiêu là giữ dưới 6 lâu dài.'],
   ['“Gút chỉ là đau khớp”','Acid uric cao liên quan đến sỏi thận, bệnh thận mạn, tăng huyết áp và hội chứng chuyển hóa; việc giảm cân, bớt đường, bớt rượu trên tờ này cũng đang lo cho những thứ đó.'],
   ['“Giảm cân cấp tốc thì acid uric sẽ hạ”','Giảm cân có hiệu quả nhưng phải từ từ; nhịn ăn và keto làm acid uric tăng trong ngắn hạn và gây lên cơn. Mỗi tháng giảm dưới 1 kg.'],

  notes:{
   core:'Hướng dẫn Đài Loan 2022 và ACR 2020 xếp lời khuyên ăn uống là “khuyến cáo có điều kiện”, nghĩa là có ích nhưng mức độ hạn chế, còn điều trị thuốc do bác sĩ quyết định. Tờ này hãy làm ba việc đầu trước, làm được rồi thì đi tiếp.',
   food:'Quy đổi khẩu phần: một phần sữa ít béo khoảng 240 mL; miếng thịt bằng lòng bàn tay khoảng 110 g. Ăn ngoài nhớ ba việc: không uống nước canh, đổi sang đồ uống không đường, không đụng rượu bia.',
   myth:'Nguồn: Hướng dẫn chẩn đoán và điều trị gút và tăng acid uric máu Đài Loan 2022 (Hội Thấp khớp học Đài Loan); hướng dẫn quản lý gút ACR 2020 (mục ăn uống là khuyến cáo có điều kiện); hướng dẫn gút EULAR 2016; so sánh hướng dẫn các nước, Tạp chí Nội khoa Đài Loan 2022.'},
  trans:'Bản dịch được thực hiện với sự hỗ trợ của AI và do nhóm của bác sĩ kiểm tra — không phải bản dịch được chứng nhận chính thức. Nếu có khác biệt, bản tiếng Trung là bản chuẩn.',
  foot:'BS. Lu Tzu-Wen, Khoa Nội tiết &amp; Chuyển hóa, Bệnh viện Cương Sơn thuộc Đại học Y Cao Hùng　｜　<b>Tờ này chỉ để giáo dục; thuốc và mục tiêu điều trị do bác sĩ quyết định</b>　｜　Theo hướng dẫn gút và tăng acid uric máu Đài Loan 2022 và hướng dẫn gút ACR 2020　｜　Phiên bản công cụ: 2026-09-10'},

  views:{core:'9 Langkah　·　mulai dari tiga hal paling berpengaruh: alkohol, minuman manis, berat badan',food:'Lampu Lalu Lintas Makanan　·　boleh, secukupnya, hindari',myth:'Mitos yang Sering Terdengar　·　tidak didukung bukti'},
  lead:'Pola makan menurunkan asam urat sekitar <b>1 mg/dL</b>; target terapi adalah asam urat <b>di bawah 6 mg/dL</b> (di bawah 5 bila sudah ada tofus), dan kebanyakan orang perlu obat untuk mencapainya. Nilai pola makan adalah <b>lebih jarang kambuh</b> dan membuat kerja obat lebih stabil.',
  cards:[
   ['<b>Alkohol</b> nomor satu','Bir dan minuman keras paling merusak, anggur pun tidak dikecualikan. Minum 1–2 porsi dalam 24 jam sudah menaikkan risiko serangan sekitar 40%, makin banyak makin tinggi. Saat serangan, sama sekali tidak boleh.'],
   ['<b>Minuman manis, boba, dan jus</b> lebih menentukan daripada seafood','Metabolisme fruktosa langsung menghasilkan asam urat: 1 g fruktosa per kg berat badan menaikkan asam urat 1–2 mg/dL dalam 2 jam. Minuman dan makanan manis dengan sirup jagung tinggi fruktosa adalah sumber utamanya.'],
   ['Kurangi <b>makanan hewani tinggi purin</b>','Jeroan, ikan teri kering, ikan layur, sarden, udang kepiting kerang, kaldu daging pekat dan kuah hotpot. Daging merah secukupnya, sebesar telapak tangan tiap kali makan; protein sekitar 1 g per kg berat badan sehari sudah cukup.'],
   ['<b>Purin nabati tidak perlu ditakuti</b>','Kacang-kacangan, tahu, susu kedelai, jamur shiitake, asparagus, bayam. Penelitian menunjukkan semua ini tidak menambah serangan gout, dan panduan pun tidak membatasi sayur maupun olahan kedelai.'],
   ['<b>Produk susu rendah lemak</b> 1–2 porsi sehari','Susu rendah lemak dan yoghurt tanpa gula membantu pembuangan asam urat — termasuk sedikit makanan yang justru makin banyak makin baik.'],
   ['Kopi boleh, <b>air</b> lebih dari 2.000 mL sehari','Kopi secukupnya berkaitan dengan asam urat yang lebih rendah; cairan yang cukup membantu asam urat terbuang, dan yang pernah kena batu ginjal harus lebih banyak lagi.'],
   ['Turunkan berat badan <b>perlahan</b>, tidak lebih dari 1 kg sebulan','Kalau kelebihan berat badan, menurunkannya menurunkan asam urat; tetapi penurunan cepat, puasa, dan keto memecah jaringan sehingga asam urat melonjak dan malah memicu serangan.'],
   ['Tidak perlu membeli <b>vitamin C atau ceri</b>','Panduan ACR 2020: suplemen vitamin C untuk menurunkan asam urat tidak dianjurkan; bukti tentang ceri belum cukup sehingga tidak ada rekomendasi.'],
   ['Saat serangan, <b>jangan hentikan obat sendiri</b>','Obat penurun asam urat yang sedang diminum tetap diteruskan; saat fase akut kompres dingin, istirahat, dan pakai antiradang atau colchicine sesuai resep dokter. Asam urat normal bukan berarti boleh berhenti minum obat.'],
  ],
  foodhead:['Lampu','Kelompok','Isinya'],
  food:[
   ['g','Boleh','Serealia dan umbi','Nasi, mi, ubi jalar, kentang, biji-bijian utuh — tidak dibatasi'],
   ['g','Boleh','Sayur','Semuanya boleh, termasuk jamur shiitake, asparagus, bayam, dan tauge yang sering salah dikira harus dipantang'],
   ['g','Boleh','Kacang dan olahan kedelai','Tahu, susu kedelai, kedelai, edamame; tidak menambah serangan dan bisa jadi sumber protein'],
   ['g','Boleh','Susu rendah lemak dan telur','Susu rendah lemak atau yoghurt tanpa gula 1–2 porsi sehari; telur hampir tidak mengandung purin'],
   ['g','Boleh','Air, teh tawar, kopi','Lebih dari 2.000 mL sehari; kopi secukupnya'],

  mythtitle:'Pernyataan berikut tidak didukung panduan maupun penelitian',
  mythhead:['Yang sering terdengar','Kenyataannya'],
  myths:[
   ['“Tahu dan susu kedelai tidak boleh”','Purin nabati tidak berkaitan dengan serangan gout, dan beberapa studi kohort menunjukkan olahan kedelai tidak menambah risiko. Kedelai boleh dimakan dan bisa menggantikan sebagian daging.'],
   ['“Jamur shiitake, asparagus, dan bayam harus dipantang”','Sama seperti di atas. Panduan menulis jelas bahwa sayur tidak dibatasi; angka pada tabel kandungan purin bukan berarti pengaruh pada asam urat darah.'],
   ['“Asal tidak makan seafood sudah aman”','Alkohol dan minuman manis lebih besar pengaruhnya pada asam urat dan serangan dibanding seafood. Banyak orang berhenti makan seafood tetapi tiap hari minum boba dan bir. Ubah dua hal itu dulu.'],
   ['“Banyak makan ceri atau vitamin C bisa menurunkan asam urat”','Panduan ACR 2020 tidak menganjurkan suplemen vitamin C; mutu penelitian tentang ceri belum memadai sehingga tidak ada rekomendasi. Menurunkan asam urat mengandalkan obat, sedangkan pola makan mengurangi alkohol dan gula.'],
   ['“Saat serangan, hentikan obat penurun asam urat”','Saat serangan akut, obat yang sedang diminum tetap diteruskan; menghentikannya justru membuat asam urat naik turun dan serangan berlangsung lebih lama. Menghentikan atau menyesuaikan adalah keputusan dokter.'],
   ['“Asam urat sudah normal, jadi obat boleh dihentikan”','Normalnya karena obat. Setelah berhenti, asam urat naik lagi dan tofus serta kerusakan sendi terus berjalan; targetnya menjaga di bawah 6 dalam jangka panjang.'],
   ['“Gout hanya nyeri sendi”','Asam urat tinggi berkaitan dengan batu ginjal, penyakit ginjal kronis, tekanan darah tinggi, dan sindrom metabolik; menurunkan berat badan, mengurangi gula dan alkohol di kartu ini sekaligus menjaga semua itu.'],
   ['“Diet kilat akan menurunkan asam urat”','Menurunkan berat badan memang efektif, tetapi harus perlahan; puasa dan keto menaikkan asam urat dalam jangka pendek dan memicu serangan. Turunkan kurang dari 1 kg sebulan.'],
  ],
  notes:{
   core:'Panduan Taiwan 2022 dan ACR 2020 menempatkan saran pola makan sebagai “rekomendasi bersyarat”, artinya membantu tetapi terbatas, sedangkan pengobatan ditentukan dokter. Kerjakan tiga langkah pertama dulu, baru lanjut ke bawah.',
   food:'Takaran: satu porsi susu rendah lemak sekitar 240 mL; daging sebesar telapak tangan sekitar 110 g. Tiga hal saat makan di luar: jangan minum kuahnya, ganti ke minuman tanpa gula, jangan menyentuh alkohol.',
   myth:'Sumber: Panduan diagnosis dan tata laksana gout dan hiperurisemia Taiwan 2022 (Perhimpunan Reumatologi Taiwan); panduan tata laksana gout ACR 2020 (butir pola makan berupa rekomendasi bersyarat); panduan gout EULAR 2016; perbandingan panduan berbagai negara, Journal of Internal Medicine of Taiwan 2022.'},

  lead:'อาหารลดกรดยูริกได้ราว <b>1 mg/dL</b> เป้าหมายการรักษาคือกรดยูริก <b>ต่ำกว่า 6 mg/dL</b> (ต่ำกว่า 5 ถ้ามีปุ่มโทฟัส) ซึ่งคนส่วนใหญ่ต้องอาศัยยาจึงจะถึง คุณค่าของอาหารคือ <b>กำเริบน้อยลง</b> และทำให้ยาออกฤทธิ์ได้สม่ำเสมอ',
  cards:[
   ['<b>แอลกอฮอล์</b> เป็นอันดับหนึ่ง','เบียร์และเหล้าแรงเสียหายที่สุด ไวน์ก็ไม่ได้รับการยกเว้น ดื่ม 1–2 ส่วนภายใน 24 ชั่วโมงก็เพิ่มความเสี่ยงกำเริบราว 40% ยิ่งดื่มยิ่งสูง ช่วงกำเริบให้งดโดยสิ้นเชิง'],
   ['<b>เครื่องดื่มหวาน ชานมไข่มุก น้ำผลไม้</b> สำคัญกว่าอาหารทะเล','การเผาผลาญฟรุกโตสสร้างกรดยูริกโดยตรง: กินฟรุกโตส 1 กรัมต่อน้ำหนักตัว 1 กิโลกรัม ภายใน 2 ชั่วโมงกรดยูริกเพิ่ม 1–2 mg/dL เครื่องดื่มและของหวานที่ใส่ไซรัปข้าวโพดฟรุกโตสสูงคือแหล่งหลัก'],
   ['ลด <b>อาหารสัตว์ที่มีพิวรีนสูง</b>','เครื่องใน ปลาแห้งตัวเล็ก ปลาดาบเงิน ปลาซาร์ดีน กุ้งปูหอย น้ำต้มเนื้อเข้มข้นและน้ำซุปหม้อไฟ เนื้อแดงพอประมาณ มื้อละเท่าฝ่ามือ; โปรตีนวันละราว 1 กรัมต่อน้ำหนักตัว 1 กิโลกรัมก็พอ'],
   ['<b>พิวรีนจากพืชไม่ต้องกลัว</b>','ถั่วต่าง ๆ เต้าหู้ น้ำเต้าหู้ เห็ดหอม หน่อไม้ฝรั่ง ผักโขม งานวิจัยพบว่าสิ่งเหล่านี้ไม่เพิ่มการกำเริบของเกาต์ แนวทางก็ไม่จำกัดผักและผลิตภัณฑ์จากถั่วเหลือง'],
   ['<b>นมไขมันต่ำ</b> วันละ 1–2 ส่วน','นมพร่องมันเนยและโยเกิร์ตไม่หวานช่วยขับกรดยูริกออก เป็นอาหารไม่กี่อย่างที่ยิ่งกินยิ่งดี'],
   ['กาแฟดื่มได้ <b>น้ำ</b> วันละมากกว่า 2,000 มิลลิลิตร','กาแฟในปริมาณพอเหมาะสัมพันธ์กับกรดยูริกที่ต่ำลง; น้ำเพียงพอช่วยขับกรดยูริก คนที่เคยเป็นนิ่วในไตยิ่งต้องดื่มให้พอ'],
   ['ลดน้ำหนัก <b>อย่างช้า ๆ</b> เดือนละไม่เกิน 1 กิโลกรัม','คนน้ำหนักเกินเมื่อลดน้ำหนักกรดยูริกจะลดลง แต่การลดน้ำหนักเร็ว การอดอาหาร และคีโตทำให้เนื้อเยื่อสลายและกรดยูริกพุ่ง กลับกระตุ้นให้กำเริบ'],
   ['<b>วิตามินซีและเชอร์รี</b> ไม่ต้องซื้อเป็นพิเศษ','แนวทาง ACR 2020: ไม่แนะนำให้เสริมวิตามินซีเพื่อลดกรดยูริก; หลักฐานเรื่องเชอร์รียังไม่พอจึงไม่มีคำแนะนำ'],
   ['เวลากำเริบ <b>อย่าหยุดยาเอง</b>','ยาลดกรดยูริกที่กินอยู่ให้กินต่อ; ระยะเฉียบพลันให้ประคบเย็น พักผ่อน และใช้ยาแก้อักเสบหรือโคลชิซีนตามที่แพทย์สั่ง กรดยูริกปกติไม่ได้แปลว่าหยุดยาได้'],

  foodhead:['สัญญาณ','หมวด','รายละเอียด'],
  food:[

   ['g','กินได้','ผัก','ได้ทั้งหมด รวมถึงเห็ดหอม หน่อไม้ฝรั่ง ผักโขม ถั่วงอก ที่มักถูกเล่าลือผิดว่าต้องงด'],
   ['g','กินได้','ถั่วและผลิตภัณฑ์จากถั่วเหลือง','เต้าหู้ น้ำเต้าหู้ ถั่วเหลือง ถั่วแระ; ไม่เพิ่มการกำเริบ ใช้เป็นแหล่งโปรตีนได้'],
   ['g','กินได้','นมไขมันต่ำและไข่','นมไขมันต่ำหรือโยเกิร์ตไม่หวานวันละ 1–2 ส่วน; ไข่แทบไม่มีพิวรีน'],
   ['g','กินได้','น้ำ ชาไม่หวาน กาแฟ','วันละมากกว่า 2,000 มิลลิลิตร; กาแฟพอประมาณ'],
   ['g','กินได้','ผลไม้','ผลไม้ทั้งผลวันละ 2 ส่วน; อย่าปั่นเป็นน้ำผลไม้'],
   ['y','พอประมาณ','เนื้อไม่ติดมัน สัตว์ปีกลอกหนัง','มื้อละเท่าฝ่ามือ; โปรตีนวันละราว 1 กรัมต่อน้ำหนักตัว 1 กิโลกรัม'],
   ['y','พอประมาณ','ปลาทั่วไป','ปลากะพง ปลาทราย แซลมอน ปลาแมกเคอเรล พอประมาณ; ไม่ดื่มน้ำแกงปลา'],
   ['y','พอประมาณ','ถั่วเปลือกแข็ง','วันละหนึ่งส่วน (ราว 10 กรัม ช้อนซุปพลาสติก 1 ช้อน); พิวรีนปานกลาง ไขมันดี'],
   ['r','เลี่ยง','แอลกอฮอล์','เบียร์ เหล้าแรง ไวน์ นับหมด; ช่วงกำเริบห้ามเด็ดขาด'],
   ['r','เลี่ยง','เครื่องดื่มหวาน น้ำผลไม้ ของหวาน','ชานมไข่มุก น้ำอัดลม น้ำผลไม้ ขนมที่ใส่ไซรัปข้าวโพดฟรุกโตสสูง'],
   ['r','เลี่ยง','เครื่องในและอาหารทะเลพิวรีนสูง','ตับ ไต สมอง ไส้; ปลาแห้งตัวเล็ก ปลาดาบเงิน ปลาซาร์ดีน ปลากะตัก กุ้ง ปู หอย หอยเชลล์'],
   ['r','เลี่ยง','น้ำซุปเข้มข้นและน้ำซุปหม้อไฟ','น้ำต้มกระดูก ซุปไก่สกัด น้ำเนื้อ น้ำซุปหม้อไฟ น้ำพะโล้ — พิวรีนละลายอยู่ในน้ำทั้งหมด'],
   ['r','เลี่ยง','วิธีลดน้ำหนักแบบเร่งด่วน','การอดอาหาร คีโต และอาหารแคลอรีต่ำมากกระตุ้นให้กำเริบเฉียบพลันได้'],

  mythtitle:'คำกล่าวเหล่านี้ไม่มีแนวทางเวชปฏิบัติหรืองานวิจัยรองรับ',
  mythhead:['ที่ได้ยินบ่อย','ความจริง'],
  myths:[
   ['“เต้าหู้ น้ำเต้าหู้ กินไม่ได้”','พิวรีนจากพืชไม่สัมพันธ์กับการกำเริบของเกาต์ งานวิจัยกลุ่มประชากรหลายชิ้นแสดงว่าผลิตภัณฑ์ถั่วเหลืองไม่เพิ่มความเสี่ยง กินได้และยังใช้แทนเนื้อสัตว์บางส่วนได้'],
   ['“ต้องงดเห็ดหอม หน่อไม้ฝรั่ง ผักโขม”','เช่นเดียวกับข้อบน แนวทางระบุชัดว่าไม่จำกัดผัก ตัวเลขในตารางปริมาณพิวรีนไม่เท่ากับผลต่อกรดยูริกในเลือด'],
   ['“แค่ไม่กินอาหารทะเลก็พอ”','แอลกอฮอล์และเครื่องดื่มหวานมีผลต่อกรดยูริกและการกำเริบมากกว่าอาหารทะเล หลายคนเลิกอาหารทะเลแต่ยังดื่มชานมและเบียร์ทุกวัน ให้เปลี่ยนสองอย่างนี้ก่อน'],
   ['“กินเชอร์รีหรือวิตามินซีเยอะ ๆ ช่วยลดกรดยูริก”','แนวทาง ACR 2020 ไม่แนะนำให้เสริมวิตามินซี; งานวิจัยเรื่องเชอร์รีคุณภาพยังไม่พอจึงไม่มีคำแนะนำ การลดกรดยูริกอาศัยยา ส่วนอาหารคือลดเหล้าลดน้ำตาล'],
   ['“เวลากำเริบให้หยุดยาลดกรดยูริก”','ระยะกำเริบเฉียบพลัน ยาที่กินอยู่ให้กินต่อ การหยุดยาทำให้กรดยูริกแกว่งและกำเริบนานขึ้น การหยุดหรือปรับยาให้แพทย์เป็นผู้ตัดสิน'],
   ['“กรดยูริกปกติแล้วหยุดยาได้”','ที่ปกติเพราะยา เมื่อหยุดแล้วกรดยูริกจะขึ้นอีก ปุ่มโทฟัสและการทำลายข้อยังดำเนินต่อ เป้าหมายคือรักษาให้ต่ำกว่า 6 ในระยะยาว'],
   ['“เกาต์ก็แค่ปวดข้อ”','กรดยูริกสูงสัมพันธ์กับนิ่วในไต โรคไตเรื้อรัง ความดันโลหิตสูง และกลุ่มอาการเมตาบอลิก การลดน้ำหนัก ลดน้ำตาล ลดเหล้าในการ์ดใบนี้กำลังดูแลสิ่งเหล่านั้นไปพร้อมกัน'],
   ['“ลดน้ำหนักเร็ว ๆ แล้วกรดยูริกจะลด”','การลดน้ำหนักได้ผล แต่ต้องช้า ๆ; การอดอาหารและคีโตทำให้กรดยูริกสูงขึ้นในระยะสั้นและกระตุ้นการกำเริบ ให้ลดไม่เกินเดือนละ 1 กิโลกรัม'],
  ],
  notes:{

const ZH = L['zh-TW'];

/* 外文在前、中文小字在後；中文版只回中文本身 */
function pair(zh, fo, k){
  if (k === 'zh-TW' || zh === fo) return zh;
  const a = `<span class="p-zh">${zh}</span>`, b = `<span class="p-fo">${fo}</span>`;
  return PAIR_ORDER === 'zh-first' ? a + b : b + a;
}

let LANG = 'zh-TW', VIEW = 'core';
const $ = id => document.getElementById(id);

function renderLangTabs(){
  $('langtabs').innerHTML = Object.keys(L).map(k =>
    `<div class="tab ${k===LANG?'active':''}" onclick="setLang('${k}')">${L[k].tab}<small>${L[k].tabsub}</small></div>`).join('');
}
function renderViewTabs(){
  const d = L[LANG];
  $('viewtabs').innerHTML = d.viewtabs.map(([v,label,sub],i) =>
    `<div class="tab ${v===VIEW?'active':''}" onclick="setV('${v}')">${pair(ZH.viewtabs[i][1],label,LANG)}<small>${pair(ZH.viewtabs[i][2],sub,LANG)}</small></div>`).join('');
}

function render(){
  const d = L[LANG], k = LANG;
  document.documentElement.lang = (k === 'zh-TW') ? 'zh-Hant' : k;
  $('langbadge').textContent = d.badge;
  $('kick').innerHTML = pair(ZH.kick, d.kick, k);
  $('h1').innerHTML   = pair(ZH.h1, d.h1, k);
  $('zh').innerHTML   = pair(ZH.views[VIEW], d.views[VIEW], k);
  $('foot').innerHTML = pair(ZH.foot, d.foot, k);
  $('note').innerHTML = pair(ZH.notes[VIEW], d.notes[VIEW], k);
  $('printbtn').innerHTML = d.printbtn;
  if ($('printallbtn')) $('printallbtn').innerHTML = d.printall || ZH.printall;
  // 翻譯來源聲明：只在外語版出現（老闆 2026-09-10 同意揭露翻譯來源）
  $('transnote').innerHTML = d.trans ? `${d.trans}<span class="p-zh">本外語版由 AI 協助翻譯、經醫師端校閱，非官方認證譯本；文字如有出入，以中文版為準。</span>` : '';

  let h = '';
  if (VIEW === 'core'){
    h = `<div class="grid"><div class="c lead"><i class="fa-solid fa-droplet"></i><div class="t">${pair(ZH.lead, d.lead, k)}</div></div>`;
    const ICON = ['fa-beer-mug-empty','fa-glass-water','fa-drumstick-bite','fa-leaf','fa-glass-water-droplet','fa-mug-hot','fa-weight-scale','fa-pills','fa-user-doctor'];
    const HOT  = [1,1,0,0,0,0,0,0,0];
    d.cards.forEach((c,i) => {
      h += `<div class="c ${HOT[i]?'hot':''}"><span class="n">${String(i+1).padStart(2,'0')}</span>`
         + `<i class="fa-solid ${ICON[i]}"></i><div class="t">${pair(ZH.cards[i][0], c[0], k)}`
         + `<span class="w">${pair(ZH.cards[i][1], c[1], k)}</span></div></div>`;
    });
    h += '</div>';
  } else if (VIEW === 'food'){
    h = `<table class="food"><tr>${d.foodhead.map((t,i)=>`<th>${pair(ZH.foodhead[i],t,k)}</th>`).join('')}</tr>`
      + d.food.map((r,i)=>`<tr><td class="${r[0]}">${pair(ZH.food[i][1],r[1],k)}</td>`
      + `<td>${pair(ZH.food[i][2],r[2],k)}</td><td>${pair(ZH.food[i][3],r[3],k)}</td></tr>`).join('')
      + '</table>';
  } else {
    h = `<div class="myth"><h3>${pair(ZH.mythtitle,d.mythtitle,k)}</h3><table><tr>`
      + d.mythhead.map((t,i)=>`<th>${pair(ZH.mythhead[i],t,k)}</th>`).join('') + '</tr>'
      + d.myths.map((r,i)=>`<tr><td class="x">${pair(ZH.myths[i][0],r[0],k)}</td>`
      + `<td>${pair(ZH.myths[i][1],r[1],k)}</td></tr>`).join('')
      + '</table></div>';
  }
  $('body').innerHTML = h;
  renderLangTabs(); renderViewTabs();
}

function buildPrintAll(){
  const keep = VIEW, box = document.createElement('div'); box.id = 'printall';
  ZH.viewtabs.forEach(([v]) => { VIEW = v; render(); const c = $('sheet').cloneNode(true); c.removeAttribute('id'); box.appendChild(c); });
  VIEW = keep; render();
  return box;
}
function printAll(){
  const old = $('printall'); if (old) old.remove();
  const box = buildPrintAll(); document.body.appendChild(box); document.body.classList.add('printing-all');
  const done = () => { document.body.classList.remove('printing-all'); box.remove(); window.removeEventListener('afterprint', done); };
  window.addEventListener('afterprint', done);
  setTimeout(() => { window.print(); setTimeout(done, 120000); }, 50);
}
function setLang(k){ LANG = k; render(); }
function setV(v){ VIEW = v; render(); }

const q = new URLSearchParams(location.search);
if (q.get('v') && ZH.viewtabs.some(t => t[0] === q.get('v'))) VIEW = q.get('v');
if (q.get('lang') && L[q.get('lang')]) LANG = q.get('lang');
render();
if (q.get('printall')) { document.body.appendChild(buildPrintAll()); document.body.classList.add('printing-all'); }
