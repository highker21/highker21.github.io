<title>甲狀腺細針抽吸 FNA 檢查衛教（6 國語言）</title>
<style>
:root{
  --ink:#1b1f1d;--sub:#5f655f;--line:#e6e2d8;--paper:#faf8f2;--card:#fff;--faint:#9a978c;
  --ok:#27ae60;--mod:#e67e22;--warn:#c0392b;--doc:#2c3e50;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#eceae2;font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei","Sukhumvit Set",sans-serif;color:var(--ink);padding:20px 12px;-webkit-font-smoothing:antialiased}

/* 語言切換 */
.tabs{max-width:900px;margin:0 auto 14px;display:flex;gap:6px;flex-wrap:wrap}
.tab{flex:1 1 130px;text-align:center;padding:10px 6px;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:pointer;font-weight:800;color:var(--sub);font-size:15px;line-height:1.3}
.tab small{display:block;font-weight:500;font-size:10.5px;color:var(--faint);margin-top:2px}
.tab.active{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tab.active small{color:#b9c7c3}

/* 單張 */
.sheet{max-width:900px;margin:0 auto;background:var(--paper);padding:34px 34px 22px}
.langbadge{display:inline-block;background:var(--doc);color:#fff;font-size:13px;font-weight:800;letter-spacing:.02em;padding:5px 13px;border-radius:999px;margin-bottom:12px;line-height:1.5}
.head{border-bottom:2px solid var(--doc);padding-bottom:12px;margin-bottom:6px}
.kick{font-size:12px;letter-spacing:.3em;color:var(--sub);font-weight:800;margin-bottom:8px}
.head h1{font-size:26px;font-weight:900;line-height:1.25;color:var(--doc)}

.sec{margin-top:18px;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--ok);border-radius:12px;padding:15px 18px 14px}
.sec.mod{border-left-color:var(--mod)}
.sec.warn{border-left-color:var(--warn)}
.sec.doc{border-left-color:var(--doc)}
.sec h2{font-size:17px;font-weight:900;color:var(--ok);margin-bottom:8px;line-height:1.35}
.sec.mod h2{color:var(--mod)}
.sec.warn h2{color:var(--warn)}
.sec.doc h2{color:var(--doc)}
.sec ul{list-style:none}
.sec li{position:relative;padding-left:17px;margin-bottom:6px;font-size:15px;line-height:1.72}
.sec li:last-child{margin-bottom:0}
.sec li:before{content:"‧";position:absolute;left:3px;font-weight:900;color:var(--ok)}
.sec.mod li:before{color:var(--mod)}
.sec.warn li:before{color:var(--warn)}
.sec.doc li:before{color:var(--doc)}
.sec b{font-weight:800}
.sec .why{display:block;margin-top:2px;font-size:13px;color:var(--sub);line-height:1.6}

/* 最重要的那一條：3 小時內不可熱食 */
.alert{margin-top:16px;background:#fdecea;border:2px solid var(--warn);border-radius:12px;padding:14px 18px;font-size:15.5px;font-weight:800;color:var(--warn);line-height:1.7}
.alert .sm{display:block;font-weight:600;font-size:13.5px;color:#8e2f22;margin-top:4px;line-height:1.65}

.note{margin-top:16px;font-size:12.5px;color:var(--sub);line-height:1.7;font-style:italic}
.hotline{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 16px;text-align:center;font-size:14.5px;line-height:1.75}
.hotline b{font-size:18px;color:var(--doc);letter-spacing:.02em}
.hotline span{display:block;font-size:12.5px;color:var(--sub);margin-top:2px}
.foot{margin-top:14px;text-align:center;font-size:11px;color:var(--faint);line-height:1.75;border-top:1px solid var(--line);padding-top:11px}
.foot b{color:var(--sub)}

.bar{text-align:center;margin:16px 0;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.bar button{background:var(--ink);color:var(--paper);border:0;padding:11px 22px;font-size:15px;font-weight:700;border-radius:6px;cursor:pointer}

/* 常見問題（只在中文版顯示） */
.qa{max-width:900px;margin:16px auto 0;background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px 20px}
.qa h3{font-size:16px;color:var(--doc);margin-bottom:10px;border-left:4px solid var(--doc);padding-left:10px}
.qa table{width:100%;border-collapse:collapse;font-size:14px}
.qa th,.qa td{border-bottom:1px solid var(--line);padding:9px 8px;text-align:left;vertical-align:top;line-height:1.65}
.qa th{background:var(--paper);font-weight:800;color:var(--sub);font-size:13px}
.qa td.q{font-weight:700;color:var(--doc);white-space:nowrap}
.qa .wrap{overflow-x:auto}

/* ⚠️ media query 一律放在所有基礎規則之後（同權重後者勝） */
/* 列印：目標是「一張 A4 印完」。壓縮過的行高與間距是實測調出來的——
   2026-08-12 第一版列印時諮詢專線與頁尾會溢到第 2 頁，
   實際 print-to-pdf 出來才看得到，螢幕上完全正常。 */
@media print{
  @page{size:A4 portrait;margin:9mm}
  body{background:#fff;padding:0}
  .tabs,.bar,.no-print{display:none!important}
  .sheet{max-width:100%;padding:0}
  .langbadge{margin-bottom:7px;padding:3px 11px;font-size:11.5px}
  .head{padding-bottom:8px;margin-bottom:2px}
  .kick{margin-bottom:5px;font-size:11px}
  .head h1{font-size:20px}
  .sec{margin-top:9px;padding:9px 13px 8px;border-radius:9px}
  .sec h2{font-size:14.5px;margin-bottom:5px}
  .sec li{font-size:12.8px;line-height:1.5;margin-bottom:3px;padding-left:14px}
  .sec .why{font-size:11.3px;line-height:1.45;margin-top:1px}
  .alert{margin-top:10px;padding:9px 13px;font-size:13.5px;line-height:1.5}
  .alert .sm{font-size:11.8px;line-height:1.45;margin-top:3px}
  .note{margin-top:8px;font-size:10.8px;line-height:1.5}
  .hotline{margin-top:8px;padding:7px 12px;font-size:12.5px;line-height:1.5}
  .hotline b{font-size:16px}
  .hotline span{font-size:11px}
  .foot{margin-top:8px;padding-top:7px;font-size:9.5px;line-height:1.5}
  .sec,.alert,.hotline{break-inside:avoid}
}
@media (max-width:640px){
  body{padding:12px 8px}
  .sheet{padding:22px 18px 18px}
  .head h1{font-size:21px}
  .langbadge{font-size:12px;padding:4px 11px}
  .tab{flex:1 1 calc(50% - 6px);font-size:14px}
  .sec{padding:13px 14px 12px}
  .sec li{font-size:14.5px}
  .alert{padding:12px 14px;font-size:15px}
  .hotline b{font-size:17px}
  .qa{padding:14px 14px}
  .qa table{font-size:13px}
  .qa td.q{white-space:normal}
}

const $ = id => document.getElementById(id);
const KEYS = Object.keys(L);

function render(k){
  const d = L[k];
  document.documentElement.lang = (k === 'zh-TW') ? 'zh-Hant' : k;
  $('langbadge').textContent = d.badge;
  $('kick').textContent = d.kick;
  $('h1').textContent = d.h1;
  $('secs').innerHTML = d.secs.map(s =>
    `<div class="sec ${s.c}"><h2>${s.t}</h2><ul>${s.items.map(i=>`<li>${i}</li>`).join('')}</ul></div>`
  ).join('');
  $('alert').innerHTML = d.alert;
  $('note').textContent = d.note;
  $('hotline').innerHTML = d.hotline;
  $('qa').innerHTML = (k === 'zh-TW') ? QA : '';
  $('qa').style.display = (k === 'zh-TW') ? '' : 'none';
  [...$('tabs').children].forEach(t => t.classList.toggle('active', t.dataset.k === k));
  window.scrollTo({top:0,behavior:'smooth'});
}

$('tabs').innerHTML = KEYS.map(k =>
  `<div class="tab" data-k="${k}">${L[k].tab}<small>${L[k].tabsub}</small></div>`
).join('');
[...$('tabs').children].forEach(t => t.onclick = () => render(t.dataset.k));
render('zh-TW');
