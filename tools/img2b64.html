<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clipboard Image to Base64</title>
</head>
<body>
    <h2>Paste Image Here</h2>
    <textarea id="pasteArea" rows="10" cols="50" placeholder="Paste an image here..."></textarea>
    <div id="result"></div>

    <script>
        document.getElementById('pasteArea').addEventListener('paste', function(event) {
            var items = (event.clipboardData || event.originalEvent.clipboardData).items;
            for (var i = 0; i < items.length; i++) {
                var item = items[i];
                if (item.kind === 'file') {
                    var blob = item.getAsFile();
                    var reader = new FileReader();
                    reader.onload = function(event) {
                        var base64String = event.target.result;
                        var resultDiv = document.getElementById('result');
                        resultDiv.innerHTML = '';
                        var p = document.createElement('p');
                        p.textContent = 'Base64:';
                        var textarea = document.createElement('textarea');
                        textarea.rows = 10;
                        textarea.cols = 50;
                        textarea.value = base64String;
                        resultDiv.appendChild(p);
                        resultDiv.appendChild(textarea);
                    };
                    reader.readAsDataURL(blob);
                }
            }
        });
    </script>
</body>
</html>
