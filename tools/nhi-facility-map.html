let cur='all', me=null;
DATA.forEach(d=>{
  d.marker=L.circleMarker([d.lat,d.lng],{radius:7,weight:2,
    color:d.type==='big'?'#b5352b':'#1c5a8a',fillColor:d.type==='big'?'#d9433a':'#2f7fc7',fillOpacity:.85});

function filt(f,el){cur=f;document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));el.classList.add('on');
  DATA.forEach(d=>{const show=(f==='all'||d.type===f); if(show)d.marker.addTo(map); else map.removeLayer(d.marker)});}
function hav(a,b,c,d){const R=6371,r=x=>x*Math.PI/180;const x=Math.sin(r(c-a)/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(r(d-b)/2)**2;return R*2*Math.asin(Math.sqrt(x))}
function show(lat,lng){
  if(me)map.removeLayer(me);
  me=L.circleMarker([lat,lng],{radius:8,color:'#c0632a',fillColor:'#e8853f',fillOpacity:.9}).addTo(map).bindPopup('你的位置');
  const pool=DATA.filter(d=>cur==='all'||d.type===cur);
  const near=pool.map(d=>({...d,km:hav(lat,lng,d.lat,d.lng)})).sort((a,b)=>a.km-b.km).slice(0,6);
  map.setView([lat,lng],12);
  document.getElementById('list').innerHTML=near.map(d=>{
    const tag=d.type==='big'?'<span class="tag tg-big">大醫院</span>':'<span class="tag tg-al">校友</span>';
    const sub=d.type==='big'?((d.level||'')+(d.dept?'　'+d.dept.split(',').slice(0,4).join('、'):'')):(d.doctor||'');
    return '<div class="card"><div class="n">'+d.name+tag+'</div><div class="d">'+sub+'</div>'+
      '<div class="dist">📍 約 '+d.km.toFixed(1)+' 公里</div>'+
      '<a href="https://www.google.com/maps/dir/?api=1&destination='+d.lat+','+d.lng+'" target="_blank">導航前往 ›</a>'+
      (d.tel?'<a href="tel:'+d.tel.replace(/[^0-9]/g,'')+'">☎ 撥號</a>':'')+'</div>';
  }).join('');
}
function near(){if(!navigator.geolocation){alert('此裝置不支援定位');return}
