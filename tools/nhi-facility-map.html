const COL={big:['#b5352b','#d9433a',7],alumni:['#1c5a8a','#2f7fc7',7],clinic:['#2e7d43','#3a9c56',4]};
const map=L.map('map',{preferCanvas:true}).setView([22.64,120.31],11);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
let cur='all',me=null;
DATA.forEach(d=>{const c=COL[d.type];
  d.marker=L.circleMarker([d.lat,d.lng],{radius:c[2],weight:1.5,color:c[0],fillColor:c[1],fillOpacity:.8});
  const info=d.type==='big'?((d.level||'')+(d.dept?'<br>'+d.dept:'')+(d.tel?'<br>☎ '+d.tel:'')):(d.type==='alumni'?('校友診所'+(d.doctor?'<br>'+d.doctor:'')+(d.tel?'<br>☎ '+d.tel:'')):((d.dept||'診所')+(d.tel?'<br>☎ '+d.tel:'')));
  d.marker.bindPopup('<b>'+d.name+'</b><br>'+info+'<br><a href="https://www.google.com/maps/dir/?api=1&destination='+d.lat+','+d.lng+'" target="_blank">導航前往</a>');
  d.marker.addTo(map);});
function filt(f,el){cur=f;document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));el.classList.add('on');
  DATA.forEach(d=>{(f==='all'||d.type===f)?d.marker.addTo(map):map.removeLayer(d.marker)});}
function hav(a,b,c,d){const R=6371,r=x=>x*Math.PI/180;const x=Math.sin(r(c-a)/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(r(d-b)/2)**2;return R*2*Math.asin(Math.sqrt(x))}
function show(lat,lng){if(me)map.removeLayer(me);
  me=L.circleMarker([lat,lng],{radius:8,color:'#c0632a',fillColor:'#e8853f',fillOpacity:.9}).addTo(map).bindPopup('你的位置');
  const pool=DATA.filter(d=>cur==='all'||d.type===cur);
  const near=pool.map(d=>({...d,km:hav(lat,lng,d.lat,d.lng)})).sort((a,b)=>a.km-b.km).slice(0,8);
  map.setView([lat,lng],13);
  document.getElementById('list').innerHTML=near.map(d=>{
    const tg=d.type==='big'?'<span class="tag tg-big">大醫院</span>':d.type==='alumni'?'<span class="tag tg-al">校友</span>':'<span class="tag tg-cl">診所</span>';
    const sub=d.type==='alumni'?(d.doctor||''):((d.level?d.level+'　':'')+(d.dept?d.dept.split(',').slice(0,4).join('、'):''));
    return '<div class="card"><div class="n">'+d.name+tg+'</div><div class="d">'+sub+'</div><div class="dist">📍 約 '+d.km.toFixed(1)+' 公里</div>'+
      '<a href="https://www.google.com/maps/dir/?api=1&destination='+d.lat+','+d.lng+'" target="_blank">導航前往 ›</a>'+(d.tel?'<a href="tel:'+d.tel.replace(/[^0-9]/g,'')+'">☎ 撥號</a>':'')+'</div>';}).join('');}
function near(){if(!navigator.geolocation){alert('此裝置不支援定位');return}
  navigator.geolocation.getCurrentPosition(p=>show(p.coords.latitude,p.coords.longitude),()=>alert('取得定位失敗，可先按示範'))}
function demo(){show(22.6393,120.3020)}
</script></body></html>
