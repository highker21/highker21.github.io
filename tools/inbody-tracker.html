<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InBody 減重追蹤管理</title>
<style>
  :root{--blue:#1a3b6e;--blue2:#2c5aa0;--bg:#f4f6fa;--card:#fff;--line:#dde3ec;--ink:#1f2733;--muted:#667;--good:#0a7d3c;--bad:#c0392b;--warnbg:#fff7ed;--warn:#b54708}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;font-size:15px}
  .wrap{max-width:1000px;margin:0 auto;padding:14px}
  h1{font-size:1.2rem;color:var(--blue);margin:.2em 0}
  h2{font-size:1rem;color:var(--blue);border-left:4px solid var(--blue2);padding-left:8px;margin:1em 0 .4em}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  button{font-family:inherit;font-size:.9rem;padding:8px 12px;border-radius:8px;border:1px solid var(--blue2);background:var(--blue2);color:#fff;cursor:pointer}
  button.sec{background:#fff;color:var(--blue2)}
  button.danger{background:#fff;color:var(--bad);border-color:var(--bad)}
  button.sm{padding:4px 8px;font-size:.8rem}
  input,select,textarea{font-family:inherit;font-size:.92rem;padding:7px;border:1px solid var(--line);border-radius:7px;background:#fff;width:100%}
  label{display:block;font-size:.82rem;color:var(--muted);margin:.4em 0 .1em}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
  table{width:100%;border-collapse:collapse;font-size:.85rem}
  th,td{border:1px solid var(--line);padding:6px 8px;text-align:center;white-space:nowrap}
  th{background:#eef2f8;color:var(--blue);position:sticky;top:0}
  .scroll{overflow:auto;max-width:100%}
  .pill{display:inline-block;background:#eef2f8;border-radius:20px;padding:3px 12px;margin:2px;cursor:pointer;border:1px solid var(--line);font-size:.88rem}
  .pill.active{background:var(--blue);color:#fff;border-color:var(--blue)}
  .muted{color:var(--muted);font-size:.84rem}
  .up{color:var(--bad)} .down{color:var(--good)}
  .warn{background:var(--warnbg);border:1px solid #f0c79a;border-radius:8px;padding:8px 10px;color:var(--warn);font-size:.84rem}
  .sumbox{background:#f0f6ff;border:1px solid #cfe0fb;border-radius:8px;padding:10px}
  svg text{font-size:10px;fill:var(--muted)}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
  @media print{ button,.noprint{display:none!important} body{background:#fff} .card{box-shadow:none;break-inside:avoid} }
</style>
</head>
<body>
<div class="wrap">
  <div class="row" style="justify-content:space-between">
    <h1>📊 InBody 減重追蹤管理</h1>
    <div class="noprint row">
      <button class="sec sm" onclick="exportJSON()">⬇ 匯出備份(JSON)</button>
      <label class="sm" style="margin:0"><input type="file" id="impFile" accept=".json" style="display:none" onchange="importJSON(event)"><span class="pill" onclick="document.getElementById('impFile').click()">⬆ 匯入備份</span></label>
    </div>
  </div>
  <p class="muted noprint">資料只存在「這台裝置的瀏覽器」(localStorage)，自動儲存、自動讀取，不上雲。請定期「匯出備份」保存。⚠️ 衛教/追蹤輔助，非醫療診斷。　｜　工具版本：2026-05-27</p>

  <!-- 病人選擇 -->
  <div class="card noprint">
    <h2>病人</h2>
    <div class="chips" id="patientChips"></div>
    <div class="row" style="margin-top:6px">
      <input id="newPname" placeholder="新增病人姓名/代號" style="max-width:220px">
      <button class="sm" onclick="addPatient()">＋ 新增病人</button>
      <button class="sm danger" onclick="delPatient()" id="delPBtn" style="display:none">刪除目前病人</button>
    </div>
  </div>

  <div id="main" style="display:none">
    <!-- 病人基本資料 -->
    <div class="card">
      <h2>基本資料 — <span id="pTitle"></span></h2>
      <div class="grid">
        <div><label>姓名 / 代號</label><input id="b_name" oninput="saveBasic()" onchange="renderAll()"></div>
        <div><label>病歷號</label><input id="b_mrn" oninput="saveBasic()"></div>
        <div><label>身高 (cm)</label><input id="b_height" oninput="saveBasic()"></div>
        <div><label>性別</label><select id="b_sex" onchange="saveBasic()"><option value="女">女</option><option value="男">男</option></select></div>
        <div><label>年齡</label><input id="b_age" oninput="saveBasic()"></div>
        <div><label>目標體重 (kg)</label><input id="b_target" oninput="saveBasic();render()"></div>
      </div>
      <label>備註</label><textarea id="b_note" rows="2" oninput="saveBasic()"></textarea>
    </div>

    <!-- 新增門診紀錄 -->
    <div class="card noprint">
      <h2>新增本次門診 InBody 數據</h2>
      <div class="row"><label style="margin:0">日期</label><input type="date" id="v_date" style="max-width:170px"></div>
      <div class="grid" id="visitForm" style="margin-top:8px"></div>
      <div class="row" style="margin-top:8px">
        <button onclick="addVisit()">＋ 儲存這次紀錄</button>
        <span class="muted">只填有量到的欄位即可；空白不畫入趨勢。</span>
      </div>
    </div>

    <!-- 個人化總結 -->
    <div class="card">
      <h2>個人化總結與建議</h2>
      <div class="sumbox" id="autoSummary">（尚無足夠紀錄）</div>
      <label style="margin-top:8px">醫師 / AI 補充建議（會一起存檔、列入報告）</label>
      <textarea id="b_advice" rows="3" oninput="saveBasic()" placeholder="可手動寫，或日後由 AI 模型生成後貼入"></textarea>
    </div>

    <!-- 趨勢圖 -->
    <div class="card">
      <h2>趨勢圖</h2>
      <div class="chips noprint" id="chartPicker"></div>
      <div id="charts"></div>
    </div>

    <!-- 紀錄表 -->
    <div class="card">
      <h2>歷次門診紀錄</h2>
      <div class="scroll"><table id="visitTable"></table></div>
    </div>

    <div class="row noprint" style="margin:10px 0">
      <button onclick="window.print()">🖨 列印 / 存 PDF 報告</button>
    </div>
  </div>
</div>

<script>
const PARAMS=[
 {k:'weight',label:'體重',unit:'kg',key:1,goalDown:1},
 {k:'bmi',label:'BMI',unit:'',key:1,goalDown:1},
 {k:'pbf',label:'體脂率',unit:'%',key:1,goalDown:1},
 {k:'bfm',label:'體脂肪量',unit:'kg',key:1,goalDown:1},
 {k:'smm',label:'骨骼肌肉量',unit:'kg',key:1,goalUp:1},
 {k:'vfa',label:'內臟脂肪面積',unit:'cm²',key:1,goalDown:1},
 {k:'vfl',label:'內臟脂肪等級',unit:'',goalDown:1},
 {k:'bmr',label:'基礎代謝率',unit:'kcal'},
 {k:'tbw',label:'身體水分',unit:'L'},
 {k:'protein',label:'蛋白質',unit:'kg'},
 {k:'mineral',label:'礦物質',unit:'kg'},
 {k:'whr',label:'腰臀比',unit:'',goalDown:1},
 {k:'smi',label:'SMI骨骼肌指數',unit:'kg/m²',goalUp:1},
 {k:'phase',label:'相位角',unit:'°',goalUp:1},
 {k:'icw',label:'細胞內水',unit:'L'},
 {k:'ecw',label:'細胞外水',unit:'L'},
 {k:'edema',label:'水腫指數',unit:''},
 {k:'waist',label:'腹圍',unit:'cm',goalDown:1},
 {k:'score',label:'InBody分數',unit:'分',goalUp:1},
 {k:'bodyage',label:'身體年齡',unit:'歲',goalDown:1},
];
const LS='inbody_tracker_v1';
let DB={patients:[]}, cur=null, chartKeys=['weight','pbf','bfm','smm','vfa'];

function load(){ try{DB=JSON.parse(localStorage.getItem(LS))||{patients:[]}}catch(e){DB={patients:[]}} }
function save(){ localStorage.setItem(LS,JSON.stringify(DB)); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function P(){ return DB.patients.find(p=>p.id===cur); }

function addPatient(){
  const n=document.getElementById('newPname').value.trim(); if(!n)return;
  const p={id:uid(),name:n,height:'',sex:'女',age:'',target:'',note:'',advice:'',visits:[]};
  DB.patients.push(p); cur=p.id; document.getElementById('newPname').value=''; save(); renderAll();
}
function delPatient(){
  if(!cur)return; const p=P(); if(!confirm('確定刪除病人「'+p.name+'」與其所有紀錄？'))return;
  DB.patients=DB.patients.filter(x=>x.id!==cur); cur=DB.patients[0]?.id||null; save(); renderAll();
}
function selectPatient(id){ cur=id; renderAll(); }
function saveBasic(){
  const p=P(); if(!p)return;
  const nm=document.getElementById('b_name').value.trim(); if(nm)p.name=nm;
  p.mrn=document.getElementById('b_mrn').value;
  p.height=document.getElementById('b_height').value; p.sex=document.getElementById('b_sex').value;
  p.age=document.getElementById('b_age').value; p.target=document.getElementById('b_target').value;
  p.note=document.getElementById('b_note').value; p.advice=document.getElementById('b_advice').value;
  document.getElementById('pTitle').textContent=p.name+(p.mrn?'（'+p.mrn+'）':'');
  save();
}
function buildVisitForm(){
  document.getElementById('visitForm').innerHTML=PARAMS.map(pa=>
    `<div><label>${pa.label}${pa.unit?' ('+pa.unit+')':''}</label><input id="vf_${pa.k}" inputmode="decimal"></div>`).join('');
}
function addVisit(){
  const p=P(); if(!p)return;
  const date=document.getElementById('v_date').value || new Date().toISOString().slice(0,10);
  const v={date};
  PARAMS.forEach(pa=>{ const val=document.getElementById('vf_'+pa.k).value.trim(); if(val!=='')v[pa.k]=parseFloat(val); });
  p.visits.push(v); p.visits.sort((a,b)=>a.date.localeCompare(b.date)); save();
  PARAMS.forEach(pa=>document.getElementById('vf_'+pa.k).value=''); document.getElementById('v_date').value='';
  render();
}
function delVisit(i){ const p=P(); if(confirm('刪除 '+p.visits[i].date+' 這次紀錄？')){ p.visits.splice(i,1); save(); render(); } }

function fmtDelta(d,pa){
  if(d===null||isNaN(d))return '';
  const sign=d>0?'+':''; const cls=d>0?'up':(d<0?'down':'');
  return `<span class="${cls}">${sign}${(+d.toFixed(1))}</span>`;
}
function render(){
  const p=P(); if(!p)return;
  // 紀錄表
  const vs=p.visits;
  let head='<tr><th>項目</th>'+vs.map((v,i)=>`<th>${v.date}<br><button class="sm danger noprint" onclick="delVisit(${i})">刪</button></th>`).join('')+'</tr>';
  let body=PARAMS.map(pa=>{
    const cells=vs.map(v=>v[pa.k]!=null?(+v[pa.k]).toString():'—').join('</td><td>');
    return `<tr><td style="text-align:left">${pa.label}${pa.unit?' ('+pa.unit+')':''}</td><td>${cells}</td></tr>`;
  }).join('');
  document.getElementById('visitTable').innerHTML=vs.length?head+body:'<tr><td class="muted">尚無紀錄</td></tr>';
  // 圖表選擇
  document.getElementById('chartPicker').innerHTML=PARAMS.map(pa=>
    `<span class="pill ${chartKeys.includes(pa.k)?'active':''}" onclick="toggleChart('${pa.k}')">${pa.label}</span>`).join('');
  // 畫圖
  document.getElementById('charts').innerHTML=chartKeys.map(k=>lineChart(k)).join('')||'<p class="muted">選上方項目顯示趨勢</p>';
  // 總結
  document.getElementById('autoSummary').innerHTML=summary(p);
}
function toggleChart(k){ chartKeys.includes(k)?chartKeys=chartKeys.filter(x=>x!==k):chartKeys.push(k); render(); }

function lineChart(k){
  const p=P(); const pa=PARAMS.find(x=>x.k===k);
  const pts=p.visits.filter(v=>v[k]!=null).map(v=>({d:v.date,y:+v[k]}));
  if(pts.length<1)return '';
  const W=Math.max(320,Math.min(900,p.visits.length*90)),H=170,padL=44,padR=12,padT=16,padB=30;
  const ys=pts.map(p=>p.y),mn=Math.min(...ys),mx=Math.max(...ys),rng=(mx-mn)||1;
  const x=i=>padL+(pts.length===1?0:i*(W-padL-padR)/(pts.length-1));
  const y=v=>padT+(H-padT-padB)*(1-(v-mn)/rng);
  let path=pts.map((p,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(p.y).toFixed(1)).join(' ');
  let dots=pts.map((p,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(p.y).toFixed(1)}" r="3.5" fill="#2c5aa0"/><text x="${x(i).toFixed(1)}" y="${(y(p.y)-7).toFixed(1)}" text-anchor="middle" style="fill:#1a3b6e;font-weight:700">${p.y}</text>`).join('');
  let xlab=pts.map((p,i)=>`<text x="${x(i).toFixed(1)}" y="${H-10}" text-anchor="middle">${p.d.slice(5)}</text>`).join('');
  const first=pts[0].y,last=pts[pts.length-1].y,delta=last-first;
  const dir=delta>0?'up':(delta<0?'down':'');
  return `<div style="margin:6px 0"><b style="color:#1a3b6e">${pa.label}</b> <span class="muted">${pa.unit}</span> <span class="${dir}">（首→末 ${delta>0?'+':''}${(+delta.toFixed(1))}）</span>
   <div class="scroll"><svg width="${W}" height="${H}" style="max-width:100%">
   <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${H-padB}" stroke="#ccc"/>
   <line x1="${padL}" y1="${H-padB}" x2="${W-padR}" y2="${H-padB}" stroke="#ccc"/>
   <text x="4" y="${padT+4}">${(+mx.toFixed(1))}</text><text x="4" y="${H-padB}">${(+mn.toFixed(1))}</text>
   <path d="${path}" fill="none" stroke="#2c5aa0" stroke-width="2"/>${dots}${xlab}</svg></div></div>`;
}

function summary(p){
  const vs=p.visits; if(vs.length<2)return '至少需要 2 次紀錄才能比較趨勢。目前 '+vs.length+' 次。';
  const first=vs[0],last=vs[vs.length-1];
  const g=(k)=>(first[k]!=null&&last[k]!=null)?(last[k]-first[k]):null;
  const dw=g('weight'),df=g('bfm'),dm=g('smm'),dp=g('pbf'),dv=g('vfa');
  let lines=[`📅 期間：${first.date} → ${last.date}（共 ${vs.length} 次）`];
  if(dw!=null)lines.push(`體重 ${first.weight} → ${last.weight} kg（${dw>0?'+':''}${(+dw.toFixed(1))} kg）`);
  if(dp!=null)lines.push(`體脂率 ${first.pbf} → ${last.pbf} %（${dp>0?'+':''}${(+dp.toFixed(1))}）`);
  if(df!=null)lines.push(`體脂肪量 ${(+df.toFixed(1))} kg`);
  if(dm!=null)lines.push(`骨骼肌肉量 ${dm>0?'+':''}${(+dm.toFixed(1))} kg`);
  if(dv!=null)lines.push(`內臟脂肪面積 ${dv>0?'+':''}${(+dv.toFixed(1))} cm²`);
  // 評語
  let verdict=[];
  if(df!=null&&dm!=null){
    if(df<-0.3&&dm>=-0.3)verdict.push('✅ 減脂同時肌肉維持，是理想的減重組成。');
    else if(df<-0.3&&dm<-0.3)verdict.push('⚠️ 脂肪下降但肌肉也流失，建議加強蛋白質攝取與阻力訓練。');
    else if(df>=0.3)verdict.push('⚠️ 體脂肪未下降，需檢視飲食與藥物順從性。');
  }
  if(p.target&&last.weight!=null){
    const rem=(last.weight-parseFloat(p.target));
    verdict.push(rem>0?`🎯 距目標體重 ${p.target} kg 還差 ${(+rem.toFixed(1))} kg。`:`🎉 已達/超越目標體重 ${p.target} kg。`);
  }
  return lines.map(l=>'• '+l).join('<br>')+(verdict.length?'<br><br>'+verdict.join('<br>'):'');
}

function renderAll(){
  // chips
  document.getElementById('patientChips').innerHTML=DB.patients.length?
    DB.patients.map(p=>`<span class="pill ${p.id===cur?'active':''}" onclick="selectPatient('${p.id}')">${p.name}（${p.visits.length}次）</span>`).join(''):
    '<span class="muted">尚無病人，請先新增。</span>';
  document.getElementById('delPBtn').style.display=cur?'':'none';
  const p=P();
  document.getElementById('main').style.display=p?'':'none';
  if(!p)return;
  document.getElementById('pTitle').textContent=p.name+(p.mrn?'（'+p.mrn+'）':'');
  document.getElementById('b_name').value=p.name||''; document.getElementById('b_mrn').value=p.mrn||'';
  document.getElementById('b_height').value=p.height||''; document.getElementById('b_sex').value=p.sex||'女';
  document.getElementById('b_age').value=p.age||''; document.getElementById('b_target').value=p.target||'';
  document.getElementById('b_note').value=p.note||''; document.getElementById('b_advice').value=p.advice||'';
  render();
}
function exportJSON(){
  const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='inbody_backup_'+new Date().toISOString().slice(0,10)+'.json'; a.click();
}
function importJSON(e){
  const f=e.target.files[0]; if(!f)return; const r=new FileReader();
  r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!d.patients)throw 0;
    if(confirm('匯入會「取代」目前所有資料，確定？（建議先匯出備份）')){ DB=d; cur=DB.patients[0]?.id||null; save(); renderAll(); } }
    catch(_){ alert('檔案格式不正確'); } };
  r.readAsText(f); e.target.value='';
}

load(); buildVisitForm(); cur=DB.patients[0]?.id||null; renderAll();
</script>
</body>
</html>
