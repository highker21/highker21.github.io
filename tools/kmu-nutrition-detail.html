<script>
(function(){
  var d = JSON.parse(document.getElementById('enc').textContent);
  function b64(s){ var bin = atob(s), u = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; }
  document.getElementById('f').addEventListener('submit', async function(e){
    e.preventDefault();
    var btn = document.getElementById('go'), msg = document.getElementById('msg');
    btn.disabled = true; msg.textContent = ''; btn.textContent = '解密中…';
    try {
      var km = await crypto.subtle.importKey('raw', new TextEncoder().encode(document.getElementById('pw').value), 'PBKDF2', false, ['deriveKey']);
      var key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(d.salt), iterations:d.iter, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, false, ['decrypt']);
      var pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(d.iv)}, key, b64(d.ct));
      var html = new TextDecoder().decode(pt);
      document.open(); document.write(html); document.close();
    } catch (err) {
      msg.textContent = '密碼不對，請再試一次。';
      btn.disabled = false; btn.textContent = '開啟';
    }
  });
})();
</script>
