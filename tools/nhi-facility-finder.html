let fCity="",fLvl="",fAlum=false;
const q=document.getElementById('q'),list=document.getElementById('list'),countEl=document.getElementById('count');

// 中文 subsequence 比對：查詢字元依序出現即可
function subseq(needle,hay){let i=0;for(const c of hay){if(c===needle[i])i++;if(i>=needle.length)return true;}return i>=needle.length;}
function matchText(term,f){
  if(!term)return true;
  const t=term.trim().toLowerCase();
  if(/^[0-9a-z]+$/i.test(t)) return f.code.toLowerCase().includes(t)||f.name.toLowerCase().includes(t);
  const hay=f.name+ " "+(f.adrs.join(""))+" "+(f.aspec.join(""));
  return hay.includes(term.trim())||subseq(term.trim(),f.name);
}
function esc(s){return (s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}
function render(){
  const term=q.value;
  let r=DATA.filter(f=>(!fCity||f.city===fCity)&&(!fLvl||f.level===fLvl)&&(!fAlum||f.alumni)&&matchText(term,f));
  // 校友優先，其次等級
  r.sort((a,b)=>(b.alumni-a.alumni)||0);
  countEl.textContent=`符合 ${r.length} 家`+(fAlum?"（高醫校友）":"");
  if(!r.length){list.innerHTML='<div class="empty">查無符合的院所，換個關鍵字或調整篩選。</div>';return;}
  const MAX=300;
  list.innerHTML=r.slice(0,MAX).map(f=>{
    const dept=f.dept&&f.dept!==f.kind?` · ${esc(f.dept)}`:"";
    const alumHtml=f.alumni?`<div class="alumrow">★ 高醫校友診所${f.aspec.length?'｜'+esc(f.aspec.join('、')):''}${f.adrs.length?'｜'+esc(f.adrs.join('、')):''}</div>`:"";
    const tel=f.tel?` · <a href="tel:${esc(f.tel.replace(/[^0-9]/g,''))}">${esc(f.tel)}</a>`:"";
    return `<div class="card">
      <div class="top">
        <span class="badge ${BADGE[f.level]}">${esc(f.level)}</span>
        ${f.alumni?'<span class="badge b-alum">★ 高醫校友</span>':''}
        <span class="meta" style="margin:0">${esc(f.kind)} · ${esc(f.city)}</span>
      </div>
      <div class="name">${esc(f.name)}</div>
      <div class="codewrap"><span class="code">${esc(f.code)}</span><button class="copy" data-code="${esc(f.code)}">複製代碼</button></div>
      <div class="meta">${esc(f.addr)}${tel}${dept}</div>
      ${alumHtml}
    </div>`;
  }).join("")+(r.length>MAX?`<div class="empty">僅顯示前 ${MAX} 家，請縮小關鍵字。</div>`:"");
}
list.addEventListener('click',e=>{
  const b=e.target.closest('.copy');if(!b)return;
  const code=b.dataset.code;
  (navigator.clipboard?navigator.clipboard.writeText(code):Promise.reject()).then(()=>{
    b.textContent="已複製 ✓";b.classList.add('done');setTimeout(()=>{b.textContent="複製代碼";b.classList.remove('done');},1200);
  }).catch(()=>{const ta=document.createElement('textarea');ta.value=code;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();b.textContent="已複製 ✓";b.classList.add('done');setTimeout(()=>{b.textContent="複製代碼";b.classList.remove('done');},1200);});
});
function bindChips(id,cb){document.getElementById(id).addEventListener('click',e=>{const c=e.target.closest('.chip');if(!c)return;cb(c,e);});}
bindChips('cityF',c=>{document.querySelectorAll('#cityF .chip').forEach(x=>x.classList.remove('on'));c.classList.add('on');fCity=c.dataset.city;render();});
bindChips('lvlF',c=>{
  if(c.dataset.alum){fAlum=!fAlum;c.classList.toggle('on',fAlum);render();return;}
  document.querySelectorAll('#lvlF .chip:not(.alum)').forEach(x=>x.classList.remove('on'));c.classList.add('on');fLvl=c.dataset.lvl;render();
});
q.addEventListener('input',render);
render();
</script>
</body>
