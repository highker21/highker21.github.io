<title>糖尿病飲食建議：種類、順序、份量 · 衛教圖卡</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{--ink:#1b1f1d;--sub:#5f655f;--line:#e6e2d8;--accent:#0f6e64;--hot:#c0562c;--paper:#faf8f2;--card:#fff;--faint:#9a978c;--ok:#27ae60;--mod:#e67e22;--warn:#c0392b;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#eceae2;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang TC","Noto Sans TC","Microsoft JhengHei","Sukhumvit Set","Noto Sans Thai",sans-serif;color:var(--ink);padding:20px 12px;-webkit-font-smoothing:antialiased}
.tabs{max-width:900px;margin:0 auto 14px;display:flex;gap:8px}
.tab{flex:1;text-align:center;padding:12px 6px;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:pointer;font-weight:800;color:var(--sub);font-size:15px}
.tab small{display:block;font-weight:500;font-size:11px;color:var(--faint);margin-top:2px}
.tab.active{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tab.active small{color:#9fd8ce}
.langtabs{max-width:900px;margin:0 auto 10px;display:flex;gap:6px;flex-wrap:wrap}
.langtabs .tab{flex:1 1 calc(33.333% - 4px);padding:9px 5px;font-size:13.5px}
.langtabs .tab small{font-size:10px}
.langbadge{display:inline-block;background:var(--ink);color:var(--paper);font-size:12.5px;font-weight:800;padding:5px 13px;border-radius:999px;margin-bottom:11px;line-height:1.5}
.sheet{max-width:900px;margin:0 auto;background:var(--paper);padding:40px 38px 26px}
.head{text-align:center;border-bottom:2px solid var(--ink);padding-bottom:15px;margin-bottom:4px}
.kick{font-size:12px;letter-spacing:.34em;color:var(--accent);font-weight:800;margin-bottom:9px}
.head h1{font-size:31px;font-weight:900;letter-spacing:-.01em;line-height:1.1}
.head .zh{font-size:14px;color:var(--sub);margin-top:6px;letter-spacing:.04em}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
.c{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 15px;display:flex;flex-direction:column;align-items:center;text-align:center;justify-content:flex-start;min-height:168px;position:relative}
.c .n{position:absolute;top:10px;left:14px;font-size:14px;font-weight:900;color:#cfcabb}
.c i{font-size:33px;color:var(--accent);margin:10px 0 12px}
.c.hot i{color:var(--hot)}
.c .t{font-size:15.5px;font-weight:800;line-height:1.45}
.c .t b{color:var(--hot)} .c .t .a{color:var(--accent)}
.c .w{display:block;margin-top:6px;font-size:12.5px;font-weight:500;color:var(--sub);line-height:1.55}
.c.lead{grid-column:span 3;flex-direction:row;gap:18px;justify-content:flex-start;text-align:left;min-height:auto;background:var(--ink);border:none}
.c.lead i{color:var(--paper);font-size:28px;margin:0;flex:0 0 auto}
.c.lead .t{color:var(--paper);font-size:16px;font-weight:600;line-height:1.6}
.c.lead .t b{color:#7fd8cc}

/* 外文在前、中文小字在後（老闆 2026-09-10 裁示；與 thyroid-fna-edu 同一套） */
.p-zh,.p-fo{display:block}
.p-zh{font-size:12.5px;font-weight:500;color:var(--sub);line-height:1.55;margin-top:5px}
.c .t .p-zh{font-size:12.5px}
.c .w .p-zh{font-size:11.5px;color:var(--faint);margin-top:3px}
.c.lead .t .p-zh{color:#b9c6c2;font-size:12.5px}
td .p-zh,th .p-zh{font-size:11.5px;color:var(--faint);margin-top:2px;font-weight:500}
.head h1 .p-zh{font-size:15px;color:var(--sub);margin-top:5px;font-weight:700}
.head .zh .p-zh,.note .p-zh{font-size:12px;color:var(--faint);margin-top:3px}

table.food{width:100%;border-collapse:collapse;margin-top:16px;font-size:14px;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
table.food th,table.food td{border-bottom:1px solid var(--line);padding:10px 10px;text-align:left;vertical-align:top;line-height:1.6}
table.food th{background:var(--paper);font-weight:800;color:var(--sub);font-size:13px}
/* 欄寬：原本寫在 <th> 的 inline style，改版時移到 CSS，並為雙語留寬（外文比中文長） */
table.food th:nth-child(1),table.food td:nth-child(1){width:110px}
table.food th:nth-child(2),table.food td:nth-child(2){width:180px}
.myth th:nth-child(1),.myth td:nth-child(1){width:250px}
table.food td.g{color:var(--ok);font-weight:800}
table.food td.y{color:var(--mod);font-weight:800}
table.food td.r{color:var(--warn);font-weight:800}
.myth{margin-top:16px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.myth h3{font-size:16px;color:var(--accent);margin-bottom:10px;border-left:4px solid var(--accent);padding-left:10px}
.myth table{width:100%;border-collapse:collapse;font-size:14px}
.myth th,.myth td{border-bottom:1px solid var(--line);padding:9px 8px;text-align:left;vertical-align:top;line-height:1.65}
.myth th{background:var(--paper);font-weight:800;color:var(--sub);font-size:13px}
.myth td.x{color:var(--warn);font-weight:700}
.note{margin-top:14px;font-size:12.5px;color:var(--sub);line-height:1.7}
.foot{margin-top:15px;text-align:center;font-size:11px;color:var(--faint);line-height:1.7;border-top:1px solid var(--line);padding-top:11px}
.foot b{color:var(--sub)}
.transnote{margin-top:6px;text-align:center;font-size:10.5px;color:var(--faint);line-height:1.6}
.transnote .p-zh{font-size:10.5px;margin-top:2px}
.bar{text-align:center;margin:16px 0}
.bar button{background:var(--ink);color:var(--paper);border:0;padding:11px 24px;font-size:15px;font-weight:700;border-radius:6px;cursor:pointer}
/* 餐盤圖（plate 頁籤） */
.plate-wrap{display:grid;grid-template-columns:260px 1fr;gap:18px;align-items:center;margin-top:16px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px}
.plate-wrap svg{width:100%;height:auto;display:block}
.motto{list-style:none;margin:0;padding:0}
.motto li{position:relative;padding:7px 0 7px 30px;font-size:14.5px;line-height:1.55;border-bottom:1px dashed var(--line)}
.motto li:last-child{border-bottom:0}
.motto li i{position:absolute;left:2px;top:9px;color:var(--accent);font-size:16px;width:20px;text-align:center}
.motto li b{color:var(--hot)}
.motto li .dm{display:block;font-size:12.5px;color:var(--sub);margin-top:1px}
.carb{margin-top:14px;background:var(--ink);color:var(--paper);border-radius:12px;padding:14px 18px;font-size:14.5px;line-height:1.7}
.carb b{color:#7fd8cc}
table.food td.k{font-weight:800;color:var(--ink);white-space:nowrap}
@media(max-width:640px){.plate-wrap{grid-template-columns:1fr}.plate-wrap svg{max-width:240px;margin:0 auto}table.food td.k{white-space:normal}
  .head h1{font-size:24px}
  /* 份量表在手機改成一列一卡：四欄硬塞 430px 會變成一字一行 */
  table.food.portion,table.food.portion tbody,table.food.portion tr,table.food.portion td{display:block;width:auto}
  table.food.portion tr:first-child{display:none}
  table.food.portion tr{border-bottom:2px solid var(--line);padding:6px 0}
  table.food.portion td{border-bottom:0;padding:4px 8px}
  table.food.portion td.k{font-size:15px;color:var(--accent);padding-top:8px}
  table.food.portion td[data-h]::before{content:attr(data-h) "：";font-weight:800;color:var(--sub);font-size:12.5px}}

@media print{@page{size:A4 portrait;margin:8mm}body{background:#fff;padding:0}.tabs,.langtabs,.no-print{display:none!important}.sheet{max-width:100%;padding:4mm}.c,tr{break-inside:avoid}}
@media(max-width:640px){.grid{grid-template-columns:repeat(2,1fr)}.c.lead{grid-column:span 2}.tabs{flex-wrap:wrap}.tab{min-width:30%}.langtabs .tab{flex:1 1 calc(50% - 3px)}
  /* 手機：取消固定欄寬，否則雙語內容會被擠成一行一兩個字 */
  table.food th:nth-child(1),table.food td:nth-child(1),
  table.food th:nth-child(2),table.food td:nth-child(2),
  .myth th:nth-child(1),.myth td:nth-child(1){width:auto}
  table.food th,table.food td,.myth th,.myth td{padding:8px 6px;font-size:13px}
  .myth{padding:12px 10px}}
@media(max-width:420px){.grid{grid-template-columns:1fr}.c.lead{grid-column:span 1;flex-direction:column;text-align:center}}

/* 三個分頁一起列印（老闆 2026-09-10 12:46 要求）：把三個 view 各渲染一份 .sheet 疊進 #printall，只在列印時顯示 */
#printall{display:none}
.bar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.bar button.ghost{background:#fff;color:var(--ink);border:1px solid var(--ink)}
@media print{
  body.printing-all #sheet,body.printing-all .bar{display:none!important}
  body.printing-all #printall{display:block}
  #printall .sheet{max-width:100%;padding:4mm}
  #printall .sheet+.sheet{break-before:page;page-break-before:always}
}

   ['r','少碰','精緻澱粉與加糖','白麵包、蛋糕、餅乾、麵線羹、肉羹、勾芡、炒飯炒麵、滷肉飯'],
   ['r','少碰','加工肉與油炸','香腸、培根、火腿、炸雞、鹹酥雞；飽和脂肪和鹽都高'],

  notes:{

let LANG = 'zh-TW', VIEW = 'order';
const ZH = L['zh-TW'];
function pair(zh, fo, k){
  if (k === 'zh-TW' || zh === fo) return zh;
  const a = `<span class="p-zh">${zh}</span>`, b = `<span class="p-fo">${fo}</span>`;
  return PAIR_ORDER === 'zh-first' ? a + b : b + a;
}

const $ = id => document.getElementById(id);

function renderLangTabs(){
  const keys = Object.keys(L);
  $('langtabs').style.display = keys.length > 1 ? '' : 'none';
  $('langtabs').innerHTML = keys.map(k =>
    `<div class="tab ${k===LANG?'active':''}" onclick="setLang('${k}')">${L[k].tab}<small>${L[k].tabsub}</small></div>`).join('');
}
function renderViewTabs(){
  const d = L[LANG];
  $('viewtabs').innerHTML = d.viewtabs.map(([v,label,sub],i) =>
    `<div class="tab ${v===VIEW?'active':''}" onclick="setV('${v}')">${pair(ZH.viewtabs[i][1],label,LANG)}<small>${pair(ZH.viewtabs[i][2],sub,LANG)}</small></div>`).join('');
}
function plateSVG(labels){
  // 半盤蔬菜（左）、右上豆魚蛋肉、右下全穀雜糧
  return `<svg viewBox="0 0 240 240" role="img" aria-label="${labels.join('、')}">
    <circle cx="120" cy="120" r="112" fill="#fff" stroke="#cfcabb" stroke-width="6"/>
    <path d="M120 20 A100 100 0 0 0 120 220 Z" fill="#dff3ea"/>
    <path d="M120 20 A100 100 0 0 1 220 120 L120 120 Z" fill="#fde7d6"/>
    <path d="M220 120 A100 100 0 0 1 120 220 L120 120 Z" fill="#f4ecd2"/>
    <line x1="120" y1="20" x2="120" y2="220" stroke="#fff" stroke-width="4"/>
    <line x1="120" y1="120" x2="220" y2="120" stroke="#fff" stroke-width="4"/>
    <text x="72" y="116" text-anchor="middle" font-size="15" font-weight="800" fill="#0f6e64">${labels[0]}</text>
    <text x="72" y="136" text-anchor="middle" font-size="11" fill="#5f655f">先吃</text>
    <text x="168" y="78" text-anchor="middle" font-size="13" font-weight="800" fill="#c0562c">${labels[1]}</text>
    <text x="168" y="96" text-anchor="middle" font-size="11" fill="#5f655f">第二</text>
    <text x="168" y="166" text-anchor="middle" font-size="13" font-weight="800" fill="#8a6d1f">${labels[2]}</text>
    <text x="168" y="184" text-anchor="middle" font-size="11" fill="#5f655f">最後</text>
  </svg>`;
}
function render(){
  const d = L[LANG], k = LANG;
  document.documentElement.lang = (k === 'zh-TW') ? 'zh-Hant' : k;
  $('langbadge').textContent = d.badge;
  $('kick').innerHTML = pair(ZH.kick, d.kick, k);
  $('h1').innerHTML   = pair(ZH.h1, d.h1, k);
  $('zh').innerHTML   = pair(ZH.views[VIEW], d.views[VIEW], k);
  $('foot').innerHTML = pair(ZH.foot, d.foot, k);
  $('note').innerHTML = pair(ZH.notes[VIEW], d.notes[VIEW], k);
  $('printbtn').innerHTML = d.printbtn;
  if ($('printallbtn')) $('printallbtn').innerHTML = d.printall || ZH.printall;
  $('transnote').innerHTML = d.trans ? `${d.trans}<span class="p-zh">本外語版由 AI 協助翻譯、經醫師端校閱，非官方認證譯本；文字如有出入，以中文版為準。</span>` : '';

  let h = '';
  if (VIEW === 'order'){
    h = `<div class="grid"><div class="c lead"><i class="fa-solid fa-arrow-down-1-9"></i><div class="t">${pair(ZH.lead, d.lead, k)}</div></div>`;
    const ICON = ['fa-leaf','fa-fish','fa-bowl-rice','fa-clock','fa-mug-hot','fa-apple-whole','fa-calendar-check','fa-utensils','fa-droplet'];
    const HOT  = [1,1,1,0,0,0,0,0,0];
    d.cards.forEach((c,i) => {
      h += `<div class="c ${HOT[i]?'hot':''}"><span class="n">${String(i+1).padStart(2,'0')}</span>`
         + `<i class="fa-solid ${ICON[i]}"></i><div class="t">${pair(ZH.cards[i][0], c[0], k)}`
         + `<span class="w">${pair(ZH.cards[i][1], c[1], k)}</span></div></div>`;
    });
    h += '</div>';
  } else if (VIEW === 'plate'){
    const p = d.plate, z = ZH.plate;
    const MI = ['fa-glass-water','fa-apple-whole','fa-leaf','fa-bowl-rice','fa-hand','fa-seedling'];
    h = `<div class="plate-wrap">${plateSVG(p.labels)}<div><div class="t" style="font-size:17px;font-weight:900">${pair(z.title,p.title,k)}</div>`
      + `<div style="font-size:13.5px;color:var(--sub);margin:4px 0 10px;line-height:1.6">${pair(z.sub,p.sub,k)}</div><ul class="motto">`
      + p.motto.map((m,i)=>`<li><i class="fa-solid ${MI[i]}"></i>${pair(z.motto[i][0],m[0],k)}<span class="dm">${pair(z.motto[i][1],m[1],k)}</span></li>`).join('')
      + `</ul></div></div>`
      + `<div class="carb">${pair(z.carb,p.carb,k)}</div>`
      + `<table class="food portion"><tr>${p.head.map((t,i)=>`<th>${pair(z.head[i],t,k)}</th>`).join('')}</tr>`
      + p.rows.map((r,i)=>`<tr><td class="k">${pair(z.rows[i][0],r[0],k)}</td><td data-h="${z.head[1]}">${pair(z.rows[i][1],r[1],k)}</td><td data-h="${z.head[2]}">${pair(z.rows[i][2],r[2],k)}</td><td data-h="${z.head[3]}">${pair(z.rows[i][3],r[3],k)}</td></tr>`).join('')
      + '</table>';
  } else {
    h = `<table class="food"><tr>${d.foodhead.map((t,i)=>`<th>${pair(ZH.foodhead[i],t,k)}</th>`).join('')}</tr>`
      + d.food.map((r,i)=>`<tr><td class="${r[0]}">${pair(ZH.food[i][1],r[1],k)}</td>`
      + `<td>${pair(ZH.food[i][2],r[2],k)}</td><td>${pair(ZH.food[i][3],r[3],k)}</td></tr>`).join('')
      + '</table>';
  }
  $('body').innerHTML = h;
  renderLangTabs(); renderViewTabs();
}
function buildPrintAll(){
  const keep = VIEW, box = document.createElement('div'); box.id = 'printall';
  ZH.viewtabs.forEach(([v]) => { VIEW = v; render(); const c = $('sheet').cloneNode(true); c.removeAttribute('id'); box.appendChild(c); });
  VIEW = keep; render();
  return box;
}
function printAll(){
  const old = $('printall'); if (old) old.remove();
  const box = buildPrintAll(); document.body.appendChild(box); document.body.classList.add('printing-all');
  const done = () => { document.body.classList.remove('printing-all'); box.remove(); window.removeEventListener('afterprint', done); };
  window.addEventListener('afterprint', done);
  setTimeout(() => { window.print(); setTimeout(done, 120000); }, 50);
}
function setLang(k){ LANG = k; render(); }
function setV(v){ VIEW = v; render(); }
const q = new URLSearchParams(location.search);
if (q.get('v') && ZH.viewtabs.some(t => t[0] === q.get('v'))) VIEW = q.get('v');
if (q.get('lang') && L[q.get('lang')]) LANG = q.get('lang');
render();
if (q.get('printall')) { document.body.appendChild(buildPrintAll()); document.body.classList.add('printing-all'); }
</script></body></html>
