<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>RAI Scheduler — SMART on FHIR Launch</title>
<style>
  body{font-family:-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
       background:#f8fafc;color:#1e293b;display:flex;align-items:center;justify-content:center;
       min-height:100vh;margin:0;padding:20px;}
  .card{background:white;border-radius:12px;padding:32px 36px;max-width:520px;
        box-shadow:0 4px 24px rgba(15,23,42,0.08);border-top:4px solid #2563eb;}
  h1{font-size:18px;margin:0 0 12px;color:#1e3a8a;}
  p{font-size:14.5px;line-height:1.7;margin:8px 0;color:#475569;}
  code{background:#f1f5f9;padding:2px 6px;border-radius:4px;font-size:13px;color:#dc2626;}
  .spinner{display:inline-block;width:16px;height:16px;border:2px solid #e5e7eb;
           border-top-color:#2563eb;border-radius:50%;animation:spin 0.8s linear infinite;
           margin-right:8px;vertical-align:middle;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .err{background:#fef2f2;border-left:4px solid #dc2626;padding:12px 16px;
       border-radius:6px;color:#991b1b;font-size:14px;margin-top:12px;display:none;}
  .err.show{display:block;}
</style>
</head>
<body>
<div class="card">
  <h1>🚀 RAI Scheduler — SMART on FHIR Launch</h1>
  <p><span class="spinner"></span> 從 EHR 連線中⋯ 正在請求 FHIR 授權。</p>
  <p style="font-size:12.5px;color:#94a3b8">App: <code>rai-scheduler-prototype</code><br>
  Scopes: <code>openid fhirUser launch patient/Patient.read patient/Observation.read</code></p>
  <div class="err" id="err"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/fhirclient@2.6.3/build/fhir-client.js"></script>
<script>
  // SMART on FHIR Launch sequence
  // ─────────────────────────────────────
  // When EHR calls this URL with ?iss=<FHIR_URL>&launch=<token>, we initiate OAuth2.
  // Alternatively, standalone launch can be triggered with ?iss=<FHIR_URL> only.
  // After successful auth, browser is redirected back to RAI-scheduler-smart.html.

  FHIR.oauth2.authorize({
    client_id: "rai-scheduler-prototype",
    scope: "openid fhirUser launch patient/Patient.read patient/Observation.read launch/patient",
    redirect_uri: "RAI-scheduler-smart.html"
  }).catch(err => {
    console.error("[RAI-launch] authorize failed:", err);
    const e = document.getElementById("err");
    e.classList.add("show");
    e.innerHTML = `<strong>❌ 授權失敗：</strong> ${String(err && err.message || err)}<br><br>
      <strong>常見原因</strong>：<br>
      1. URL 缺少 <code>?iss=</code>（FHIR base URL）<br>
      2. 該 EHR 未註冊本 App<br>
      3. 網路被擋<br><br>
      <strong>測試方式</strong>：用 SMART Health IT 沙盒 →
      <a href="https://launch.smarthealthit.org/?launch_url=https://highker21.github.io/tools/RAI-launch.html"
         target="_blank">點我開沙盒</a>`;
  });
</script>
</body>
</html>
