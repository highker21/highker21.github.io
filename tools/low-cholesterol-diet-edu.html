   ['Switch cooking oil to <b>olive, canola or camellia oil</b>','Steam, boil, braise or bake instead of deep-frying. When eating out, skim off the surface oil and remove the skin first.'],
   ['Overall pattern: <b>Mediterranean</b> or <b>DASH</b> diet','2025 Taiwan lipid guideline: people at low or moderate risk try lifestyle change for 3&ndash;6 months first, then decide about medication.'],
   ['Weight, exercise and quitting smoking <b>go together</b>','Losing 5% of body weight already changes your lipid profile; aim for 150 minutes of moderate exercise a week. Alcohol does not help LDL &mdash; do not rely on red wine.'],
  ],

  mythtitle:'These claims are not supported by guidelines or research',
  mythhead:['What you often hear','What is actually true'],
  myths:[
   ['&ldquo;You can&rsquo;t eat eggs, the yolk is high in cholesterol&rdquo;','Dietary cholesterol has limited effect on blood LDL; saturated fat is the main driver. Since 2018 the AHA/ACC has set no upper limit on dietary cholesterol. One egg a day is fine for most people.'],
   ['&ldquo;Fish oil lowers cholesterol&rdquo;','Fish oil (EPA/DHA) lowers triglycerides. It does not lower LDL, and some formulations raise it slightly. LDL comes down through saturated fat, fibre, plant sterols and medication.'],
   ['&ldquo;All vegetable oils are healthy&rdquo;','Coconut and palm oil are more than 80% saturated fat and raise LDL &mdash; treat them like animal fat and use less.'],
   ['&ldquo;If the label says zero cholesterol, it&rsquo;s a good oil&rdquo;','Vegetable oil never contained cholesterol in the first place; that label says nothing about saturated fat. Read the &ldquo;saturated fat&rdquo; line instead.'],
   ['&ldquo;Red yeast rice or supplements can replace the drug&rdquo;','Red yeast rice contains natural lovastatin, but the dose is inconsistent and the quality varies &mdash; and it carries the same liver and muscle side effects. If you need medication, use medication with a known dose.'],
   ['&ldquo;Red wine protects the heart&rdquo;','Alcohol does not lower LDL; it raises triglycerides and blood pressure. If you do not already drink, there is no heart-related reason to start.'],
   ['&ldquo;I&rsquo;m thin, so diet doesn&rsquo;t matter&rdquo;','LDL is not fully tied to body weight &mdash; people with familial hypercholesterolaemia are often thin. Thin people follow this same card.'],
   ['&ldquo;If my diet is good I can stop the medication&rdquo;','Diet lowers LDL by at most 10&ndash;20%; one tablet lowers it 30&ndash;50%. If you already have cardiovascular disease or diabetes, diet alone usually cannot reach your target. Stopping medication is your doctor&rsquo;s decision.'],
  ],
  notes:{
   core:'The percentages are study averages and vary a lot between individuals; what counts is your blood test three months from now. If you are already taking a lipid-lowering drug, follow the diet but do not stop the drug on your own.',
   food:'Serving sizes: one vegetable serving is about half a bowl cooked; one fruit serving is about the size of your fist; one nut serving is about 10 g (1 disposable soup spoon), counted under fats and nuts in the Taiwan daily dietary guide. If you eat out often, start with three things: remove the skin, skim the oil, and switch your staple to brown rice or oats.',
   myth:'Sources: 2025 Taiwan lipid management guideline; 2018 AHA/ACC cholesterol guideline; 2019 ESC/EAS dyslipidaemia guideline; 2021 AHA dietary guidance; randomised trials and meta-analyses of the Portfolio diet.'},

'vi':{badge:'🇻🇳　越南文　·　Tiếng Việt　·　Vietnamese',tab:'🇻🇳 Tiếng Việt',tabsub:'越南文　Vietnamese',
  h1:'Chế độ ăn giảm cholesterol', kick:'Khoa Nội tiết &amp; Chuyển hóa　·　Giáo dục dinh dưỡng',
  printbtn:'🖨 In bản đang xem / Lưu thành PDF (A4)',

  viewtabs:[['core','9 việc cần làm','mỗi việc giảm được bao nhiêu'],['food','Đèn giao thông thực phẩm','nên ăn / vừa phải / hạn chế'],['myth','Những hiểu lầm thường gặp','không có bằng chứng ủng hộ']],
  views:{core:'9 việc cần làm　·　mục tiêu là hạ cholesterol xấu (LDL-C)',food:'Đèn giao thông thực phẩm　·　nên ăn, vừa phải, hạn chế',myth:'Những hiểu lầm thường gặp　·　không có bằng chứng ủng hộ'},
  lead:'Nếu làm đúng, chế độ ăn hạ LDL-C khoảng <b>10–20%</b>; kết hợp bốn việc (chế độ ăn Portfolio) đạt tới <b>20–30%</b> trong nghiên cứu. Đây là tất cả những gì ăn uống làm được, nhưng không thay thế thuốc bác sĩ đã kê.',
  cards:[
   ['Giữ <b>chất béo bão hòa</b> dưới <b>7% năng lượng mỗi ngày</b>','Khoảng 15 g với người ăn 2.000 kcal. Nguồn chính: thịt mỡ, da gà, mỡ heo và bơ, dầu dừa, dầu cọ, sữa nguyên kem, bánh ngọt. Đây là việc hạ LDL nhiều nhất, khoảng 8–10%.'],
   ['Đưa <b>chất béo chuyển hóa</b> về 0','Shortening, bơ thực vật, bánh ngàn lớp, đồ chiên đi chiên lại. Thấy nhãn ghi “dầu hydro hóa một phần” thì đặt lại kệ.'],
   ['Lòng đỏ trứng <b>không còn là thủ phạm chính</b>','Cholesterol trong thức ăn ảnh hưởng đến LDL trong máu ít hơn chất béo bão hòa. Một quả trứng mỗi ngày là được với đa số người; ăn vừa phải nếu đã có bệnh tim mạch hoặc tiểu đường. Nội tạng, gạch cua, trứng tôm, trứng cá mới là thứ cần giảm.'],
   ['<b>Chất xơ hòa tan</b> <span class="a">5–10 g mỗi ngày</span>','Yến mạch, lúa mạch, các loại đậu, đậu bắp, táo, cam quýt. Nó giữ acid mật trong ruột để thải ra ngoài, hạ LDL khoảng 5%. Một bát cháo yến mạch khoảng 2 g.'],
   ['<b>Sterol thực vật</b> <span class="a">2 g mỗi ngày</span>','Hạ LDL khoảng 8–10%. Rau thường không đạt được lượng này, phải dùng thực phẩm bổ sung (sữa hoặc bơ phết có ghi chứa sterol thực vật).'],
   ['<b>Thay thịt đỏ</b>: cá 2 lần/tuần, đậu nành, mỗi ngày một phần hạt','Một phần hạt khoảng 10 g (1 thìa canh nhựa), tính vào lượng dầu mỡ trong ngày. Nghiên cứu dùng lượng cao hơn nên phải tính cả calo. Viên dầu cá hạ triglyceride chứ không hạ LDL.'],
   ['Đổi dầu nấu ăn sang <b>dầu ô liu, dầu hạt cải, dầu trà</b>','Hấp, luộc, kho, nướng thay cho chiên ngập dầu; ăn ngoài thì vớt lớp mỡ nổi và bỏ da trước.'],
   ['Kiểu ăn tổng thể: <b>Địa Trung Hải</b> hoặc <b>DASH</b>','Hướng dẫn lipid Đài Loan 2025: người nguy cơ thấp và trung bình thay đổi lối sống 3–6 tháng trước, rồi mới quyết định dùng thuốc.'],
   ['Cân nặng, vận động, bỏ thuốc lá <b>làm cùng lúc</b>','Giảm 5% cân nặng đã thấy mỡ máu thay đổi; 150 phút vận động cường độ vừa mỗi tuần. Rượu không giúp hạ LDL, đừng trông vào rượu vang đỏ.'],
  ],
  foodhead:['Đèn','Nhóm','Nội dung'],
  food:[
   ['g','Nên ăn','Ngũ cốc nguyên hạt &amp; tinh bột','Yến mạch, lúa mạch, gạo lứt, lúa mì nguyên cám, khoai lang, đậu gà, đậu đỏ đậu xanh; đổi hơn một nửa lượng cơm sang những thứ này'],
   ['g','Nên ăn','Đậu và chế phẩm từ đậu nành','Đậu nành, đậu đen, đậu edamame, đậu phụ, sữa đậu nành không đường; tính là chất đạm, thay được một phần thịt'],
   ['g','Nên ăn','Rau và trái cây','Mỗi ngày ít nhất 3 phần rau và 2 phần trái cây; đậu bắp, táo, cam quýt có chất xơ hòa tan đặc biệt cao'],
   ['g','Nên ăn','Dầu tốt và các loại hạt','Dầu ô liu, dầu hạt cải, dầu trà, bơ; mỗi ngày một phần hạt không tẩm gia vị (khoảng 10 g, 1 thìa canh nhựa)'],
   ['g','Nên ăn','Cá','Cá thu, cá thu đao, cá hồi, cá vược — 2 lần/tuần, hấp hoặc nướng thay vì chiên'],
   ['y','Vừa phải','Trứng','Một quả mỗi ngày là được với đa số người; nếu có bệnh tim mạch hoặc tiểu đường thì 3–4 quả mỗi tuần'],
   ['y','Vừa phải','Thịt nạc, thịt gia cầm bỏ da','Mỗi bữa bằng lòng bàn tay; chọn thăn, ức gà, bỏ da bỏ mỡ'],
   ['y','Vừa phải','Sữa ít béo','Sữa ít béo hoặc tách béo, sữa chua không đường; đổi nguyên kem sang ít béo'],
   ['y','Vừa phải','Thực phẩm bổ sung sterol thực vật','Phải đủ 2 g mỗi ngày mới có tác dụng, theo đúng khẩu phần ghi trên nhãn'],
   ['r','Hạn chế','Nguồn chất béo bão hòa','Thịt mỡ, ba chỉ, da gà, mỡ heo, mỡ bò, bơ, dầu dừa, dầu cọ, kem béo nguyên kem'],
   ['r','Hạn chế','Nguồn chất béo chuyển hóa','Bánh ngàn lớp, shortening, bơ thực vật, đồ chiên, bánh quy bánh ngọt làm từ dầu hydro hóa một phần'],
   ['r','Hạn chế','Bộ phận nhiều cholesterol','Nội tạng (gan, óc, cật), gạch cua, trứng tôm, trứng cá, mực khô'],
   ['r','Hạn chế','Thịt chế biến và đường tinh luyện','Xúc xích, thịt xông khói, giăm bông; nước ngọt và đồ ngọt làm tăng triglyceride'],
   ['r','Hạn chế','Rượu bia','Không hạ LDL mà làm tăng triglyceride; rượu vang đỏ cũng vậy'],
  ],
  mythtitle:'Những câu này không được hướng dẫn và nghiên cứu ủng hộ',
  mythhead:['Câu thường nghe','Thực tế'],
  myths:[
   ['“Không được ăn trứng, lòng đỏ nhiều cholesterol”','Cholesterol trong thức ăn ảnh hưởng đến LDL trong máu có giới hạn, chất béo bão hòa mới là nguyên nhân chính. Từ 2018 AHA/ACC đã bỏ mức trần cholesterol trong khẩu phần; một quả trứng mỗi ngày là được với đa số người.'],
   ['“Uống dầu cá hạ được cholesterol”','Dầu cá (EPA/DHA) hạ triglyceride, không hạ LDL, một số chế phẩm còn làm tăng nhẹ. Hạ LDL dựa vào chất béo bão hòa, chất xơ, sterol thực vật và thuốc.'],
   ['“Dầu thực vật thì đều tốt”','Dầu dừa và dầu cọ có hơn 80% là chất béo bão hòa, làm tăng LDL — phải hạn chế như mỡ động vật.'],
   ['“Nhãn ghi không cholesterol là dầu tốt”','Dầu thực vật vốn dĩ không có cholesterol, nhãn đó không nói gì về chất béo bão hòa. Hãy xem dòng “chất béo bão hòa”.'],
   ['“Men gạo đỏ hay thực phẩm chức năng thay được thuốc”','Men gạo đỏ có lovastatin tự nhiên, nhưng liều không ổn định, chất lượng không đồng đều, và vẫn có tác dụng phụ trên gan và cơ. Khi cần dùng thuốc, hãy dùng thuốc có liều rõ ràng.'],
   ['“Uống rượu vang đỏ bảo vệ tim”','Rượu không hạ LDL, còn làm tăng triglyceride và huyết áp; người không có thói quen uống thì không cần bắt đầu vì tim.'],
   ['“Tôi gầy nên không cần để ý ăn uống”','LDL không hoàn toàn liên quan đến cân nặng — người tăng cholesterol máu gia đình thường rất gầy. Người gầy vẫn ăn theo tờ này.'],
   ['“Ăn uống tốt rồi thì bỏ thuốc được”','Ăn uống hạ nhiều nhất 10–20%, một viên thuốc hạ 30–50%. Người đã có bệnh tim mạch hoặc tiểu đường thường không đạt mục tiêu chỉ bằng ăn uống; ngừng thuốc do bác sĩ quyết định.'],
  ],
  notes:{
   core:'Các mức phần trăm là trung bình trong nghiên cứu, khác nhau nhiều tùy người; cái tính là kết quả xét nghiệm máu sau ba tháng. Người đang uống thuốc hạ mỡ máu thì cứ ăn theo, nhưng đừng tự ngừng thuốc.',
   food:'Quy đổi khẩu phần: một phần rau khoảng nửa bát rau đã nấu; một phần trái cây khoảng một nắm tay; một phần hạt khoảng 10 g (1 thìa canh nhựa), tính vào nhóm dầu mỡ và hạt theo hướng dẫn dinh dưỡng Đài Loan. Người hay ăn ngoài làm ba việc trước: bỏ da, vớt mỡ, đổi cơm sang gạo lứt hoặc yến mạch.',
   myth:'Nguồn: Hướng dẫn điều trị rối loạn lipid Đài Loan 2025; hướng dẫn cholesterol AHA/ACC 2018; hướng dẫn rối loạn lipid ESC/EAS 2019; hướng dẫn dinh dưỡng AHA 2021; các thử nghiệm ngẫu nhiên và phân tích gộp về chế độ ăn Portfolio.'},
  trans:'Bản dịch được thực hiện với sự hỗ trợ của AI và do nhóm của bác sĩ kiểm tra — không phải bản dịch được chứng nhận chính thức. Nếu có khác biệt, bản tiếng Trung là bản chuẩn.',
  foot:'BS. Lu Tzu-Wen, Khoa Nội tiết &amp; Chuyển hóa, Bệnh viện Cương Sơn thuộc Đại học Y Cao Hùng　｜　<b>Tờ này chỉ để giáo dục; việc dùng thuốc và mục tiêu điều trị do bác sĩ quyết định</b>　｜　Theo hướng dẫn lipid Đài Loan 2025, AHA/ACC 2018 và ESC/EAS 2019　｜　Phiên bản công cụ: 2026-09-10'},

  views:{core:'9 Langkah　·　tujuannya menurunkan kolesterol jahat (LDL-C)',food:'Lampu Lalu Lintas Makanan　·　perbanyak, secukupnya, kurangi',myth:'Mitos yang Sering Terdengar　·　tidak didukung bukti'},
  lead:'Kalau dijalankan dengan benar, pola makan menurunkan LDL-C sekitar <b>10–20%</b>; menggabungkan empat langkah (diet Portfolio) mencapai <b>20–30%</b> dalam penelitian. Ini batas yang bisa dicapai pola makan, dan tidak menggantikan obat dari dokter.',
  cards:[
   ['Jaga <b>lemak jenuh</b> di bawah <b>7% kalori harian</b>','Sekitar 15 g untuk diet 2.000 kkal. Sumber utama: daging berlemak, kulit ayam, lemak babi dan mentega, minyak kelapa, minyak sawit, susu full cream, kue. Langkah ini paling banyak menurunkan LDL, sekitar 8–10%.'],
   ['Jadikan <b>lemak trans</b> nol','Shortening, margarin, kue berlapis, gorengan yang dipakai berulang. Kalau label tertulis “minyak terhidrogenasi parsial”, kembalikan ke rak.'],
   ['Kuning telur <b>bukan lagi biang keladinya</b>','Kolesterol dari makanan berpengaruh lebih kecil pada LDL darah dibanding lemak jenuh. Satu telur sehari boleh untuk kebanyakan orang; kurangi bila sudah ada penyakit jantung atau diabetes. Jeroan, telur kepiting, telur udang dan telur ikan justru yang harus dikurangi.'],
   ['<b>Serat larut</b> <span class="a">5–10 g sehari</span>','Oat, jelai, kacang-kacangan, okra, apel, jeruk. Serat mengikat asam empedu di usus agar terbuang, menurunkan LDL sekitar 5%. Semangkuk bubur oat sekitar 2 g.'],
   ['<b>Sterol nabati</b> <span class="a">2 g sehari</span>','Menurunkan LDL sekitar 8–10%. Sayur biasa tidak sampai jumlah ini, perlu produk yang difortifikasi (susu atau olesan berlabel mengandung sterol nabati).'],
   ['<b>Ganti daging merah</b>: ikan 2 kali seminggu, olahan kedelai, satu porsi kacang tiap hari','Satu porsi kacang sekitar 10 g (1 sendok sup plastik) dan dihitung ke dalam porsi lemak hari itu. Penelitian memakai jumlah lebih besar, jadi kalorinya ikut dihitung. Kapsul minyak ikan menurunkan trigliserida, bukan LDL.'],
   ['Ganti minyak masak ke <b>minyak zaitun, kanola, atau camellia</b>','Kukus, rebus, ungkep, panggang menggantikan goreng rendam; kalau makan di luar, buang minyak yang mengambang dan lepas kulitnya dulu.'],
   ['Pola menyeluruh: diet <b>Mediterania</b> atau <b>DASH</b>','Panduan lipid Taiwan 2025: yang risikonya rendah dan sedang menjalani perubahan gaya hidup 3–6 bulan dulu, baru diputuskan perlu obat atau tidak.'],
   ['Berat badan, olahraga, berhenti merokok <b>dijalankan bersama</b>','Turun 5% berat badan saja sudah mengubah profil lemak darah; 150 menit olahraga intensitas sedang per minggu. Alkohol tidak membantu LDL — jangan mengandalkan anggur merah.'],
  ],

  mythtitle:'Pernyataan berikut tidak didukung panduan maupun penelitian',
  mythhead:['Yang sering terdengar','Kenyataannya'],
  myths:[
   ['“Tidak boleh makan telur, kuningnya tinggi kolesterol”','Kolesterol dari makanan pengaruhnya terbatas pada LDL darah; lemak jenuh yang jadi penyebab utama. Sejak 2018 AHA/ACC tidak lagi menetapkan batas atas kolesterol makanan; satu telur sehari boleh untuk kebanyakan orang.'],
   ['“Minum minyak ikan bisa menurunkan kolesterol”','Minyak ikan (EPA/DHA) menurunkan trigliserida, bukan LDL, dan sebagian sediaan malah sedikit menaikkannya. LDL turun lewat lemak jenuh, serat, sterol nabati, dan obat.'],
   ['“Semua minyak nabati itu sehat”','Minyak kelapa dan minyak sawit lebih dari 80% lemak jenuh dan menaikkan LDL — perlakukan seperti lemak hewani dan kurangi.'],
   ['“Kalau labelnya nol kolesterol berarti minyaknya bagus”','Minyak nabati memang tidak pernah mengandung kolesterol; label itu tidak berbicara soal lemak jenuh. Yang dibaca adalah baris “lemak jenuh”.'],
   ['“Angkak atau suplemen bisa menggantikan obat”','Angkak mengandung lovastatin alami, tetapi dosisnya tidak stabil, mutunya tidak seragam, dan efek samping pada hati serta otot tetap ada. Kalau memang perlu obat, pakai obat yang dosisnya jelas.'],
   ['“Minum anggur merah melindungi jantung”','Alkohol tidak menurunkan LDL; ia menaikkan trigliserida dan tekanan darah. Kalau selama ini tidak minum, tidak ada alasan jantung untuk mulai.'],
   ['“Saya kurus, jadi tidak perlu mengatur makan”','LDL tidak sepenuhnya berkaitan dengan berat badan — penderita hiperkolesterolemia familial justru sering kurus. Yang kurus tetap makan sesuai kartu ini.'],
   ['“Kalau pola makan sudah baik, obat boleh dihentikan”','Pola makan menurunkan paling banyak 10–20%, satu tablet menurunkan 30–50%. Yang sudah punya penyakit jantung atau diabetes umumnya tidak mencapai target hanya dengan makanan; menghentikan obat adalah keputusan dokter.'],

  notes:{
   core:'Angka persen adalah rata-rata penelitian dan berbeda-beda antarorang; yang menentukan adalah hasil laboratorium tiga bulan lagi. Kalau sudah minum obat penurun lemak darah, jalankan dietnya tetapi jangan menghentikan obat sendiri.',
   food:'Takaran: satu porsi sayur sekitar setengah mangkuk matang; satu porsi buah sekitar sekepalan tangan; satu porsi kacang sekitar 10 g (1 sendok sup plastik), dihitung pada kelompok minyak dan kacang menurut panduan gizi harian Taiwan. Yang sering makan di luar mulai dari tiga hal: buang kulit, buang minyak yang mengambang, ganti nasi ke beras merah atau oat.',

  lead:'ถ้าทำได้ครบ อาหารลด LDL-C ได้ราว <b>10–20%</b>; ถ้ารวมสี่ข้อเข้าด้วยกัน (อาหารแบบ Portfolio) งานวิจัยพบว่าลดได้ถึง <b>20–30%</b> นี่คือทั้งหมดที่อาหารทำได้ แต่ไม่ใช้แทนยาที่แพทย์สั่ง',
  cards:[
   ['คุม <b>ไขมันอิ่มตัว</b> ให้ต่ำกว่า <b>7% ของพลังงานต่อวัน</b>','ราว 15 กรัมสำหรับคนที่กิน 2,000 กิโลแคลอรี แหล่งหลัก: เนื้อติดมัน หนังไก่ น้ำมันหมูและเนย น้ำมันมะพร้าว น้ำมันปาล์ม นมไขมันเต็ม ขนมอบ ข้อนี้ลด LDL ได้มากที่สุด ราว 8–10%'],
   ['ทำให้ <b>ไขมันทรานส์</b> เป็นศูนย์','ชอร์ตเทนนิง มาร์การีน ขนมพัฟ ของทอดซ้ำ ถ้าฉลากเขียนว่า “น้ำมันเติมไฮโดรเจนบางส่วน” ให้วางกลับ'],
   ['ไข่แดง <b>ไม่ใช่ตัวการหลักอีกแล้ว</b>','คอเลสเตอรอลในอาหารมีผลต่อ LDL ในเลือดน้อยกว่าไขมันอิ่มตัว คนส่วนใหญ่กินไข่วันละฟองได้ ถ้ามีโรคหัวใจหลอดเลือดหรือเบาหวานให้กินพอประมาณ สิ่งที่ต้องลดคือเครื่องใน มันปู ไข่กุ้ง ไข่ปลา'],
   ['<b>ใยอาหารชนิดละลายน้ำ</b> <span class="a">วันละ 5–10 กรัม</span>','ข้าวโอ๊ต ข้าวบาร์เลย์ ถั่ว กระเจี๊ยบเขียว แอปเปิล ส้ม มันจับกรดน้ำดีในลำไส้แล้วขับออก ลด LDL ราว 5% โจ๊กข้าวโอ๊ตหนึ่งถ้วยราว 2 กรัม'],
   ['<b>สเตอรอลจากพืช</b> <span class="a">วันละ 2 กรัม</span>','ลด LDL ราว 8–10% ผักทั่วไปให้ไม่ถึงปริมาณนี้ ต้องอาศัยผลิตภัณฑ์เสริม (นมหรือแยมทาขนมที่ฉลากระบุว่ามีสเตอรอลจากพืช)'],
   ['<b>เปลี่ยนจากเนื้อแดง</b>: ปลาสัปดาห์ละ 2 ครั้ง ผลิตภัณฑ์ถั่วเหลือง ถั่วเปลือกแข็งวันละหนึ่งส่วน','ถั่วหนึ่งส่วนราว 10 กรัม (ช้อนซุปพลาสติก 1 ช้อน) และนับรวมในโควตาไขมันของวันนั้น งานวิจัยใช้ปริมาณสูงกว่านี้ จึงต้องคิดแคลอรีด้วย น้ำมันปลาแคปซูลลดไตรกลีเซอไรด์ ไม่ได้ลด LDL'],
   ['เปลี่ยนน้ำมันปรุงอาหารเป็น <b>น้ำมันมะกอก น้ำมันคาโนลา น้ำมันเมล็ดชา</b>','นึ่ง ต้ม ตุ๋น อบ แทนการทอดน้ำมันท่วม เวลากินนอกบ้านให้ช้อนน้ำมันที่ลอยอยู่ออกและลอกหนังทิ้งก่อน'],
   ['รูปแบบโดยรวม: อาหาร <b>เมดิเตอร์เรเนียน</b> หรือ <b>DASH</b>','แนวทางไขมันในเลือดไต้หวัน 2025: ผู้ที่มีความเสี่ยงต่ำถึงปานกลางให้ปรับวิถีชีวิต 3–6 เดือนก่อน แล้วจึงตัดสินใจเรื่องยา'],
   ['น้ำหนัก การออกกำลังกาย เลิกบุหรี่ <b>ทำไปพร้อมกัน</b>','ลดน้ำหนักเพียง 5% ก็เห็นไขมันในเลือดเปลี่ยน ออกกำลังกายระดับปานกลางสัปดาห์ละ 150 นาที แอลกอฮอล์ไม่ช่วยเรื่อง LDL อย่าหวังพึ่งไวน์แดง'],

  foodhead:['สัญญาณ','หมวด','รายละเอียด'],
  food:[

   ['g','กินได้','ถั่วและผลิตภัณฑ์จากถั่วเหลือง','ถั่วเหลือง ถั่วดำ ถั่วแระ เต้าหู้ นมถั่วเหลืองไม่หวาน; นับเป็นโปรตีน ใช้แทนเนื้อสัตว์บางส่วนได้'],
   ['g','กินได้','ผักและผลไม้','วันละผักอย่างน้อย 3 ส่วน ผลไม้ 2 ส่วน; กระเจี๊ยบเขียว แอปเปิล ส้ม มีใยอาหารละลายน้ำสูงเป็นพิเศษ'],
   ['g','กินได้','น้ำมันดีและถั่วเปลือกแข็ง','น้ำมันมะกอก คาโนลา เมล็ดชา อะโวคาโด; ถั่วไม่ปรุงรสวันละหนึ่งส่วน (ราว 10 กรัม ช้อนซุปพลาสติก 1 ช้อน)'],
   ['g','กินได้','ปลา','ปลาแมกเคอเรล ปลาซาบะ แซลมอน ปลากะพง สัปดาห์ละ 2 ครั้ง นึ่งหรืออบแทนการทอด'],
   ['y','พอประมาณ','ไข่','คนส่วนใหญ่วันละฟองได้; ถ้ามีโรคหัวใจหลอดเลือดหรือเบาหวาน สัปดาห์ละ 3–4 ฟอง'],
   ['y','พอประมาณ','เนื้อไม่ติดมัน สัตว์ปีกลอกหนัง','มื้อละเท่าฝ่ามือ; เลือกสันในหรืออกไก่ ลอกหนังและมันออก'],
   ['y','พอประมาณ','นมไขมันต่ำ','นมพร่องมันเนยหรือขาดมันเนย โยเกิร์ตไม่หวาน; เปลี่ยนจากไขมันเต็มเป็นไขมันต่ำ'],
   ['y','พอประมาณ','อาหารเสริมสเตอรอลจากพืช','ต้องได้วันละ 2 กรัมจึงได้ผล ให้ทำตามปริมาณบนฉลาก'],
   ['r','ลด','แหล่งไขมันอิ่มตัว','เนื้อติดมัน หมูสามชั้น หนังไก่ น้ำมันหมู ไขวัว เนย น้ำมันมะพร้าว น้ำมันปาล์ม ครีมไขมันเต็ม'],
   ['r','ลด','แหล่งไขมันทรานส์','แป้งพัฟ ชอร์ตเทนนิง มาร์การีน ของทอด บิสกิตและเค้กที่ใช้น้ำมันเติมไฮโดรเจนบางส่วน'],
   ['r','ลด','ส่วนที่คอเลสเตอรอลสูง','เครื่องใน (ตับ สมอง ไต) มันปู ไข่กุ้ง ไข่ปลา ปลาหมึกแห้ง'],
   ['r','ลด','เนื้อแปรรูปและน้ำตาลขัดขาว','ไส้กรอก เบคอน แฮม; เครื่องดื่มหวานและของหวานทำให้ไตรกลีเซอไรด์สูงขึ้น'],
   ['r','ลด','แอลกอฮอล์','ไม่ลด LDL แต่ทำให้ไตรกลีเซอไรด์สูงขึ้น; ไวน์แดงก็เช่นกัน'],

  mythtitle:'คำกล่าวเหล่านี้ไม่มีแนวทางเวชปฏิบัติหรืองานวิจัยรองรับ',
  mythhead:['ที่ได้ยินบ่อย','ความจริง'],
  myths:[
   ['“กินไข่ไม่ได้ ไข่แดงคอเลสเตอรอลสูง”','คอเลสเตอรอลในอาหารมีผลต่อ LDL ในเลือดจำกัด ไขมันอิ่มตัวต่างหากที่เป็นตัวหลัก ตั้งแต่ปี 2018 AHA/ACC ไม่กำหนดเพดานคอเลสเตอรอลในอาหารอีกแล้ว คนส่วนใหญ่กินไข่วันละฟองได้'],
   ['“กินน้ำมันปลาแล้วคอเลสเตอรอลลด”','น้ำมันปลา (EPA/DHA) ลดไตรกลีเซอไรด์ ไม่ได้ลด LDL บางสูตรกลับทำให้สูงขึ้นเล็กน้อย การลด LDL อาศัยไขมันอิ่มตัว ใยอาหาร สเตอรอลจากพืช และยา'],
   ['“น้ำมันพืชดีต่อสุขภาพทุกชนิด”','น้ำมันมะพร้าวและน้ำมันปาล์มมีไขมันอิ่มตัวเกิน 80% ทำให้ LDL สูงขึ้น ต้องลดเหมือนไขมันสัตว์'],
   ['“ฉลากเขียนว่าไม่มีคอเลสเตอรอลแปลว่าเป็นน้ำมันดี”','น้ำมันพืชไม่เคยมีคอเลสเตอรอลอยู่แล้ว ฉลากนี้ไม่ได้บอกอะไรเรื่องไขมันอิ่มตัว ให้ดูบรรทัด “ไขมันอิ่มตัว” แทน'],
   ['“ข้าวยีสต์แดงหรืออาหารเสริมใช้แทนยาได้”','ข้าวยีสต์แดงมีโลวาสแตตินตามธรรมชาติ แต่ขนาดยาไม่คงที่ คุณภาพไม่สม่ำเสมอ และมีผลข้างเคียงต่อตับและกล้ามเนื้อเช่นกัน เมื่อจำเป็นต้องใช้ยา ให้ใช้ยาที่ระบุขนาดชัดเจน'],
   ['“ดื่มไวน์แดงช่วยปกป้องหัวใจ”','แอลกอฮอล์ไม่ลด LDL แต่ทำให้ไตรกลีเซอไรด์และความดันโลหิตสูงขึ้น คนที่ไม่ได้ดื่มอยู่แล้วไม่จำเป็นต้องเริ่มดื่มเพื่อหัวใจ'],
   ['“ฉันผอม ไม่ต้องคุมอาหาร”','ระดับ LDL ไม่ได้ขึ้นกับน้ำหนักทั้งหมด ผู้ที่มีภาวะไขมันสูงทางพันธุกรรมมักผอม คนผอมก็กินตามการ์ดใบนี้เช่นกัน'],
   ['“คุมอาหารดีแล้วหยุดยาได้”','อาหารลดได้มากที่สุด 10–20% ยาหนึ่งเม็ดลดได้ 30–50% ผู้ที่มีโรคหัวใจหลอดเลือดหรือเบาหวานส่วนใหญ่ไปไม่ถึงเป้าหมายด้วยอาหารอย่างเดียว การหยุดยาให้แพทย์เป็นผู้ตัดสิน'],

const ZH = L['zh-TW'];

/* 外文在前、中文小字在後；中文版只回中文本身 */
function pair(zh, fo, k){
  if (k === 'zh-TW' || zh === fo) return zh;
  const a = `<span class="p-zh">${zh}</span>`, b = `<span class="p-fo">${fo}</span>`;
  return PAIR_ORDER === 'zh-first' ? a + b : b + a;
}

let LANG = 'zh-TW', VIEW = 'core';
const $ = id => document.getElementById(id);

function renderLangTabs(){
  $('langtabs').innerHTML = Object.keys(L).map(k =>
    `<div class="tab ${k===LANG?'active':''}" onclick="setLang('${k}')">${L[k].tab}<small>${L[k].tabsub}</small></div>`).join('');
}
function renderViewTabs(){
  const d = L[LANG];
  $('viewtabs').innerHTML = d.viewtabs.map(([v,label,sub],i) =>
    `<div class="tab ${v===VIEW?'active':''}" onclick="setV('${v}')">${pair(ZH.viewtabs[i][1],label,LANG)}<small>${pair(ZH.viewtabs[i][2],sub,LANG)}</small></div>`).join('');
}

function render(){
  const d = L[LANG], k = LANG;
  document.documentElement.lang = (k === 'zh-TW') ? 'zh-Hant' : k;
  $('langbadge').textContent = d.badge;
  $('kick').innerHTML = pair(ZH.kick, d.kick, k);
  $('h1').innerHTML   = pair(ZH.h1, d.h1, k);
  $('zh').innerHTML   = pair(ZH.views[VIEW], d.views[VIEW], k);
  $('foot').innerHTML = pair(ZH.foot, d.foot, k);
  $('note').innerHTML = pair(ZH.notes[VIEW], d.notes[VIEW], k);
  $('printbtn').innerHTML = d.printbtn;
  if ($('printallbtn')) $('printallbtn').innerHTML = d.printall || ZH.printall;
  // 翻譯來源聲明：只在外語版出現（老闆 2026-09-10 同意揭露翻譯來源）
  $('transnote').innerHTML = d.trans ? `${d.trans}<span class="p-zh">本外語版由 AI 協助翻譯、經醫師端校閱，非官方認證譯本；文字如有出入，以中文版為準。</span>` : '';

  let h = '';
  if (VIEW === 'core'){
    h = `<div class="grid"><div class="c lead"><i class="fa-solid fa-heart-pulse"></i><div class="t">${pair(ZH.lead, d.lead, k)}</div></div>`;
    const ICON = ['fa-bacon','fa-ban','fa-egg','fa-wheat-awn','fa-seedling','fa-fish','fa-bottle-droplet','fa-utensils','fa-person-walking'];
    const HOT  = [1,1,0,0,0,0,0,0,0];
    d.cards.forEach((c,i) => {
      h += `<div class="c ${HOT[i]?'hot':''}"><span class="n">${String(i+1).padStart(2,'0')}</span>`
         + `<i class="fa-solid ${ICON[i]}"></i><div class="t">${pair(ZH.cards[i][0], c[0], k)}`
         + `<span class="w">${pair(ZH.cards[i][1], c[1], k)}</span></div></div>`;
    });
    h += '</div>';
  } else if (VIEW === 'food'){
    h = `<table class="food"><tr>${d.foodhead.map((t,i)=>`<th>${pair(ZH.foodhead[i],t,k)}</th>`).join('')}</tr>`
      + d.food.map((r,i)=>`<tr><td class="${r[0]}">${pair(ZH.food[i][1],r[1],k)}</td>`
      + `<td>${pair(ZH.food[i][2],r[2],k)}</td><td>${pair(ZH.food[i][3],r[3],k)}</td></tr>`).join('')
      + '</table>';
  } else {
    h = `<div class="myth"><h3>${pair(ZH.mythtitle,d.mythtitle,k)}</h3><table><tr>`
      + d.mythhead.map((t,i)=>`<th>${pair(ZH.mythhead[i],t,k)}</th>`).join('') + '</tr>'
      + d.myths.map((r,i)=>`<tr><td class="x">${pair(ZH.myths[i][0],r[0],k)}</td>`
      + `<td>${pair(ZH.myths[i][1],r[1],k)}</td></tr>`).join('')
      + '</table></div>';
  }
  $('body').innerHTML = h;
  renderLangTabs(); renderViewTabs();
}

function buildPrintAll(){
  const keep = VIEW, box = document.createElement('div'); box.id = 'printall';
  ZH.viewtabs.forEach(([v]) => { VIEW = v; render(); const c = $('sheet').cloneNode(true); c.removeAttribute('id'); box.appendChild(c); });
  VIEW = keep; render();
  return box;
}
function printAll(){
  const old = $('printall'); if (old) old.remove();
  const box = buildPrintAll(); document.body.appendChild(box); document.body.classList.add('printing-all');
  const done = () => { document.body.classList.remove('printing-all'); box.remove(); window.removeEventListener('afterprint', done); };
  window.addEventListener('afterprint', done);
  setTimeout(() => { window.print(); setTimeout(done, 120000); }, 50);
}
function setLang(k){ LANG = k; render(); }
function setV(v){ VIEW = v; render(); }

const q = new URLSearchParams(location.search);
if (q.get('v') && ZH.viewtabs.some(t => t[0] === q.get('v'))) VIEW = q.get('v');
if (q.get('lang') && L[q.get('lang')]) LANG = q.get('lang');
render();
if (q.get('printall')) { document.body.appendChild(buildPrintAll()); document.body.classList.add('printing-all'); }
