const $ = id => document.getElementById(id);
const KEYS = Object.keys(L);

/* 項目可能是字串（中文版）或 [外文, 中文對照]（外語版） */
const item = x => Array.isArray(x) ? `${x[0]}<span class="zh">${x[1]}</span>` : x;
const cell = arr => `<ul>${arr.map(x => `<li>${item(x)}</li>`).join('')}</ul>`;

function render(k){
  const d = L[k];
  document.documentElement.lang = (k === 'zh-TW') ? 'zh-Hant' : k;
  $('kick').textContent = d.kick;
  $('h1').textContent   = d.h1;
  $('org').textContent  = d.org;
  $('intro').innerHTML  = d.intro;
  d.th.forEach((t,i) => $('th'+i).textContent = t);
  $('rows').innerHTML = d.cats.map(c => {
    const name = Array.isArray(c.n) ? `${c.n[0]}<span class="zh">${c.n[1]}</span>` : c.n;
    const tip  = c.tip ? `<div class="tip">${item(c.tip)}</div>` : '';
    return `<tr><td class="cat">${name}</td><td class="y">${cell(c.y)}</td><td class="n">${cell(c.n2)}${tip}</td></tr>`;
  }).join('');
  $('note').textContent = d.note;
  $('refs').innerHTML = `<b>參考資料 / References</b>${REFS.map(r=>`${r}<br>`).join('')}`;
  $('hint').innerHTML = d.hint;
  [...$('tabs').children].forEach(t => t.classList.toggle('active', t.dataset.k === k));
  window.scrollTo({top:0,behavior:'smooth'});
}

$('tabs').innerHTML = KEYS.map(k =>
  `<div class="tab" data-k="${k}">${L[k].tab}<small>${L[k].tabsub}</small></div>`
).join('');
[...$('tabs').children].forEach(t => t.onclick = () => {
  render(t.dataset.k);
  history.replaceState(null,'', t.dataset.k==='zh-TW' ? location.pathname : location.pathname+'?lang='+t.dataset.k);
});

/* ?lang=xx 直接開該語言版本——方便把單一語言網址直接傳給外籍看護 */
const want = new URLSearchParams(location.search).get('lang');
render(KEYS.includes(want) ? want : 'zh-TW');
