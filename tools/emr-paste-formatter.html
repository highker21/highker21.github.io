<!DOCTYPE html><html lang="zh-Hant"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>雲端藥歷 → 病歷精簡格式</title>
<style>
:root{--accent:#0e6e6e;--accent2:#139999;--ink:#132020;--line:#d8e4e4;--soft:#f4f9f9;--bg:#eaf2f2;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;background:var(--bg);color:var(--ink);padding:14px;max-width:1000px;margin:0 auto}
h1{font-size:1.25rem;color:var(--accent);margin-bottom:2px}
.sub{font-size:.8rem;color:#567;margin-bottom:10px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:640px){.cols{grid-template-columns:1fr}}
.col label{font-size:.82rem;font-weight:bold;color:var(--accent);display:block;margin-bottom:4px}
textarea{width:100%;height:200px;border:1px solid var(--line);border-radius:8px;padding:10px;font:0.8rem/1.5 ui-monospace,Menlo,monospace;background:#fff;resize:vertical}
textarea:focus{outline:2px solid var(--accent2)}
.opts{display:flex;flex-wrap:wrap;gap:14px;margin:10px 0;font-size:.85rem;align-items:center}
.opts label{display:flex;align-items:center;gap:4px;cursor:pointer}
#out{width:100%;min-height:120px;border:1px solid var(--line);border-radius:8px;padding:12px;font:0.85rem/1.65 ui-monospace,Menlo,monospace;background:var(--soft);white-space:pre-wrap;word-break:break-all}
.bar{display:flex;gap:8px;margin:8px 0;align-items:center}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:8px 18px;font-size:.9rem;cursor:pointer}
button:hover{background:var(--accent2)}
button.ghost{background:#fff;color:var(--accent);border:1px solid var(--accent)}
#msg,#msg2{font-size:.8rem;color:var(--accent2)}
.warn{font-size:.78rem;color:#a05a1c;margin-top:6px}
details{margin-top:6px;font-size:.75rem;color:#678}
.foot{margin-top:18px;font-size:.72rem;color:#789;text-align:center}
.hi{color:#c0392b;font-weight:bold}
.histbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}
#pname{border:1px solid var(--line);border-radius:6px;padding:7px 9px;font-size:.85rem;width:180px}
#pname:focus{outline:2px solid var(--accent2)}
#histList{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 12px}
.hchip{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--accent);border-radius:16px;padding:4px 4px 4px 12px;font-size:.8rem}
.hchip .hload{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.hchip .hname{font-weight:bold;color:var(--accent)}
.hchip .hdate{color:#789;font-size:.72rem}
.hchip.active{background:var(--accent);}
.hchip.active .hname,.hchip.active .hdate{color:#fff}
.hchip .hdel{background:none;color:#a05a1c;border:0;padding:0 5px;font-size:.9rem;cursor:pointer;border-radius:50%;line-height:1}
.hchip .hdel:hover{background:#f0d0c0}
.hchip.active .hdel{color:#ffd9c0}
.muted{color:#789;font-size:.8rem}
</style></head><body>
<h1>🩺 雲端藥歷 → 病歷精簡格式</h1>
<div class="sub">把健保雲端系統的「西醫藥歷」與「檢驗結果」分別貼到下面兩欄，自動重排成可貼病歷的精簡格式。可用歷史記錄快速切換不同病人。<b>資料只在你的瀏覽器本機處理與儲存，不會上傳。</b></div>

<div class="histbar">
  <input id="pname" placeholder="姓名 / 病歷號（存檔用）">
  <button id="save">💾 儲存到歷史</button>
  <button id="newp" class="ghost">＋ 新病人（清空）</button>
  <span id="msg2"></span>
</div>
<div id="histList"></div>

<div class="cols">
  <div class="col"><label>💊 用藥資訊（西醫藥歷）</label><textarea id="inMed" placeholder="在這裡貼上雲端西醫藥歷…"></textarea></div>
  <div class="col"><label>🩸 抽血資料（檢驗結果）</label><textarea id="inLab" placeholder="在這裡貼上雲端檢驗結果…"></textarea></div>
</div>

<div class="opts">
  <label><input type="checkbox" id="oAbn" checked>標記異常值 ↑↓</label>
  <label><input type="checkbox" id="oDx" checked>含診斷 (ICD)</label>
  <label><input type="checkbox" id="oShort" checked>藥名精簡</label>
  <label><input type="checkbox" id="oList">條列式（預設一行式）</label>
</div>
<div class="bar"><button id="copy">📋 複製結果</button><button id="clr" class="ghost">清空輸入</button><span id="msg"></span></div>
<div id="out">貼上後結果會出現在這裡</div>
<div class="warn" id="warn" hidden></div>
<details id="skipbox" hidden><summary>未解析的段落（點開檢查）</summary><pre id="skipped"></pre></details>
<div class="foot">僅重排文字、不做醫療判斷，貼入病歷前請自行核對｜歷史記錄存於本機瀏覽器（localStorage）｜工具版本：2026-07-23（新增複合用法碼 QDAMPC/QDAMAC 與每N日 Q2D 等解析）</div>
<script>
const $=id=>document.getElementById(id);
const FREQ='QD|QAM|QPM|QDS|BID|TID|QID|QN|HS|PRN|QOD|QW|BIW|TIW|Q\\d+[HD]|ST|STAT|MEAL|AC|PC';
const FORM=/^(TABLETS?|TAB|CAPSULES?|CAP|CAPS|ENTERIC[\w-]*|PROLONGED-RELEASE|EXTENDED[\w-]*|FILM[\w-]*|F\.?C\.?|SUGAR[\w-]*|ORAL|EYE|DROPS?|LOTION|OINTMENT|CREAM|GEL|SYRUP|SOLUTION|SUSPENSION|MIXTURE|LIQUID|EFFERVESCENT|INJECTION|INJ|PATCH|PLASTER|SPRAY|SUPPOSITOR(Y|IES)|POWDER|GRANULES?|S\.?R\.?M\.?C\.?|MICROENCAPSULATED)$/i;
const CONTAINER=/^(LIQUID|MIXTURE|SOLUTION|SYRUP|SUSPENSION|DROPS?)$/i;
const EXTRA=/^(SR|XL|XR|CR|ER|LA|MR|DEPOT|FORTE|RETARD)$/i;
const title=s=>s.charAt(0)+s.slice(1).toLowerCase();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function shortDrug(brand){
  const toks=brand.replace(/["＂]/g,' ').split(/\s+/).filter(Boolean);
  let name=[],extra='',form=[];
  for(const t of toks){
    if(EXTRA.test(t)&&name.length){extra=t.toUpperCase();continue}
    if(FORM.test(t)){form.push(t.toLowerCase());continue}
    if(/^\(/.test(t)||/^\d/.test(t))break;
    if(form.length)break;
    name.push(title(t));
  }
  const dm=brand.match(/(\d+(?:\.\d+)?(?:\/\d+(?:\.\d+)?)?)\s*(MG|MCG|G|ML|IU|%)/i);
  const dose=dm?dm[1]+dm[2].toLowerCase():'';
  if(!name.length)return brand.replace(/["＂]/g,'').replace(/\s+/g,' ').trim(); // 退化(容器型如 Brown Mixture)→回完整品牌
  let out=name.join(' ')+(extra?' '+extra:'')+(dose?' '+dose:'');
  if(!dose&&form.length)out+=' '+form.slice(0,2).join(' ');
  return out.trim()||brand;
}

function parse(text){
  const recs=text.split(/\n(?=\d+\s+1\d{2}\/\d{2}\/\d{2})/).map(s=>s.trim()).filter(Boolean);
  const meds={},labs={},order=[],skipped=[];
  const freqRe=new RegExp('\\s((?:'+FREQ+')(?:AM|PM|NOON|N|AC|PC|HS|MC)*)\\s+(\\d+(?:\\.\\d+)?)\\s+(\\d+)\\s+(\\d+)');
  for(const r of recs){
    const h=r.match(/^\d+\s+(1\d{2}\/\d{2}\/\d{2})\s+(.*)$/m);
    if(!h){skipped.push(r);continue}
    const date=h[1];
    // 院所：藥歷在首行日期後、檢驗在資料列尾端
    const isLab=/\[[^\[\]]*\]\[[^\[\]]*\]/.test(r)||/健保署計算/.test(r);
    if(isLab){
      // 資料列：以 ( 開頭的行（跳過純中文續行）
      let item=null,val=null,lo=null,hi=null,org='';
      const isVal=t=>/^[＞>＜<]?-?\d+(\.\d+)?$/.test(t)||/^\([+-]\)$/.test(t)||/^(Negative|Positive|Trace|Clear|Turbid|Cloudy|Yellow|Normal)$/i.test(t);
      const parenHead=ln=>{if(ln[0]!=='(')return null;let d=0;
        for(let i=0;i<ln.length;i++){if(ln[i]==='(')d++;else if(ln[i]===')'){d--;if(d===0)return{name:ln.slice(1,i),rest:ln.slice(i+1).trim()}}}
        return null};
      for(const ln of r.split('\n')){
        const ph=parenHead(ln);
        if(!ph)continue;
        const rng=ph.rest.match(/\[([^\[\]]*)\]\[([^\[\]]*)\]/);
        if(rng){
          // 型A：(英文名) 項目 值 單位 單位 [下限][上限]…（項目可中文；單位固定重複兩次，以此定位值）
          const toks=ph.rest.slice(0,rng.index).trim().split(/\s+/);
          if(toks.length>=4&&toks[toks.length-1]===toks[toks.length-2]){val=toks[toks.length-3];item=toks.slice(0,-3).join(' ')}
          else{const vi=toks.findIndex(isVal);if(vi<0)continue;val=toks[vi];item=vi>0?toks.slice(0,vi).join(' '):ph.name.trim()}
          lo=rng[1];hi=rng[2];
        }else{
          // 型B：(eGFR-CKD-EPI) 83.58 單位 60 健保署計算…
          const m=ph.rest.match(/^(＞?-?[\d.]+)\s/);
          if(!m)continue;
          item=ph.name.trim();val=m[1];
          const b=ph.rest.match(/[\d.]+\s*\S*\s+([\d.]+)\s+健保署計算/);if(b)lo=b[1];
        }
        const o=ln.match(/(?:檢查|健保署計算)\s+(\S+)\s*$/);if(o)org=o[1];
        break;
      }
      if(!item){skipped.push(r);continue}
      if(!org){const o2=r.match(/無\s+(\S+)\n門診/);org=o2?o2[1]:''}
      const key=date+'｜'+org;
      if(!labs[key]){labs[key]=[];order.push(['lab',key])}
      if(!labs[key].some(x=>x.item===item))labs[key].push({item,val,lo,hi});
    }else{
      const fm=r.match(freqRe);
      if(!fm){skipped.push(r);continue}
      const org=h[2].trim();
      const dxm=r.match(/^\d{10}\s+(.+)$/m);
      const lines=r.split('\n');const dl=lines[lines.length-1];
      const icd=(dl.match(/^([A-Z]\d[\dA-Z]{1,5})\s/)||[])[1]||'';
      const pre=dl.slice(0,dl.indexOf(fm[0]));
      const bm=pre.match(/((?:[("'＂]?[A-Z0-9][A-Z0-9()"'＂.\-\/%,;：；]*\s+)*[("'＂]?[A-Z0-9][A-Z0-9()"'＂.\-\/%,;：；]*)\s*$/);
      const brand=bm?bm[1].trim():pre.trim();
      const key=date+'｜'+org;
      if(!meds[key]){meds[key]={dx:new Map(),items:[]};order.push(['med',key])}
      if(icd&&dxm)meds[key].dx.set(icd,dxm[1].trim());
      meds[key].items.push({brand,freq:fm[1],days:fm[3]});
    }
  }
  return {meds,labs,order,skipped};
}

/* ---------- 「整頁全選貼上」格式（雲端西醫藥歷整頁）：每筆以日期開頭、跨行、ICD 被換行拆開、項次黏在藥品代碼尾 ---------- */
// 訊號式偵測：整頁貼上時「含日期的行」多半不含用法+三數字（藥資訊在後續換行的列）；相容「日期開頭」與「項次+日期開頭」兩變體
function isFullPage(t){
  if(/就醫日期[\s\S]{0,40}主診斷/.test(t))return true;
  const dl=(t.match(/^.*1\d{2}\/\d{2}\/\d{2}.*$/mg)||[]);
  if(!dl.length)return false;
  const wrapped=dl.filter(l=>!/(?:QD|QAM|QPM|BID|TID|QID|QN|HS|PRN|QOD)[A-Z]*\s+\d+\s+\d+\s+\d+/.test(l)).length;
  return wrapped>=Math.ceil(dl.length*0.5);
}
// 從表頭抓病人姓名：身分證號： X000***000○○○民 YY/MM/DD 性別
function extractPatientName(t){const m=t.match(/身分證號[：:\s]*[A-Z][0-9A-Z*]+\s*([一-鿿]{2,4})\s*民/);return m?m[1]:'';}
function parseFullPage(text){
  const chunks=text.split(/\n(?=\s*(?:\d+\s+)?1\d{2}\/\d{2}\/\d{2}\s)/);
  const meds={},order=[],skipped=[];
  const freqRe=/\s((?:QD|QAM|QPM|QDS|BID|TID|QID|QN|HS|PRN|QOD|QW|BIW|TIW|Q\d+[HD]|ST|STAT)(?:AM|PM|NOON|N|AC|PC|HS|MC)*)\s+(\d+(?:\.\d+)?)\s+(\d+)\s+(\d+)(?:\s|$)/;
  for(const c of chunks){
    const joined=c.replace(/\s*\n\s*/g,' ').replace(/\s+/g,' ').trim();
    if(!/^(?:\d+\s+)?1\d{2}\/\d{2}\/\d{2}\s/.test(joined))continue;   // 略過表頭/雜訊段
    const date=joined.match(/^(?:\d+\s+)?(1\d{2}\/\d{2}\/\d{2})/)[1];  // 可含前置項次
    const orgM=joined.match(/^(?:\d+\s+)?1\d{2}\/\d{2}\/\d{2}\s+([一-鿿]+)/);
    const org=orgM?orgM[1]:'';
    // 主診斷：診斷名+ICD。相容①ICD被換行拆開(高血壓I1↵0→I10) ②診斷名與碼分行(肝細胞癌↵C220→C22.0、B181→B18.1)
    const dxM=joined.match(/([一-鿿][一-鿿（）()／\-]*?)\s*([A-Z]\d)\s*(\d{0,4})(?=[\s一-鿿])/);
    let icd='',dxName='';
    if(dxM){dxName=dxM[1];icd=(dxM[2]+dxM[3]).replace(/^([A-Z]\d{2})(\d+)$/,'$1.$2');}
    const fm=joined.match(freqRe);
    if(!fm){skipped.push(joined);continue}
    // pre＝用法用量前的字串；砍掉診斷、ATC3名稱、複方註記Y，剩 成分名稱+藥品名稱
    let pre=joined.slice(0,joined.indexOf(fm[0]));
    if(dxM)pre=pre.slice(dxM.index+dxM[0].length);
    const am=pre.match(/^[一-鿿][^）)]*[）)]\s*/);        // 中文ATC3(含英文gloss括號)
    if(am)pre=pre.slice(am[0].length);else pre=pre.replace(/^[A-Za-z]+\s+/,''); // 英文ATC3(如 Psycholeptics)
    pre=pre.replace(/^Y\s+/,'');                                   // 複方註記
    const toks=pre.split(/\s+/).filter(Boolean);
    // 藥品名稱起點＝第一個 FORM 詞(TABLETS/CAPSULES/F.C./Plaster…)的前一 token；廠商(引號內)在 FORM 之後不會被誤選；成分名稱不含 FORM 詞
    const fi=toks.findIndex(t=>FORM.test(t.replace(/["＂]/g,'')));
    let bi;
    if(fi<0)bi=toks.length-1;
    else if(fi===0)bi=0;
    else if(CONTAINER.test(toks[fi].replace(/["＂]/g,''))&&/^[A-Z][a-z]/.test(toks[fi-1]))bi=fi; // 容器型且前token為成分尾→不回退
    else bi=fi-1;
    const brand=toks.slice(Math.max(0,bi)).join(' ');
    const key=date+'｜'+org;
    if(!meds[key]){meds[key]={dx:new Map(),items:[]};order.push(['med',key])}
    if(icd)meds[key].dx.set(icd,dxName);
    meds[key].items.push({brand,freq:fm[1],days:fm[3]});
  }
  return {meds,labs:{},order,skipped};
}
function parseAll(medText,labText){
  if(medText&&isFullPage(medText)){
    const res=parseFullPage(medText);
    if(labText){const lr=parse(labText);Object.assign(res.labs,lr.labs);for(const o of lr.order)if(o[0]==='lab')res.order.push(o);res.skipped.push(...lr.skipped);}
    return res;
  }
  return parse(((medText||'')+'\n'+(labText||'')).trim());
}

function flag(v,lo,hi){
  if(!$('oAbn').checked)return '';
  const n=parseFloat(v);if(isNaN(n))return '';
  const pl=s=>{if(s==null)return null;s=String(s).replace(/[＞>＜<]/g,'').trim();return s&&s!=='無'?parseFloat(s):null};
  const l=pl(lo),h=pl(hi);
  if(l!=null&&n<l)return '↓';
  if(h!=null&&n>h)return '↑';
  return '';
}

function render(){
  const medText=$('inMed').value.trim(),labText=$('inLab').value.trim();
  if(!medText&&!labText){$('out').textContent='貼上後結果會出現在這裡';$('warn').hidden=true;$('skipbox').hidden=true;return}
  const {meds,labs,order,skipped}=parseAll(medText,labText);
  // 姓名欄空時，自動從表頭帶入病人姓名（不覆蓋使用者已輸入）
  if(!$('pname').value.trim()){const nm=extractPatientName(medText)||extractPatientName(labText);if(nm)$('pname').value=nm;}
  const listMode=$('oList').checked,out=[];
  for(const [kind,key] of order){
    const [date,org]=key.split('｜');
    if(kind==='lab'){
      const items=labs[key].map(x=>{
        const v=/^(Negative|\(-\))$/i.test(x.val)?'(-)':/^(Positive|\(\+\))$/i.test(x.val)?'(+)':' '+x.val+flag(x.val,x.lo,x.hi);
        return x.item+v});
      out.push(listMode?`${date} ${org}\n`+items.map(i=>'- '+i).join('\n')
                       :`${date} ${org}：${items.join('、')}`);
    }else{
      const m=meds[key];
      const dx=$('oDx').checked&&m.dx.size?`（${[...m.dx].map(([i,d])=>i+' '+d).join('；')}）`:'';
      const items=m.items.map(x=>`${$('oShort').checked?shortDrug(x.brand):x.brand} ${x.freq}×${x.days}d`);
      out.push(listMode?`${date} ${org}${dx}\n`+items.map(i=>'- '+i).join('\n')
                       :`${date} ${org}${dx}：${items.join('、')}`);
    }
  }
  $('out').textContent=out.join('\n')||'（無法解析，請確認貼的是雲端藥歷/檢驗清單）';
  // 過濾雲端系統表頭/導覽/病人資訊列，不當成「未解析」警告
  const realSkipped=skipped.filter(s=>!/NHI MediCloud|健保醫療資訊雲端|身分證號|摘要.病人資訊|就醫日期[\s\S]{0,20}來源|使用指南|本頁注意事項|篩選器|預防接種/.test(s));
  $('warn').hidden=!realSkipped.length;
  $('warn').textContent=realSkipped.length?`⚠️ 有 ${realSkipped.length} 段未能解析，未納入結果（點下方檢查原文）`:'';
  $('skipbox').hidden=!realSkipped.length;
  $('skipped').textContent=realSkipped.join('\n----\n');
}

/* ---------- 歷史記錄（本機 localStorage，可切換不同病人） ---------- */
const HKEY='emrHistory_v1';
let activeId=null;
const loadHist=()=>{try{return JSON.parse(localStorage.getItem(HKEY))||[]}catch(e){return[]}};
const saveHist=a=>localStorage.setItem(HKEY,JSON.stringify(a));
function nowStr(){const d=new Date(),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}/${p(d.getMonth()+1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`}

function renderHist(){
  const arr=loadHist(),box=$('histList');box.innerHTML='';
  if(!arr.length){box.innerHTML='<span class="muted">尚無歷史記錄——輸入姓名後按「儲存到歷史」，之後可在這裡快速切換。</span>';return}
  for(const it of arr){
    const chip=document.createElement('div');chip.className='hchip'+(it.id===activeId?' active':'');
    const load=document.createElement('span');load.className='hload';
    load.innerHTML=`<span class="hname">${esc(it.name||'未命名')}</span><span class="hdate">${esc(it.date||'')}</span>`;
    load.onclick=()=>loadItem(it.id);
    const del=document.createElement('button');del.className='hdel';del.textContent='✕';del.title='刪除這筆';
    del.onclick=e=>{e.stopPropagation();delItem(it.id)};
    chip.appendChild(load);chip.appendChild(del);box.appendChild(chip);
  }
}
function saveCurrent(){
  const name=$('pname').value.trim();
  if(!name){$('msg2').textContent='請先填姓名/病歷號';setTimeout(()=>$('msg2').textContent='',1800);$('pname').focus();return}
  if(!$('inMed').value.trim()&&!$('inLab').value.trim()){$('msg2').textContent='兩欄都是空的，沒東西可存';setTimeout(()=>$('msg2').textContent='',1800);return}
  const arr=loadHist();
  const existing=arr.find(x=>x.name===name);
  const rec={id:existing?existing.id:'p'+Date.now(),name,med:$('inMed').value,lab:$('inLab').value,date:nowStr()};
  activeId=rec.id;
  const na=arr.filter(x=>x.name!==name);na.unshift(rec);saveHist(na);renderHist();
  $('msg2').textContent=existing?'已更新 ✅':'已儲存 ✅';setTimeout(()=>$('msg2').textContent='',1600);
}
function loadItem(id){
  const it=loadHist().find(x=>x.id===id);if(!it)return;
  $('pname').value=it.name||'';$('inMed').value=it.med||'';$('inLab').value=it.lab||'';
  activeId=id;render();renderHist();
  $('msg2').textContent='已載入：'+(it.name||'未命名');setTimeout(()=>$('msg2').textContent='',1600);
}
function delItem(id){
  saveHist(loadHist().filter(x=>x.id!==id));
  if(activeId===id)activeId=null;
  renderHist();
}
function newPatient(){
  $('pname').value='';$('inMed').value='';$('inLab').value='';activeId=null;render();renderHist();$('pname').focus();
}

['input','change'].forEach(e=>{
  $('inMed').addEventListener(e,render);$('inLab').addEventListener(e,render);
  document.querySelectorAll('.opts input').forEach(c=>c.addEventListener(e,render));
});
$('copy').onclick=async()=>{await navigator.clipboard.writeText($('out').textContent);$('msg').textContent='已複製 ✅';setTimeout(()=>$('msg').textContent='',1500)};
$('clr').onclick=()=>{$('inMed').value='';$('inLab').value='';render()};
$('save').onclick=saveCurrent;
$('newp').onclick=newPatient;
renderHist();
</script></body></html>
