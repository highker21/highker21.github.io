.sec li:last-child{margin-bottom:0}
.sec li:before{content:"‧";position:absolute;left:3px;font-weight:900;color:var(--ok)}
.sec.mod li:before{color:var(--mod)}
.sec.warn li:before{color:var(--warn)}
.sec.doc li:before{color:var(--doc)}
.sec b{font-weight:800}
.sec .why{display:block;margin-top:2px;font-size:13px;color:var(--sub);line-height:1.6}

.note{margin-top:16px;font-size:12.5px;color:var(--sub);line-height:1.7;font-style:italic}
.foot{margin-top:14px;text-align:center;font-size:11px;color:var(--faint);line-height:1.75;border-top:1px solid var(--line);padding-top:11px}

.bar{text-align:center;margin:16px 0;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.bar button{background:var(--ink);color:var(--paper);border:0;padding:11px 22px;font-size:15px;font-weight:700;border-radius:6px;cursor:pointer}
.bar button.ghost{background:#fff;color:var(--ink);border:1px solid var(--ink)}

/* 常見誤解（只在中文版顯示） */
.myth{max-width:900px;margin:16px auto 0;background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px 20px}
.myth h3{font-size:16px;color:var(--doc);margin-bottom:10px;border-left:4px solid var(--doc);padding-left:10px}
.myth table{width:100%;border-collapse:collapse;font-size:14px}
.myth th,.myth td{border-bottom:1px solid var(--line);padding:9px 8px;text-align:left;vertical-align:top;line-height:1.65}
.myth th{background:var(--paper);font-weight:800;color:var(--sub);font-size:13px}
.myth td.x{color:var(--warn);font-weight:700;white-space:nowrap}
.myth td.o{color:var(--ok);font-weight:700}
.myth .wrap{overflow-x:auto}

/* ⚠️ media query 一律放在所有基礎規則之後（同權重後者勝） */
@media print{
  @page{size:A4 portrait;margin:10mm}
  body{background:#fff;padding:0}
  .tabs,.bar,.no-print{display:none!important}

  .sec,.myth{break-inside:avoid}

@media (max-width:640px){

}

   {c:'mod',t:'⚠️ Katamtaman lamang (depende sa inyong kalagayan)',items:[
    '<b>Alak</b>: ≤ 1 baso/araw (babae), ≤ 2 baso/araw (lalaki)',
    '<b>Pagkaing mataas sa iodine</b> (kelp, nori, dikya, kombu, scallops)<span class="why">Ang doktor ang magpapayo batay sa inyong thyroid function</span>',
    '<b>Cruciferous na gulay</b> (cauliflower, repolyo, pechay)<span class="why">Kapag lutong-luto ay OK; iwasan lang ang hilaw na malaking dami sa mahabang panahon</span>',
    '<b>Soy / soy milk / tokwa</b><span class="why">Ligtas para sa populasyong sapat ang iodine, hindi kailangang ipagbawal</span>']},
   {c:'warn',t:'🚨 Babala → magpatingin agad sa doktor',items:[
    'Mabilis na lumalaki ang nodule',
    'Tuloy-tuloy na pamamalat nang higit sa 2 linggo',
    'Hirap lumunok o pakiramdam ng presyon sa leeg',
    'Palpitations, biglaang pagbabago ng timbang, hindi maipaliwanag na panginginig']},
   {c:'doc',t:'👨‍⚕️ Paalala ng Doktor',items:[
    '<b>Regular na ultrasound follow-up</b> (ayon sa doktor — kadalasan tuwing 6–12 buwan)',
    'Gamot sa thyroid (hal. Eltroxin): inumin sa <b>walang laman na tiyan</b>, 30–60 minuto bago kumain',
    '<b>Hindi bababa sa 4 na oras</b> ang pagitan mula sa calcium / iron supplements',
    'Bukod sa pangkalahatang prinsipyo, <b>talakayin ang inyong personal na kalagayan sa inyong doktor</b>']}],
  note:'Batay sa 2024 American Thyroid Association (ATA) guidelines. Ang personal na payo ay mula sa inyong doktor.'}
};

/* 只在中文版顯示：舊版紙本衛教單常見的錯誤禁忌 */
const MYTH = `

<div class="wrap"><table>
<tr><th>常見說法</th><th>實證上怎麼看</th></tr>
<tr><td class="x">十字花科蔬菜要忌口</td>
    <td>致甲狀腺腫物質（goitrogen）在<b>烹煮後大幅失活</b>，且需長期大量生食才可能有影響。<b>煮熟正常吃即可。</b></td></tr>
<tr><td class="x">豆漿、豆腐不能吃</td>
    <td>在<b>碘攝取充足</b>的族群（台灣食鹽已碘化），大豆製品不影響甲狀腺功能。<b>不需禁止。</b>唯服用甲狀腺素者建議與藥物間隔開。</td></tr>
<tr><td class="x">要吃「消結散腫」的食物</td>
    <td><b>沒有任何食物能讓結節縮小。</b>飲食的角色是維持整體健康，不是治療結節。</td></tr>
<tr><td class="x">辛辣、蔥蒜要完全避免</td>
    <td>與甲狀腺結節<b>無實證關聯</b>，不需特別禁食。</td></tr>
<tr><td class="x">所有海帶紫菜一律禁止</td>
    <td>要不要限碘<b>取決於您的甲狀腺功能</b>（甲亢、橋本氏、準備接受碘-131 治療的處理方式各不相同），由醫師個別判斷。</td></tr>
</table></div>`;

const $ = id => document.getElementById(id);
const KEYS = Object.keys(L);
let cur = 'zh-TW';

function render(k){
  cur = k;
  const d = L[k];
  document.documentElement.lang = (k === 'zh-TW') ? 'zh-Hant' : k;
  $('kick').textContent = d.kick;
  $('h1').textContent = d.h1;
  $('secs').innerHTML = d.secs.map(s =>
    `<div class="sec ${s.c}"><h2>${s.t}</h2><ul>${s.items.map(i=>`<li>${i}</li>`).join('')}</ul></div>`
  ).join('');
  $('note').textContent = d.note;
  $('myth').innerHTML = (k === 'zh-TW') ? MYTH : '';
  $('myth').style.display = (k === 'zh-TW') ? '' : 'none';
  [...$('tabs').children].forEach(t => t.classList.toggle('active', t.dataset.k === k));
  window.scrollTo({top:0,behavior:'smooth'});
}

$('tabs').innerHTML = KEYS.map(k =>
  `<div class="tab" data-k="${k}">${L[k].tab}<small>${L[k].tabsub}</small></div>`
).join('');
[...$('tabs').children].forEach(t => t.onclick = () => render(t.dataset.k));
render('zh-TW');
</script>
