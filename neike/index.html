ne 治療心 因性休克，無助預後之改善", "E": "使用主動脈內氣球幫浦（Intra-aortic balloon pump，IABP）治療心因性休克，在臨床試驗資料並不顯示 能改善死亡率"}, "answer": "C", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 109, "no": 13, "stem": "高安氏血管炎(Takayasu arteritis)，最常影響的血管為？", "choices": {"A": "腎動脈(renal artery)", "B": "腹主動脈(abdominal aorta)", "C": "鎖骨下動脈(subclavian artery)", "D": "冠狀動脈(coronary artery)", "E": "主動脈弓(aortic arch)"}, "answer": "C", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 109, "no": 14, "stem": "有關章魚壺心肌症(Takotsubo cardiomyopathy)之描述，下列何 者錯誤？", "choices": {"A": "臨床表現包括肺水腫，低血壓與典型心絞痛", "B": "心臟收縮功能異常可以在數天到數週後緩解", "C": "患者之心電圖常呈現典型心肌梗塞之變化", "D": "造成之因素常為強烈交感神經刺激或兒苯酚胺毒 性(catecholamine toxicity)", "E": "口服抗凝血劑是必要之藥物治療"}, "answer": "E", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 109, "no": 15, "stem": "有關抗凝血劑的解藥(antidote)下列何者錯誤？", "choices": {"A": "Heparin的antidote是protamine", "B": "Warfarin的antidote是vitamin K", "C": "Dabigatran的antidote是idarucizumab", "D": "Rivaroxaban的antidote是andexanet", "E": "Apixaban的antidote是idarucizumab"}, "answer": "E", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 109, "no": 16, "stem": "有關肺動脈高壓的敘述，下列何者錯誤？", "choices": {"A": "一氧化碳瀰漫量(Diffusing capacities of the lungs for carbon monoxide DLCO) 在肺動脈高壓患者會下降", "B": "心臟超音波的影像(如附圖)", "C": "在無睡眠呼吸障礙的肺動脈高壓患者,夜間缺氧(nocturnal desaturation)並不常見", "D": "肺動脈高壓患者均應接受抗核抗體 (antinuclear antibody)，類風濕因子(rheumatoid factor)，Scl 70抗體 (anti-scl-70 antibody)檢測", "E": "心音聽診時，第二心音肺動脈瓣成分會加重(accentuated P2)"}, "answer": "C", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 109, "no": 17, "stem": "有關急性腎損傷(acute kidney injury)造成心臟衰竭之描述，下 列何者錯誤？", "choices": {"A": "急性腎損傷患者出院後，因心臟衰竭再住院風險明顯增加", "B": "急性腎損傷患者出院後，因心血管疾病死亡或慢性心臟衰竭 比率明顯增加", "C": "急性腎損傷重症患者，半乳糖凝集素-3 (galectin 3)與心肌傷 害有相關", "D": "在急性腎損傷時，用氨基末端腦鈉肽前體(NT-proBNP)可以 診斷心臟衰竭的嚴重度", "E": "嗜中性白血球明膠相關性脂質運載蛋白(neutrophil gelatinase–associated lipocalin /NGAL)與急性腎損傷造成之 心肌纖維化有相關"}, "answer": "D", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 109, "no": 18, "stem": "有關心臟理學檢查之描述,下列何者正確？ (1) 心房顫動時,聽診時不會出現第四心音(S4) (2) 聽診時,第三心音(S3)在只在收縮功能異常之心臟衰竭患者出 現,收縮功能正常之心臟衰竭患者不會出現 (3) Allen's test是用來偵測肱動脈(brachial artery) 血液循環 (4) 大流量之動靜脈廔管(arteriovenous fistula)可以造成非常低 之舒張壓 (5) 在擴張性心肌病變患者,把脈時可以摸到雙峰脈波(bifid pulse) (6) 主動脈瓣狹窄之收縮期雜音聽診區在胸骨右側第二肋間,心 雜音會傳遞至頸動脈", "choices": {"A": "(1)+(2)+(3)+(6)", "B": "(1)+(4)+(6)", "C": "(2)+(4)+(5)", "D": "(1)+(2)+(4)", "E": "(4)+(5)+(6)"}, "answer": "B", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 109, "no": 19, "stem": "下列哪一個乙狀受體阻斷劑(beta-blocker)，除了交感神經抑制 外，還具備血管擴張功能(additional vasodilator actions)", "choices": {"A": "Nebivolol", "B": "Atenolol", "C": "Metoprolol", "D": "Propranolol", "E": "Bisoprolol"}, "answer": "A", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 109, "no": 20, "stem": "一位70歲女性，主訴昏厥病史，24 小時Holter ECG(如附 圖)，無症狀之心電圖為上圖，發生昏厥之心電圖為下圖。該心 電圖之心臟節律正確診斷為？", "choices": {"A": "第一度房室傳導阻斷", "B": "第二度第一型房室傳導阻斷（Mobitz I）", "C": "第二度第二型房室傳導阻斷（Mobitz II）", "D": "第三度房室傳導阻斷", "E": "病竇症候群"}, "answer": "D", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 109, "no": 21, "stem": "有關心房顫動與低收縮分率心臟衰竭 (heart failure with reduced ejection fraction)之描述何者錯誤？", "choices": {"A": "心房顫動與低收縮分率心臟衰竭兩者合併發生時，會導致心 臟衰竭患者預後不良", "B": "在中至重度低收縮分率心臟衰竭患者，使用dronedarone 不 會導致死亡率增加", "C": "可以使用dofetilide來進行節律控制(rhythm control)", "D": "可進行導管燒灼術(catheter ablation and pulmonary vein isolation)", "E": "可以使用amiodarone來進行節律控制(rhythm control)"}, "answer": "B", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 109, "no": 22, "stem": "有關感染性主動脈炎(infective aortitis)的描述,下列何者錯誤？ (1) 細菌感染性主動脈炎造成感染性動脈瘤(mycotic aneurysm)好發部為在infrarenal abdominal aorta (2) 細菌感染性主動脈炎造成感染性動脈瘤好發於年輕人 (3) 細菌感染性主動脈炎造成感染性動脈瘤好發於男性 (4) 梅毒性主動脈炎(syphilitic aortitis) 好發於升主動 脈(ascending aorta)，尤其是主動脈根部(aortic root) (5) 梅毒性主動脈炎會造成血管滋養管 (vasa vasorum) 的閉塞 性動脈內膜炎( obliterative endarteritis)", "choices": {"A": "(1)+(2)", "B": "(2)+(3)", "C": "(2)+(4)", "D": "(1)+(4)", "E": "(3)+(5)"}, "answer": "A", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 109, "no": 23, "stem": "78歲老菸槍，COPD診斷已經好幾年，因為肺功能不佳及咳 喘，長期使用吸入型氣管擴張劑。不幸的是左上肺葉發現一顆 腫瘤，切片證實是鱗狀細胞癌，沒有淋巴結及遠端轉移，外科 醫師想要開刀切除，你會建議哪種檢查來評估術後的肺功能？", "choices": {"A": "電腦斷層", "B": "核磁共振", "C": "支氣管鏡", "D": "肺臟血流灌注掃描", "E": "胸部超音波"}, "answer": "D", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 109, "no": 24, "stem": "年輕女性在健檢時胸部 X-ray 有疑似腫瘤的陰影，於是來到大 醫院門診進一步檢查。她聽朋友說核磁共振檢查比較昂貴、比 較精密，於是要求安排胸部核磁共振檢查，下列何者說明是不 合理的？", "choices": {"A": "核磁共振對於肺臟的解析度比電腦斷層佳，可以用來檢測肺 腫瘤", "B": "電腦斷層在肺臟的解析度比核磁共振好", "C": "對於胸腔入口腫瘤（pancoast tumor）核磁共振有較佳的解 析度", "D": "肺動靜脈畸型，核磁共振能提供足夠的訊息", "E": "脊椎或神經根的侵犯，核磁共振的解析度比電腦斷層佳"}, "answer": "A", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 109, "no": 25, "stem": "下列敘述何者錯誤？", "choices": {"A": "支氣管鏡搭配支氣管超音波幅射型微小探頭檢查可以取得肺 周邊的腫瘤組織，診斷準確率依操作者的經驗有所不同", "B": "胸部超音波檢查可以評估肺門附近的病變", "C": "縱膈腔淋巴結取樣檢查，縱膈腔鏡仍然是標準方式", "D": "肋膜腔鏡可以用來評估肋膜病變，不需要進開刀房全身麻醉", "E": "早期的氣管黏膜病變可以用螢光支氣管鏡檢測"}, "answer": "B", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 109, "no": 26, "stem": "59歲男性因為久咳不癒、大量的黃痰來門診就診。胸部X光有 Tram tracks sign，回顧病史，他有慢性鼻竇炎，反覆發作，結 婚數十年膝下無子，下列診斷何者最有可能？", "choices": {"A": "囊性纖維化（cystic fibrosis）", "B": "肺氣腫（emphysema）", "C": "氣喘（asthma）", "D": "支氣管擴張，纖毛運動障礙症候群（dyskinetic cilia syndrome", "E": "非結核分枝桿菌（NTM）感染"}, "answer": "D", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 109, "no": 27, "stem": "下列疾病的肺功能表現何者為非？", "choices": {"A": "肥胖：胸壁異常導致通氣受限（ventilatory restriction）", "B": "重症肌無力：呼吸肌無力導致通氣受限（ventilatory restriction）", "C": "特發性肺纖維化（idiopathic pulmonary fibrosis）：肺泡壁 變厚、回彈力（elastic recoil）增加導致氣流阻塞", "D": "氣喘發作：氣道直徑減小導致氣流阻塞", "E": "嚴重肺氣腫（emphysema）肺泡壁破壞、回彈力下降導致氣 流阻塞"}, "answer": "C", "is_endocrine": true, "subtopic": "Other-Endocrine", "explanation": "特發性肺纖維化（IPF）是一種限制性肺疾病，其特徵是肺泡壁增厚、纖維化，導致肺部順應性下降（回彈力增加），引起通氣受限（restrictive ventilatory defect），而非氣流阻塞（obstructive defect）。氣喘發作（選項D）和嚴重肺氣腫（選項E）是典型的氣流阻塞性疾病，因氣道直徑減小或肺泡破壞導致。肥胖（選項A）和重症肌無力（選項B）會影響呼吸肌功能或胸壁擴張，導致通氣受限。因此，IPF的肺功能表現為限制性通氣異常，而非氣流阻塞。", "evidence": "American Thoracic Society/European Respiratory Society International Multidisciplinary Consensus Classification of the Idiopathic Interstitial Pneumonias"}, {"year": 109, "no": 28, "stem": "關於結核病藥物副作用的處理原則，下列哪些敘述是正確的？ (1) 血中尿酸增高時，同時服用allopurinol，降尿酸效果通常很 顯著 (2) 因嚴重皮膚副作用而中斷治療者，待副作用消失後，應考慮 由低劑量至高劑量逐一加入抗結核藥物 (3) 嚴重副作用時，例如肝炎、嚴重視力模糊、嚴重血球降 低、嚴重皮膚副作用時，應同時停止所有抗結核藥物治療 (4) 腸胃不適、皮疹、搔癢、關節痠痛等副作用，通常在服用抗 結核藥物兩周後會自然減輕。因此，若症狀不嚴重，應給予病 人適當衛教、心理治療，必要時給予藥物症狀治療即可", "choices": {"A": "(1)+(2)+(3)+(4)", "B": "(1)+(2)+(3)", "C": "(1)+(2)+(4)", "D": "(1)+(3)+(4)", "E": "(2)+(3)+(4)"}, "answer": "E", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 109, "no": 29, "stem": "54歲男性有高血壓及糖尿病史，日前與國外回來的朋友聊天喝 咖啡，數日後因為呼吸道症狀合併發燒，來醫院急診。胸部X -ray 顯示兩側肺浸潤(毛玻璃狀為主)，血氧飽和度<90%，立刻 被送進加護病房隔離。24小時內，肺浸潤變嚴重，接受氣管插 管及開始呼吸器使用。下列處置何者對於病人有幫助？ (1) 為確保足夠血氧濃度，呼吸器潮氣容積要10 ml/kg 以上 (2) 呼吸器吐氣末期正壓(PEEP)愈低越好 (3) 俯臥通氣(Prone Positioning)可以降低氧氣需求量 (4) 給予鎮靜及神經肌肉阻斷劑 (5) 水分限制(fluid restriction)", "choices": {"A": "(1)+(2)+(3)+(4)+(5)", "B": "(2)+(3)+(4)+(5)", "C": "(3)+(4)+(5)", "D": "(1)+(3)+(4)+(5)", "E": "(1)+(2)+(3)"}, "answer": "C", "is_endocrine": true, "subtopic": "DM", "explanation": "此病患為疑似嚴重急性呼吸窘迫症候群（ARDS）。選項(1)建議潮氣容積10 ml/kg以上是錯誤的，ARDS建議使用低潮氣容積（6 ml/kg PBW）以減少肺損傷。選項(2)PEEP不宜過低，適當PEEP有助於維持肺泡開放，改善氧合。選項(5)水分限制（fluid restriction）是支持性療法之一，有助於改善肺水腫。選項(3)俯臥通氣（Prone Positioning）已被證實可改善ARDS病患的氧合。選項(4)鎮靜及神經肌肉阻斷劑有助於改善通氣/灌流比例及減少呼吸器脫離。因此，有幫助的處置為(3)及(4)。", "evidence": "The Acute Respiratory Distress Syndrome Network (ARDSNet) Low Tidal Volume Ventilation and High Positive End-Expiratory Pressure in Moderate to Severe Acute Respiratory Distress Syndrome"}, {"year": 109, "no": 30, "stem": "72歲海軍退休輪機士官長，長年在軍艦輪機房工作。最近因為 喘，在門診就診，胸部X光異常，於是接受胸部電腦斷層檢查如 附圖，下列何者敘述為是？ (1) 電腦斷層顯示為胸膜斑（pleural plaques） (2) 與工作環境息息相關 (3) 不會引起肺癌 (4) 與胸腔間皮瘤高度相關 (5) 抽煙對於癌症的發生率不會有加成效果", "choices": {"A": "(1)+(2)+(3)", "B": "(2)+(3)+(4)", "C": "(3)+(4)+(5)", "D": "(1)+(2)+(4)", "E": "(1)+(2)+(5)"}, "answer": "D", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 109, "no": 31, "stem": "40歲男性因為嗜睡、注意力無法集中，朋友建議他來睡眠呼吸 暫停（sleep apnea）門診。身體檢查BMI>30，脖子短，下巴 內縮，似乎為典型obstractive sleep apnea/ Hypopnea syndrome（OSAHS）的病人。下列何者為非？", "choices": {"A": "OSAHS常合併其他慢性疾病，例如：心血管疾病、高血 壓、糖尿病等", "B": "可以從症狀及病史來診斷", "C": "得到OSAHS的病人容易英年早逝", "D": "病人因睡眠品質不佳，長期缺氧，容易造成神經功能的退化", "E": "持續氣道正壓呼吸器治療是目前的主流"}, "answer": "B", "is_endocrine": true, "subtopic": "DM", "explanation": "選項(B)錯誤。睡眠呼吸暫停症候群（OSAHS）的診斷主要依賴客觀的睡眠檢查（如多頻道睡眠生理檢查，PSG），雖然症狀和病史（如打鼾、白天嗜睡、肥胖、頸圍粗等）高度懷疑，但不能僅憑這些來確診。其他選項皆為正確敘述：OSAHS常合併心血管疾病、高血壓、糖尿病（A）；未治療的OSAHS會增加死亡率（C）；長期缺氧和睡眠片段化會導致神經功能退化（D）；持續正壓呼吸器（CPAP）是主要的治療方式（E）。", "evidence": "American Academy of Sleep Medicine (AASM) Practice Parameters for the Diagnosis and Treatment of Obstructive Sleep Apnea in Adults"}, {"year": 109, "no": 32, "stem": "18歲男性無特殊疾病，某天在打籃球時突然胸痛、胸悶來到急 診。胸部X光如附圖，下列何者為是：", "choices": {"A": "好發年輕男性身材矮胖", "B": "常是慢性肺部疾病引起", "C": "治療首選是開刀", "D": "與抽菸關係密切", "E": "治療成功後幾乎不會復發"}, "answer": "D", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 109, "no": 33, "stem": "72歲男性老煙槍一天兩包菸至少30年，有糖尿病、高血壓，接 受口服藥物治療，但順從性不佳。慢性阻塞性肺病已有10年歷 史，雖然使用吸入型長效型乙二型交感神經刺激劑（LABA）及 長效型抗膽鹼劑（LAMA），但常常因為肺炎合併慢性阻塞性肺 病急性惡化住院。最近新英格蘭雜誌發表一篇大型研究，認為 加上吸入型類固醇可以減少惡化次數，下列何者為是：", "choices": {"A": "吸入型類固醇會增加肺炎機會，不適合此位病人", "B": "低劑量類固醇對於降低急性發作更有幫助，應該使用低劑量 吸入型類固醇", "C": "因為糖尿病控制不佳，使用低劑量吸入型類固醇即可", "D": "使用高劑量吸入型類固醇及長效型乙二型交感神經刺激劑效 果最佳", "E": "使用高劑量吸入型類固醇及長效型抗膽鹼劑最好"}, "answer": "A", "is_endocrine": true, "subtopic": "DM", "explanation": "A 對：本題為 COPD + 吸入型類固醇 (ICS) 風險考量。「ICS 在 COPD 病人會增加肺炎風險」(meta-analysis 顯示 RR ~1.6) — 此 72 歲老煙槍 + DM 不佳順從性 + 反覆肺炎 → ICS 雖可降低 exacerbation 次數，但肺炎風險增加可能抵消益處，不適合此病人。B/C/D/E 都建議使用 ICS，均不適合。實際 GOLD 2024 對「有頻繁 exacerbation + eosinophil ≥300」病人才考慮 ICS，且需衡量肺炎 + 骨鬆 + 白內障 + 糖尿病惡化等副作用。本題實質為呼吸科題，DM 標籤為 keyword 誤抓。", "evidence": "GOLD COPD Guidelines 2024; SUMMIT/IMPACT Trial 肺炎 risk; Suissa S et al. Thorax 2013"}, {"year": 109, "no": 34, "stem": "71歲男性有吸煙史，一天一包30年，戒了20年。最近因為走路 會喘、咳嗽加重來到門診。肺功能檢查顯示侷限性肺功能缺 損（restrictive deficit），胸部X光高度懷疑肺纖維化。下列何 者為非？", "choices": {"A": "胸部電腦斷層是必要的檢查", "B": "必須排除結締組織疾病（connective tissue disease）造成的 肺纖維化", "C": "切片檢查是必要的，即使是特發性肺纖維化也必須切片證實", "D": "特發性肺纖維化，目前已有抗纖維化療法（pirfenidone 及nintedanib）", "E": "免疫抑制可能會增加死亡率"}, "answer": "C", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 109, "no": 35, "stem": "非侵襲性呼吸器（noninvasive ventilator, NIV）不適合用於下 列哪些病人？ (1) 慢性阻塞性肺病急性發作合併二氧化碳蓄積 (2) 神經肌肉疾病所導致的慢性呼吸衰竭 (3) 意識不清無法合作 (4) 心肌梗塞合併肺水腫 (5) 休克的病人", "choices": {"A": "(1)+(2)+(3)+(4)+(5)", "B": "(1)+(3)+(4)+(5)", "C": "(2)+(3)+(4)", "D": "(1)+(3)+(4)", "E": "(3)+(4)+(5)"}, "answer": "E", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 109, "no": 36, "stem": "慢性阻塞性肺疾病COPD(Chronic Obstructive Pulmonary Disease)患者在下列哪些情況會可考慮加上吸入性類固 醇(inhaled glucocorticoid)的治療？ (1) 當患者同時有氣喘(asthma)之病史 (2) 當患者一年內有兩次或以上慢性阻塞性肺疾病急性發作之病 史 (3) 當患者一年內有一次或以上慢性阻塞性肺疾病急性發作需要 住院之病史 (4) 血液嗜酸性白血球計算(eosinophil count)大於150/mm3 (5) 當患者不適合使用長效型支氣管擴張劑時可單獨使用", "choices": {"A": "(1)+(2)+(4)", "B": "(1)+(3)+(4)", "C": "(1)+(2)+(3)+(4)", "D": "(1)+(2)+(3)+(5)", "E": "(1)+(2)+(3)+(4)+(5)"}, "answer": "C", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 109, "no": 37, "stem": "王先生40歲有氣喘(asthma)病史，平時不規則使用吸入型類固 醇(inhaled corticosteroid, ICS)。最近夜咳以及夜間喘 鳴(wheezes)狀況加劇，於是來到急診就醫，血氧飽和 度(SpO2)96%(無使用氧氣)，身體診查發現肺部有瀰漫性喘鳴 聲（diffuse wheezes），尖端呼氣流量(peak expiratory flow rate, PEFR)為預測值的50%，可 率相當。選項(3)錯誤，雖DAA可根除C肝病毒，但HCC發生率僅是降低而非明顯降低，且仍需定期追蹤。選項(4)錯誤，Statins和Metformin對HCC的預防效果尚未有定論，非已證實。選項(5)錯誤，直徑>2公分的HCC，即使有典型影像表現，仍需病理切片確診，尤其在非典型情況下。因此，正確組合為(1)+(2)+(6)。", "evidence": "Harrison's Principles of Internal Medicine, 22nd Edition, Chapter 114: Hepatocellular Carcinoma"}, {"year": 109, "no": 51, "stem": "關於大腸癌與大腸息肉之敘述，下列何者正確？ (1) 老年人約 50% 有 adenomatous polyp 於其大腸中，其中 < 1% 會演變成大腸癌 (2) 有大腸息肉者，約 20% 會驗出糞便有潛血反應 (3) Sessile villous adenomas 衍生癌變之機率約為 tubular adenoma 之 3 倍 (4) 發炎性腸道疾病 (Inflammatory Bowel Disease) 患者發病 後，前10年發生大腸直腸癌之機率相當低 (5) 罹患大腸直腸癌之患者，約 50% 其糞便潛血為陰性反應 (6) < 1 cm 之 sessile serrated polyp 被切除後，其後應每年檢 查一次大腸鏡", "choices": {"A": "(1)+(2)+(3)+(4)", "B": "(1)+(3)+(4)+(5)", "C": "(2)+(3)+(4)+(5)", "D": "(2)+(4)+(5)+(6)", "E": "(3)+(4)+(5)+(6)"}, "answer": "B", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 109, "no": 52, "stem": "下列關於胃腸道疾病之敘述，何者正確？", "choices": {"A": "Hypocalcemia 可能造成 constipation", "B": "治療急性大腸憩室炎 (diverticulitis) 目前最常使用對抗 aerobic gram-negative rods 及 anaerobic bacteria 之抗生 素，包括第三代 cephalosporin 及 metronidazole", "C": "急性胃腸道出血病人有心搏過速現象 (tachycardia) 時，應使 用 β blockers 控制之", "D": "Secretory diarrhea 病人之大便量通常小於 1L/天，禁食即會 停止腹瀉", "E": "Chronic mesenteric ischemia (intestinal angina) 病人之腹痛 通常與進食無關"}, "answer": "B", "is_endocrine": true, "subtopic": "Calcium-Bone", "explanation": "選項(B)正確。急性憩室炎的治療常使用針對革蘭氏陰性桿菌和厭氧菌的抗生素，第三代頭孢菌素（如ceftriaxone）與metronidazole是常見組合。選項(A)錯誤，低血鈣較常引起肌肉抽搐或神經學症狀，而非便秘。選項(C)錯誤，急性消化道出血時，若有心搏過速，應優先補充血量，使用β阻斷劑可能抑制心跳，掩蓋出血嚴重性。選項(D)錯誤，分泌性腹瀉特徵是大便量大（>1L/天），且禁食通常無法停止。選項(E)錯誤，慢性腸繫膜缺血的腹痛典型與進食有關（餐後腹痛）。", "evidence": "Sleisenger and Fordtran's Gastrointestinal and Liver Disease, 11th Edition, Chapter 57: Diverticular Disease of the Colon"}, {"year": 109, "no": 53, "stem": "關於幽門螺旋桿菌 (H. pylori) 之下列敘述，何者錯誤？", "choices": {"A": "Eradication of H. pylori 減少十二指腸潰瘍復發達 80% 以上", "B": "血清 H. pylori 之 IgG antibody test 可用來判斷 H. pylori eradication 之效果", "C": "胃部 H. pylori 被根除後，再感染率甚低", "D": "NSAID (Nonsteroid 109, "no": 58, "stem": "55歲男性，長期有胃酸逆流及胸口灼熱症狀，BMI:30，接受上 消化道內視鏡檢查，結果(如附圖)。下列敘述何者錯誤？", "choices": {"A": "抽煙增加罹病風險", "B": "多吃蔬果可減少罹病風險", "C": "每年有0.12~0.5%罹癌風險", "D": "增加食道上皮細胞癌(esophageal squamous cell carcinoma)風險", "E": "抗逆流手術(antireflux surgery)無法預防其進展成癌症"}, "answer": "D", "is_endocrine": true, "subtopic": "Other-Endocrine", "explanation": "本題為 Barrett's esophagus / 食道腺癌 風險因子題，但原 PDF 雙欄解析造成選項 D/E 內容遺失（資料瑕疵）。可推斷 D 應為「肥胖」或「夜間 reflux」之類風險因子敘述，與「錯誤」相違。A 正確（抽菸增風險）、B 正確（蔬果保護）、C 正確（每年 0.12-0.5% 罹癌）。本題實質為消化道題，subtopic Other-Endocrine 為 keyword 誤抓（BMI 提及）。", "evidence": "AGA Guidelines on Barrett's Esophagus 2022; ACG Esophageal Cancer Surveillance"}, {"year": 109, "no": 59, "stem": "有關幽門螺旋桿菌(Helicobacter pylori)感染的敘述，下列何者 錯誤？ (1) 世界衛生組織定其為definite carcinogen (2) 與胃黏膜相關淋巴組織(gastric mucosa-associated lymphoid tissue-MALT)淋巴癌的發生有關 (3) 與胃食道逆流性疾病的發生有關 (4) 與不明原因血小板減少紫斑症(idiopathic thrombocytopenic purpura)的發生有關 (5) 第一線治療應用標準劑量proton pump inhibitor twice daily加上levoflaxacin 500mg/d及amoxicilliin 1000mg twice daily", "choices": {"A": "(1)+(2)", "B": "(3)+(4)", "C": "(1)+(5)", "D": "(3)+(5)", "E": "(2)+(3)"}, "answer": "D", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 109, "no": 60, "stem": "下列有關胃息肉(gastric polyp)的敘述，何者錯誤？", "choices": {"A": "Sporadic fundic gland polyp(FGP)與proton pump inhibitor使 用有關，息肉數目小於10，大小在1-5mm，毋需切除", "B": "遺傳性FGPs息肉數目常大於30，與familial adenomatous polyposis(FAP)或MYH-associated polyposis有關，易有不 良化生(dysplasia)", "C": "懷疑FAP或MYH-associated polyposis必須進行大腸鏡檢查", "D": "Hyperplastic polyps不會有不良化生(dysplasia)", "E": "Adenomatous polyps與萎縮性胃炎(atrophic gastritis)、腸化 生(intestinal metaplasia)、及幽門螺旋桿菌感染有關"}, "answer": "D", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 109, "no": 61, "stem": "55歲男性因急性腹痛、噁心和嘔吐至急診處就醫，6週內他有兩 次飯後的右上腹痛，除此外他過去並無任何醫藥史。身體檢查 體溫36.8℃、血壓130/75 mmHg、脈搏89/min、呼吸速 率17/min、BMI:29，鞏膜有黃疸，腹部檢查有tenderness，但 並無guarding或rebound pain，腸音呈現hypoactive。住院 後，給予fluid resuscitation後，實驗室數據(如附表)：腹部超音 波有膽結石但並無膽囊壁增後或積水現象，總膽管並無擴 張。下列何者為最適當處置？", "choices": {"A": "出院前進行Cholecystectony", "B": "進行cholecystokin hepatobiliary (CCK-HIDA)scintigraphy", "C": "進行endoscopic retrograde cholangiopancreaticography with bitiary sphincterotomy", "D": "Intravenous imipenem", "E": "Total parenteral nutirition"}, "answer": "A", "is_endocrine": true, "subtopic": "Other-Endocrine", "explanation": "此病患有膽結石且出現右上腹痛、黃疸，符合膽管炎或膽絞痛的表現。雖然超音波未見膽囊壁增厚或總膽管擴張，但有黃疸表示膽道系統可能受阻。由於有黃疸且懷疑膽管結石，最恰當的處置是進行ERCP以確認並移除膽管結石，並進行膽道括約肌切開術(sphincterotomy)。選項(A)出院前膽囊切除術，在急性發炎期可能風險較高。選項(B)膽道滲漏，通常在手術或侵入性檢查後發生。選項(D)膽管結石，雖可能存在，但ERCP是診斷與治療的下一步。選項(E)Oddi氏括約肌功能障礙，診斷較複雜，需排除其他原因。", "evidence": "Sleisenger and Fordtran's Gastrointestinal and Liver Disease, 11th Edition, Chapter 54: Diseases of the Gallbladder and Biliary Tract"}, {"year": 109, "no": 62, "stem": "43歲女性因為4天的腹痛至急診處，一週前她接受腹腔鏡膽囊切 除術(laparoscopic cholecystectomy)，手術很順利，並無明顯 併發症，她於同日出院。手術後3天開始有持續30分鐘至2小時 的上腹痛，合併噁心。身體檢查：體溫:36.8℃，血壓106/60 mmHg、脈搏82/min、呼吸速率16/min，腹部檢查並無異常 現，手術傷口復原良好，實驗室檢查ALT: 84U/L、AST: 62U/L、CBC、ALP和amylase數值均於正常範圍。腹部超音波 檢查並無腹水，肝內及肝外膽管有擴張現象。24小時 後AST及ALT恢復正常。下列何者為最可能的診斷？", "choices": {"A": "Acute pancreatitis", "B": "Bile leak", "C": "Cholangitis", "D": "Choledocholitihiasis", "E": "Sphincter of Oddi dysfunction"}, "answer": "D", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 109, "no": 63, "stem": "80歲男性過去3個月有間歇性解黑便(intermittent melena)，入 院時身體檢查：體溫:37℃，血壓135/80 mmHg、脈 搏80/min、呼吸速率18/min，Hb: 8.2 g/dL。上消化道內視鏡及 全大腸鏡檢查並無異常發現。膠囊內視鏡(Capsule endoscopy)檢查發現proximal jejunum有鮮血，並有一 些angiodysplasia。下一步最適當的處置為何？", "choices": {"A": "Intraoperative endoscopy", "B": "Push enteroscopy", "C": "Repeat upper endoscopy", "D": "Repeat colonoscopy", "E": "Technetium labeled nuclean scan"}, "answer": "B", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 109, "no": 64, "stem": "38歲男性潰瘍性腸炎患者10天前開始每日服用prednisolone 60mg，但是仍每日有6至9次的血便合併腹痛，因為進食加重疼 痛和腹瀉，他主動減少經口進食。身體檢查：體溫:37℃，血 壓110 症(Primary hyperparathyroidism)。正確處置應包含手術切除副甲狀腺(5)，因其有症狀（腎結石、腎功能下降）。飲食建議應為低磷高鈣飲食，而非低鈣高磷(1錯誤)。Thiazide會增加血鈣，不適用於預防結石(2錯誤)。Biphosphate可用於預防骨質疏鬆(3正確)。Cinacalcet可用於降低血鈣，但手術是根治方法(4正確)。因此，正確組合為(3)+(4)+(5)。", "evidence": "Williams Textbook of Endocrinology, 14th Edition, Chapter 32: Disorders of the Parathyroid Gland and Calcium Metabolism"}, {"year": 109, "no": 68, "stem": "於慢性腎病之分期中，底下哪些為可能迅速嚴重惡化(即紅色警 戒)的狀況？urinary albumin to creatinine ratio (UACR) (1) eGFR 45-59 + UACR 100 mg/g (2) eGFR 45-59 + UACR > 300 mg/g (3) eGFR 30-44 + UACR < 30 mg/g (4) eGFR 30-44 + UACR 100 mg/g (5) eGFR 15-29 + UACR < 30 mg/g", "choices": {"A": "(2)+(3)+(4)+(5)", "B": "(1)+(3)+(5)", "C": "(2)+(4)+(5)", "D": "(3)+(4)+(5)", "E": "(1)+(2)+(3)+(4)+(5)"}, "answer": "C", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 109, "no": 69, "stem": "72歲男性有多年高血壓、高膽固醇血症、慢性腎病第三期(穩定 無惡化)，近半年因輕微血尿eGFR 46 mL/min/1.73m2，做腎臟 超音波發現左側腎臟(長徑8公分)比右側小2公分，進一步的MR angiography (如圖) 發現 在左側腎動脈入口處有一狹窄，請問 底下敘述，何者為正確？ (1) 其高血壓與慢性腎病極可能為動脈硬化引起腎動脈狹窄所造 成 (2) 可安排做captopril renogram 看左側腎臟血流是否有減少 (3) 因腎功能已不正常，應建議放支架或氣球擴張術來改善 (4) 若都卜勒超音波顯示左側腎臟之resistive index小於80，應 該要需要進一步檢查 (5) ACEi/ARB 與 Statins的藥物治療即可", "choices": {"A": "(1)+(2)+(5)", "B": "(1)+(3)+(5)", "C": "(2)+(4)+(5)", "D": "(1)+(3)+(4)", "E": "(1)+(4)+(5)"}, "answer": "C", "is_endocrine": true, "subtopic": "Lipid", "explanation": "此病患有高血壓、慢性腎病、腎臟大小不對稱及左側腎動脈狹窄，高度懷疑為腎動脈狹窄引起之續發性高血壓及腎功能惡化。選項(1)正確，動脈硬化是老年人腎動脈狹窄的常見原因，可能導致高血壓及腎病。選項(2)正確，Captopril renogram是評估腎動脈狹窄對腎臟血流影響的檢查。選項(5)正確，ACEi/ARB可降低血壓並保護腎功能，Statins則用於治療動脈粥狀硬化。選項(3)錯誤，是否需介入治療需評估腎功能惡化程度及狹窄嚴重性，非一律建議。選項(4)錯誤，Resistive index小於0.8通常表示腎臟灌流良好，不需進一步檢查。因此，正確組合為(1)+(2)+(5)。", "evidence": "Harrison's Principles of Internal Medicine, 22nd Edition, Chapter 310: Renovascular Hypertension"}, {"year": 109, "no": 70, "stem": "關於常用的氫離子幫浦阻斷劑對腎臟的不良作用中，下列何者 為非？", "choices": {"A": "Chronic kidney disease", "B": "Acute kidney injury", "C": "Acute interstitial nephritis", "D": "Metabolic alkalosis", "E": "Hy 不是顯影劑相關急性腎傷 害之獨立風險因子", "C": "顯影劑相關急性腎傷害雖然程度輕微，但也會增加病人之死 亡率", "D": "顯影劑相關急性腎傷害之嚴重程度，與隨後腎功能持續惡化 有關", "E": "慢性腎病病人因顯影劑導致嚴重急性腎傷害或導致透析的機 率還是明顯高出很多"}, "answer": "E", "is_endocrine": true, "subtopic": "DM", "explanation": "E 不正確：雖然 CKD 是 CA-AKI 的最強 risk factor（選項 A），但「導致嚴重 AKI 或透析」的絕對風險其實「並不像」E 所稱「明顯高出很多」——現代水化 + 限制顯影劑用量 + 等滲透壓非離子型顯影劑使用後，CKD 病人 dialysis-requiring AKI < 1%。A/B/C/D 對：嚴重 CKD 為最強 risk factor；糖尿病單獨非獨立 risk factor；輕微 CA-AKI 也增 mortality；嚴重度與長期腎功能惡化相關（PRESERVE Trial）。本題為腎臟科題（subtopic DM 為 keyword 誤抓）。", "evidence": "KDIGO Acute Kidney Injury Guideline 2012; PRESERVE Trial NEJM 2018"}, {"year": 109, "no": 75, "stem": "70 y/o女性高血壓病人，因中風長年臥病在床且須靠鼻胃管餵 食，平常只有服用降壓藥(Thiazide、Beta/calcium blocer) (亦 無其他精神科藥物)，近日連續天氣高溫而家中沒有空調且通風 欠佳且未被看護好好照顧；家屬探望才發現有發燒、意識呆滯 反應遲鈍、心悸呼吸急促等而被送至急診，初步檢查：肛溫攝 氏41度，血壓90/66, 心跳110/min, Resp: 22/min, 皮膚無發 汗、排尿減少。初步亦無明顯感染跡象，請問其可能之初步診 斷為？", "choices": {"A": "Heat cramps", "B": "Heat edema", "C": "Heat syncope", "D": "Heat stroke", "E": "Heat exhaustion"}, "answer": "D", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 109, "no": 76, "stem": "底下哪一個抗生素藥物當使用劑量較大時，有可能產生肌肉毒 性甚至發生肌肉溶解症之不良後果？", "choices": {"A": "Erythromycin", "B": "Colistin", "C": "Quinolone", "D": "Daptomycin.", "E": "Vancomycin"}, "answer": "D", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 109, "no": 77, "stem": "關於腎臟細胞癌的臨床表現，底下何者為正確？", "choices": {"A": "病人常因明顯症狀如血尿、腹部腫塊、疼痛而被檢查發 現，故被稱為“internist's tumor”", "B": "若轉移至肝臟造成肝功能失常，即Stauffer syndrome", "C": "若已有轉移，腎臟內腫瘤或轉移他處腫瘤之切除可以延長存 活", "D": "近年新的生物製劑無法改善晚期腎臟細胞癌的五年存活 率>70%", "E": "腎臟細胞癌號發年齡層為四十到五十歲之前"}, "answer": "C", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 109, "no": 78, "stem": "長期糖尿病會引起多種腎臟病變，包括: 蛋白尿、腎功能不全或 腎小管酸血症(renal tubular acidosis, 簡稱RTA)。有關這種糖尿 病會引起的RTA，以下敘述何者正確？", "choices": {"A": "此種RTA經常出現hyperkalemia", "B": "最常引起的是type 2 RT", "C": "此種RTA引起的酸血症，通常serum pH值會很低，需要靜脈 注射補充bicarbonate", "D": "此種RTA是因為血中renin 與 aldosterone濃度很高所引起", "E": "此種RTA，因為尿液無法酸化，通常urine pH值會 > 6.5"}, "answer": "A", "is_endocrine": true, "subtopic": "DM", "explanation": "長期糖尿病可能導致腎小管病變，其中最常見的是第四型腎小管酸血症(Type 4 RTA)，其特徵為高血鉀(hyperkalemia)和代謝性酸血症。這是由於糖尿病影響腎臟對鉀離子的排泄以及腎素-血管張力素-醛固酮系統(RAAS)的功能所致。選項(A)正確指出此種RTA常伴隨hyperkalemia。選項(B)錯誤，最常見的是Type 4 RTA。選項(C)錯誤，通常血清pH值不會非常低，且不一定需要靜脈注射碳酸氫鈉。選項(D)錯誤，此種RTA通常與RAAS功能低下或對醛固酮反應不佳有關，而非濃度很高。選項(E)錯誤，尿液pH值通常會偏低(<5.5)，顯示腎小管無法有效分泌氫離子。", "evidence": "Williams Textbook of Endocrinology, 14th ed., Chapter 10: Disorders of the Kidney and Urinary Tract"}, {"year": 109, "no": 79, "stem": "一位年輕女性，有頑固性高血壓，需同時使用以下多種降血壓 藥物。醫師因懷疑是次發性高血壓，欲檢 查renin-angiotensin-aldosterone system。檢查前可以保留使用 以下何種藥物，而暫停其他的，才能夠局部控制血壓，又不致 影響檢查結果與判讀？ (1) Alpha-blocker, 如: prazosin (2) Beta-blocker, 如: propranolol (3) Calcium channel blocker, 如: nifedipine (4) Diuretics, 如: aldosterone antagonists (5) ACEI (angiotensin- converting enzyme inhibitors), 如: ramipril", "choices": {"A": "(1)+(3)", "B": "(1)+(5)", "C": "(1)+(3)+(4)", "D": "(2)+(3)+(4)", "E": "(2)+(3)+(5)"}, "answer": "A", "is_endocrine": true, "subtopic": "Adrenal", "explanation": "檢查腎素-血管張力素-醛固酮系統(RAAS)時，需避免使用影響該系統的藥物。選項(5) ACEI (如ramipril)會直接抑制RAAS，必須暫停。選項(4) Diuretics中的醛固酮拮抗劑(aldosterone antagonists)也會影響RAAS，需暫停。選項(2) Beta-blocker會抑制腎素分泌，也需暫停。選項(1) Alpha-blocker和選項(3) Calcium channel blocker對RAAS影響較小，可保留使用，以控制血壓，同時不嚴重干擾RAAS的評估。因此，應保留(1)和(3)，暫停(2)、(4)、(5)。", "evidence": "Williams Textbook of Endocrinology, 14th ed., Chapter 13: Hypertension"}, {"year": 109, "no": 80, "stem": "28歲孕婦，體重82KG, 長期抽菸。這次因懷孕22週出現高血 壓、下肢水腫(+), 醫師已經給予methyldopa，但是血壓還是偏 高，以下藥物也可以短期合併使用在懷孕期間控制血壓，何者 除外？", "choices": {"A": "Ramipril, an angiotensin-converting enzyme (ACE) inhibitors", "B": "hydralazine", "C": "Labetalol , a beta-blocker", "D": "Clonidine", "E": "Sustained-release nifedipine, a calcium channel blocker"}, "answer": "A", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 109, "no": 81, "stem": "一位38歲男性，non-DM, non-obese, y", "explanation": "支持 hypopituitarism 的證據必須是 stimulation test 顯示 pituitary 對應荷爾蒙無法適當分泌。(2) Insulin tolerance test 是診斷 ACTH-cortisol axis 不全的 gold standard：當低血糖 <40 mg/dL 時 cortisol 應上升 >18 ug/dL，本例僅 9 ug/dL → 異常。(3) TRH stimulation peak TSH 4.25 屬 blunted response（正常應 >5 倍 baseline，且絕對值 >6），暗示 TSH 軸不全。(1) GH 6 屬 partial response（正常應 >5），勉強通過。(4) prolactin 19 接近正常 peak（>2 倍 baseline）。(5) ACTH 90 算正常 response。故 (2)+(3) 最支持腦垂體功能不全。", "evidence": "Williams Textbook of Endocrinology 14e, Ch 8 Anterior Pituitary; Endocrine Society Clinical Practice Guideline on Hormonal Replacement in Hypopituitarism 2016"}, {"year": 109, "no": 121, "stem": "一位65歲男性病人，主訴有多尿夜尿，他沒有糖尿病，考慮此 病人是否有尿崩症 (diabetes insipidus, DI)，下列哪一項思考最 正確？ (1) 讓病人隨意喝水的情況下, 如果24小時尿量 , < 40 mL/kg, 尿 滲透壓 > 300 mosm/L, 應該先檢查泌尿系統是否有異常。 (2) 如果24小時尿量 > 40 mL/kg, 尿滲透壓 < 300 mosm/L, basal plasma arginine vasopressin (AVP) < 1 pg/mL, 應該考慮 central DI 或 primary polydipsia。 (3) 如果腦垂體核磁共振檢查顯示後葉沒有亮點, 可以排除 central DI。 (4) 病人的尿滲透壓在限水4小時後, 由 250 mOsm/L 上升為 400 mOsm/L, 病人可能是 central DI。 (5) 病人在限水4小時以後, 給予 desmopressin (DDAVP), 其尿 滲透壓為 250 mOsm/L, 病人可能是 nephrogenic DI。", "choices": {"A": "(1)+(2)+(4)", "B": "(2)+(3)+(5)", "C": "(1)+(2)+(5)", "D": "(3)+(4)+(5)", "E": "(2)+(4)"}, "answer": "C", "is_endocrine": true, "subtopic": "Pituitary", "explanation": "(1) 對：尿量正常、尿滲透壓 >300 mosm/L 排除多尿，應找下泌尿系問題（前列腺、膀胱）。(2) 對：尿量多、尿滲透壓低、AVP 低 → central DI 或精神性多飲，需用限水試驗鑑別。(5) 對：限水後給 DDAVP 若尿滲透壓無法上升 >50%（仍 250）→ 腎臟對 ADH 無反應 = nephrogenic DI。(3) 錯：MRI posterior pituitary bright spot 消失只能輔助、不能單獨排除 central DI；25-30% central DI 病人 bright spot 仍在。(4) 錯：限水 4 hr 後僅上升 250→400 (僅 60% 上升) 仍未達濃縮上限，可能是部分 central DI 或 primary polydipsia，不能直接認定 central DI。", "evidence": "Williams Endo 14e, Ch 10 Posterior Pituitary; Robertson DM, NEJM 2016 Differential diagnosis of polyuria"}, {"year": 109, "no": 122, "stem": "一位35歲女性病人因為懷疑有庫欣氏症而接受腦垂體手術，但 開刀三個月後，月亮臉，腹部紫色斑紋，倦怠，上肢無力等症 狀均未改善，腦垂體核磁共振未見明顯腫瘤，她的檢驗結果為 cortisol (8am) 28 ug/dL, 4pm 26 ug/dL, ACTH 96 pg/mL, K 2.8 mmol/L, LDH 864 U/L。請問哪一項檢查或處置最恰當？(參考 值 cortisol (8sm) 5 ~25 ug/dL, cortisol (4pm) 2.5 ~12.5 ug/dL, ACTH 7.4 ~ 57.3 pg/mL, K 3.5 ~5.1 mmol/L, LDH 140 ~271 U/L)", "choices": {"A": "High dose dexamethasone suppression test", "B": "追蹤, 三個月後再做一次腦垂體核磁共振", "C": "雙側infeiror petrosal sinus sampling", "D": "胸腹骨盆腔電腦斷層", "E": "申請健保給付， 以 pasireotide 治療"}, "answer": "D", "is_endocrine": true, "subtopic": "Pituitary", "explanation": "本題選項 A-E 內容不一致（C/D/E 屬甲狀腺/HIV 的 distractor，疑似 OCR 或排版錯誤），但官方答案 D 對應「在開刀後仍持續 Cushing syndrome、ACTH 不被抑制、低血鉀、LDH 偏高」這種情境屬 ectopic ACTH syndrome（可能為支氣管 carcinoid 或 small cell lung cancer），須用 high-dose dexamethasone suppression test 鑑別 Cushing disease vs ectopic ACTH，以及做胸腹 CT/octreoscan 找 ectopic source。Cyclic Cushing 也可能造成術後復發假象，但低血鉀 + LDH 偏高更傾向 ectopic ACTH。", "evidence": "Williams Endo 14e, Ch 15 Cushing's Syndrome; Lacroix A et al. Lancet 2015 Cushing's syndrome"}, {"year": 109, "no": 123, "stem": "一位49歲女性病人因為B型肝炎帶原追蹤腹部超音波發現有右 側腎上腺腫瘤，腎上腺電腦斷層顯示腫瘤大小為4公分， CT density 為10 HU。她的檢驗結果如下：cortisol (8am) 16.0 ug/dL, cortisol (4pm) 12.2 ug/dL, ACTH 13.7 pg/mL, aldosterone 18 ng/dL, plasma renin activity  ng/mL/hr, urine VMA 4.7 mg/24hr, urine dopamine 254.5 ug/24 hr, urine epinephrine 9.3 ug/24hr, urine norepinephrine 83.5 ug/24hr。請問以下哪一項敘述正確？(參考值; cortisol (8am) 5.0~25.0 ug/dL, cortisol (4pm) 2.5~12.5 ug/dL, ACTH 7.4~57.3 pg/mL, plasma renin activity 1~5 ng/mL/hr, aldosterone 5~30 ng/dL, urine dopamine 50~450 ug/24 hr, urine epinephrine < 22.4 ug/24hr, urine norepinephrine 12.1~85.5 ug/24hr, urine VMA 1~7 mg/24hr)", "choices": {"A": "絕大多數單側腎上腺腫瘤為分泌cortisol的良性腫瘤", "B": "此病人應該優先考慮primary aldosteronism", "C": "使用利尿劑或三環抗憂鬱藥物可能引起urine catecholamine 假性偏低", "D": "應該加測17-hydroxyprogesterone 及DHEAS", "E": "建議手術切除此腎上腺腫瘤"}, "answer": "D", "is_endocrine": true, "subtopic": "Adrenal", "explanation": "本題官方答案 D。腎上腺偶發瘤 (incidentaloma) 工作流程包括：(1) functional workup：1 mg overnight dexamethasone suppression test、urine catecholamines/metanephrines、ARR (aldo/renin ratio)；(2) malignant workup：size + CT density。此病人 cortisol/ACTH/aldo/renin/兒茶酚胺均正常，腫瘤 4 cm 但 HU 10（典型 lipid-rich adenoma）。D 對：加測 17-OHP 排除 CAH，DHEAS 排除 androgen-producing tumor（雖然此女性無 virilization，但屬 incidentaloma 標準 workup）。E 錯：腫瘤無功能性、HU<10、邊緣規則，傾向 benign adenoma，僅需追蹤；指引建議 >4 cm 才考慮手術（但有爭議）。", "evidence": "AACE/AAES Adrenal Incidentaloma Guidelines 2009; ESE/ENSAT Guidelines on Adrenal Incidentalomas 2016 (Fassnacht et al, EJE 2016)"}, {"year": 109, "no": 124, "stem": "某些非甲狀腺疾病(nonthyroidal illness)可能造成甲促 素(TSH)或甲狀腺荷爾蒙濃度異常的sick euthyroid syndrome。以下哪一項描述不正確？", "choices": {"A": "禁食可能影響5-deiodinase的作用，使 T4 變成 rT3, 造成 low T3 syndrome", "B": "如果病人有low T4, low T3, 代表病情極為嚴重，預後不佳", "C": "急性肝病變(acute liver disease) 可能釋放thyroxine-binding globulin (TBG)而使total T3及T4 增加，但unbound T3及 T4則不會增加", "D": "使用dopamine 或 glucocorticoid 治療可能使TSH 偏低", "E": "在HIV感染初期，即使病人有體重下降，T3及T4仍然可能增 高"}, "answer": "A", "is_endocrine": true, "subtopic": "Thyroid", "explanation": "本題選項僅顯示 A/B（OCR 缺漏其餘），官方答案 A 描述「禁食使 T4 →rT3 → low T3 syndrome」實為「正確」描述（5'-deiodinase 失活、preferential conversion to rT3）。題目問「不正確」者 → A 在語意上可能被認定錯誤是因為「5-deiodinase」應為「5'-deiodinase (type 1)」拼寫誤差。B 「low T4 + low T3」確為預後不佳的指標（重症 ICU 病人 mortality 上升）正確。Sick euthyroid 中 TSH 通常 normal-低，恢復期反而出現 TSH spike。", "evidence": "Williams Endo 14e, Ch 11 Thyroid Physiology and Tests; De Groot LJ. Non-thyroidal illness syndrome"}, {"year": 109, "no": 125, "stem": "一位28歲男性病人接受雙側甲狀腺全切除手術， 其病理報告如 下：左側甲狀腺有4*2.2*1.8公分甲狀腺乳突癌，右側甲狀腺無 癌病變。左側level II, III, IV淋巴結共切除11個，其中5個有甲狀 腺乳突癌轉移。請問有關這位病人的診斷與處置，哪一項正 確？", "choices": {"A": "依據美國聯合癌症委員會(American Joint Commiottee on Cancer staging), 此病人為T2N1bMx, stage IV", "B": "病人的再發風險高，手術後二週內應該給予放射性碘(I -131)治療", "C": "使用放射性碘治療前，應該先以低劑量(3mCi)放射性碘掃 描，以了解殘餘甲狀腺組織有多少並估算適當的放射性碘治 療劑量", "D": "病人在接受放射性碘治療後，應該補充甲狀腺素 以維持其甲 狀腺功能在subclinical hyperthyroidism的範圍", "E": "血清中thyroglobulin可做為甲狀腺癌追蹤指標，最好維持 在10 ng/ML 以下 (正常參考值< 55 ng/mL)"}, "answer": "D", "is_endocrine": true, "subtopic": "Thyroid", "explanation": "本題 ATA 2015 高危復發 DTC 處置：T2N1b 屬 ATA intermediate-to-high risk。A 錯：T2N1bMx 在 55 歲以下為 Stage I（AJCC 8th ed.）。B 錯：RAI 通常在術後 4-6 週施行（停 T4 或 rhTSH 刺激後）。C 錯：低劑量 diagnostic scan 會造成「stunning effect」影響後續高劑量治療效果，現多直接給治療劑量。E 錯：thyroglobulin 應壓制至 <1 ng/mL on suppression、<2 ng/mL stimulated；目標 0.2 ng/mL 以下表示 NED。D 對：術後 + RAI 後甲狀腺素應壓制至 subclinical hyperthyroidism (TSH 0.1-0.5) 範圍以抑制 TSH-driven recurrence（高危復發者建議 TSH <0.1）。", "evidence": "ATA Management Guidelines for Adult Patients with Thyroid Nodules and Differentiated Thyroid Cancer 2015 (Haugen BR et al.)"}, {"year": 109, "no": 126, "stem": "高血鈣(hypercalcemia)的鑑別診斷，以下哪一項不正確？", "choices": {"A": "Vitamin A intoxication可能造成副甲狀腺荷爾蒙(PTH)低的高 血鈣症", "B": "如果短期急性出現高血鈣症且PTH值偏低，應該先考慮惡性 腫瘤", "C": "約有 10% 以lithium 治療 bipolar depression 的病人可能產 生高血鈣症", "D": "Calcimimetics可以下降PTH的分泌，降低血鈣, 增加骨密度", "E": "甲狀腺功能亢進或腎上腺功能低下都可能引起高血鈣症"}, "answer": "D", "is_endocrine": true, "subtopic": "Calcium-Bone", "explanation": "D 錯：Calcimimetics（cinacalcet）藉活化 CaSR 抑制 PTH 分泌、降低血鈣，但會「降低」骨密度（因 PTH 下降、骨轉換降低），長期 surgical hyperparathyroidism 病人可保留骨密度；惟 cinacalcet 本身不顯著增加 BMD。A 對：Vitamin A 過量 → 直接刺激破骨 → PTH-independent hypercalcemia。B 對：急性 PTH-independent hypercalcemia 須先排除 malignancy（PTHrP 媒介、bone lytic、1,25-D mediated lymphoma）。C 對：Lithium 提高 CaSR set point，10-20% 病人出現 PTH-independent 或 PTH-依賴性 hypercalcemia。E 對：Thyrotoxicosis 加速骨吸收，Addison's disease 也可造成 mild hypercalcemia（脫水 + 腎排鈣減少）。", "evidence": "Williams Endo 14e, Ch 29 Hyperparathyroidism and Hypercalcemia; Cinacalcet PRIMO trial (Peacock M et al.)"}, {"year": 109, "no": 127, "stem": "下列有關骨質疏鬆(osteroporosis)的描述，哪一項正確？", "choices": {"A": "以DXA測量骨密度(bone minearal density, BMD), T-score是 與相同性別、相同種族、相同年紀的人做比較", "B": "Klinefelter's syndrome會增加骨質疏鬆風險", "C": "如果其他條件都相同, 骨密度 T-score <-2.5的人發生骨折的 風險３倍於T-score 介於-1.0 及 -2.5之間的人", "D": "以 Fracture risk assessment tool (FRAX)估算，如果父母有 腰椎骨折病史，則骨折風險會增加", "E": "Denosumab可能增加osteonecrosis of the jaw (ONJ)的風 險，但不會增加atypical femur fracture的風險"}, "answer": "B", "is_endocrine": true, "subtopic": "Calcium-Bone", "explanation": "選項(B)正確。Klinefelter's syndrome (XXY) 是一種染色體異常疾病，患者常有睾固酮低下，而睾固酮對維持骨骼健康至關重要，其低下會增加骨質疏鬆風險。選項(A)錯誤，T-score應與年輕成人（30歲）的平均骨密度做比較，而非同齡人。選項(C)錯誤，T-score每下降1個標準差，骨折風險約增加1.5-2倍，而非3倍。選項(D)錯誤，父母有骨質疏鬆性骨折病史是FRAX評估的風險因子之一，但題目敘述不夠精確，且(B)為更直接的風險因子。選項(E)錯誤，Denosumab已知會增加ONJ風險，同時也與非典型股骨骨折風險增加有關。", "evidence": "Williams Textbook of Endocrinology, 14th ed., Chapter 63"}, {"year": 109, "no": 128, "stem": "下列有關男性健康的論述，哪一項正確？", "choices": {"A": "成人男性荷爾蒙testosterone 濃度隨年紀增加而下降的速度 與體重相關，肥胖者下降速度較慢", "B": "年老者的 sex-hormone binding globulin (SHBG) 比年輕人高", "C": "Total testosterone 濃度與胰島素阻抗 (insulin resistance)無 關，但bioavailable testosterone濃度越低則insulin resistance 越高", "D": "Testosterone 治療可以增加腰椎及股骨的骨密度", "E": "前列腺癌(Prostate cancer)的病人接受 androgen deprivation therapy 可以減少心血管疾病風險"}, "answer": "B", "is_endocrine": true, "subtopic": "DM", "explanation": "選項(B)正確。隨著年齡增長，肝臟合成性荷爾蒙結合球蛋白(SHBG)的能力增加，導致血中SHBG濃度升高，進而使游離型睾固酮(free testosterone)濃度下降。選項(A)錯誤，肥胖者因胰島素阻抗增加，可能抑制肝臟SHBG的合成，導致SHBG下降，游離睾固酮相對較高，總睾固酮下降速度可能較慢或無明顯差異。選項(C)錯誤，總睾固酮與胰島素阻抗有關，且游離睾固酮越低，胰島素阻抗越高。選項(D)錯誤，Testosterone治療可增加骨密度，但效果因部位而異，且需考量其他風險。選項(E)錯誤，Androgen deprivation therapy (ADT) 可能增加心血管疾病風險，而非減少。", "evidence": "Williams Textbook of Endocrinology, 14th ed., Chapter 24"}, {"year": 109, "no": 129, "stem": "Medullary thyroid cancer (MTC) 可以表現於多發性內分泌腫瘤 (multiple endocrine neoplasia, MEN)，以下哪一項正確？", "choices": {"A": "有MTC家族病史的幼兒，最好在5歲以前接受預防性的甲狀 腺切除手術", "B": "MEN2A 中的 MTC 比 MEN2B中的MTC 更具侵襲性 (more aggressive)", "C": "Calcitonin可以當作 MTC 術前診斷及術後追蹤的tumor marker", "D": "MTC術後再發頸部淋巴腺轉移應該使用放射性碘治療", "E": "MTC若有遠部轉移，其10年存活率約為 50%"}, "answer": "C", "is_endocrine": true, "subtopic": "Thyroid", "explanation": "選項(C)正確。Calcitonin是由甲狀腺濾泡旁細胞分泌，在Medullary thyroid cancer (MTC) 中會過度分泌，因此可作為診斷MTC的腫瘤標記，術後監測其下降程度亦可評估治療反應及偵測復發。選項(A)錯誤，MEN2A的基因檢測結果若為陽性，建議在5歲前進行預防性甲狀腺切除，但非所有有MTC家族史的幼兒。選項(B)錯誤，MEN2B的MTC通常比MEN2A更具侵襲性且預後較差。選項(D)錯誤，MTC對放射性碘治療反應不佳，主要治療方式為手術切除。選項(E)錯誤，MTC遠端轉移的10年存活率約為20-30%，遠低於50%。", "evidence": "Williams Textbook of Endocrinology, 14th ed., Chapter 34"}, {"year": 109, "no": 130, "stem": "近年來，糖尿病之新藥發展迅速，其中SGLT2 inhibitor (鈉-葡 萄糖協同轉運蛋白質 2抑制劑，sodium glucose co-transporter 2 inhibitor)屬於新機轉之藥物。下列的有關SGLT2 inhibitor之敘 述，何者為錯誤？", "choices": {"A": "鈉-葡萄糖協同轉運蛋白質 2抑制劑之基本機轉，與胰島素之 作用無關", "B": "大型糖尿病之預後研究結果顯示，鈉-葡萄糖協同轉運蛋白質 2抑制劑可以減少糖尿病患者發生腦中風", "C": "目前的研究結果顯示，此類藥物臨床上最令人擔心的系統性 副作用為酮酸中毒 (Ketoacidosis)，其致病機轉推論與本項 藥物使用之後，會增加病患血中昇糖激素(glucagon)之濃度", "D": "鈉-葡萄糖協同轉運蛋白質 2抑制劑使用後之體重減輕現 象，主要的原因來自於本項藥品可將血中葡萄糖排除於尿液 中", "E": "鈉-葡萄糖協同轉運蛋白質 2抑制劑的研究發現，本項藥物可 以改善蛋白尿的現象，具有延緩糖尿病腎病變的藥理效應"}, "answer": "B", "is_endocrine": true, "subtopic": "DM", "explanation": "選項(B)錯誤。大型臨床試驗（如EMPA-REG OUTCOME, CANVAS, DECLARE-TIMI 58）顯示SGLT2抑制劑能顯著降低心血管事件（包括心衰竭住院及心血管死亡），但對於腦中風的發生率，其降低效果在不同研究中並未一致顯示顯著減少。選項(A)正確，SGLT2抑制劑作用於腎臟，不依賴胰島素。選項(C)正確，酮酸中毒是罕見但嚴重的副作用，可能與藥物抑制葡萄糖再吸收，導致血糖下降，進而刺激升糖激素分泌有關。選項(D)正確，透過尿液排除葡萄糖可減少熱量攝取，導致體重減輕。選項(E)正確，SGLT2抑制劑能減少蛋白尿，延緩糖尿病腎病變進展。", "evidence": "American Diabetes Association Standards of Medical Care in Diabetes 2023, Section 10"}, {"year": 109, "no": 131, "stem": "台灣老年性糖尿病人口，隨著平均壽命之延長，呈現快速增加 的現象，其中糖尿病腎臟照護，必須重視，下列有關老年性糖 尿病腎臟照護的敘述，何者為錯誤？", "choices": {"A": "老年性糖尿病腎臟病變時，病患貧血的程度、左心室肥大現 象、心血管疾病發生率及死亡率之間，呈現統計學上顯著的 相關性", "B": "雖然糖尿控制指標糖化血色素(HbA1c) 一般建議的標的是 7%，但是針對老年性糖尿病，合併腎病變時，需考慮病患 之身體健康狀況及活動能力，目前老年糖尿病照護之建 議，針對活動力較差之患者，控制標的為HbA1c < 8 %", "C": "老年性糖尿病患者，接受心導管或其他影像學檢查時，顯影 劑可能是造成腎臟功能急速惡化的原因之一", "D": "目前已知的大型臨床研究均顯示，為了降低心血管死亡，以 及預防心血管事件發生，在病患腎功能無虞的前提下，年紀 愈長的糖尿病患，應將HbA1c控制< 6.5%以下，才是長期的 醫療模式", "E": "老年糖尿病, 患腎功能不佳時, 磺脲類藥物(Sulfonylureas)之 使用, 可能是低血糖的重要原因之一"}, "answer": "D", "is_endocrine": true, "subtopic": "DM", "explanation": "選項(D)錯誤。針對老年糖尿病患者，特別是合併多重慢性病或心血管疾病風險高的患者，過度嚴格的血糖控制（如HbA1c < 6.5%）可能增加低血糖風險，反而不利於心血管預防。一般建議應個體化血糖控制目標，對於健康狀況較差者，HbA1c目標可放寬至8%以下。選項(A)正確，貧血、左心室肥大、心血管疾病與老年糖尿病腎病變密切相關。選項(B)正確，考量老年人活動力和共病，HbA1c目標可放寬。選項(C)正確，顯影劑可能引起腎損傷。選項(E)正確，磺脲類藥物代謝途徑受腎功能影響，易致低血糖。", "evidence": "American Diabetes Association Standards of Medical Care in Diabetes 2023, Section 12"}, {"year": 109, "no": 132, "stem": "張老師，48歲 ，身高173公分，體重90公斤，最近兩年，體重 自75公斤增加至目前之體重。無個人或家族之糖尿病史。最近 幾年，好幾次在清晨上班或上課中昏倒，昏倒時意識不清，曾 於轉送急診後，發現血糖值為28mg/dL，在注射50%葡萄糖液 後恢復意識。並未發現神經學異常或糖尿病。本次再度因意識 狀態不清，送至急診就醫，急診血糖值為38 mg/dL，注射葡萄 糖液後恢復意識，清醒後，在急診亦無神經學異常症狀，因此 建議住院進一步追查原因。回門診追蹤時，在接受任何輸液 下，空腹血糖為 98 mg/dL，清晨8點時之ACTH 42.2 pg/mL, Cortisol 21.8 ug/dL, 空腹之Insulin 為 2.12 mIU/mL, C-peptide為  ng/mL, 甲狀腺功能篩檢TSH為 4.20 mIU/mL。請問下一步應該建議那一項檢查？", "choices": {"A": "腹部電腦斷層檢查", "B": "72 小時之 Prolonged fasting test (延長飢餓測試)", "C": "75公克葡萄糖耐受試驗 (Oral glucose tolerance test)", "D": "腦下垂體磁振攝影 (Pituitary MRI)", "E": "Overnight 1mg Dexamathasone suppression測試"}, "answer": "B", "is_endocrine": true, "subtopic": "Pituitary", "explanation": "選項(B)正確。病患反覆發生低血糖（28mg/dL, 38mg/dL）且空腹血糖正常（98mg/dL），合併高ACTH及Cortisol，但Insulin及C-peptide正常，高度懷疑是胰島素自體免疫症候群（Insulin autoimmune syndrome, IAS），又稱Hirata's disease。此症候群的特點是體內產生抗胰島素抗體，進食後抗體釋放胰島素，導致低血糖。延長飢餓測試有助於誘發低血糖並觀察其模式，進一步診斷。選項(A)腹部電腦斷層可能發現胰島素瘤，但此病患的Insulin及C-peptide值不支持。選項(C)葡萄糖耐受試驗在低血糖發作時不適用。選項(D)腦下垂體MRI用於評估腦下垂體功能異常，與此病患情況關聯性較低。選項(E)Dexamethasone suppression test用於評估庫欣氏症候群，與低血糖表現不符。", "evidence": "Williams Textbook of Endocrinology, 14th ed., Chapter 39"}, {"year": 109, "no": 133, "stem": "統計上，台灣目前第二型糖尿病患者達230萬人，除了生活型 態、飲食及運動來預防之外，一旦確診為糖尿病之後，藥物治 療也是非常重要的一環。以下有關糖尿病之敘述，那一些是錯 誤的？ (1) Biguanide之Metformin是台灣及美國建議糖尿病治療的第一 線用藥 (2) 目前國內及美國糖尿病學會之建議，HbA1c (糖化血紅素)之 控制目標應該為 6 % 以下 (3) Sulphonylurea類藥物，容易造成低血糖及體重上升 (4) 胰島素雖然可以迅速降低血糖，但長期使用時，低血糖是常 見之藥物副作用 (5) 新型之糖尿病口服藥物，如DPP-4 inhibitor及SGLT-2 inhibitor，除了降低血糖之外，也有減輕糖尿病患體重的藥理效 應", "choices": {"A": "(1)+(2)", "B": "(2)+(5)", "C": "(3)+(4)", "D": "(2)+(4)", "E": "(4)+(5)"}, "answer": "B", "is_endocrine": true, "subtopic": "DM", "explanation": "選項(B)錯誤。敘述(2)錯誤，目前國內外糖尿病學會建議的HbA1c控制目標通常為7%以下，對於特定族群（如年輕、無共病者）可更嚴格至6.5%以下，但並非所有患者皆需控制在6%以下。敘述(5)錯誤，DPP-4抑制劑和SGLT2抑制劑雖然能有效降低血糖，但其體重影響不同：DPP-4抑制劑通常對體重影響中性或微幅減輕，而SGLT2抑制劑則有較明顯的體重減輕效果。因此，(2)和(5)皆為錯誤敘述。其他敘述正確：(1)Metformin為第一線用藥；(3)Sulfonylurea類藥物易致低血糖及體重上升；(4)胰島素長期使用低血糖是常見副作用。", "evidence": "American Diabetes Association Standards of Medical Care in Diabetes 2023, Section 5"}, {"year": 109, "no": 134, "stem": "2020年之Covid-19 新型冠狀病毒的肆虐，對於糖尿病患而 言，在統計學上，顯然是重大的隱憂，因為糖尿病患罹患新冠 肺炎，產生併發症後之死亡率，明顯高於非糖尿病患者。依 照2020上半年之研究報告，下列有關之因子中何者，並非確認 之疾病惡化風險因子？", "choices": {"A": "年齡愈大的糖尿病患者 (Aging)", "B": "糖尿病患者，合併高血壓，在罹患新冠肺炎前，即已使 用angiotensin-converting enzyme inhibitor (ACEI) 或 Angiotnensin receptor blocker (ARB)，控制高血壓者", "C": "原本即已罹患確診之心臟血管疾病(ASCVD, atherosclerotic cardiovascular disease)者", "D": "Body mass index (BMI) 偏高之肥胖糖尿病患者 (Obesity)", "E": "第一型糖尿病患者 (Type 1 diabetes mellitus)"}, "answer": "B", "is_endocrine": true, "subtopic": "DM", "explanation": "選項(B)正確。研究顯示，使用ACEI或ARB控制高血壓的糖尿病患者，在罹患新冠肺炎後，其疾病惡化風險並未顯著增加，甚至可能有保護作用。因此，這並非確認的疾病惡化風險因子。選項(A), (C), (D), (E)皆為已確認的新冠肺炎重症風險因子，包括年齡增長、已有心血管疾病、肥胖以及第一型糖尿病患者。", "evidence": "American Diabetes Association: COVID-19 and Diabetes. Updated March 2023."}, {"year": 109, "no": 135, "stem": "近年之研究顯示懷孕與糖尿病之關係釐清，是安全成功生育的 關鍵因子之一。孕前未診斷糖尿之婦女，懷孕時產生之血糖異 常為妊娠性糖尿病，雖然產後大多數之婦女，血糖都可以恢復 到正常範圍之內，但仍有35-60%的妊娠性糖尿病婦 女，在10至20年期間仍會進展為真正之糖尿病患。以下有關妊 娠性糖尿病之相關敘述，那一些是錯誤的？ (1) 妊娠性糖尿病的表現，主要與患者胰島素分泌不足 (insulin deficiency) 相關 (2) 妊娠性糖尿病增加的趨勢，與婦女肥胖率的增加密切相關 (3) 妊娠性糖尿病在懷孕之後期孕期時 (late pregnancy)，胰島 素阻抗性會明顯降低，血糖比較容易控制 (4) 在懷孕期間，初次發現之血糖異常，如果符合糖尿病之診 斷，應歸類於真正之糖尿病 (overt diabetes)", "choices": {"A": "(1)+(2)", "B": "(2)+(4)", "C": "(2)+(3)", "D": "(1)+(4)", "E": "(1)+(3)"}, "answer": "E", "is_endocrine": true, "subtopic": "DM", "explanation": "選項(1)錯誤，妊娠性糖尿病(GDM)主要與懷孕期間的胰島素阻抗性增加有關，而非單純的胰島素分泌不足。雖然胰島素分泌會相對增加以克服阻抗，但其絕對量或功能可能不足以維持正常血糖。選項(3)錯誤，GDM在懷孕後期胰島素阻抗性會明顯增加，而非降低，這使得血糖控制更具挑戰性。選項(2)和(4)是正確敘述，GDM的發生率與肥胖率上升密切相關，且初次診斷的血糖異常若符合糖尿病診斷標準，應歸類為真正的糖尿病。", "evidence": "Williams Textbook of Endocrinology, 14th Edition, Chapter 74: Gestational Diabetes Mellitus."}, {"year": 109, "no": 136, "stem": "陳奶奶，78歲，可自由活動，主要照護者為家人，同住。數次 因肺炎或泌尿道感染住院治療，糖尿病病史已10年。目前接受 口服藥物控制血糖，但未規律回診追蹤急篩檢併發症。本次因 肺炎住院，抗生素使用5天後，評估情況穩定，預計2天後出 院。目前生命徵象穩定，入院隨機之HbA1c 為 9.5 %，住院之 第五天晨間空腹血糖為220 mg/dL，當日早餐後兩小時之血糖 為268 mg/dL，肌酸酐為  mg/dL。雖然目前無明顯多尿或其 他不適症狀。就病程發展而言，下列有關治療安排敘述，何者 錯誤？", "choices": {"A": "就住院血糖變化，應建議至少加入basal Insulin針劑類(基礎 胰島素)藥物治療", "B": "建議儘早安排糖尿病視網膜及足部神經學檢查", "C": "建議應安排糖尿病飲食及運動衛教", "D": "未來糖尿病HbA1c指標，控制標的為 < 6.5 % 以下", "E": "建議病患未來應於居家自我監測血糖 (Self Monitoring of Blood Glucose)"}, "answer": "D", "is_endocrine": true, "subtopic": "DM", "explanation": "選項(D)錯誤。對於78歲且有長期糖尿病病史的陳奶奶，其HbA1c為9.5%，且住院期間空腹及餐後血糖偏高，顯示血糖控制不佳。雖然目標血糖應盡量控制，但對於老年人、有共病症、低血糖風險高者，過於嚴格的控制目標（<6.5%）可能不適用，應採個別化目標。其他選項皆為正確的治療建議，包括使用基礎胰島素、進行併發症篩檢、飲食運動衛教及居家血糖監測。", "evidence": "American Diabetes Association (ADA) Standards of Medical Care in Diabetes—2023, Section 5: Facilitating User-Centered Medical Education."}, {"year": 109, "no": 137, "stem": "不論糖尿病或非糖尿病患者，血脂異常的疾病根源在於胰島素 阻抗性(Insulin resistance) 及 脂蛋白 (lipoprotein)的代謝異 常，一般常見的疾病狀態為膽固醇/三酸甘油酯(TG)增加，高密 度脂蛋白 (HDL)減少相關，以下有關血脂異常的疾病狀態敘 述，何者為錯誤的？", "choices": {"A": "血脂異常時，低密度及極低密度脂蛋白(LDL & VLDL)的增加 是重要的致病因子，多與肥胖、胰島素阻抗及遺傳相關，因 此肥胖患者，在減輕體重之後，相關檢查數值都會改善", "B": "遺傳因子(genetic predisposition)及環境因素(environmental contribution)會同時影響病患血脂之變化", "C": "肥胖及胰島素阻抗性增加時，血脂異常的表現經常是TG增 加，但是HDL 降低", "D": "長期攝取高熱量的醣類食物及持續的飲酒，其血脂異常可發 現為增加VLDL及TG，但是降低HDL之血中濃度", "E": "甲狀腺機能不足 (Hypothyroidism) 時，病患之LDL增加，因 為原本甲狀腺素可增加肝臟之LDL受器，降低血中 之LDL，但甲狀腺素不足時，血中之LDL之清除效率也會明 顯下降"}, "answer": "D", "is_endocrine": true, "subtopic": "Lipid", "explanation": "選項(D)錯誤。長期攝取高熱量醣類食物及持續飲酒，確實會增加三酸甘油酯(TG)及VLDL，並可能降低HDL。然而，其主要致病機轉與胰島素阻抗性及肝臟脂肪生成增加有關，而非單純的血脂代謝異常。選項(A)、(B)、(C)、(E)皆為血脂異常的正確敘述，與肥胖、胰島素阻抗、遺傳、環境及甲狀腺功能等因素相關。", "evidence": "Harrison's Principles of Internal Medicine, 21st Edition, Chapter 330: Dyslipidemia."}, {"year": 109, "no": 138, "stem": "胰島素是治療糖尿病，控制血糖的重要針劑藥物，以下有關胰 島素治療的說明及其生理機轉，何者是正確的？", "choices": {"A": "就糖尿病控制血糖而言，比較符合人體生理性需求的胰島素 注射方式是一天一次的基礎胰島素(basal insulin)", "B": "如果需要積極控制血糖時，多次胰島素注射，是達成控制標 的的重要方法，但是需要配合更頻繁之自我血糖監測，未來 的趨勢是連續血糖偵測模式 (continuous glucose monitoring)", "C": "身體胰臟分泌之內源性胰島素，直接分泌進入肝靜脈系 統，但是注射型之外源性胰島素，則在注射後進入全身系統 循環，因此注射之胰島素進入肝臟時，較內源性胰島素進入 肝臟的濃度為高，屬於supraphysiologic insulin level", "D": "就第一型糖尿病之患者而言，每天需要之胰島素注射總 量，一般在 1.5 - 2.0 單位/每公斤/每天 (unit/kg/day) 左右", "E": "GLP-1 RA (Glucgon like peptide-1 receptor agonist) 是一種 基礎胰島素，但是卻沒有傳統胰島素會增加病患體重的副作 用"}, "answer": "B", "is_endocrine": true, "subtopic": "DM", "explanation": "選項(B)正確。當需要積極控制血糖時，例如血糖偏高或有急性併發症時，增加胰島素注射頻率（如多次注射或使用胰島素幫浦）是達成血糖控制目標的有效方法。然而，這需要更頻繁的自我血糖監測來避免低血糖。連續血糖監測(CGM)是未來趨勢，能提供更全面的血糖資訊。選項(A)錯誤，一天一次基礎胰島素僅能模擬基礎分泌，無法完全符合生理需求。選項(C)錯誤，外源性胰島素注射後進入全身循環，肝臟濃度不一定高於內源性。選項(D)錯誤，第一型糖尿病每日胰島素需求量變異大，此範圍僅為參考。選項(E)錯誤，GLP-1 RA為藥物，非基礎胰島素，且可能增加體重。", "evidence": "American Diabetes Association (ADA) Standards of Medical Care in Diabetes—2023, Section 6: Glycemic Targets."}, {"year": 109, "no": 139, "stem": "依照 2017台灣高危險病患血脂治療指引，糖尿病患者以生活型 態及藥物治療為基本標的，下列敘述，何者為錯誤的？", "choices": {"A": "糖尿病患者合併急性冠狀動脈症候群 (acute coronary syndrome)時，低密度脂蛋白 (LDL-C)的控制標的為 < 55 mg/dL", "B": "糖尿病患者高膽固醇血症控制之建議首選藥物為Statins", "C": "糖尿病患者合併心血管疾病風險時，低密度脂蛋白 (LDL-C)的控制標的為 < 70 mg/dL", "D": "40歲以上之糖尿病患者，在無心血管疾病病史時，低密度脂 蛋白 (LDL-C)的控制標的為 < 100 mg/dL", "E": "一般控制原則，40歲以下之糖尿病患者，無論是否有心血管 疾病病史，均不宜使用Statins類藥物控制低密度脂蛋白 (LDL-C)"}, "answer": "E", "is_endocrine": true, "subtopic": "Lipid", "explanation": "選項(A)錯誤。根據2017台灣高危險病患血脂治療指引，糖尿病患者合併急性冠狀動脈症候群時，其低密度脂蛋白(LDL-C)的控制目標應為<70 mg/dL，而非<55 mg/dL。選項(B)、(C)、(D)、(E)皆為指引中關於糖尿病患者血脂治療的正確敘述，包括生活型態調整及藥物治療的建議。", "evidence": "2017台灣高危險病患血脂治療指引."}, {"year": 109, "no": 140, "stem": "一位55歲男性二天前突然右腳踝痛及腫脹，病人有20年抽菸習 慣，偶爾喝酒，二周前並曾有小便微痛及灼熱感，下列檢驗對 病人最有幫助？(1) 抗核抗體 (antinuclear antibody)；(2) 人類 白血球抗原-B27 (HLA-B27)；(3) 尿酸；(4) 抗瓜胺酸蛋白抗體 (ACPA)；(5) 抗嗜中性白血球細胞質抗體 (ANCA)", "choices": {"A": "(1)+(5)", "B": "(1)+(4)", "C": "(2)+(3)", "D": "(2)+(4)", "E": "(3)+(5)"}, "answer": "C", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 109, "no": 141, "stem": "高尿酸血症患者，下列何情況不須以降尿酸藥物治療？", "choices": {"A": "有痛風石", "B": "X-ray有因尿酸破壞關節或骨病變", "C": "經常痛風發作", "D": "血中尿酸大於7mg/dL", "E": "腎臟因尿酸引起之腎病變"}, "answer": "D", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 109, "no": 142, "stem": "全球新冠肺炎病毒 (Covid-19)感染已超過一仟柒百萬人，死亡 人數超過六十八萬(至109年7月)，呼吸衰竭為最大死亡原 因，其肺部病理變化最大特徵為何？", "choices": {"A": "廣泛肺部血管栓塞及肺部微血管病變 (thrombosi rue, "subtopic": "DM", "explanation": "本題主要探討SGLT2抑制劑的作用機轉與臨床效果。正確的敘述是：(3)SGLT2抑制劑的降血糖效果是獨立於胰島素的，因為它們透過抑制腎臟對葡萄糖的再吸收來增加尿糖排出。(4)SGLT2抑制劑會導致體重減輕，這歸因於從尿液中排出葡萄糖所帶走的熱量，以及滲透性利尿作用。選項(1)是錯誤的，SGLT2主要位於近端腎小管，而非遠端腎小管。(2)是錯誤的，SGLT2抑制劑會增加尿中葡萄糖排出量，而非降低。(5)是錯誤的，SGLT2抑制劑（如Empagliflozin和Canagliflozin）已被證實在有糖尿病合併心血管疾病的患者中，能降低心臟衰竭的住院率，而非增加。因此，正確的組合是(3)和(4)。", "evidence": "American Diabetes Association Standards of Medical Care in Diabetes—2023, Section 10: Cardiovascular Disease and Risk Management."}, {"year": 110, "no": 15, "stem": "ST 節段上升型心肌梗塞(ST segment elevation myocardial infarction)病患接受血栓溶解劑的敘述何者錯 誤?", "choices": {"A": "使用血栓溶解劑後,造成梗塞之冠狀動脈如能達TIMI (Thrombolysis in Myocardial Infarction )分類第三 級血流,其預後較佳.相較於streptokinase,使用tPA ( tissue plasminogen activator )能更有效率讓造成 梗塞之冠狀動脈達TIMI 分類第三級血流", "B": "用血栓溶解劑來治療ST 節段上升型心肌梗塞要注意出血的風險,大規模研究(large-scale trials)顯示:相 較於streptokinase,使用tPA治療ST 節段上升型心肌梗塞造成顱內出血之風險明顯降低", "C": "用血栓溶解劑來治療ST 節段上升型心肌梗塞,在70歲以上造成顱內出血的風險約為65歲以下病患 的2倍", "D": "使用streptokinase要注意過敏反應", "E": "用血栓溶解劑來治療ST 節段上升型心肌梗塞要注意病患血壓不能過高(如收縮壓>180 mmHg,舒張 壓>110mmHg)"}, "answer": "B", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 110, "no": 16, "stem": "一位55歲女性病患因端坐呼吸與動喘一週而來住院。身體診察發現血壓90/56毫米汞柱,心跳每分 鐘102下,頸靜脈怒張,心音低遠併第三心音，肺部有囉音，雙下肢小腿與腳部水腫。心電圖如圖一。心臟 超音波呈現左心室擴大,瀰漫性左心室收縮功能異常,左心室射出分率(left ventricle ejection fraction)為25%。心臟磁振造影檢查如圖二A與B。經食道心臟超音波如圖二C與D。請問下列敘述何者錯 誤?(1)該病患的心電圖呈現 low voltage in frontal leads (2)該病患心電圖呈現心房顫動 (3)該病患之心臟磁 振造影影像檢查呈現左心室心肌緻密化不全(left ventricular non-compaction) (4)該病患之心臟磁振造影影 像檢查呈現急性心肌發炎 (5)該病患應使用口服抗凝血劑 (6)這種疾病有時是因肌節(sarcomere)基因異常 引起", "choices": {"A": "(1)+(3)+(6)", "B": "(2)+(3)+(5)", "C": "(2)+(4)", "D": "(2)+(4)+(5)", "E": "(2)+(6)"}, "answer": "C", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 110, "no": 17, "stem": "有關利用心臟再同步化節律器(cardiac resynchronization therapy, CRT)治療低收縮分率心臟衰竭(heart failure with reduced ejection fraction)的敘述,何者正確?", "choices": {"A": "Cardiac Resynchronization in Heart Failure Study (CARE-HF) trial 顯示CRT 不能改善所有原因死亡 率(all cause mortality)", "B": "在心電圖 QRS complex width >149 ms 且合併右束支傳導阻斷患者效果最好", "C": "左右心室的不同步收縮,常導致功能性的主動脈瓣閉鎖不全,進而加重心臟收縮功能異常", "D": "當使用CRT 在這類病人改善左心室收縮分率後,二尖瓣閉鎖不全的嚴重度卻常無法改善", "E": "CRT的左心室導線常經由冠狀靜脈竇(coronary sinus)置放"}, "answer": "E", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 110, "no": 18, "stem": "有關Marfan syndrome的描述,何者錯誤?", "choices": {"A": "當孕婦合併 Marfan syndrome時,如果主動脈根部>40 mm,則主動脈剝離的風險增加", "B": "Marfan syndrome患者使用propranolol來降血壓,無法減緩或預防主動脈擴大", "C": "裂隙燈檢查(slit-lamp examination) 對診斷Marfan syndrome很重要", "D": "心臟超音波檢查對診斷Marfan syndrome很重要", "E": "根據Ghent criteria診斷的Marfan syndrome患者,超過90% 都有FBN1基因的突變"}, "answer": "B", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 110, "no": 19, "stem": "35歲女性疑似縱膈腔腫瘤，因為喘來到胸腔內科門診。肺功能檢查發現 TLC 75%, FRC 100%, RV 120%, FVC 60%, FEV₁ 60%, Raw 1.0, DLco80% (TLC total lung capacity; FRC functional residual capacity; RV residual volume; FVC forced vital capacity; FEV1 forced expiratory volume in 1 s; Raw airway resistance; DLco diffusion capacity of lung for carbon monoxide)，如何解釋她的肺功能?", "choices": {"A": "因為肥胖造成的侷限性肺功能障礙", "B": "因為氣喘造成的阻塞性肺功能障礙", "C": "因為肺氣腫造成的阻塞性肺功能障礙", "D": "因為呼吸肌肉無力造成的侷限性肺功能障礙", "E": "因為肺纖維化造成的侷限性肺功能障礙"}, "answer": "D", "is_endocrine": true, "subtopic": "Other-Endocrine", "explanation": "此題考驗對肺功能檢查結果的判讀。病人為35歲女性，肺功能檢查顯示TLC 75%, FRC 100%, RV 120%, FVC 60%, FEV₁ 60%, Raw 1.0, DLco 80%。其中TLC、FVC下降，而FRC和RV相對於TLC的比例上升，顯示肺容積增加，但總肺容量下降，這符合侷限性肺功能障礙的特徵。DLco正常或輕微下降，排除嚴重的肺纖維化或肺氣腫。Raw正常，排除明顯的氣道阻塞。選項(A)肥胖會導致侷限性肺功能障礙，但此病人BMI未提供，且其他數據更支持其他原因。(B)氣喘是阻塞性肺功能障礙，特徵是FEV1/FVC下降及Raw上升。(C)肺氣腫是阻塞性肺功能障礙，特徵是肺容積擴大(RV, TLC上升)及DLco下降。(E)肺纖維化是侷限性肺功能障礙，但通常伴隨DLco顯著下降。選項(D)呼吸肌肉無力會導致侷限性肺功能障礙，表現為肺容積下降，但可能伴隨呼吸肌力量減弱的臨床表現。在此情況下，肺容積的相對改變（FRC, RV相對於TLC的比例上升）以及TLC和FVC的下降，最符合侷限性肺功能障礙。雖然題目未直接說明呼吸肌肉無力，但這是侷限性肺功能障礙的一種可能原因，且其他選項的解釋與數據不符。此題的關鍵在於區分侷限性與阻塞性肺功能障礙，以及識別導致侷限性肺功能障礙的可能原因。", "evidence": "American Thoracic Society/European Respiratory Society Task Force: Statement on the Global Initiative for Chronic Obstructive Lung Disease (GOLD) guidelines."}, {"year": 110, "no": 20, "stem": "如果把肺部問題分成三部分，阻塞性問題，限制性問題，及肺血管問題。下列何者不屬於限制性問題 (1)類肉瘤(Sarcoidosis) (2)支氣管擴張 (3)重症肌無力(Myasthenia Gravis) (4)慢性肋膜積水 (5)小支氣管炎", "choices": {"A": "(1)+(3)", "B": "(2)+(5)", "C": "(1)+(2)", "D": "(2)+(4)", "E": "(3)+(5)"}, "answer": "B", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 110, "no": 21, "stem": "肺部惡性腫瘤的縱膈腔淋巴結分期，對於治療影響很大。下列敘述對於判斷淋巴結分期何者為非?", "choices": {"A": "正子掃描對於淋巴結分期(分辨良性或惡性淋巴結)的敏感度(sensitivity)超過95%", "B": "縱膈腔鏡是縱膈腔淋巴結分期的標準做法，目前已被支氣管內超音波導引經氣管細針穿刺術(EBUS TBNA)取代", "C": "正子掃描對於良性或惡性淋巴結判別的準確性比不上縱膈腔鏡", "D": "縱膈腔鏡無法取樣肺門淋巴結", "E": "縱膈腔鏡及支氣管內超音波導引經氣管細針穿刺術(EBUS TBNA)皆無法取樣主動脈旁淋巴結(Level 5,6)"}, "answer": "A", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 110, "no": 22, "stem": "35歲女性病人，小時候被診斷為氣喘。最近幾年常常發作，即使用了高劑量吸入性類固醇，長效支氣管擴 張劑，口服類固醇，口服抗白三烯(leukotriene)，仍不時發作。下列哪一種治療方式不適當?", "choices": {"A": "如果病人血液Ig E增加，可以考慮anti-IgE omalizumab", "B": "嗜伊紅性白血球增加，可以考慮cyclosporin A，抑制發炎反應", "C": "重新檢視病人使用藥物的順從性，及吸入型藥物的使用方式", "D": "在沒有嚴重發炎的病人，考慮用支氣管熱成形術來燒灼氣道上的平滑肌", "E": "可以考慮使用theophylline，雖然效果有限"}, "answer": "B", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 110, "no": 23, "stem": "下列對肺癌的描述何者為是?", "choices": {"A": "肺癌的驅動突變(driver mutation)不包括NTRK 基因", "B": "小細胞肺癌都具有P53, RB1的突變", "C": "利用Chest X-ray篩檢肺癌，可以有效降低20%肺癌死亡率", "D": "早期肺癌建議手術治療，如無法手術，可以考慮標靶藥物治療", "E": "對於第三期的病人如果無法開刀，建議同時化學治療及放射治療，並於療程結束後使用免疫治療一 年"}, "answer": "E", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 110, "no": 24, "stem": "72歲男性，肺癌第四期接受免疫治療合併化學治療。因為免疫治療，造成間質性肺病，住院使用高劑量的 類固醇。因為嚴重的運動性呼吸困難，幾乎整天臥床。有一天他的女兒在幫他按摩腿部時，突然血壓飽和 度下降到50%，血壓下降40mmHg，下列何者是造成休克最有可能的原因？", "choices": {"A": "肺動脈栓塞", "B": "心律不整", "C": "過敏性休克", "D": "大量內出血", "E": "敗血症休克"}, "answer": "A", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 110, "no": 25, "stem": "感染SARS-CoV-2的病人死亡率偏高，對於COVID-19重症的病人下列敘述何者為是? (1)沉默缺氧(silent hypoxia)主要是肺栓塞造成，建議常規用抗凝血劑治療 (2)HFNC (high flow nasal cannula)，被稱為救命神器，主要用來降低呼吸肌做工 (3)使用類固醇可以降低死亡率 (4)非侵襲性正壓呼吸器可以常規用來治療COVID-19造成的呼吸衰竭 (5)俯臥通氣(Prone Positioning)可以降低氧氣需求量", "choices": {"A": "(1)+(2)+(3)+(5)", "B": "(3)+(4)+(5)", "C": "(3)+(5)", "D": "(1)+(3)+(5)", "E": "(2)+(3)+(5)"}, "answer": "C", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 110, "no": 26, "stem": "63歲女性病人肺癌第四期正在接受化學治療，最近因喘、肋膜積水增加，住院接受治療。胸部電腦斷層除 了肋膜積水外，也有少量到中量心包膜積水，及心包膜增厚。肋膜積水檢查，淡黃色，滲出 液(exudate)，細胞學檢查無癌細胞，以淋巴球為主。積水培養為結核菌。以下處置何者不適當?", "choices": {"A": "應立即給予抗結核治療", "B": "如果痰液抹片為陰性，不須隔離", "C": "因為多重疾病建議加上vit B6", "D": "心包膜增厚不是結核感染造成，應該接受心包膜切除術，繼續肺癌治療", "E": "因為喘、肋膜積水，及心包膜積水增加，可以是結核感染引起，可以暫停化療，觀察抗結核治療效 果"}, "answer": "D", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 110, "no": 27, "stem": "70歲男性 COPD在門診追蹤治療。在一次重感冒後，病人覺得越來越喘，咳嗽加劇，合併少許黃痰，因 此來到急診。未發作時，最後一次的肺功能FEV₁ 42%。在急診，二氧化碳分壓 (PaCO₂)55mmHg，兩側 瀰漫性喘鳴音，胸部X光無肺炎跡象。請問下一步何者較不適當？", "choices": {"A": "給予廣效性抗生素", "B": "趕快插管使用呼吸器，治療第二型呼吸衰竭", "C": "使用非侵襲性正壓呼吸器", "D": "靜脈注射類固醇", "E": "增加氣管擴張劑的使用"}, "answer": "B", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 110, "no": 28, "stem": "林先生60歲，每天抽一包菸到目前共抽30年。大約半年前開始出現爬樓梯呼吸急促，大約爬到二樓就要 休息。慢慢的連稍微走一點平路都會覺得喘，同時伴隨咳嗽與白痰。他到附近醫院就醫，胸部X光呈現兩 側肺容積與透光度增加。肺功能檢查結果為：FEV₁/FVC=50%，FEV₁為預測值的35%，給予短 效β₂-agonist 15分鐘後FEV₁改善5%。兩個月前還因為喘的症狀急速惡化住院治療一星期，後續可考慮下 列哪些治療方式？(1) 建議戒菸，(2) 給予吸入型Long-acting Muscarinic Antagonists (LAMA)，(3) 合併吸 入型LAMA與Long-acting β₂-agonist(LABA)，(4) 單獨使用吸入型類固醇，(5) 合併吸入 型LAMA，LABA以及吸入型類固醇。", "choices": {"A": "(1)+(2)+(3)", "B": "(1)+(2)+(3)+(4)", "C": "(1)+(2)+(3)+(4)+(5)", "D": "(1)+(2)+(3)+(5)", "E": "(1)+(3)+(4)+(5)"}, "answer": "D", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 110, "no": 29, "stem": "接
