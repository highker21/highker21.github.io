等化學 治療的病人，因為低血鉀而照會你(妳)。病人的檢查數值: albumin 2.9 g/dL, BUN 40 mg/dL, creatinine 2.6 mg/dL, Na 146 mEq/L, K 1.9 mEq/L, Cl 89 mEq/L, Mg 1.7 mg/dL, plasma-osmolality 300 mOsm/kg。arterial blood gas(cannula, 4 L O₂): pH 7.48, PaO₂ 91 mmHg, PaCO₂ 58 mmHg, HCO₃ 40 mEq/L。urine data: Na 34 mEq/L, K 22 mEq/L, Cl 46 mEq/L, urine-osmolality 320 mOsm/kg以下哪些臨 床判讀與敘述是合理的? (1) 低血鉀，可能與Cushing syndrome有關 (2) 如果計算TTKG，應該可排除腎 鉀流失是該病人hypokalemia的主因 (3) 治療上，同時矯正hypomagnesemia，也有助於矯 正hypokalemia (4) ABG 的解讀應是metabolic alkalosis , respiratory adequate compensation (5) ABG 的解讀應是mixed type (metabolic alkalosis + respiratory acidosis)", "choices": {"A": "(1)+(3)+(4)", "B": "(1)+(3)+(5)", "C": "(2)+(3)+(4)", "D": "(2)+(3)+(5)", "E": "(2)+(5)"}, "answer": "B", "is_endocrine": true, "subtopic": "Adrenal", "explanation": "選項(B)正確，包含(1)、(3)、(5)。(1) Cushing syndrome常導致醛固酮分泌增加，引起低血鉀。(3) 低血鎂會影響鉀離子在細胞內的轉運，矯正低血鎂有助於糾正低血鉀。(5) ABG顯示pH 7.48, HCO₃ 40 mEq/L，為代謝性鹼中毒；PaCO₂ 58 mmHg，為呼吸性代償。但同時存在呼吸性酸中毒的表現(PaCO2升高)，因此為混合型。(2) TTKG (Transtubular Potassium Gradient) 計算需排除腎小管對鉀離子的分泌能力，此病人尿液K+濃度相對較高，可能為腎臟鉀流失。(4) ABG應為混合型，非單純代謝性鹼中毒伴呼吸代償。", "evidence": "Williams Textbook of Endocrinology, 14th Edition, Chapter 15: Fluid and Electrolyte Disturbances."}, {"year": 112, "no": 63, "stem": "一位68歲女性因腳踝漸漸水腫惡化而就醫。他表示最近感到非常疲倦。過去3個月中，她體重增加了5公 斤。她每天抽一包香菸已經有30年。她的脈搏為每分鐘75次，血壓為150/94毫米汞柱。檢查發現下肢 有3+凹陷性水腫。神經檢查顯示手指和腳趾震動感受性減弱。實驗室檢查顯示糖化血色素濃度 為8.1％，血清肌酸酐濃度為2.1 mg/dL。排尿時可觀察到明顯液泡沫尿。對腎臟的切片組織樣本最可能顯 示以下哪種情況？", "choices": {"A": "間質炎症", "B": "毛細血管圍繞環狀彎曲", "C": "結節性腎小球硬化", "D": "免疫複合物沉積", "E": "腎小球基底膜分裂"}, "answer": "C", "is_endocrine": true, "subtopic": "DM", "explanation": "選項(C)正確。病患有糖尿病、高血壓、蛋白尿（液泡沫尿）、腎功能異常(Cr 2.1 mg/dL)，且有長期抽菸史，高度懷疑為糖尿病腎病變(diabetic nephropathy)。糖尿病腎病變的典型病理變化為結節性腎小球硬化(Kimmelstiel-Wilson nodules)。關鍵在於臨床表現與病理機轉的連結。選項(A)間質炎症常見於腎盂腎炎。選項(B)毛細血管圍繞環狀彎曲非典型病變。選項(D)免疫複合物沉積常見於自體免疫疾病。選項(E)腎小球基底膜分裂常見於Alport syndrome。", "evidence": "Harrison's Principles of Internal Medicine, 22nd Edition, Chapter 312: Diabetic Kidney Disease."}, {"year": 112, "no": 64, "stem": "64歲男性因右腿劇烈疼痛前往急診室，症狀突然出現並持續了3個小時。過去4個月，他在行走時右小腿 經常抽筋，但從未達到這麼嚴重的程度。他患有第2型糖尿病、高膽固醇血症和高血壓。目前正在使用的 藥物包括胰島素、enalapril、阿斯匹靈和statin。他每天吸食一包香菸已經有30年。他不飲酒。他的脈搏 為每分鐘103下，血壓為136/84毫米汞柱。兩側股動脈脈搏可觸及，但右側膝窩和足脈搏無法觸及。實驗 室檢查結果顯示：Hemoglobin 15.9 g/dL；Blood urea nitrogen (BUN) 34 mg/dL；Blood Glucose 186 mg/dL；Serum Creatinine 2.5 mg/dL。醫生開立要執行右下肢的CT血管攝影。以下哪個是最適當的下一 步處理措施？", "choices": {"A": "給予碳酸氫鈉", "B": "給予甘露醇(mannitol)", "C": "給予離子造影劑", "D": "進行攝影後血液透析", "E": "給予生理食鹽水"}, "answer": "E", "is_endocrine": true, "subtopic": "DM", "explanation": "本題為 acute limb ischemia 題：DM + 高脂 + HT 男性，突發劇烈腿痛 + intermittent claudication 病史 → 周邊動脈栓塞 (acute limb ischemia)。處置遵循 6P (Pain, Pallor, Pulselessness, Paresthesia, Paralysis, Poikilothermia)，緊急 vascular surgery / endovascular intervention + heparin。subtopic DM 為 keyword 誤抓（雖 DM 為 PAD risk factor，但題本身為周邊血管科）。", "evidence": "AHA/ACC PAD Guidelines 2016; Society for Vascular Surgery Critical Limb Ischemia Guidelines"}, {"year": 112, "no": 65, "stem": "ㄧ位75歲的男性因為持續七天的噁心和嘔吐而前往門診治療。過去兩天，他也感到虛弱和疲倦。坐了一段 時間後站起來時，他感到頭暈。他說他比平常更頻繁地去廁所，每次排尿都是「相當多」。他沒有腹 瀉。他有高血壓，過去六個月一直在服用Thiazide類利尿劑。他每天喝9杯水並定時服藥。他身高168公 分，體重90公斤；BMI為32 kg/m2。體溫為36.5°C，脈搏為每分鐘92次，血壓為106/54毫米汞柱。理學 檢查顯示：舌頭變白。用手指捏取手背上的皮膚，皮膚在5秒後會恢復原狀。在精神狀態檢查中，他的說 話速度減慢，對人物、地點和時間有定向感。實驗室檢驗顯示：血清 Na⁺ 152 mEq/L; Cl⁻ 98 mEq/L; K⁺ 3.5 mEq/L; HCO3⁻30 mEq/L; Osmolality 356 mOsmol/kg H2O; HbA1C 10.6%; 尿液Osmolality 410 mOsmol/kg H2O以下哪個解釋最有可能解釋這些發現？", "choices": {"A": "抗利尿激素產生不足", "B": "利尿劑過量", "C": "滲透性利尿", "D": "腸胃液流失", "E": "過量水分攝取"}, "answer": "C", "is_endocrine": true, "subtopic": "DM", "explanation": "該患者表現出明顯的脫水症狀（噁心、嘔吐、虛弱、頭暈、舌頭變白、皮膚彈性變差）和高鈉血症（血清Na⁺ 152 mEq/L），尿液滲透壓（410 mOsmol/kg H2O）高於血清滲透壓（356 mOsmol/kg H2O），但不足以完全濃縮尿液以對應如此高的血鈉。這提示身體試圖排出過多的溶質，最常見的原因是滲透性利尿。患者有第2型糖尿病（HbA1C 10.6%），高血糖可引起滲透性利尿，導致水分流失和相對性高鈉血症。Thiazide類利尿劑可能加劇脫水，但滲透性利尿是更直接的解釋。抗利尿激素產生不足（DI）會導致尿量過多且尿滲透壓低。利尿劑過量可能導致低鈉血症或脫水，但在此情況下高鈉血症更為明顯。腸胃液流失通常導致低鈉血症。過量水分攝取會導致低鈉血症。", "evidence": "Williams Textbook of Endocrinology, 14th Edition, Chapter 14: Disorders of the Posterior Pituitary and Water Balance."}, {"year": 112, "no": 66, "stem": "62歲男性因為持續8小時的上腹疼痛惡化而被送往醫院。他患有骨關節炎、高血脂和高血壓。目前正在使 用的藥物包括依enalapril, simvastatin和需要時的非處方ibuprofen治療。他的生命徵象在正常範圍內。體 溫為38.2°C，脈搏為每分鐘96次，呼吸頻率為每分鐘22次，血壓為130/86毫米汞柱。腹部檢查顯示右上 腹部壓痛，輕度腹部肌肉防衛性地收縮；沒有反彈性壓痛或僵直。其他檢查，包括神經檢查，均未發現異 常。腹部超音波檢查確診為急性結石性膽囊炎。開始靜脈輸液和鎮痛治療。開始使用針劑環孢靈類抗生素 治療並計劃在近日進行腹腔鏡膽囊切除術。實驗室檢驗顯示：Hemoglobin 15.5 g/dL; WBC 13,000/mm³; Platelet count 310,000/mm³ Serum Na⁺ 138 mEq/L; K⁺ 5.8 mEq/L; Cl⁻ 100 mEq/L; HCO³⁻ 22 mEq/L; Urea nitrogen 13 mg/dL; Creatinine 1.0 mg/dL。心電圖顯示正常的竇性節律且無急性異常。重複血清檢 查顯示鉀濃度為5.8 mEg/L。下列哪一項是處理這位患者高血鉀的最適當下一步措施？", "choices": {"A": "維持液體療法", "B": "碳酸氫鈉療法", "C": "胰島素和葡萄糖療法", "D": "血液透析", "E": "葡萄糖酸鈣療法"}, "answer": "A", "is_endocrine": true, "subtopic": "DM", "explanation": "該患者的血清鉀離子濃度為5.8 mEq/L，屬於高血鉀。高血鉀的處理原則是保護心臟、降低血鉀以及移除鉀離子。在急性處理中，若無明顯心電圖異常，維持靜脈輸液是基礎支持療法，但對於降低血鉀效果有限。碳酸氫鈉療法適用於代謝性酸中毒合併高血鉀，但此患者無明顯酸中毒。胰島素和葡萄糖療法能將鉀離子轉移至細胞內，快速降低血鉀，是緊急處理高血鉀的常用方法。葡萄糖酸鈣療法用於穩定心肌細胞膜，預防心律不整，但不能降低血鉀。血液透析是移除鉀離子的有效方法，但通常用於嚴重或對藥物治療無反應的高血鉀，或合併嚴重腎衰竭的患者。在此情況下，患者僅有輕度腎功能異常，且血鉀為5.8 mEq/L，胰島素和葡萄糖療法是更適當的下一步措施。", "evidence": "Harrison's Principles of Internal Medicine, 21st Edition, Chapter 340: Disorders of Potassium and Magnesium."}, {"year": 112, "no": 67, "stem": "這位55歲的女性患有第二型糖尿病但控制不良，因為有嚴重疼痛和水泡性皮疹的症狀，來到急診。皮疹從 右額頭開始，接下來的兩天擴散到胸部、背部和雙側上肢。她被診斷為散在性皮膚帶狀疱疹，並因此住院 接受抗病毒治療。入院前，她唯一使用的藥物是胰島素。住院第二天，她開始出現雙側間歇性的腰痛和噁 心。她的體溫為36.7°C，脈搏為每分鐘80次，血壓為128/76毫米汞柱。檢查顯示額頭、胸部和四肢的皮 疹正在癒合，沒有新的水泡出現。她的血清尿素氮為33 mg/dL，血清肌酸酐為3.5 mg/dL。入院時，她的 血清尿素氮為18 mg/dL，血清肌酸酐為1.1 mg/dL。下列哪個是導致這位患者實驗室結果異常的最可能原 因？", "choices": {"A": "葡萄糖化腎小球基底膜", "B": "輸尿管腎盂交界阻塞", "C": "腎乳頭凝固性壞死", "D": "腎小管阻塞", "E": "供應入球小動脈收縮"}, "answer": "D", "is_endocrine": true, "subtopic": "DM", "explanation": "該患者在住院期間出現急性腎損傷（血清肌酸酐從1.1 mg/dL上升至3.5 mg/dL，血清尿素氮從18 mg/dL上升至33 mg/dL），伴隨腰痛和噁心。其病史中有糖尿病，且皮疹擴散至全身，診斷為帶狀疱疹。帶狀疱疹病毒感染可能引起腎臟併發症。腎乳頭凝固性壞死（Renal papillary necrosis）是糖尿病患者常見的腎臟併發症，尤其是在使用非類固醇消炎止痛藥（NSAIDs）或合併感染時。患者雖然沒有明確使用NSAIDs，但糖尿病本身就是危險因子，且病毒感染可能誘發此情況。腎乳頭壞死會導致腎小管阻塞，進而引起急性腎損傷。葡萄糖化腎小球基底膜和糖尿病腎病症候群是慢性病變。輸尿管或腎盂阻塞通常表現為腎水腫。供應入球小動脈收縮可能導致腎前性腎衰竭，但在此情況下，腎小管阻塞更符合臨床表現。", "evidence": "Williams Textbook of Endocrinology, 14th Edition, Chapter 34: Diabetes Mellitus and Complications."}, {"year": 112, "no": 68, "stem": "一位50歲的女性前來接受醫生的追蹤檢查。兩週前，由於血壓持續升高，她的抗高血壓藥物中增加處 方irbesartan。在上一次就診時，她的完整血液計數和腎功能測試都在參考範圍內。在過去一個月中，她 一直感到疲倦並頻繁頭痛。她患有高血壓、第2型糖尿病、多囊卵巢綜合症和高脂血症。她的母親患有甲 狀腺亢進和高血壓。目前正在使用的藥物包括amlodipine, hydrochlorothiazide, irbesartan, metformin, glimepiride及atorvastatin。她從未吸煙，每晚晚餐時飲用一到兩杯紅酒。她身高167公分，體重82公 斤；BMI為30 kg/m2。她的脈搏為每分鐘90次，呼吸為每分鐘12次，兩臂的血壓為170/110毫米汞柱。身 體檢查未顯示異常。實驗室檢查結果如下： Hb：14 g/dL；WBC：7,800/mm³ 。血清： Na⁺：139 mEq/L；K⁺：3.2 mEq/L; Cl⁻：100 mEq/L; 肌酸酐：2.1 mg/dL; 尿素氮：44 mg/dL； TSH：3 μU/mL。 尿液： 潛血：陰性; 蛋白質：陰性; 葡萄糖：1+。以下哪個是最有可能的診斷？", "choices": {"A": "阻塞性睡眠呼吸中止症候群", "B": "甲狀腺亢進", "C": "腎動脈狹窄", "D": "多囊腎", "E": "糖尿病腎病症候群"}, "answer": "C", "is_endocrine": true, "subtopic": "DM", "explanation": "該患者有難以控制的高血壓（170/110 mmHg），儘管使用了多種降壓藥物，包括血管張力素受體阻斷劑（irbesartan）和利尿劑（hydrochlorothiazide）。實驗室檢查顯示血清鉀離子偏低（3.2 mEq/L）和血清肌酸酐升高（2.1 mg/dL），尿液檢查有葡萄糖陽性。這些發現高度懷疑腎動脈狹窄，特別是當患者同時使用血管張力素轉化酶抑制劑（ACEI）或血管張力素受體阻斷劑（ARB）時，可能導致血鉀下降和腎功能惡化。儘管患者有糖尿病，但糖尿病腎病症候群通常表現為蛋白尿，且腎功能惡化速度可能較慢。阻塞性睡眠呼吸中止症候群可能導致高血壓，但通常不直接引起腎功能惡化和低血鉀。甲狀腺亢進可能導致高血壓，但TSH正常。多囊腎通常有家族史且伴有腎臟囊腫。", "evidence": "Harrison's Principles of Internal Medicine, 21st Edition, Chapter 307: Renovascular Hypertension."}, {"year": 112, "no": 69, "stem": "66歲的男性因疲倦和下肢腫脹已兩週而來就醫。在過去的6個月中，他體重減輕了3.8公斤。他患有慢性支 氣管炎，需要使用albuterol吸入劑。他每天抽一包香煙已經持續近50年，並且每天飲烈酒一杯。他的體溫 為37°C，脈搏為88次/分，血壓為120/75 mm Hg。他看起來很瘦。理學檢查發現兩側的脛骨前水腫 達2+級。心肺檢查未見異常。實驗室檢查結果如下：血色素 11.2 g/dL；白細胞計數 8500/mm³ 血小板計 數 130,000/mm³。血清檢驗顯示：尿素氮 23 mg/dL；葡萄糖 77 mg/dL；肌酸酐 1.6 mg/dL；白蛋白 1.8 mg/dL；總膽固醇 475 mg/dL。尿液檢驗顯示：潛血 ：陰性；葡萄糖 陰性, 蛋白質 4+； 白血球 0–1/HPF, Fatty casts 多量. 胸部X光顯示右上葉密度增加。胸部CT顯示一個2.5 x 3.5 x 2公分的右上葉腫塊。 以下哪種診斷最有可能？", "choices": {"A": "局部結節性腎小球硬化症 （Focal segmental glomerulosclerosis）", "B": "IgA腎病 （IgA nephropathy）", "C": "膜增生性腎小球腎炎 （Membranoproliferative glomerulonephritis）", "D": "快速進展性腎小球腎炎 （Rapidly  4200 mL)且尿滲透壓小於250 mosmol/L", "B": "病人有尿崩症，且其plasma arginine vasopressin (AVP) < 1 pg/mL，應該安排腦下垂體核磁共振檢 查", "C": "尿崩症的病人如果其腦下垂體核磁共振影像顯示其後葉有白白亮點，一定是中樞性尿崩症 (central DI)", "D": "懷疑有尿崩症的病人在做限水測試時，尿量減少，尿滲透壓增加，此病人比較像是中樞性尿崩症 (central DI)", "E": "腎源性尿崩症(nephrogenic DI)應該使用desmopressin (DDAVP)治療"}, "answer": "B", "is_endocrine": true, "subtopic": "Pituitary", "explanation": "尿崩症（DI）的診斷與治療選項中，選項(B)是正確的。當患者有尿崩症的臨床表現，且血漿血管加壓素（AVP）濃度極低（<1 pg/mL），這強烈提示中樞性尿崩症（central DI），此時應安排腦下垂體核磁共振檢查以評估腦下垂體或下視丘病變。選項(A)關於尿量的定義不夠精確，且尿滲透壓應小於血漿滲透壓。選項(C)後葉的白點（bright spot）在MRI上可能代表正常儲存AVP，不一定等於中樞性DI。選項(D)限水測試中尿量減少且尿滲透壓增加，表示腎臟對AVP有反應，更傾向於中樞性DI，但題目描述的反應強度不足以完全排除腎源性DI。選項(E)腎源性DI對DDAVP無反應，需使用其他藥物。", "evidence": "Williams Textbook of Endocrinology, 14th Edition, Chapter 14: Disorders of the Posterior Pituitary and Water Balance."}, {"year": 112, "no": 79, "stem": "一位28歲男性職業軍人因為下背痛有5年時間，在早晨睡醒後特別厲害早上僵硬會持續2小時，但運動後 下背痛會改善，使用消炎藥後會有一點改善，此外沒有任何關節問題，雙親沒有特別疾病，但叔父也有長 期下背痛。理學檢查：沒有特別不正常，除向前及向後彎腰有一些限制及下背壓痛外，實驗室檢查顯 示：紅血球下降速度(ESR)48mm/h，HLA-B27(人類白血球抗原-B27)陰性，下列檢查是最適當", "choices": {"A": "骨氏髂關節(sacroiliac joint)電腦斷層(CT)檢查", "B": "骨氏髂關節(sacroiliac joint)核磁共振(MRI)檢查", "C": "骨閃爍顯影檢查(bone scan)", "D": "超音波檢查(ultrasonography)", "E": "關節組織切片檢查(join biopsy)"}, "answer": "B", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 112, "no": 80, "stem": "冷凍沈澱(Cryoprecipitate)可用於治療何種病人？ (1) Hypofibrinogenemia (2) Hypoalbuminemia (3) Hemophilia A (4) von Willebrand disease", "choices": {"A": "(1)+(2)", "B": "(1)+(3)", "C": "(1)+(2)+(3)", "D": "(1)+(3)+(4)", "E": "(1)+(2)+(3)+(4)"}, "answer": "D", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 112, "no": 81, "stem": "庫賈氏病(Creutzfeldt-Jakob disease; CJD) 在1920年代初期首先被報導，為一種相當罕見的疾病。下列 敘述，何項組合最正確?(1)致病原Prion不是傳統的細菌或病毒等病原，也不具核酸，但卻有感染力，但僅 限於同種動物間才可傳染。(2)臨床症狀包括記憶喪失及混淆、慢性痴呆化、運動神經失調、及喪失語言 能力。(3)人的新型庫賈氏病(new variant CJD, v-CJD)與牛海綿狀腦病(Bovine spongiform encephalopathy; BSE)有高度相關。此類患者發生年齡較散發型庫賈氏病年輕。(4)照顧病患基本上不需 要特別隔離, 只需以一般防護再加上正確的消毒。(5)感染性的變性蛋白質對一般常用的物理或化學方法有 很強的抵抗性，必須使用紫外線、輻射照射及消毒劑來消毒。", "choices": {"A": "(2)+(3)+(4)", "B": "(2)+(3)+(5)", "C": "(1)+(2)+(3)+(5)", "D": "(2)+(3)+(4)+(5)", "E": "(1)+(2)+(3)+(4)+(5)"}, "answer": "A", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 112, "no": 82, "stem": "下列有關A型肝炎的敘述，何者正確?", "choices": {"A": "A型肝炎病毒是一種無套膜、單股去氧核糖核酸(DNA)病毒，酒精可以消毒A型肝炎病毒污染的表 面", "B": "主要是經由糞口途徑傳播，因此會經由攝入受污染的食物或水而感染，也會經由性接觸傳染", "C": "臨床症狀包括全身倦怠不適、食慾不振、嘔吐、噁心、黃疸等，但不會發燒", "D": "A型肝炎不會導致慢性肝炎，但是大多數的病患在症狀消退或出現黃疸1週後仍具高傳染力", "E": "A型肝炎疫苗的效果佳，僅須完成一劑疫苗接種即可提供長期的保護力"}, "answer": "B", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 112, "no": 83, "stem": "近年來抗藥性細菌的問題引起各國政府重視，尤其以ESKAPE這些菌最為棘手。下列敘述，何項組合最正 確?(1) MRSA多以院內感染為主，社區型感染不需考慮MRSA。(2) Linezolid為抑菌型抗生素，所以不適 合用於治療VRE (vancomycin-resistant Enterococcus)引起之菌血症。(3)由於抗藥性細菌盛行率節節高 升，即便社區型感染還是得使用後線抗生素治療，以免治療失敗。(4)畜牧業使用抗生素，與人類得到抗 藥性細菌感染有關係。(5)在台灣carbapenem-resistant Klebsiella pneumoniae (CRKP)主要與碳青黴烯類 酶OXA-48有相關。", "choices": {"A": "(1)+(3)", "B": "(1)+(2)+(3) +(4)", "C": "(2)+(4)", "D": "(2)+(4)+(5)", "E": "(4)+(5)"}, "answer": "E", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 112, "no": 84, "stem": "某特殊單位在員工年度體檢須對結核感染(潛伏性)進行篩檢，其中一位62歲員工一年前曾患膀胱癌並 以BCG 治療，最近膀胱鏡檢查並無活動性膀胱癌之證據，也沒有呼吸道或全身性症狀。身體診察生命徵 象和心肺都無異常。請問此時那一項檢查最適當?", "choices": {"A": "CXR", "B": "Tuberculin skin test", "C": "Interferon-γ release assay", "D": "Two-step tuberculin skin testing", "E": "以上皆是"}, "answer": "C", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 112, "no": 85, "stem": "有關penicillin過敏，以下敘述何者錯誤？", "choices": {"A": "越來越多研究認為多數註記為penicillin過敏反應的病人並沒有真正過敏，而且penicillin過敏反應會隨 著時間過去而降低其產生過敏反應的機會，因此病史詢問、重新評估和正確註記很重要", "B": "曾被註記為penicillin過敏的病人因治療會接受更多vancomycin、fluoroquinolone或clindamycin等抗 生素，而增加多重抗藥菌感染率及手術傷口感染的機會", "C": "大多數對penicillin過敏的病人並非對完整藥物分子過敏，而是對體內penicillin降解物與白蛋白共價連 接產物過敏，以藥物溶液進行皮膚測試不足以識別大多數病人的過敏", "D": "目前國內臨床病人處置以病史為主，若無penicillin過敏病史，於符合適應症時可以直接使 用penicillin，並不須以藥物溶液進行皮膚測試;惟完備急救設備藥物和人員環境是所有醫療院所之基本 法規要求", "E": "若病史有中度或高度penicillin過敏反應風險者，建議以藥物溶液逕行進行皮膚測試"}, "answer": "E", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 112, "no": 86, "stem": "SARS-CoV-2感染及其治療，以下敘述何者錯誤？", "choices": {"A": "自2022年1月至2023年3月，我國公布1010萬本土確診個案中，約16%為60歲以上。依WHO嚴重度 分類為嚴重肺炎或ARDS個案占0.4%，其中58% 為大於60歲", "B": "口服抗病毒Molnupiravir是一種核苷類似物，使病毒RNA複製時不斷累積突變，導致無法完全複製而 自行消失", "C": "Paxlovid (Nirmatrelvir/ritonavir)能阻止病毒蛋白酶複製，ritonavir是肝cytochrome P450 3A4的強抑制 劑，可減緩Nirmatrelvir被cytochrome P450代謝，而增強其抗病毒作用", "D": "Paxlovid和molnupiravir對不須用氧氣且具重症風險因子之SARS-CoV-2感染者可降低其死亡率及後續 住院率", "E": "長效單株抗體藥Tixagevimab + cilgavimab對SARS-CoV-2 α, β, γ, δ及omicron最近subvariant XBB 和BQ.1.1 都一直具有很好的中和效果"}, "answer": "E", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 112, "no": 87, "stem": "我國防治愛滋病強調正確使用保險套等安全性行為、篩檢及暴露愛滋病毒前預防性投藥(PrEP) 。惟性行 為傳染的梅毒、淋病和砂眼披衣菌感染仍逐漸增加。關於披衣菌和淋菌，下列何者錯誤?", "choices": {"A": "披衣菌感染常無症狀，而造成子宮外孕、不孕和慢性骨盆腔疼痛症", "B": "在美國建議懷孕時、年輕女性有風險因子和男男性行為者需每年篩檢披衣菌和淋菌", "C": "淋菌可造成子宮頸炎、骨盆腔炎、尿道炎和副睪丸炎，也可造成咽炎和腔門直腸感染", "D": "瀰漫性淋菌感染主要以關節炎和皮膚炎或化膿性關節炎表現", "E": "核酸檢驗 (NAAT)對披衣菌和淋菌的檢驗敏感性不如培養和格蘭氏染色"}, "answer": "E", "is_endocrine": true, "subtopic": "Reproductive", "explanation": "選項(E)是錯誤的。核酸檢驗（NAAT）是目前診斷披衣菌和淋菌感染最敏感和特異的方法，其敏感性遠高於傳統的培養和格蘭氏染色。培養雖然是診斷淋菌的金標準之一，但操作較複雜且耗時，對披衣菌的敏感性不如NAAT。格蘭氏染色僅對診斷淋菌有一定價值，但對披衣菌無效，且敏感性較低。披衣菌感染常無症狀，可能導致不孕和骨盆腔疼痛。淋菌感染可引起多種部位的感染，包括泌尿生殖道、咽喉和直腸。瀰漫性淋菌感染可能表現為關節炎和皮膚炎。因此，NAAT是首選的診斷工具。", "evidence": "Centers for Disease Control and Prevention (CDC) Sexually Transmitted Infections Treatment Guidelines, 2021."}, {"year": 112, "no": 88, "stem": "困難梭狀桿菌(Clostridium difficile)感染是醫療照護機構相關大腸炎最重要的原因。以下敘述何者錯誤?", "choices": {"A": "無症狀帶菌者可經由口糞傳播途徑散播細菌或孢子", "B": "帶手套、不使用污染的溫度計及以漂白水清潔消毒病人住房環境可預防困難梭狀桿菌傳播", "C": "以酒精性乾洗手或濕洗手都可以有效預防傳播", "D": "抗生素使用是增加困難梭狀桿菌感染風險重要的因素，尤其是對腸道厭氧菌很有效但對困難梭狀桿菌 無效者如clindamycin", "E": "減少第二、三代頭孢子素使用也降低困難梭狀桿菌感染風險"}, "answer": "C", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 112, "no": 89, "stem": "下列疫苗組合選項，何者皆為活性疫苗，不建議接種於嚴重免疫不全病人?(1)TdaP(破傷風、白喉、百日 咳混合疫苗) (2)MMR(麻疹、腮腺炎、德國麻疹混合疫苗) (3)HPV(人類乳突病毒疫苗) (4)Varicella-Zoster(帶狀皰疹疫苗，Zostavax®) (5)Meningococcal vaccine(腦膜炎雙球菌疫苗)", "choices": {"A": "(1)+(3)+(5)", "B": "(2)+(4)", "C": "(1)+(2)+(3)", "D": "(2)+(3)+(5)", "E": "(4)+(5)"}, "answer": "B", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 112, "no": 90, "stem": "有關社區性金黃色葡萄球菌肺炎(Community-acquired MRSA pneumonia)之臨床表徵及微生物特性，下 列敘述何者最不適當?", "choices": {"A": "胸部X光顯示開洞浸潤(cavitary infiltrate)或壞死(necrosis)", "B": "可能同時合併流感(concurrent influenza)", "C": "出現咳血(gross hemoptysis)、皮疹(erythematous rash)", "D": "易發生於年長者 (elderly)，年輕健康(young, previously healthy)族群十分少見", "E": "Oxacillin呈現抗藥性，clindamycin可做為輔助治療藥物"}, "answer": "D", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 112, "no": 91, "stem": "有關社區性肺炎感染致病原與宿主因素之關聯，下列何者最不適當?", "choices": {"A": "酒癮(alcoholism)- Klebsiella pneumoniae", "B": "慢性肺病(COPD) – Pseudomonas aeruginosa", "C": "支氣管擴張症(bronchiectasis) – Staphylococcus aureus", "D": "流感併發症(influenza) – Streptococcus pneumoniae", "E": "接觸鳥禽(birds) – Coxiella burnetii (Q fever)"}, "answer": "E", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 112, "no": 92, "stem": "一位30歲男性，因發生急性腹瀉併有血便(dysentery)至急診就醫，其可能致病原的組合，下列選項何者最 為適當？(1) Staphylococcus aureus (2) Salmonella typhi (3) Enterotoxigenic E.coli (4) Campylobacter jejuni (5) Bacillus cereus", "choices": {"A": "(1)+(2)+(3)", "B": "(2)+(4)", "C": "(1)+(3)+(5)", "D": "(2)+(3)", "E": "(1)+(5)"}, "answer": "B", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 112, "no": 93, "stem": "有關動物咬傷與感染致病原之配對，下列何者最不適當？", "choices": {"A": "狗(Dog)–Pasteurella multocida", "B": "人(Human)–viridans streptococci", "C": "猴(Monkey)–Streptobacillus moniliformis", "D": "蛇(Snake)–Pseudomonas aeruginosa", "E": "鼠(Rodent)–Leptospira"}, "answer": "C", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 112, "no": 94, "stem": "有關在血液幹細胞移植後(Hematopoietic Stem Cell Transplant)早期(<1個月)發生的感染，下列何者致病 原之選項最不適當？", "choices": {"A": "Pseudomonas aeruginosa", "B": "Herpes simplex virus", "C": "Cytomegalovirus (CMV)", "D": "Candida albicans", "E": "Clostridium difficile"}, "answer": "C", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 112, "no": 95, "stem": "下列之抗生素選項，何者無法治療李斯特菌(Listeria monocytogenes)感染？", "choices": {"A": "Ampicillin", "B": "Ceftriaxone", "C": "Vancomycin", "D": "Linezolid", "E": "TMP-SMX(Trimethoprim-Sulfamethoxazole)"}, "answer": "B", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 112, "no": 96, "stem": "以下針對猴痘(Monkeypox)的敘述，何者最不適當?", "choices": {"A": "猴痘病毒屬於痘病毒科(Poxviridae)，正痘病毒屬(Orthopoxvirideae)，為雙股DNA病毒(dsDNA)", "B": "接種天花(smallpox)疫苗，可對猴痘產生部分免疫力", "C": "主要藉由齧齒類動物及靈長類動物傳播給人，屬人畜共通傳染病(zoonosis)", "D": "前驅症狀，如發熱、頭痛、疲倦，約維持1至4天", "E": "發疹(皮膚病灶)係由四肢向臉部及軀幹中心蔓延(centripetal)"}, "answer": "E", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 112, "no": 97, "stem": "有關成人生長激素缺乏(Adult growth hormone deficiency)的治療，那一項描述不正確?", "choices": {"A": "診斷確定後應給予生長激素治療，生長激素的起始劑量約為每日0.1-0.2mg，逐漸調整至最大劑量每 日1.25mg，維持類胰島素成長因子1(IGF-1)血清濃度在符合年齡與性別的參考值中間", "B": "生長激素治療劑量一般男性多於女性、年長者多於年輕人", "C": "使用生長激素治療的禁忌症包括腫瘤、顱內高血壓、不易控制的糖尿病及視網膜病變等", "D": "長期使用生長激素治療會增加高密度脂蛋白(high-density lipoprotein)，但總膽固醇及胰島素不會有明 顯的改變", "E": "第二型糖尿病患者使用生長激素治療初期可能會增加胰島素阻抗，在小心監控及適當調整劑量下，長 期使用生長激素可以減少腹部脂肪並改善血糖控制"}, "answer": "B", "is_endocrine": true, "subtopic": "DM", "explanation": "B 錯：成人 GH 缺乏症治療劑量「女性多於男性、年輕多於年長」(estrogen 增加 GH 阻抗使女性需求更高，年長 IGF-1 自然下降故劑量降低)。A 對：起始 0.1-0.2 mg/日、目標 IGF-1 在 normal 中位區。C 對：禁忌包括 active malignancy、顱內高壓、不穩 DM/糖尿病視網膜病變。D 對：HDL 上升但 total cholesterol 變化有限。E 對：T2DM 初期 insulin resistance ↑、長期改善 abdominal fat 與血糖控制。", "evidence": "Endocrine Society Clinical Practice Guideline for GH Use in Adults and Transition Patients 2011; AACE 2019 Update"}, {"year": 112, "no": 98, "stem": "腎上腺皮質刺激素依賴型庫欣氏症候群(ACTH-dependent Cushing's syndrome)的病因包括腦垂 體ACTH分泌瘤(以下簡稱腦垂體瘤)或異位性 ACTH(以下簡稱異位性)，下列有關其鑑別診斷的描述, 那一 項正確?(1)腦垂體瘤男性多於女性;異位性女性多於男性。(2)腦垂體瘤的病程通常進展較緩慢;異位性通常 病程進展快且常見嚴重肌病變(myopathy)。(3)約有45%的腦垂體瘤病人血鉀濃度低於3.3 mEg/L;約 有55%的異位性病人血鉀濃度低於3.3 mEg/L。(4)雖然異位性病人的ACTH平均濃度約為腦垂體瘤病人 的8倍，但因為重疊性高，ACTH濃度仍無法區別這兩種病因。(5)下岩樣竇採樣(Inferior petrosal sinus sampling, IPSS)檢查時，腦垂體瘤病人可見基礎IPSS與周圍靜脈之ACTH值之比>2,，注射促腎上腺皮質 激素釋放激素(corticotropin releasing hormone, CRH)後，IPSS與周圍靜脈之ACTH 值之比>3。這個檢查 的敏感度>95%。", "choices": {"A": "(1)+(2)", "B": "(2)+(4)", "C": "(2)+(4)+(5)", "D": "(1)+(3)+(4)", "E": "(3)+(5)"}, "answer": "C", "is_endocrine": true, "subtopic": "Pituitary", "explanation": "C 對。(2) 對：pituitary Cushing 病程慢、ectopic ACTH (小細胞肺癌、carcinoid) 進展快、嚴重肌病變、色素沉著。(4) 對：ectopic 平均 ACTH 約為 pituitary 8 倍但個別重疊，single value 無法絕對區分。(5) 對：IPSS 基線比 >2、CRH 後 >3，sensitivity >95%。(1) 錯：性別比應為「pituitary 女多於男 (8:1)；ectopic 男多於女」。(3) 錯：應為 pituitary 10-30% 低血鉀、ectopic 70-100% 低血鉀 (mineralocorticoid 過量)。", "evidence": "Williams Endo 14e, Ch 15 Cushing's; Endocrine Society Cushing's Syndrome Treatment Guideline 2015"}, {"year": 112, "no": 99, "stem": "原發性皮質醛酮症((primary aldosteronism), PA)的篩檢與診斷，哪一項最正確?(1)檢測皮質醛酮-腎素 比(aldosterone-to-renin ratio, ARR)前需先矯正低血鉀並停用spironolactone兩週。(2)乙型抑制 劑(β-Blockers)會使renin下降、aldosterone上升、ARR上升。初步的ARR若不確定(為equivcal result)時，最好停用β-Blockers二週後再重複檢測。(3)做生理食鹽水輸注測試(saline infusion test)，在4小時內以靜脈輸注2L的生理食鹽水，若aldosterone為10ng/dL(280 pmol/L) 可以排除PA。(4)經 過ARR檢測、saline infsion test等confirmation tests確認有PA，若電腦斷層檢查發現有單側腎上腺腫瘤 時，小於40歲以下的病人最好再做腎上腺靜脈取樣檢查(adrenal vein sampling)，而40歲以上病人應該建 議單側腎上腺切除。(5)經過ARR檢測、saline infusion test等confirmation tests確認有PA，若電腦斷層檢 查發現兩側腎上腺有小結節性增生(bilateral micronodular hyperplasia)應該使用鹽皮質激素受 體(mineralocorticoid recepter)抑制劑或鈉離子通道阻斷劑(sodium channel blocker)等藥物治療。", "choices": {"A": "(1)+(2)+(3)", "B": "(2)+(4)", "C": "(1)+(3)+(5)", "D": "(2)+(5)", "E": "(1)+(3)+(4)"}, "answer": "D", "is_endocrine": true, "subtopic": "Adrenal", "explanation": "D 對。(2) 對：β-blocker 抑制 renin → renin 下降 → ARR 假性上升，應停藥 2 週後重測。(5) 對：bilateral hyperplasia 的 PA 應藥物治療 (spironolactone/eplerenone = MR antagonist) 或 amiloride (sodium channel blocker)。(1) 錯：spironolactone 應停用「4-6 週」而非 2 週。(3) 錯：saline test 後 aldosterone <5 ng/dL 才排除 PA，10 ng/dL 屬 indeterminate。(4) 錯：所有 <35-40 歲 PA + 單側腫瘤 + biochemistry 典型者「可直接手術」不需 AVS；>35 歲反而 AVS 必做以確認 lateralization。", "evidence": "Endocrine Society Clinical Practice Guideline for Primary Aldosteronism 2016 (Funder JW et al.)"}, {"year": 112, "no": 100, "stem": "第二型自體免疫多腺體症候群(Autoimmune polyglandular syndrome 2 , APS2)常見下列疾病，除了：", "choices": {"A": "原發性腎上腺功能不足(primary adrenal insufficiency)", "B": "甲狀腺功能亢進(hyperthyroidism)", "C": "早發性卵巢衰竭(premature ovarian failure)", "D": "惡性貧血(pernicious anemia)", "E": "慢性黏膜皮膚念珠菌病(chronic mucocutaneous candidiasis)"}, "answer": "E", "is_endocrine": true, "subtopic": "Adrenal", "explanation": "E 錯：慢性黏膜皮膚念珠菌症 (CMC) 是 APS Type 1 (APECED, AIRE 基因突變) 的特徵之一 (與 Addison + hypoparathyroidism + CMC 三聯)；不屬於 APS Type 2。APS-2 (Schmidt syndrome) 為成人多見、HLA-DR3/DR4 關聯、組合 Addison + autoimmune thyroid + T1DM (Carpenter 三聯) ± 早發性卵巢衰竭 + 惡性貧血。", "evidence": "Williams Endo 14e, Ch 41 Autoimmune Polyendocrine Syndromes; Husebye ES et al. NEJM 2018"}, {"year": 112, "no": 101, "stem": "有關嗜鉻細胞瘤(pheochromocytoma)的描述，下列哪一項不正確?", "choices": {"A": "測量血漿後腎上腺髓素(plasma metanephrine)濃度具有最高的敏感度，但比較有容易有因為靜脈抽 血的壓力造成的偽陽性(false positive)升高", "B": "嗜鉻細胞瘤常見的症狀包括陣發性頭痛、冒汗、心悸等。有些病人可以數年沒有症狀", "C": "三環抗憂鬱症(tricyclic antidepressants)及鴉片類藥物(opiates)都可能誘發嗜鉻細胞瘤的症狀發作", "D": "嗜鉻細胞瘤術前應該以α交感神經阻斷劑(α-adrenergic blockers)控制血壓；術中可以 用nitroprusside輸注控制高血壓", "E": "約有5-10%的嗜鉻細胞瘤是惡性的。手術檢體有細胞異型(cellular atypia)、有絲分裂(mitosis)、血管 或周圍組織侵犯(invasion)等特徵尚不足以診斷為惡性嗜鉻細胞瘤。有淋巴或遠處轉移的，才被認為 是惡性嗜鉻細胞瘤"}, "answer": "A", "is_endocrine": true, "subtopic": "Adrenal", "explanation": "A 錯：plasma free metanephrines 為 pheochromocytoma 篩檢的 gold standard，「敏感度高」(96-100%) 是對的；但「容易因抽血壓力造成假陽性」實際上 plasma free metanephrines 較不受 stress 影響 (取血需 30 分鐘 supine)，反而 urine catecholamines 易受 stress 影響。所以 A 的「易因壓力造成假陽性」不準確。B/D/E 皆為正確 pheochromocytoma 共識。C 對：TCA、opiates、metoclopramide 可誘發 attack 或干擾檢驗。", "evidence": "Endocrine Society Pheochromocytoma and Paraganglioma Guideline 2014 (Lenders JW et al.)"}, {"year": 112, "no": 102, "stem": "有關甲狀腺功能低下的描述，哪一項最正確?", "choices": {"A": "自體免疫性甲狀腺功能低下(autoimmune hypothyroidism)的病人，因為有淋巴球浸潤，故而其甲狀 腺皆為瀰漫性腫大", "B": "亞臨床甲狀腺功能低下(subclinical hypothyroidism)的病人不會有明顯症狀，因此不需要治療", "C": "甲狀腺功能低下時，心肌收縮力(myocardial contractility)減少、心跳減慢，因此通常血壓偏低，不會 有高血壓", "D": "甲狀腺功能低下的levothyroxine治療劑量為每日每公斤體重1.6μg，最好是早餐後30分鐘內使用", "E": "懷孕婦女若有甲狀腺抗體，即使甲狀腺功能正常，仍有較高的流產及早產風險"}, "answer": "E", "is_endocrine": true, "subtopic": "Thyroid", "explanation": "E 對：懷孕 + TPO ab + 即使 TSH 正常 → 流產 (RR ~2)、早產 (RR ~2)、preeclampsia 風險增加；考慮治療有爭議但 TPO+ 是 marker。A 錯：autoimmune (Hashimoto) 可表現瀰漫腫大也可萎縮 (atrophic variant)。B 錯：subclinical hypothyroidism + 症狀或 TSH >10 仍需治療。C 錯：甲低反而常有 diastolic hypertension (周邊阻力上升)。D 錯：levothyroxine 應「早餐前 30-60 分鐘空腹」服用，與食物/鈣/鐵分開 4 hr。", "evidence": "ATA Guidelines for Detection and Management of Thyroid Disease During Pregnancy 2017 (Alexander EK et al.)"}, {"year": 112, "no": 103, "stem": "有關甲狀腺結節及甲狀腺癌的描述，下列哪一項最正確?", "choices": {"A": "甲狀腺超音檢查，高度大於寬度(taller-than-wide)的結節，其惡性風險高於寬度大於高 度(wider-than-tall)的結節", "B": "甲狀腺結節的細針穿刺細胞學檢查如果報告為濾泡瘤(follicular neoplasm), 其惡性風險通常<10%", "C": "美國癌症聯合委員會(American Joint Committee on Cancer, AJCC)的腫瘤、淋巴、轉移(tumor, node , metastasis, TNM)癌症分類，腫瘤3.5公分為T3", "D": "甲狀腺癌病人經手術切除後都應該接受放射性(radioiodine)治療，以減少復發及延長存活", "E": "甲狀腺淋巴癌常快速長大，手術切除是首要的治療方式"}, "answer": "A", "is_endocrine": true, "subtopic": "Thyroid", "explanation": "A 對：超音波 taller-than-wide (AP > transverse) 為 ATA high-suspicion sonographic feature (高惡性風險 70-90%)。B 錯：FA (follicular neoplasm) 惡性風險 25-40%，不是 <10%。C 錯：AJCC 8th ed 甲狀腺癌 T 分期 T3 為 >4 cm 或 minor extrathyroidal extension，3.5 cm 仍為 T2。D 錯：低風險 thyroid cancer (T1aN0) 不需 RAI 治療。E 錯：thyroid lymphoma 治療首選 chemotherapy ± radiation (R-CHOP for DLBCL)，手術非首要。", "evidence": "ATA Adult Thyroid Cancer Guidelines 2015 (Haugen BR); AJCC Cancer Staging Manual 8th Ed"}, {"year": 112, "no": 104, "stem": "下列有關副甲狀腺與血鈣平衡的描述哪一項最正確?", "choices": {"A": "約有10%長期使用鋰鹽的病人可能有高血鈣。一旦造成高血鈣，即使停用鋰鹽，血鈣仍無法恢復正 常", "B": "家族性低尿鈣性高鈣血症(familial hypocalciuric hypercalcemia, FHH) 是一種體染色體隱性遺 傳(autosomal recessive)疾病。病人常表現無症狀的高血鈣，主要是因為感應鈣離子濃度的受器基因 突變引起的", "C": "肺癌中的小細胞癌(small cell carcinoma)以及腺癌(adenocarcinoma)雖然常有骨轉移，但少引起高血 鈣。鱗狀細胞癌(squamous cell carcinoma)較常有高血鈣", "D": "原發性副甲狀腺功能亢進(primary hyperparathyroidism)中約有80%的病人為單一副甲狀腺瘤。副甲 狀腺瘤以良性居多，偶而可見副甲狀腺癌。副甲狀腺癌侵襲性強，存活期很短", "E": "高血鈣的治療藥物中，calcitonin的開始作用時間比denosumab或pamidronate短，可能的副作用是嚴 重的低血鈣"}, "answer": "C", "is_endocrine": true, "subtopic": "Calcium-Bone", "explanation": "C 對：肺腺癌、小細胞肺癌雖常骨轉移但 osteolytic 程度有限、PTHrP 分泌不高，故較少高血鈣；squamous cell carcinoma (especially head & neck, lung SCC) 是 PTHrP-mediated humoral hypercalcemia of malignancy 最經典原因。A 錯：鋰鹽造成的 HPT，停藥後血鈣多可恢復，但持續性者需手術切除。B 錯：FHH 為 autosomal dominant CaSR mutation (不是 recessive)。D 錯：原發性 HPT 中 80% 為單一腺瘤、但副甲狀腺癌 <1%，雖侵襲性強但 5 年存活仍 50-60%。E 錯：calcitonin 起效確實比 bisphosphonate 快 (2-6 hr vs 2-3 天) 但副作用為 tachyphylaxis (不是嚴重低血鈣)。", "evidence": "Williams Endo 14e, Ch 29 Hypercalcemia; ESE/ENSAT Hypercalcemia Workup"}, {"year": 112, "no": 105, "stem": "有關糖胖症(Diabesity)，下列相關疾病敘述中，何者有誤?", "choices": {"A": "依照糖尿病飲食控制原則，計畫性飲食及運動降低的體重，主要是脂肪組織", "B": "心血管疾病密切相關的肥胖型態是中心性腹部肥胖 (central abdominal obesity)", "C": "針對糖尿病的患者安排營養諮詢及體重管理，可以改善血糖及HbA1c之控制，但是目前研究結果顯示 並無法降低糖尿病患者之心臟血管疾病死亡率", "D": "運動對於體重之控制非常重要，運動強度愈強，研究之資料顯示可以降低糖尿病發病率，也可以降低 心臟血管疾病之死亡率", "E": "計畫性飲食及規律之足量運動，可以降低糖尿病發病之機率，其關鍵機轉為控制體重"}, "answer": "D", "is_endocrine": true, "subtopic": "Other-Endocrine", "explanation": "D 錯：「運動強度愈強愈能降低 DM 發病率與心血管 mortality」是過度推論——指引（ADA、ACSM）建議「中等強度有氧 + 阻力運動」每週 150 分鐘最佳，過強運動反而增加肌肉骨骼傷害且邊際效益遞減。A/B 對：飲食運動主要減少脂肪而非肌肉、中心型肥胖最相關。C 對：營養諮詢改善 HbA1c 但 LookAHEAD trial 並未顯示降低 CV mortality。E 對：DPP/DPS trial 證實 lifestyle 透過控制體重預防 DM。", "evidence": "ADA Standards of Care 2024 Lifestyle Management; LookAHEAD Trial NEJM 2013"}, {"year": 112, "no": 106, "stem": "下列降血糖藥物中，何項藥物為非胰島素相關(non-insulin dependent)之藥理機轉?", "choices": {"A": "Glucagon like peptide 1 receptor agonist (GLP 1 RA)", "B": "Dipeptidyl dipeptidase 4 inhibitor (DPP4 inhibitor)", "C": "Sodium-glucose co-transporter 2 inhibitor (SGLT 2 inhibitor)", "D": "Sulfonylurea", "E": "Thiazolidinedione"}, "answer": "C", "is_endocrine": true, "subtopic": "DM", "explanation": "C 對：SGLT-2 inhibitor 作用於腎近端小管阻斷葡萄糖再吸收，與胰島素分泌/作用無關，屬「真正 insulin-independent」機轉。A/B GLP-1 RA/DPP-4i 透過 incretin pathway 增加 glucose-dependent insulin secretion。D Sulfonylurea 直接刺激 β-cell 釋放 insulin。E TZD 增加周邊組織對 insulin 敏感度 (PPAR-γ activation)，仍依賴 endogenous insulin。", "evidence": "Williams Endo 14e, Ch 50 Type 2 Diabetes Therapy; ADA Standards of Care 2024"}, {"year": 112, "no": 107, "stem": "下列有關糖尿病藥物之敘述，何者為錯誤之描述? (1) Metformin可以安全地使用於eGFR < 30的糖尿病患 者 (2)Sulfonylurea類之降血糖藥物，容易造成病患之低血糖及體重上升 (3) 美國糖尿病學會之臨床建 議，HbA1c糖化血色素應控制於 < 6% (4) Sodium glucose co-transporter 2 inhibitor (SGLT2 inhibitor) 在 降低血糖之時，通常也會伴隨減輕病患之體重 (5) 腎功能不佳，eGFR < 60時，應避免使用胰島素 及GLP-1 receptor agonist之針劑藥物。", "choices": {"A": "(1)+(4)+(5)", "B": "(2)+(4)+(5)", "C": "(3)+(4)+(5)", "D": "(1)+(3)+(4)", "E": "(1)+(3)+(5)"}, "answer": "E", "is_endocrine": true, "subtopic": "DM", "explanation": "E 對 (錯誤組合)。(1) 錯：Metformin 在 eGFR <30 為禁忌 (lactic acidosis 風險)。(3) 錯：ADA 建議 HbA1c <7% 為一般目標 (而非 <6%)，<6% 反而增加低血糖風險。(5) 錯：腎功能差不應避免胰島素 (反而是首選) 與 GLP-1 RA (semaglutide/dulaglutide 可用於 eGFR ≥15)。(2)/(4) 對：SU 確有低血糖+體重上升；SGLT-2i 確降體重。", "evidence": "ADA Standards of Care 2024 Pharmacologic Approaches"}, {"year": 112, "no": 108, "stem": "Thiazolidinedione 類藥物，以Pioglitazone為例，使用相關藥物副作用包括下列何者?(1)骨質疏鬆 (2)認知 障礙 (cognitive dysfunction) (3)體重增加 (4)腦中風 (Storke) (5)體重及脂肪組織增加。", "choices": {"A": "(1)+(3)+(5)", "B": "(3)+(4)+(5)", "C": "(1)+(2)+(5)", "D": "(1)+(2)+(3)", "E": "(2)+(3)+(5)"}, "answer": "A", "is_endocrine": true, "subtopic": "DM", "explanation": "A 對 (1)+(3)+(5)。TZD (pioglitazone) 副作用：(1) 骨質疏鬆 (透過 PPAR-γ 抑制 osteoblast、促進 adipocyte 分化)；(3) 體重增加 (脂肪堆積)；(5) 體重 + 脂肪組織增加 (visceral 變 subcut)。(2) Cognitive dysfunction 與 (4) Stroke 不是 TZD 直接副作用 (pioglitazone PROactive 反顯示 stroke 略降)。其他副作用：水腫、心衰惡化、膀胱癌風險。", "evidence": "PROactive Trial Lancet 2005; ADA Standards of Care 2024 TZD Section"}, {"year": 112, "no": 109, "stem": "下列之糖尿病之治療藥物中，何者具有增加排除尿鈉之藥理機轉?", "choices": {"A": "Sulfonylurea", "B": "Biguanide", "C": "Thiazolidinedione (TZD)", "D": "Sodium glucose co-transporter 2 inhibitor (SGLT 2 inhibitor)", "E": "Insulin"}, "answer": "D", "is_endocrine": true, "subtopic": "DM", "explanation": "D 對：SGLT-2 inhibitor 透過阻斷近端小管 sodium-glucose 共同運輸 → 同時增加尿鈉與尿糖排出，故有 natriuresis effect (這也是其降血壓與心衰受益的部分機轉)。A/B/C/E 皆無 natriuretic 作用。", "evidence": "EMPA-REG OUTCOME Trial NEJM 2015; ADA Standards of Care 2024"}, {"year": 112, "no": 110, "stem": "以下有關胰島素及GLP-1 RA (Glucagon like peptide-1 receptor agonist) 治療之描述，何者錯誤?", "choices": {"A": "基礎胰島素 (basal insulin) 可以合併GLP-1 RA，協同控制病患之血糖", "B": "GLP-1 RA 常見的副作用為腹脹噁心感，胰島素最常見之副作用為低血糖", "C": "GLP-1 RA 可以合併胰島素治療第一型糖尿病，並可減少胰島素使用之劑量", "D": "GLP-1 RA 之使用，在降低血糖時，也會同時減輕病患之體重", "E": "Basal insulin (基礎胰島素) 使用之起始劑量(initial dose) 的原則為 0.2 unit/kg/day"}, "answer": "C", "is_endocrine": true, "subtopic": "DM", "explanation": "C 錯：GLP-1 RA 目前 FDA/EMA 仍未核准用於第一型糖尿病 (T1DM 缺乏 β-cell，GLP-1 機轉受限；ADA 建議僅 T2DM 與肥胖)。少數研究顯示 T1DM + 肥胖共病可能輔助減少 insulin 劑量，但非標準療法。A/B/D/E 為正確 GLP-1 RA + insulin 共識。", "evidence": "ADA Standards of Care 2024 Pharmacologic Approaches"}, {"year": 112, "no": 111, "stem": "56歲，男性，糖尿病病史為10年，曾因冠狀動脈疾病進行心導管置放支架。目前使用藥物包括: 預混型胰 島素 (Premix insulin)，高血壓藥物為每日valsatan 160mg 及amlodipine 5mg ，膽固醇藥物為 rosuvastatin 每日20mg。目前HbA1c 為 6.9 %，LDL cholesterol 為 52 mg/dL，HDL cholesterol 39 mg/dL，Triglyceride 為 828 mg/dL，尿液檢查正常，無微量白蛋白尿，輕微背景型視網膜病變 (Background retinopathy)，目前應該增加使用下列哪一項藥物?", "choices": {"A": "Nicotic acid", "B": "Fenofibrate", "C": "Ezetimibe", "D": "Cholestyramine", "E": "PCSK-9 inhibitor"}, "answer": "B", "is_endocrine": true, "subtopic": "Lipid", "explanation": "B 對：本例 LDL 已達標 (52 < 70)，但 triglyceride 828 mg/dL 為「嚴重高 TG」(>500) 屬「胰臟炎風險區」，應加用 fibrate (fenofibrate) 降低 TG 並預防 acute pancreatitis。A nicotinic acid 副作用多 (潮紅、高血糖、肝損)。C ezetimibe 主降 LDL 非 TG。D cholestyramine 反會升高 TG。E PCSK9 inhibitor 為降 LDL，與 TG 無直接關係。Omega-3 高劑量 (icosapent ethyl, REDUCE-IT) 亦為選項。", "evidence": "ADA Standards of Care 2024 Lipid Management; REDUCE-IT Trial NEJM 2019"}, {"year": 112, "no": 112, "stem": "45歲，男性，165公分，80公斤，無糖尿病家族及個人病史，經常工作時昏倒，都在休息30分鐘後逐漸甦 醒，心臟內科及神經內科門診檢查無心律不整或神經血管病變異常發現。本次昏倒後，送至急診，但意識 持續不清，血壓為112/60 mmHg，急診血糖為 32 mg/dl，給予50%葡萄糖注射及輸液後甦醒。建議住院 診治。 在病房未輸液情況下，空腹8小時後，抽血結果為空腹血糖 88 mg/dl, Insulin 3.6 mIU/ml, C-peptide 2.6 ng/ml, ACTH 36.8 pg/ml, Cortisol 18.6 ug/dl, IGF-1 172 ng/ml, TSH 1.10 mIU/ml。此時應建議先進行何 項檢查?", "choices": {"A": "75 公克葡糖糖耐受試驗", "B": "24小時心電圖", "C": "腹部電腦斷層", "D": "72小時 Prolong fasting test", "E": "24小時心電圖"}, "answer": "D", "is_endocrine": true, "subtopic": "DM", "explanation": "D 對：低血糖且 C-peptide 高 (內源性 insulin 過多) → 須排除 insulinoma。72-hr prolonged fasting test 為 gold standard：禁食期間若血糖 <55 mg/dL 同時 insulin >3、C-peptide >0.6、proinsulin >5、β-hydroxybutyrate <2.7 即可確診 insulinoma。隨後安排 EUS/MRI 或 SACST 定位。A OGTT 是 DM 診斷不是低血糖。C abdominal CT 可作後續定位但非首先檢查 (sensitivity 低)。", "evidence": "Williams Endo 14e, Ch 48 Hypoglycemia; Endocrine Society Hypoglycemia Guideline 2009 (Cryer PE)"}, {"year": 112, "no": 113, "stem": "一位17歲女性因發燒及咳血兩星期而住院，經檢查後發現有貧血、血尿、腎功能下降及肺部X光右下方一 塊混濁浸潤，經肺及腎切片後證明為肉芽腫性多血管炎(granulomatosis polyangiitis)，此病人血清中最有 可能含下列何者抗體？", "choices": {"A": "抗RNP抗體 ( anti-RNP antibody)", "B": "抗SS-A/RO抗體 ( anti-SS-A/Ro antibody)", "C": "抗proteinase 3抗體 ( anti-proteinase-3 antibody)", "D": "抗dsDNA抗體 ( anti-dsDNA antibody)", "E": "抗MAD5抗體 ( anti-MAD5antibody)"}, "answer": "C", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 112, "no": 114, "stem": "一位69歲男性COV 者會出現失眠症狀，失眠可能會加重其他疾病的嚴重程度", "B": "診斷失眠症的標準是每週有3天或更多天的睡眠連續性受干擾(sleep continuity disturbance)", "C": "無論失眠的潛在原因是否已經確定， benzodiazepines是推薦的第一線治療方式", "D": "失眠症的刺激控制治療法(stimulus control therapy)其內容通常包括：限制在臥室中只進行睡眠和性 行為的行為，限制清醒時間在床上或臥室中的時間，並確保患者每天都在相同的時間上床睡覺和起 床", "E": "褪黑激素更適合被視為一種生理節律調節劑，而非催眠鎮靜藥物，其主要適應症為循環節律失 調(circadian rhythm disorders)，例如睡眠-清醒相位延遲或提前失調患者"}, "answer": "C", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 112, "no": 152, "stem": "關於年輕族群的憂鬱症(depression in young people)下列敘述何者為非？", "choices": {"A": "過去十年間，在許多國家，年輕人的憂鬱症患病率急劇上升，尤其是女性", "B": "社會變遷，例如日益增加的孤獨感、學業壓力、不斷擴大的社經不平等，可能是導致憂鬱症患者增加 的原因", "C": "近年來人們更願意公開自己的心理健康問題，也有可能是導致各種統計當中，憂鬱症患者數目增加的 原因之一", "D": "患有憂鬱症的青少年，日後罹患焦慮症的風險增加，但日後罹患躁鬱症(bipolar affective disorder)的 風險降低", "E": "對於年齡小於18歲的青少年，一項臨床試驗的網絡統合分析發現：Fluoxetine單獨使用，或與認知行 為治療結合使用，會比安慰劑更有效"}, "answer": "D", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 112, "no": 153, "stem": "關於複雜性創傷後壓力症(complex post-traumatic stress disorder, complex PTSD)下列敘述何者錯誤？", "choices": {"A": "Complex PTSD是一種嚴重的精神疾病，是個體對創傷性生活事件的反應", "B": "Complex PTSD除了具備三個PTSD核心的創傷後症候群特徵外，同時伴隨著情緒調節、身份認同和 人際關係方面的長期和普遍性障礙", "C": "對於患有Complex PTSD的個體進行的結構性腦影像分析，會發現海馬迴、顳葉迴、杏仁核、島葉和 前扣帶迴皮質層體積增加的情况", "D": "評估和治療計劃應以協作(collaborative)方式進行，聚焦個案獨特關注的議題，並遵從共同決策模 型(shared decision-making)", "E": "目前所有治療指引均建議優先考慮心理治療，儘管藥物治療不建議作為獨立治療，但可以用於處理穩 定性問題，以促進個案參與心理治療"}, "answer": "C", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 112, "no": 154, "stem": "關於DSM-5定義的「身體症狀疾患」(somatic symptom disorder)的描述何者為是？(1)盛行率大 約5%至7%；(2)臨床特徵包括：令人苦惱和困擾的身體症狀，以至於這些症狀佔據了他們的思緒、情緒和 信念，並以不同程度地干擾日常功能；(3)要能夠建立診斷必須確定個案的身體抱怨「查無實據」；(4) 危 險因子可能包括：性格因素，低教育水準，低社會經濟地位，以及最近有壓力的生活事件；(5)治療方式 首選為精神藥物治療。", "choices": {"A": "(1)+(2)+(3)", "B": "(1)+(2)+(4)", "C": "(2)+(3)+(4)", "D": "(1)+(2)+(5)", "E": "(3)+(4)+(5)"}, "answer": "B", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 112, "no": 155, "stem": "關於恐慌症(panic disorder)的描述何者為是？(1)是以反覆無法預測的恐慌發作以及對於發作的強烈恐懼 為特徵；(2)症狀包括心悸、出汗、顫抖、呼吸急促、胸痛、頭暈，以及對即將來臨的厄運或死亡的恐懼 感；(3)感覺異常(paresthesias)、腸胃不適和去真實感(derealization)並非恐慌症的常見症狀；(4)診斷標準 要求至少持續一年對發作感到擔憂或焦慮，或是因發作而改變行為；(5)Fluoxetine, paroxetine, sertraline和選擇性血清素-新腎上腺素再吸收抑制劑(SNRI)的venlafaxine 是治療藥物選項。", "choices": {"A": "(1)+(2)+(3)", "B": "(2)+(3)+(4)", "C": "(1)+(3)+(5)", "D": "(2)+(3)+(4)", "E": "(1)+(2)+(5)"}, "answer": "E", "is_endocrine": true, "subtopic": "Adrenal", "explanation": "正確選項應為 (1)+(2)+(5)。(1) 對：panic disorder 定義特徵——反覆無預警 panic attack + 對未來發作的擔憂。(2) 對：經典 symptom 群。(5) 對：SSRI (fluoxetine, paroxetine, sertraline)、SNRI (venlafaxine) 為一線治療。(3) 錯：paresthesias、GI distress、derealization 都是 panic attack 常見 symptom。(4) 錯：DSM-5 診斷標準要求「至少 1 個月」對發作擔憂或行為改變，而非 1 年。本題實質為精神科題。", "evidence": "DSM-5 Panic Disorder; APA Practice Guideline for Treatment of Patients with Panic Disorder"}, {"year": 112, "no": 156, "stem": "關於疥瘡(scabies)感染，以下何者「正確」?(1) 第㇐次受到疥蟲 (Sarcoptes scabiei var. hominis)感染之 個案，可能長達六週才出現搔癢的症狀。(2) 抗疥藥膏局部厚塗於患部紅疹處就可徹底除去疥蟲感染。(3) 結痂型疥瘡(挪威疥) (crusted / Norwegian scabies)常發生在免疫力低下的年長衰弱的臥床病人。(4) 家中 寵物(如貓狗)身上的疥蟲不會傳染給人類。(5) 成人的疥瘡感染最好發於手臂、腿部、背部及臉部 。", "choices": {"A": "(1)+(2)+(3)", "B": "(2)+(3)+(4)", "C": "(1)+(3)", "D": "(2)+(4)", "E": "(3)+(4)+(5)"}, "answer": "C", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 112, "no": 157, "stem": "關於藥物引起之蕁蔴疹(drug-induced urticaria)，最「不」常見由以下何類型藥物所引發？", "choices": {"A": "鴉片類藥物(Opiates)", "B": "非類固醇類消炎藥(Non-steroidal Anti-inflammatory Drugs)", "C": "血管張力素轉化酶抑制劑(Angiotensin converting enzyme inhibitors)", "D": "乙二型交感神經興奮劑(β2 agonists)", "E": "顯影劑(Radiographic dyes)"}, "answer": "D", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 112, "no": 158, "stem": "27歲無病史女性，過去幾個月來被新診斷糖尿病和高血壓，問診和理學檢查發現近端肢體無力、臉部潮紅 和中央型肥胖，腹部有如照片所示皮疹(如圖)，24小時free cortisol 3058 nmol (正常值 <160)，ACTH偵測 不到，病人過去並無使用類固醇，請問下一步應該做以下哪項檢查?", "choices": {"A": "胸部電腦斷層", "B": o": 2, "stem": "病人罹患感染性心內膜炎(Infective endocarditis)，臨床治療應著眼於根治病菌感染，請問下列何者病況不 符合臨床指引?", "choices": {"A": "在適當抗生素治療之下，病人病況持續發燒或超過7-10 天的菌血培養仍舊陽性時，應及時施行外科 手術治療", "B": "有確鑿病菌感染心肌結構，併有人工瓣膜失能或心臟衰竭難治的病人，得以外科療法處置", "C": "病人二尖瓣前葉感染葡萄球菌心內膜炎，其贅生物(Vegetation) 大於10 mm，有腦栓塞之慮，得以外 科療法處置", "D": "併有腦血栓的心內膜炎得以人工瓣膜置換手術，且應盡早手術以減少出血性轉化病變 (Hemorrhagic transformation)及降低死亡率", "E": "感染性心內膜炎病人經適切治療在數日內逐漸退燒，如超過2週仍舊體溫不退，應再度血液病菌培養 及再度影像檢查，以為處置之參考"}, "answer": "D", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 113, "no": 3, "stem": "病人突發急性心肌梗塞後伴有心因性休克(Cardiogenic shock)，應首先穩定及復原血壓及組織灌注 (Tissue perfusion)，請問下列何者處置的說法不正確?", "choices": {"A": "病人因心肌梗塞後伴發心因性休克，應迅即從事經皮介入手術 (Percutaneous coronary intervention, PCI)開通阻塞血管，以降低休克死亡率", "B": "因心肌梗塞後休克，經PCI開通阻塞血管後，應盡早啓用主動脈內氣球幫浦(Intra-aortic balloon pump，IABP )，以降低病人的死亡率", "C": "病人心肌梗塞發生休克時，如在18小時內的PCI，經開通阻塞血管，仍舊有助存活率的提昇", "D": "病人有多條冠狀動脈阻塞時，只要首惡病變血管（Culprit lesion）以PCI開通阻塞即可，不必同時多 條血管一次全部完成血管開通", "E": "年過75歲的心梗休克病人以PCI開通阻塞血管，仍是合理的處置"}, "answer": "B", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 113, "no": 4, "stem": "由於影像醫學科技的進步，關於主動脈瘤(Aortic aneurysm) 的臨床診療有諸多新知，請問下列何者才是 正確的論點?", "choices": {"A": "主動脈瘤之發生與年齡、性別、抽煙及家族遺傳傾向有關，在歐美近年婦女較男人長命，又多抽 煙，再加上女性賀爾蒙造成大動脈肌肉層脆弱，以致主動脈瘤多見女性病人", "B": "心臟快跳及高血壓對主動脈傷變較強，胸部主動脈瘤在解剖學結構上鄰近心臟，是以臨床上遠比腹部 主動脈瘤多見", "C": "Fluoroquinolones與主動脈瘤或剝離(Aortic dissection) 有關聯，在臺灣的研究發現使 用Fluoroquinolones治療肺及尿路感染的病人，發生主動脈瘤或剝離多見2-3倍，特別對使用長 過60天者", "D": "急性主動脈症候群 (Acute aortic syndrome ) 包括Penetrating ulcer, Aortic dissection 及Intramural hematoma三種，後者在東方有40%多見，症狀輕，進展不強，得以內科療法處置", "E": "沒有症狀的主動脈瘤，只要在胸部主動脈瘤直徑超過5.5公分或腹部主動脈瘤伴有Marfan症候群者超 過5.0 公分，應逕行經皮血管支架 (Endovascular stent)處置"}, "answer": "C", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 113, "no": 5, "stem": "依據有標的理學所見(Targeted physical examination) 的作法，請問下列何組才是典型重度慢性二尖瓣閉 銷不全(Mitral regurgitation) 的臨床所見? (1) 在心尖部偏左側，出現顯著心縮震顫(Systolic thrill) 。 (2) 可在心尖部位聽到心舒中期隆隆心雜音(Mid-diastolic rumbling murmur) 。 (3) 在心尖部位可聽聞有輕柔S1併有中強度全心縮期心雜音(Pansystolic murmur)及S3。 (4) 深度吸氣可增強心縮性心雜音。 (5) 心縮性心雜音併有腋窩傳聲(Axillar transmission) 。 (6) 如若二尖瓣後葉腱索斷裂(Chordae rupture)的二尖瓣閉銷不全，可在上胸緣(Upper sternal border)聽 到心縮性心雜音。", "choices": {"A": "(1)+(2)+(3)", "B": "(1)+(3)+(5)", "C": "(2)+(3)+(4)", "D": "(2)+(3)+(5)", "E": "(4)+(5)+(6)"}, "answer": "B", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 113, "no": 6, "stem": "有關急速猝死(Sudden death) 的臨床實用資料頗多，下列何組的新知オ是正確的說法? (1) 較年輕(<35歲) 發生急性猝死者，以從事劇烈又競爭性運動的男人為多。 (2) 現在無論院內或院外急速猝死都以無脈電氣 (Pulsuless electrical activity) 及心跳閉止(asystole ) 為 多，而心室纖維顫動(Ventricular fibrillation)則少見。 (3) 心臟病人以心室為起源的早期心室收縮(Premature ventricular contractions, VPC) 及短陣的非持續心 室快跳(Non-sustained tachycardia) 最具猝死的風險，但治療VPC並無預防猝死的實証。 (4) 有關急救處置的存活高低，以心跳閉止最好，有25-30%存活，無脈電氣10-15%有救，心室纖維顫動 僅只5%不到存活。 (5) 有關院外急速猝死多因肺動脈栓塞、主動脈瘤破裂、主動脈剝離或腦溢血而起，因為心臟病及原發性 心律不整(Primary arrhythmias) 已因有效治療而減少。 (6) 對於院內心臟驟停(In-hospital candiac arrest)，急救後目標性低溫治療(Targeted therapeutic hypothermia)確實可改善腦神經的損傷。", "choices": {"A": "(1)+(2)+(3)", "B": "(4)+(5)+(6)", "C": "(1)+(3)+(5)", "D": "(2)+(4)+(6)", "E": "(1)+(3)+(6)"}, "answer": "A", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 113, "no": 7, "stem": "依據美國的心房纖維顫動(Atrial fibrillation, AF) 診斷及處置指引，請問下列何者的指引主張是不正確的?", "choices": {"A": "導管燒灼手術(Catheter ablation) 適用於年青又無任何病態、新發AF、低LVEF的心衰或藥物治療罔 效的病例", "B": "只要AF發作歷時5分到24小時的病例，不論CHA2DS2 或 CHA2DS2-VASc分數高低，都應使用抗凝 血藥物治療，且以新式口服抗凝血藥物(Novel oral anti-coagulant, NOAC) 為佳", "C": "肥胖、體能活動不足、抽煙喝酒、睡眠異常及高血壓與AF的發生有關，應作生活習慣的矯正", "D": "併用抗凝血藥物的控管心跳次數療法(Rate-control) 適用於少有症狀、年青、正常左心房大小、正常 左心室功能的AF病人", "E": "左心耳封堵器(Left atria appendage occlusion devices)治療AF有實証療效"}, "answer": "B", "is_endocrine": true, "subtopic": "Other-Endocrine", "explanation": "B 錯：AF + 是否抗凝血應以 CHA2DS2-VASc 分數決定 (≥2 男性 / ≥3 女性 才強烈建議抗凝)，並非「不論分數高低都應使用」。低分病人 (0-1) 因出血風險可能 > 中風風險，反而不建議抗凝。A/C/D/E 為 2023 ACC/AHA/HRS AF 指引正確主張。本題為心律不整題，Other-Endocrine 標籤為 keyword 誤抓。", "evidence": "2023 ACC/AHA/HRS Guideline for Diagnosis and Management of AF (Joglar JA et al.)"}, {"year": 113, "no": 8, "stem": "女性病人83歲因胸悶多達一小時，未有舒緩，乃前往急診求醫，曾在2018及2019年有兩次腦中風，以致 微有跛行，病人身體質量指數BMI在31.5 kg/m²，又有高血壓及高血脂十數年，服藥治療中。檢查所見: 血 壓:144/88 mmHg; 心跳:90/min，心臟大小及心音尚無異常，其他所見均屬正常。血液檢驗進展中，唯心 電圖及胸部X光，如圖。請問病人此刻的診斷，最可能是?", "choices": {"A": "正常心臟", "B": "心絞疼", "C": "左前下枝阻塞的急性心肌梗塞", "D": "右冠脈阻塞的急性心肌梗塞", "E": "左迴旋枝阻塞的急性心肌梗塞"}, "answer": "D", "is_endocrine": true, "subtopic": "Lipid", "explanation": "本題為心電圖 + 臨床判讀題。「右冠脈阻塞」會在 II、III、aVF 導極呈現 ST 上升 (inferior wall STEMI)，常見於 RCA proximal 阻塞。其他類型阻塞典型 ECG：左前下枝 (LAD) 阻塞 → V1-V4 ST 上升；左迴旋枝 (LCX) 阻塞 → I、aVL、V5-V6 ST 上升。本題實質為心臟科 STEMI 判讀題。", "evidence": "ESC STEMI Guidelines 2017/2023; 12-lead ECG Localization of MI"}, {"year": 113, "no": 9, "stem": "依據美國AHA及ACC會同多個相關醫學會在2023年公佈有關「慢性冠心病」(Chronic coronary disease, CCD) 病人的處置指引，請問下列何項不是推荐的指引?", "choices": {"A": "CCD病人減少靜坐時間、或增加有氧運動或阻力鍛練(Resistance exercise) 等的習慣性活動不必禁 止", "B": "沒有糖尿病的CCD病人亦得使用Sodium glucose cotransporter-2 inhibitors (SGLT2i) 及 glucagon-like peptide-1 (GLP-1) receptor agonists治療心功能低退", "C": "CCD病人應終生使用乙型交感神經阻斷劑(Beta-blockers)", "D": "Statin 是CCD病人的第一線降血脂藥物", "E": "CCD病人如若病情穩定，不必每年定期健檢或從事缺氧檢查(Ischemic testing) ，除非病人顯示身體 機能衰退"}, "answer": "C", "is_endocrine": true, "subtopic": "DM", "explanation": "C 錯：2023 AHA/ACC CCD 指引「不再建議所有 CCD 病人終生使用 β-blocker」；β-blocker 主要用於 LVEF <50% 或近期 MI (1 年內)；穩定 CCD 無 LV dysfunction 病人不必例行使用。A/B/D/E 為新指引重點：鼓勵運動、SGLT2i + GLP-1 RA 用於 HF/糖尿病、Statin 為降脂第一線、穩定病人不必每年 stress testing。", "evidence": "2023 AHA/ACC/ACCP/ASPC/NLA/PCNA Guideline for CCD (Virani SS et al.)"}, {"year": 113, "no": 10, "stem": "下列有關頑固性高血壓(Resistant Hypertension)的敘述何者為非?", "choices": {"A": "一般的定義為，至少使用三種降血壓的藥物，包含長效的鈣離子阻斷劑(long acting calcium channel blocker)，腎素血管收縮素阻斷劑(renin-angiotensin-aldosterone system (RAAS) blocker)，以及一種 利尿劑至最大耐受劑量，病患血壓仍無法達標", "B": "男性罹病的比率較高", "C": "根據全世界流行病學的研究，佔所有高血壓的病患約莫1/6的比率", "D": "血壓更難控制的患者，稱為阻抗型高血壓(refractory hypertension)。阻抗型高血壓的定義，為病患使 用五種以上的高血壓藥物，且必需包含使用乙型阻斷劑(beta-blocker)", "E": "Refractory hypertension 的病患相較於Resistant Hypertension的病患一般比較年輕，比較容易有終 端器官(end organ)的損傷"}, "answer": "D", "is_endocrine": true, "subtopic": "Adrenal", "explanation": "D 錯：阻抗型高血壓 (refractory HT) 的定義應為「至少 5 種藥物 + 包含 chlorthalidone (利尿劑) + spironolactone」血壓仍未控制；並非「必須包含 β-blocker」。A/B/C 對：resistant HT 標準定義、男性較高、流行病學約 12-15%。E 對：refractory HT 病人較年輕、終端器官傷害更明顯。本題為高血壓題，Adrenal 標籤為 keyword 誤抓 (RAAS)。", "evidence": "AHA Scientific Statement on Resistant Hypertension 2018; Calhoun DA et al. JACC 2018"}, {"year": 113, "no": 11, "stem": "下列有關心血管疾病危險因子敘述，何者正確?", "choices": {"A": "根據Framingham Heart Study，Atherosclerosis Risk in Communities (ARIC) study等流行病學研 究，中年和老年成人患高血壓的剩餘終身心血風險約為70-90%", "B": "在SPRINT study對發病性心肌梗死、急性冠狀動脈綜合症、中風、失代償性心力衰竭或心血管疾病 死亡的次分析顯示，在收縮壓目標≤120mmHg與≤140mmHg之間，non-hispanic白 人、non-hispanic黑人的血壓控制的幫助上，僅有白人積極控制血壓是對病患有幫助的", "C": "根據亞洲病患研究，包括亞裔印度人、菲律賓人、日本人、中國人、韓國人和越南人，高血壓性心臟 病和腦血管疾病造成的比例死亡率較白人為低", "D": "高血壓的可改變危險因子(Modifiable Risk Factors) 包括: 肥胖，糖尿病，心理壓力(psychosocial stress)，抽菸等", "E": "收入、教育、就業等社會經濟因素對於血壓沒有顯著的影響"}, "answer": "A", "is_endocrine": true, "subtopic": "DM", "explanation": "A 對：Framingham + ARIC 顯示中老年成人 lifetime risk of developing HT 約 70-90%。B 錯：SPRINT 次分析顯示積極控壓 (<120) 對白人與黑人都有益。C 錯：亞洲族群高血壓性腦中風與心臟病死亡率較西方為「高」(中風型態尤其顯著)。D 對但 A 更直接相關 → 取 A。E 錯：社經因素 (收入、教育) 對血壓有顯著影響 (低社經 = 高 HT 患病率)。本題實質為流行病學題。", "evidence": "Framingham Heart Study; ARIC Study; SPRINT Trial NEJM 2015"}, {"year": 113, "no": 12, "stem": "對於臨床上使用抗血脂藥物他汀類(statin)藥物的敘述，下列何者錯誤?", "choices": {"A": "使用上可能發生的副作用包含肌肉酵素(CK)上升，以及肝臟酵素上升等", "B": "他汀類的藥物可以降低低密度脂蛋白（low-density lipoprotein, LDL）受体的表現，因而減少膽固醇 的合成，達成降低膽固醇的目的", "C": "根據最新的治療指引，對於高風險心血管疾病患者(如冠狀動脈疾病，腦中風患者)的血漿低密度脂蛋 白（low density lipoprotein, LDL）膽固醇應該控制在70 mg/dL以下", "D": "他汀類藥物，和某些常使用的內科用藥如amiodarone，cyclosporin會有藥物交互作用", "E": "對於血漿低密度脂蛋白膽固醇未達標的患者，可以加上Proprotein Convertase Subtilisin/Kexin type 9 (PCSK9)抑制劑等其他控制LDL藥物輔助他汀類的治療"}, "answer": "B", "is_endocrine": true, "subtopic": "Lipid", "explanation": "B 錯：Statin 的機轉是抑制「HMG-CoA reductase」(rate-limiting enzyme of cholesterol synthesis) → 細胞內 cholesterol 下降 → 「上調 (upregulate) LDL receptor」 → 增加 LDL 清除。而非「下降 LDL receptor」。A/C/D/E 為 statin 標準臨床知識：CK/ALT 上升、目標 LDL <70 高風險、與 amiodarone/cyclosporin 交互作用、未達標可加 PCSK9i。", "evidence": "ACC/AHA Cholesterol Guidelines 2018; Harrison 21e, Ch 407 Lipid Disorders"}, {"year": 113, "no": 13, "stem": "有關診斷心臟衰竭的Framingham Criteria，下列何者是主要診斷(major criteria)？(1) 陽性 的Hepatojugular reflex (2) 肋膜積水(pleural effusion) (3) 聽診聽到囉音(rales) (4) 夜間咳嗽(Nocturnal cough) (5) 聽到第三心音", "choices": {"A": "(4)+(5)", "B": "(1)+(2)+(5)", "C": "(2)+(4)+(5)", "D": "(1)+(5)", "E": "(1)+(3)+(5)"}, "answer": "E", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 113, "no": 14, "stem": "心跳速率每分鐘160下，QRS寬大且呈現左束支傳導阻斷(LBBB)，R-R interval規則，第二導程(lead 2) 可 以見到融合波(fusion wave)，此心電圖診斷?", "choices": {"A": "心室頻脈 (ventricular tachycardia)", "B": "心房震顫 (atrial fibrillation)", "C": "心房撲動 (atrial flutter)", "D": "心室震顫 (ventricular fibrillation)", "E": "陣發性心室上心搏過速 (PSVT)"}, "answer": "A", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 113, "no": 15, "stem": "50歲女性，過去沒有系統性疾病，過去六個月因為運動時喘來就醫，曾有抽菸的病史，戒菸五年，自述在 家中血壓有達150/95 mmHg，下一步的處理，何者較不適當?", "choices": {"A": "對於高血壓的治療部分，應該先計算10年的危險因子，如果心血管事件風險(ASCVD > 10%)，將視 為高風險高血壓患者治療", "B": "非藥物的血壓治療方面，最重要的就是在肥胖的患者減重", "C": "如果平均量測的血壓超過140/90 mmHg，視為stage 2 的高血壓，可以直接考慮開始藥物治療", "D": "減鈉控制血壓的目標是減低到每天攝取1000 mg鈉，或者至少減少原本飲食50%的鈉含量", "E": "有氧運動，如快步走/跑步、游泳和跳舞，被證明是降低血壓的最佳形式"}, "answer": "D", "is_endocrine": true, "subtopic": "Other-Endocrine", "explanation": "D 不適當：減鈉控制血壓目標應為「每日 <2,300 mg (~1 茶匙鹽)」較理想目標 <1,500 mg/day；「1,000 mg/day」過度嚴格不切實際。A 計算 ASCVD 10-year risk 為標準作法。B 減重為最有效的 lifestyle 介入。C 平均 BP >140/90 確為 stage 2 (ACC/AHA 2017) 可考慮藥物。E 有氧運動降壓最佳。本題實質為高血壓基本題。", "evidence": "2017 ACC/AHA High Blood Pressure Guideline; DASH-Sodium Trial"}, {"year": 113, "no": 16, "stem": "承上題有關此患者急性及慢性血壓處理的原則，下列何者正確 ?", "choices": {"A": "如果患者收縮壓大於180毫米汞柱或舒張壓大於120毫米汞柱，需要立即仔細評估，是否血壓迅速上 升，或有新的或惡化的靶器官損傷(target organ damage)，如果沒有伴隨急性靶器官損傷，應當開始 口服門診治療，目標是一周內將收縮壓/舒張壓降至小於160/100毫米汞柱", "B": "依照目前各國心臟學會的建議，此患者的理想血壓至少降至120/70mmHg以下", "C": "針對糖尿病的患者，控制血壓是減少心血管風險最有效的方式，建議積極的控制血壓", "D": "ACE inhibitors, ARBs等抑制劑對於非洲裔患者特別的有效", "E": "依照現行指南，左心室射出分率下降之心衰竭患者(heart failure with reduced ejection fraction )，nondihydropyridine CCBs 絕對不可以使用"}, "answer": "C", "is_endocrine": true, "subtopic": "DM", "explanation": "C 對：糖尿病人控制血壓是減少 macro + microvascular complication 的最有效介入之一 (ACCORD/SPRINT subgroup)。A 錯：BP >180/120 + 無 target organ damage 為「hypertensive urgency」應在「24-48 小時」內降至安全範圍，非 1 週。B 錯：理想 BP 應 <130/80 (高風險病人) 而非 <120/70。D 錯：非洲裔病人對 ACE/ARB 「較不敏感」(因 low-renin profile)，CCB/thiazide 較有效。E 錯：HFrEF 病人應避免非雙氫嘧啶 CCB (verapamil/diltiazem 抑制心收縮)，但「絕對禁用」過於絕對。", "evidence": "2017 ACC/AHA Hypertension Guideline; 2022 AHA/ACC/HFSA HF Guideline"}, {"year": 113, "no": 17, "stem": "引起血壓上升的許多機轉當中，下列何者的敘述有誤?", "choices": {"A": "在正常血壓和高血壓個体中，對鈉攝入變化的血壓反應存在個體的差異，臨床觀察顯示，通常老年人 比年輕人對鹽敏感性更高，而黑人則比白人更容易對鹽敏感", "B": "交感神經纖維分布在幾乎所有血管、心臟和腎臟的各區域，交感神經活化可使血管收缩、增加心 率、心臟的輸出率，在幾秒鐘升高血壓。抑制交感神經則可能在不到一分鐘降低血壓至一半以下", "C": "肥胖相關的高血壓和腎臟的交感神經系統活性(renal sympathetic nerve system)活化相關", "D": "血管張力素II (angiotensin II)可以不經由腎素(renin)的刺激產生，心肌組織中的局部酵素(kallikren, cathepsin G)便可以將血管張力素元(angiotensinogen) 轉換成血管張力素 I (angiotensin I)", "E": "刺激頸動脈的壓力感受器(baro-receptor)，會影響血壓在正常日常活動中高低波動，導致24小時平均 動脈壓力顯著上升"}, "answer": "E", "is_endocrine": true, "subtopic": "Other-Endocrine", "explanation": "E 錯：「刺激頸動脈 baroreceptor」會「降低」血壓 (反射性 vasodilation + bradycardia)，而非升高。Baroreceptor 在日常活動中參與短期血壓恆定，但長期血壓設定仍由 RAAS、SNS、kidney 主導。A/B/C/D 為正確血壓調節機轉。本題為心血管生理題，Other-Endocrine 標籤源 keyword (RAAS、catecholamine)。", "evidence": "Guyton Medical Physiology 14e, Ch 18 Nervous Regulation of Circulation"}, {"year": 113, "no": 18, "stem": "54歲王小姐，兩年前心臟超音波顯示左心室射出分率為35%，左心室舒張末期直徑為6.4公分，經藥物治 療之後，兩個月前追蹤心臟超音波顯示，左心室射出分率為52%，抽血的血漿中之NT-proBNP指數為 345 pg/mL，心臟衰竭症狀根據美國紐約心臟學會分級為NYHA Fc II，有關本患者的治療診斷下列何者正確?", "choices": {"A": "根據最新的美國心臟學會指南，病患的心臟衰竭分類是正常收縮力心臟衰竭(heart failure with preserved ejection fraction)", "B": "肥胖病患通常NT-proBNP的數值會較預期的為高(higher than expected)", "C": "隨著病患的症狀改善，左心室射出率回復到50%以上，可以逐漸減少guideline-directed medical therapy 的種類，研究上此類病患不會因為減少藥物而影響左心室的射出分率", "D": "血漿中的ST2 和心臟的纖維化有關，和NTproBNP結合，可以預測HFrEF (heart failure with reduced ejection fraction)或者HFpEF (heart failure with preserved ejection fraction)病患的預後", "E": "運動生理測試指標，吐氣換氣量 (expiratory ventilation, VE)除以攝氧量(oxygen uptake, VO2) 的斜 率，可以代表運動時肺部的代謝效率，和心臟衰竭患者的預後有密切的關係"}, "answer": "D", "is_endocrine": true, "subtopic": "Other-Endocrine", "explanation": "D 對：ST2 + NT-proBNP 結合可預測 HFrEF/HFpEF 預後 (PARADIGM-HF subanalysis)。本病人 LVEF 由 35% 改善至 52% 屬「heart failure with recovered EF (HFrecEF)」，臨床上需「持續 GDMT」否則 50% 病人在 6-12 個月內 LVEF 會再下降 (TRED-HF Trial)。C 錯：停藥會復發。A 錯：原本是 HFrEF (LVEF 35%)，現在改善不算 HFpEF (因起點 reduced)。B 錯：肥胖 NT-proBNP 應「偏低」(adipocyte clearance)。E 對 VE/VO2 slope 為 CPX 指標但題目重點在 D。本題為心衰題。", "evidence": "TRED-HF Trial Lancet 2019; AHA/ACC/HFSA 2022 HF Guidelines"}, {"year": 113, "no": 19, "stem": "吳小姐28歲，過去有氣喘病史，平時只有在氣喘發作有喘鳴時使用吸入型Short-acting beta agonists (SABA)。最近兩個月以來，一星期會有3-4天需要使用吸入型SABA，但沒有夜間發作的現象。肺功能檢 查結果為：FEV1/FVC=75%，FEV1為預測值的90%。下列何種處置較不恰當？", "choices": {"A": "有需要時使用(as-needed-only)低劑量吸入型formoterol", "B": "有需要時使用(as-needed-only)低劑量吸入型類固醇 + formoterol", "C": "規則使用低劑量吸入型類固醇 + 有需要時使用(as-needed) SABA", "D": "有需要時使用(as-needed-only)低劑量吸入型類固醇 + SABA", "E": "避免需要時(as-needed)單獨使用 SABA"}, "answer": "A", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 113, "no": 20, "stem": "下列哪些共病（comorbidity）有可能造成氣喘較難控制？ (1) 鼻瘜肉 (Nasal polyposis)。 (2) 肥胖 (Obesity)。 (3) 胃食道逆流疾病 (Gastroesophageal Reflux Disease)。 (4) 阻塞性睡眠呼吸中止（Obstructive Sleep Apnea, OSA）。 (5) 焦慮症/抑鬱症 (Anxiety / Depression)。", "choices": {"A": "(1)+(2)", "B": "(3)+(4)", "C": "(1)+(2)+(3)", "D": "(1)+(2)+(3)+(4)", "E": "(1)+(2)+(3)+(4)+(5)"}, "answer": "E", "is_endocrine": true, "subtopic": "Other-Endocrine", "explanation": ": {"A": "建議使用低潮氣容積（4-8 mL/kg）", "B": "中重度ARDS 的病患建議使用俯臥式通氣模式(Prone positioning)", "C": "建議使用短暫高壓（50–60 cmH2O）肺泡再擴張術（recruitment maneuver）", "D": "不建議長時間使用神經肌肉阻斷劑", "E": "可以考慮將適合使用ECMO (extracorporeal membrane oxygenation) 的患者轉介至ECMO centers"}, "answer": "C", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 113, "no": 25, "stem": "下列有關氣胸的描述何者錯誤？", "choices": {"A": "原發型自發性氣胸（primary spontaneous pneumothorax）患者通常都有吸菸史", "B": "發生原發型自發性氣胸時的起始治療（ initial treatment）是simple aspiration", "C": "次發性氣胸(Secondary Pneumothorax)通常不需要接受引流", "D": "次發性氣胸患者若無法接受胸腔鏡手術，應考慮肋膜沾黏術(Pleurodesis)", "E": "張力性氣胸（tension pneumothorax）通常發生在使用呼吸器或急救過後的病患"}, "answer": "C", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 113, "no": 26, "stem": "下列關於肺膿瘍(lung abscess)的描述何者錯誤?", "choices": {"A": "常造成原發性肺膿瘍（Primary lung abscess）的病原菌是厭氧菌(anaerobic bacteria)，且為多種菌 株(polymicrobial)", "B": "次發性肺膿瘍（Secondary lung abscess）可以是因為腫瘤阻塞支氣管造成", "C": "格蘭氏陰性桿菌（Gram-negative rods）為造成次發性肺膿瘍常見的病原菌", "D": "金黃色葡萄球菌(Staphylococcus aureus) 造成的肺膿瘍臨床上較不會發燒，病程也較緩慢", "E": "直徑大於6–8 cm的肺膿瘍單獨使用抗生素的治療效果通常不好，需要考慮手術或者是經皮引 流（Percutaneous drainage）"}, "answer": "D", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 113, "no": 27, "stem": "林女士65歲，無糖尿病病史，因為呼吸急促至急診就醫，胸部X光如圖所示，經胸腔穿刺 （Thoracentesis）抽取肋膜積液緩解症狀，肋膜積液檢驗顯示：RBC 4000/uL, Total nucleated cells 340/uL, lymphocyte predominant, total protein 4.9 g/dL, LDH 254 U/L (normal range 140~271 U/L), Glucose 100 mg/dL, 造成林女士的肋膜積液的原因最不可能為下列何者？", "choices": {"A": "肺癌", "B": "惡性間皮細胞瘤", "C": "淋巴癌", "D": "結核性肋膜炎", "E": "膿胸"}, "answer": "E", "is_endocrine": true, "subtopic": "DM", "explanation": "E 錯：empyema (膿胸) 應有大量白血球 + neutrophil predominant + 低 glucose (<60) + 低 pH，本例 lymphocyte predominant + glucose 100 正常 → 不像 empyema。A/B/C 對：lung cancer / mesothelioma / lymphoma 均常以 lymphocytic exudate + glucose 偏低或正常表現。D 對：tuberculous pleuritis 典型 lymphocytic exudate + ADA 高。本題為胸腔題，DM 標 )", "E": "(4)+(5)+(7)"}, "answer": "D", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 113, "no": 42, "stem": "一位病人有吞嚥障礙（dysphagia）已超過一年，不論吃固態食物或喝流質食物都有困難。未消化的食物 會逆流至口腔，但不會覺得酸酸的。不定時會有胸痛，體重沒有明顯下降。Barium esophagography所得 結果如圖所示。關於這個病人之病情，下列敘述何者錯誤？", "choices": {"A": "以proton pump inhibitor (PPI)治療應無效", "B": "使用刺激胃腸蠕動之藥物，如：metoclopramide，無法改善其症狀", "C": "需考慮以內視鏡或手術處理", "D": "需排除惡性腫瘤存在之可能性", "E": "這個病人未來不必擔心罹患食道癌"}, "answer": "E", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 113, "no": 43, "stem": "一位67歲病人因前一天解了4次血便而住院，不久前又解了一次相當大量的血便，解便前並未併有腹 痛。目前血壓為90/50 mmHg（過去有高血壓服藥治療中），心跳105/分。腹部摸起來柔軟，也無觸 痛。肛門指檢有一些血塊。抽血檢驗 Hb=11 g/dL；Cr=0.8mg/dL (eGFR=80)。緊急輸注500 ml生理食鹽 水，血壓僅增為96/65 mmHg，心跳仍為105/分。鼻胃管引流液並未發現咖啡色物質，亦無血塊。針對此 病人之病情，下列各項檢查何者應最優先安排？", "choices": {"A": "Angiography", "B": "Colonoscopy", "C": "CT angiography", "D": "Esophagogastroduodenoscopy", "E": "Capsule endoscopy"}, "answer": "C", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 113, "no": 44, "stem": "一位慢性B型肝炎患者已有肝硬化時，在長期追蹤中應注意其是否發生併發症並予以妥善處理。下列相關 敘述何者錯誤？", "choices": {"A": "若腹水太多，使用利尿劑效果有限時，可考慮單次大量抽出腹水（> 5L），此時應同時輸注白蛋 白，每抽1L腹水應補充6-8g", "B": "若有腹水，本來在服用的ACE inhibitors及NSAIDs最好停止使用", "C": "若併發胸水（hydrothorax），且排除其它病因，應考慮以doxycycline行chemical pleurodesis來治療 之", "D": "若腹水中之中性球（neutrophil）＞250/μL，應立即以第三代cephalosporin予以治療", "E": "即使沒有併發胸水，亦可能出現dyspnea及hypoxemia之症狀"}, "answer": "C", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 113, "no": 45, "stem": "一位女性病人抽血檢驗肝功能，結果如下： Alb=3.9 g/dL (>3.5), Globulin=4.2 g/dL (<3.5), AST=70 U/L (<31), ALT=75 U/L (<41), ALP=580 U/L(<104), γ-GT=300 U/L (<50), Bil(T)=1.1 mg/dL (<1.2), Bil(D)=0.3 mg/dL (<0.3), HBsAg (-), Anti-HCV (-), ANA (-)。腹部超音波檢查及磁振造影檢查無異常。下列關於這位病人之敘述，何者錯誤？", "choices": {"A": "可能會併發autoimmune thyroid disease", "B": "Prednisolone是最佳治療藥物", "C": "應檢測Anti-mitochondrial antibody", "D": "接受Ursodeoxycholic acid治療，大多數病人之病情能獲得改善", "E": "應注意有無osteoporosis"}, "answer": "B", "is_endocrine": true, "subtopic": "Thyroid", "explanation": "B 錯：本例 ALP/γ-GT 上升明顯、AST/ALT 輕度上升、AMA 待測 → 高度懷疑 primary biliary cholangitis (PBC)。PBC 第一線治療為 UDCA (ursodeoxycholic acid)，不是 prednisolone (steroid 僅用於 AIH/PBC-AIH overlap)。A 對：PBC 常合併 autoimmune thyroid。C 對：AMA 是 PBC hallmark (>95% sens)。D 對：UDCA 治療有效。E 對：PBC 病人 osteoporosis 風險增加。本題為肝病題，Thyroid 標籤源 keyword (autoimmune thyroid 提及)。", "evidence": "AASLD Practice Guidance for PBC 2018; EASL Clinical Practice Guideline PBC 2017"}, {"year": 113, "no": 46, "stem": "一位病人因最近出現茶色尿就醫，沒有腹痛也未發燒，身體診察發現眼白泛黃，腹部無異常。抽血檢驗結 果如下：Bil(T)=8.5 mg/dL (<1.2), Bil(D)=7.2 mg/dL (<0.3), ALP=350 U/L (<104), AST=50 U/L (<31), ALT=60 U/L (<41)。腹部超音波檢查發現雙側肝內膽管和總膽管皆異常脹大；膽囊內有結石。下列各種病 況，何者最符合此病人之病情？", "choices": {"A": "Drug-induced liver injury (mixed type)", "B": "Pancreatic head tumor", "C": "Common bile duct stone", "D": "Gallbladder stone", "E": "Perihilar type cholangiocarcinoma"}, "answer": "B", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 113, "no": 47, "stem": "根據Lauren分類，胃腺癌主要分為兩個亞型，以下哪個敘述錯誤？", "choices": {"A": "腸型亞型(intestinal type)與CDH1基因突變相關，常見於老年患者，預後較好", "B": "瀰漫型(diffuse type)特徵為細胞間黏附能力下降，形成單個或小群分佈的癌細胞", "C": "瀰漫型(diffuse type)亞型與幽門螺桿菌感染有相關，常見於家族性胃癌及年輕患者，預後較差", "D": "腸型亞型(intestinal type)亞型特徵為形成腺管構造，細胞排列有序，有明顯的分化", "E": "腸型亞型(intestinal type)與幽門螺桿菌感染引起的慢性萎縮性胃炎有相關"}, "answer": "A", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 113, "no": 48, "stem": "哪一種胃癌分子亞型通常表現出高免疫原性，並對免疫檢查點抑制劑（如PD-1/PD-L1抑制劑）顯示良好 反應？", "choices": {"A": "與Epstein-Barr病毒（EBV）相關的胃癌", "B": "微衛星不穩定（MSI-H）型胃癌", "C": "基因組穩定（GS）型胃癌", "D": "染色體不穩定（CIN）型胃癌", "E": "免疫檢查點抑制劑（如PD-1/PD-L1抑制劑）對於以上四種亞型皆無效"}, "answer": "B", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 113, "no": 49, "stem": "對於胰臟癌邊緣可切除性病例 ( borderline resectable pancreatic adenocarcinoma) ，以下哪種治療方法 是手術前輔助治療的首選？", "choices": {"A": "手術前化療後，再進行手術和輔助化學治療", "B": "放射治療兩周後，進行手術和輔助化學治療", "C": "免疫檢查點抑制劑(PD-1或PD-L1抑制劑)治療兩周後，再進行手術治療", "D": "Poly ADP-ribose polymerase (PARP)抑制劑治療六周後，再進行手術治療", "E": "合併PD-1或PD-L1抑制劑與PARP抑制劑治療四周後，再進行手術治療"}, "answer": "A", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 113, "no": 50, "stem": "大腸直腸癌的症狀因腫瘤的解剖位置而異，以下哪些選項描述了右側結腸病變的特徵？ (1) 便血、裡急後重以及糞便直徑變窄 。 (2) 糞便外觀沒有改變但患者表現為疲勞、心悸，檢查出缺鐵性微小細胞貧血。 (3) 隨機糞便潛血測試可能為陰性。 (4) 右側腹部劇烈疼痛並伴有明顯的腸道習慣改變。 (5) 癌症可以長得相當大，而不會導致任何阻塞性症狀或明顯的腸道習慣改變。", "choices": {"A": "(1)+(3)+(4)", "B": "(1)+(2)+(4)+(5)", "C": "(2)+(3)+(4)+(5)", "D": "(2)+(3)+(5)", "E": "(2)+(4)+(5)"}, "answer": "D", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 113, "no": 51, "stem": "關於大腸直腸癌遺傳因素與綜合症的描述中，以下哪一個敘述是錯誤的？", "choices": {"A": "高達25%的大腸直腸癌患者有家族病史，顯示有遺傳易感性", "B": "多發性結腸息肉症是一種罕見病症，特徵是整個大腸中出現成千上萬個腺瘤性息肉。若不進行手術治 療，一半以上超過40歲的患者都將發展成大腸直腸癌", "C": "Lynch綜合症也稱遺傳性非多發性結腸癌，是一種常染色體顯性特徵，與在結腸遠端發生的大腸直腸 癌症有相關", "D": "多發性結腸息肉症是由APC基因的突變引起", "E": "Lynch綜合症主要與MLH1和MSH2等DNA修復基因的突變有關"}, "answer": "C", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 113, "no": 52, "stem": "一名45歲女性，近期反覆出現上腹部劇烈疼痛的症狀。她在一次高脂餐後，突然感到上腹部及右上腹部劇 烈疼痛，疼痛放射至背部及右肩部。這種疼痛通常在夜間發生，並伴隨著明顯的噁心和嘔吐。疼痛持續時 間不等，從30分鐘到5小時不等，這些發作對其日常生活造成了嚴重影響，尤其是在夜間發作時，使她無 法正常入睡，進而影響到第二天的工作和生活。基於這些症狀，初步懷疑為膽石病引發的膽絞痛。關於後 續的診斷與治療，下列何者為正確?", "choices": {"A": "若結石為小型色素型結石(小於5毫米)，建議使用Ursodeoxycholic Acid（UDCA)一到兩年，約50%的 膽結石可以溶解", "B": "建議接受腹腔鏡膽囊切除術", "C": "建議術前要進行膽胰內視鏡檢查，排除膽管結石，若有膽管結石可同時進行內視鏡取石術", "D": "若未併發急性膽囊炎，不需要接受膽囊切除", "E": "腹腔鏡膽囊切除術，約5%需轉開放手術，約4%的病例出現併發症，膽管損傷率較高（2-5%）"}, "answer": "B", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 113, "no": 53, "stem": "關於結腸假性阻塞（Ogilvie綜合症），哪些為正確之敘述? (1) 由於自主神經系統異常導致結腸蠕動障礙。 (2) 使用 Neostigmine可增加結腸蠕動。 (3) 通常需要手術進行矯正。 (4) 通常涉及乙狀結腸。 (5) 常伴有劇烈腹痛和不對稱的腹脹。", "choices": {"A": "(1)+(2)+(3)", "B": "(1)+(2)+(4)", "C": "(2)+(4)+(5)", "D": "(1)+(2)+(5)", "E": "(1)+(3)+(4)"}, "answer": "B", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 113, "no": 54, "stem": "以下哪些選項關於閉合環腸道(closed loop intestinal obstruction)阻塞的描述是正確的？ (1) 腸段的近端和遠端開口都被阻塞 (2) 常見於腸扭轉和疝氣 (3) 增加了絞窄和血管供應不足的風險 (4) 通常不需要緊急干預 (5) 多數個案可透過內視鏡技術治療", "choices": {"A": "(1)+(2)+(3)", "B": "(1)+(2)+(4)+(5)", "C": "(1)+(3)+(5)", "D": "(1)+(2)+(3)+(4)", "E": "(1)+(2)+(4)"}, "answer": "A", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 113, "no": 55, "stem": "一位47歲男性，過去有hypertension, microscopic hematuria病史，但未規則就醫。此次因高血壓(BP 205/129 mmHg)、頭痛、茶色尿(tea-color urine)來診，身體檢查無神經學異常、無下肢水腫。實驗室檢 查: Hb 8.5 g/dL, platelet count 52,000/μL, peripheral blood smear 2% schistocytes, BUN 106 mg/dL, serum creatinine 10.2 mg/dL, urinalysis protein (2+), O.B. (3+). 另外: AST, ALT, C3, C4, ADAMTS-13 activity 皆在正常範圍。有關本病人的診斷與治療，以下敘述何者最正確?", "choices": {"A": "病人可能發生血栓性血小板減少性紫斑症(Thrombotic Thrombocytopenic Purpura, TTP)", "B": "症狀可能導因於 endothelial damage and complement activation", "C": "使用血漿置換/輸注治療 (plasma exchange or infusion)可以有效恢復腎功能與降低死亡率", "D": "最主要治療是:盡快使用支持性透析療法(dialysis) 及有效降低血壓，腎衰竭與貧血症狀在兩周內可自 然緩解", "E": "單株抗體藥物如: eculizumab 或ravulizumab的效果與血漿置換/輸注治療相似，且有增加感染的風 險，不建議作為優先使用"}, "answer": "B", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 113, "no": 56, "stem": "應用腎動脈交感神經燒灼阻斷術(Renal artery sympathetic nerve denervation, RDN) 來治療頑固性高血 壓。以下敘述何者最正確?", "choices": {"A": "可以達治癒(cure)高血壓，大多數病人可以終生不需再使用降血壓藥物", "B": "除了降低血壓，可以保護心臟功能，有效減少心臟衰竭與心衰竭住院", "C": "除了降低血壓，可以保護腎臟功能，有效減少末期腎病(ESRD)與透析(dialysis)風險", "D": "對於頑固性高血壓病人，能顯著減少降血壓藥物品項或數量提高醫囑遵從度(adherence)", "E": "病人的選擇是RDN成功的關鍵之一。RDN更適用於primary aldosteronism 或volume overload型的頑 固性高血壓病人，相較於obesity, COPD合併頑固性高血壓病人"}, "answer": "D", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 113, "no": 57, "stem": "一位37歲女性，本身就有慢性高血壓的病史。因為懷孕18週時出現高血壓(156/102 mmHg)，尿液檢查有 蛋白尿 (2+)，無下肢水腫，血糖也正常，被轉介照會內科門診。以下診斷檢查與處置的敘述，何者正確? (1) 懷孕期間因為生理變化，孕婦的高血壓定義相較一般人為高，是以高於SBP/DBP 160/110 mmHg為診 斷依據，所以此女性尚無需藥物治療。 (2) 懷孕期間雖然有生理變化，孕婦的高血壓定義仍以SBP 130-149/DBP 80-99 mmHg為治療目標，兼顧 母親與胎兒有足夠循環，所以建議此女性需藥物治療。 (3) 若需血壓控制，可使用 ACEI/ARB for hypertension control and for renal protection。 (4) 若需血壓控制，可使用 Sustained-release nifedipine, 或Labetalol 。 (5) 建議給予low dose aspirin。", "choices": {"A": "(1)+(3)+(5)", "B": "(1)+(4)+(5)", "C": "(2)+(3)+(5)", "D": "(2)+(4)+(5)", "E": "(2)+(3)"}, "answer": "D", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 113, "no": 58, "stem": "一位54歲女性，因為高血鈣，腎功能異常，經轉診門診就醫。病人無糖尿病、貧血或關節痛、骨折等病 史。身體檢查:血壓136/78 mmHg, 無肝脾或淋巴腫大、也無下肢水腫。實驗室檢查: serum creatinine 3.2 mg/dL，Calcium 14.0 mg/dL，Hb 10.8 g/dL，腎臟超音波有腎結石與腎鈣化症( nephrocalcinosis )。 以下診斷與處置的敘述，何者正確? (1) 檢查chest x-ray, urine calcium excretion。 (2) 檢查skull x-ray, urine protein electrophoresis。 (3) 抽血檢測抗嗜中性球細胞質抗體, ANCA(Anti-Neutrophil Cytoplasmic Ab)，補體, complement levels, 尤其是C3，C4。 (4) 針對腎功能異常，需要適量intravascular (IV) saline hydration。 (5) 針對腎功能異常，盡早考慮plasma exchange or infusion。", "choices": {"A": "(1)+(3)+(5)", "B": "(1)+(4)", "C": "(2)+(3)+(5)", "D": "(2)+(4)", "E": "(2)+(5)"}, "answer": "B", "is_endocrine": true, "subtopic": "DM", "explanation": "B 對 (1)+(4)。54 歲女性 + 高血鈣 14 + 腎結石 + nephrocalcinosis + 貧血 → 應檢查 multiple myeloma vs primary hyperparathyroidism。(1) chest X-ray (排除 sarcoidosis/lung cancer) + urine calcium excretion (鑑別 FHH < 100 mg/24hr vs PHPT > 200) 必做。(4) IV saline hydration 是高血鈣首要處置。(2)/(3)/(5) 為 vasculitis (ANCA) / TTP-HUS 處置，不適合此病情。本題為高血鈣 workup 題，DM 標籤為 keyword 誤抓。", "evidence": "Endocrine Society Hypercalcemia Guidelines; KDIGO Acute Kidney Injury Guidelines"}, {"year": 113, "no": 59, "stem": "肥胖相關腎臟病(obesity-related kidney disease or fatty kidney)，以下治療被認為在該類病人，可以減少 蛋白尿或有利於相關腎臟病的預後，何者除外?", "choices": {"A": "GLP-1 RAs (Glucagon-like peptide 1 receptor agonist), 如: semaglutide", "B": "anti-obesity drugs (如:orlistat, bupropion-naltrexone)", "C": "外科減重手術 (Bariatric surgery)", "D": "Lifestyle interventions (hypocaloric diet and/or exercise)", "E": "Renin-angiotensin-aldosterone system blockers"}, "answer": "B", "is_endocrine": true, "subtopic": "Other-Endocrine", "explanation": "B 錯：肥胖相關腎臟病 (Obesity-related glomerulopathy, ORG) 處置應為「減重」(任何方式)。A semaglutide (GLP-1 RA) STEP/SELECT trials 證實減重 + 腎保護。C 減重手術為 effective。D 飲食運動為基礎。E RAAS blocker 降蛋白尿經典處置。B「antiobesity drugs (orlistat, bupropion-naltrexone)」雖能減重但「腎臟病改善證據有限」(無 RCT 顯示直接減蛋白尿)，故為例外。Bupropion-naltrexone 在 CKD 也須劑量調整。", "evidence": "ADA/KDIGO Joint Statement on Obesity and Kidney Disease 2024"}, {"year": 113, "no": 60, "stem": "一位58歲男性，過去病史有C型肝炎，高血壓，沒有糖尿病。1個月前確診Covid-19，之後雖然呼吸道症 狀緩解，但出現蛋白尿(urine protein/creatinine ratio 3800 mg/g)與urine O.B. (2+)，雙下肢足踝與脛前水 腫。實驗室檢查: Hb 9.8 g/dL, serum creatinine 2.1 mg/dL, 血清補體(C3, C4)皆低於正常 值，ANA與anti-GBM antibody皆無陽性。病人接受腎臟病理檢查，最可能的診斷為?", "choices": {"A": "HCV-related glomerulonephritis", "B": "IgA nephropathy", "C": "Pauci- immune glomerulonephritis", "D": "Membranous nephropathy and nephrotic syndrome", "E": "Renal amyloidosis"}, "answer": "A", "is_endocrine": true, "subtopic": "DM", "explanation": "A 對：HCV-related glomerulonephritis 最典型為 type II/III mixed cryoglobulinemia → MPGN pattern + 低 C3/C4 (補體消耗)。本病人 HCV + 急性蛋白尿 + 血尿 + 補體低 + AKI → 符合。COVID 可能 trigger HCV-related cryoglobulinemic vasculitis。B IgA nephropathy 補體通常正常。C Pauci-immune (ANCA) 補體正常 + ANCA+。D Membranous 補體正常 + anti-PLA2R。E Amyloidosis 蛋白尿 + Congo red+。", "evidence": "KDIGO Clinical Practice Guideline for Glomerular Diseases 2021"}, {"year": 113, "no": 61, "stem": "一位62歲男性，過去病史有糖尿病，因發燒(37.8-38.4 ⁰C)一週，陸續出現食慾不振、倦怠與尿量變少來 診。身體檢查:BP 130/80 mmHg,有肝脾腫脹、輕度黃疸，daily urine 約800 ml/day。皮膚上可 見petechiae, ecchymosis, iv lock處會有滲血情形。實驗室檢查: AST/ALT 190/78 U/L, bilirubin total/direct 6.4/3.8 mg/dL, eGFR 14 ml/min。醫師除了做相關影像檢查，感染症培養之外，您會建議採取以下何種治 療?", "choices": {"A": "給予Penicillin or Doxycycline", "B": "給予Renin-angiotensin-aldosterone system blockers for renoprotection", "C": "給予High dose steroid pulse therapy for acute glomerulonephritis", "D": "給予aggressive fluid and electrolyte resuscitation for pre-renal acute kidney injury", "E": "安排plasma exchange or plasma infusion"}, "answer": "A", "is_endocrine": true, "subtopic": "DM", "explanation": "A 對：DM 病人 + 發燒 + 黃疸 + AKI + 肝損 + 出血傾向 + petechiae → Weil's disease (severe leptospirosis) 經典三聯：renal failure + jaundice + bleeding。Penicillin 或 Doxycycline 為首選治療。本病例無腎絲球炎徵象 (排除 C)，AKI 非單純 pre-renal (排除 D)，無 TTP 證據 (排除 E)。本題實質為感染科題。", "evidence": "WHO Leptospirosis Treatment Guideline; Levett PN. Leptospirosis Clin Microbiol Rev 2001"}, {"year": 113, "no": 62, "stem": "一位38歲女性，腦下垂體腫瘤手術後24小時內，尿量近4000ml，血鈉[Na] 自手術前的138 mEq/L上升 為150 mEq/L。根據紀錄，病人手術前並無特意增加水分輸注，本身無糖尿病等慢性病史。實驗室檢查: urine osmolality: 92 mOsm/kg H₂O, urine Na 30 mEq/L。以下處置，何者最適當?", "choices": {"A": "安排water deprivation test，追蹤plasma AVP or circulating copeptin level, 與血鈉[Na]變化", "B": "給予desmopressin (dDAVP)", "C": "給予tolvaptan", "D": "給予lactated ringer solution或0.9% saline補充體液容積", "E": "給予thiazides, amiloride, and NSAID，搭配water (without electrolytes) intake"}, "answer": "B", "is_endocrine": true, "subtopic": "Pituitary", "explanation": "B 對：腦下垂體術後 24 hr 內 polyuria + hypernatremia + dilute urine (osmo 92 << plasma) → 經典 central diabetes insipidus (因 ADH 神經元損傷)。立即治療為 desmopressin (dDAVP)。A water deprivation test 病人已脫水高鈉不需再脫水測。C tolvaptan (V2 antagonist) 治療 SIADH，反向用錯。D 等張液僅補體液不解決 free water deficit。E 三聯療法為 nephrogenic DI 治療。術後 transient DI 多在 5-7 天緩解，部分轉 SIADH (triphasic response)。", "evidence": "Williams Endo 14e, Ch 10 Posterior Pituitary; Endocrine Society Hyponatremia Guidelines"}, {"year": 113, "no": 63, "stem": "一位84歲男性，過去除高血壓、前列腺肥大，定期服用amlodipine, tamsulosin之外，身體狀況良好。在 某次例行檢查中發現血鈉 [Na] 127 mEq/L，病人意識清楚，四肢無水腫。飲食正常也未刻意限制鹽分攝 取。門診再次實驗室檢查: [Na] 128 mEq/L，creatinine 0.84 mg/dL, plasma osmolality 262 mOsm/kg H₂O, urine Na 88 mEq/L, urine osmolality 620 mOsm/kg H₂O, 安排 CT檢查(brain, chest, abdomen/pelvis)無異常發現。針對病人的hyponatremia，您會建議採取以下何種診斷或治療處置?", "choices": {"A": "檢查 lse, "subtopic": null, "explanation": null, "evidence": null}, {"year": 113, "no": 66, "stem": "在一位有第2型糖尿病有明顯蛋白尿的患者中，區分單純性糖尿病腎臟病變與非糖尿病性腎絲球病變，下 列哪一項最沒有診斷價值？", "choices": {"A": "被診斷糖尿病的時間長短", "B": "有增殖性視網膜病變", "C": "蛋白尿的嚴重程度", "D": "有腎絲球性血尿", "E": "尿液出現紅血球圓柱體"}, "answer": "C", "is_endocrine": true, "subtopic": "DM", "explanation": "C 對：「蛋白尿嚴重程度」對區分糖尿病腎病 (DKD) 與 non-DKD 「最沒有」診斷價值——兩者都可有 nephrotic range 蛋白尿。A 對：DM <5 年發生蛋白尿應懷疑 non-DKD。B 對：proliferative retinopathy 與 DKD 強相關 (>90% 同時存在)，缺乏視網膜病變應懷疑 non-DKD。D 對：glomerular hematuria 非典型 DKD，更傾向 IgA、lupus 等。E 對：RBC cast 為 GN，DKD 罕見。", "evidence": "KDIGO Clinical Practice Guideline for Diabetes Management in CKD 2022; ADA Standards of Care 2024"}, {"year": 113, "no": 67, "stem": "一位最近被診斷為原發性膜性腎病（Membranous nephropathy，簡稱MN）、腎功能正常且有腎病症候 群（Nephrotic syndrome，簡稱NS）的患者，下列哪一項血清學及免疫組織學發現可以預測此病患很可 能自發性緩解？", "choices": {"A": "血清抗PLA2R抗體陰性且腎小球中PLA2R1抗原陽性", "B": "血清抗PLA2R抗體陰性且腎小球中PLA2R1抗原陰性", "C": "血清抗PLA2R抗體陽性且腎小球中PLA2R1抗原陽性", "D": "血清抗PLA2R抗體陽性且腎小球中PLA2R1抗原陰性", "E": "與抗PLA2R抗體檢出無關"}, "answer": "A", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 113, "no": 68, "stem": "一位72歲男性因C型肝炎相關肝硬化併發腹水及2級食道靜脈曲張入院，目的是處理日益增加的腹水及水 腫，對漸增劑量的furosemide and spironolactone治療無效。腹腔穿刺顯示沒有自發性細菌性腹膜炎的證 據。接受靜脈注射利尿劑治療後，出現急性腎損傷（AKI），血清肌酸酐（SCr）從入院時的0.8 mg/dl上 升到3天後的1.8 mg/dl。在停用利尿劑並給予每日白蛋白1 g/kg靜脈注射治療後，腎功能持續惡化，並在 接下來的2天內出現少尿。理學檢查顯示：血壓100/65 mmHg，有明顯的腹水和2級下肢水腫。實驗室檢 查顯示：SCr 3.4 mg/dl，血清白蛋白2.6 g/dl，膽紅素4.5 mg/dl。鈉的排除分率（FENa）為0.05%。尿檢 顯示無蛋白，尿沉渣顯示腎小管型圓柱體。腹部超聲顯示中等程度的腹水，腎臟大小和回聲均正常，無腎 積水。最可能的診斷是下列哪一項？", "choices": {"A": "腹腔室隔症候群 (abdominal compartment syndrome)", "B": "急性腎小管壞死 (acute tubular necrosis)", "C": "腎前性氮血症 （prerenal azotemia）", "D": "肝腎症候群 (hepatorenal syndrome)", "E": "快速進行性腎絲球體腎炎( rapidly progressive glomerulonephritis)"}, "answer": "D", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 113, "no": 69, "stem": "一名63歲男性在進行冠狀動脈繞道術(coronary artery bypass graft, CABG)和二尖瓣置換手術後2天出現 急性腎 ced cholestasis)。E 仍未到 decompensation (Albumin 3.9、INR 1.05)。A 錯：T4/TSH 都在正常範圍。本題為肝病題。", "evidence": "AASLD Cholestatic Liver Disease Guidance; EASL Guidelines on Cholestasis"}, {"year": 113, "no": 75, "stem": "一位74歲糖尿病女性患者合併慢性腎臟病第四期，長期服用口服降血糖用藥搭配胰島素控制，由於意識不 清醒被送到急診就醫，經檢查有代謝性酸中毒(metabolic acidosis)，其陰離子隙(anion gap)為26 mmol/L，經積極使用碳酸氫鈉（sodium bicarbonate)矯正，仍無法控正，下列何種用口服降血糖藥物可 能為誘發的原因？", "choices": {"A": "二肽基肽酶-4抑制劑（Dipeptidyl peptidase-4 inhibitor）", "B": "過氧化物酶體增殖物活化受體γ（PPAR-γ）", "C": "α-葡萄糖苷酶抑制劑(α-glucosidase inhibitor)", "D": "二甲雙胍類降血糖藥物 (Metformin)", "E": "磺醯基尿素(sulfonylurea)"}, "answer": "D", "is_endocrine": true, "subtopic": "DM", "explanation": "D 對：Metformin-associated lactic acidosis (MALA) 為 metformin 在腎功能不全病人累積的嚴重副作用，特徵為「高 anion gap metabolic acidosis (lactate >5 mmol/L) + 無法用 sodium bicarb 矯正」。死亡率 30-50%。CKD stage 4 (eGFR <30) 為 metformin 禁忌。處置：停藥 + 透析 (CRRT 清除 lactate + metformin)。", "evidence": "ADA Standards of Care 2024 Metformin Section; DeFronzo R et al. Metformin Lactic Acidosis 2016"}, {"year": 113, "no": 76, "stem": "臨床上會造成病患的一氧化碳肺瀰散量(diffusion capacity of carbon monoxide，DLCO)下降的常見原因 不包括：", "choices": {"A": "肺氣腫", "B": "肺動脈高壓", "C": "氣喘急性發作", "D": "肺纖維化", "E": "貧血"}, "answer": "C", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 113, "no": 77, "stem": "病人58歲男性，有僵直性脊椎炎，近月來逐漸運動性呼吸困難，乃至醫院求診。經系列心臟檢查確診主動 脈閉鎖不全(Aortic regurgitation)，依據標的理學檢查(Targeted physical examination) ，請問下列何組才 是正確的聽診? (1) 在心尖處(Apical area)有Gr 2/6 mid-systolic click and late systolic murmur， (2) 在右胸骨緣(Right sternal border)有Gr3/6 decrescendo, early diastolic murmur， (3) 在心尖處有Gr 1-2/6 mid-diastolic murmur ， (4) 在右胸骨緣下端有S3 gallop， (5) 在心尖處有Open Snap ， (6) 在主動脈區(Aortic area)有Ejection click 。", "choices": {"A": "(1)+(2)+(3)", "B": "(2)+(4)+(6)", "C": "(1)+(3)+(5)", "D": "(2)+(3)+(4)", "E": "(1)+(4)+(5)"}, "answer": "D", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 113, "no": 78, "stem": "下列不適用於幽門螺旋桿菌(Helicobacter pylori)之救援治療(salvage therapy)的處方(regimen)?", "choices": {"A": "bismuth quadruple regimen", "B": "clarithromycin triple regimen", "C": "concomitant regimen", "D": "levofloxacin triple regimen", "E": "rifabutin triple regimen"}, "answer": "B", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 113, "no": 79, "stem": "嗜鉻細胞瘤 (pheochromocytoma) 被視為“偉大的偽裝者(the great masquerader)”，以下哪一項描述最正 確?", "choices": {"A": "嗜鉻細胞瘤的症狀包括高血壓及陣發性的心悸、冒汗、頭痛等。通常其症狀明顯，但也有某些病人可 以無症狀達數年之久", "B": "嗜鉻細胞瘤的症狀發作頻率不定，但每次發作時間通常大於兩小時", "C": "三環抗憂鬱藥(tricyclic antidepressants)、opiates、metoclopramide等藥會減少嗜鉻細胞瘤的症狀表 現，延緩診斷", "D": "病人懷疑有嗜鉻細胞瘤需要做電腦斷層或核磁共振等影像學檢查時，為減少刺激，最好不要施打顯影 劑", "E": "與其他檢驗方式比較，檢測血中的metanephrine 具有高敏感度，但因很容易受到靜脈穿刺 (venipuncture) 等壓力影響，而有較高的偽陽性"}, "answer": "A", "is_endocrine": true, "subtopic": "Adrenal", "explanation": "A 對：嗜鉻細胞瘤稱「the great masquerader」因為其臨床表現變化大 — 典型三聯 (頭痛 + 心悸 + 冒汗) + paroxysmal hypertension，但「也有病人可數年無症狀」(尤其 incidentaloma 或 cluster syndrome 病人)。B 錯：發作通常 5-60 min。C 錯：TCA/opiates/metoclopramide 反而會「誘發」症狀而非減少。D 錯：CT 顯影劑現代非碘化造影劑安全；α-blocker 預治療後即可。E 錯：plasma free metanephrines 為 first-line 篩檢但「不易」受 venipuncture 壓力影響。", "evidence": "Endocrine Society Pheochromocytoma Guideline 2014 (Lenders JW et al.)"}, {"year": 113, "no": 80, "stem": "下列有關與性病表徵(syndrome)致病原(pathogen)之配對，何這為非?", "choices": {"A": "Epididymitis：Chlamydia trachomatis", "B": "Bartholinitis ：Trichomonas vaginalis", "C": "Infertility ： Neisseria gonorrhoeae", "D": "Genital warts：Human herpes virus type 8", "E": "Genital ulcers ： Haemophilus ducreyi"}, "answer": "D", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 113, "no": 81, "stem": "下列有關於肺部麴菌(Aspergillus)感染之敘述，下列那項最「不正確」?", "choices": {"A": "Aspergillus是一種黴菌，隨著宿主免疫力情形，會造成不同樣貌的感染形式", "B": "Invasive pulmonary aspergillosis主要是出現在免疫低下族群，近幾年發現流感感染者及新冠肺炎感 染者也會併發Aspergillus感染", "C": "Invasive pulmonary aspergillus的實驗室診斷主要是依據血中或是肺部沖洗液之Galactomannan或 是PCR", "D": "Chronic pulm terococcus species (VRE) 和抗生素治療的敘述，以下那 一組最正確？ (1) 只要尿、痰或rectal swab 培養發現VRE，就應該立即治療。 (2) 可以使用Daptomycin治療VRE肺炎。 (3) 可以使用 Linezolid 或Daptomycin治療VRE菌血症。 (4) 近年VRE菌株數量在疾管署的統計之下，已佔整體Enterococcus species中之三至四成以上。 (5) VRE雖具Vancomycin 抗藥性，使用Teicoplanin治療其感染仍有很好之療效。", "choices": {"A": "(1)+(2)+(3)", "B": "(2)+(3)+(4)", "C": "(2)+(3)+(5)", "D": "(2)+(3)", "E": "(3)+(4)"}, "answer": "E", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 113, "no": 86, "stem": "關於菌尿 (bacteriuria)和尿路感染的敘述，以下何者錯誤？", "choices": {"A": "尿路感染的危險因子包括停經婦女、性行為、糖尿病和失禁", "B": "懷孕婦女有菌尿時，給予適當抗生素治療可以降低腎盂腎炎、早產、嬰孩低出生體重之發生", "C": "大多數有尿路感染的男性都有尿路功能性或解剖結構的異常，例如攝護腺肥大或包皮因素", "D": "一位70歲女性，一年前中風後長期接受導尿管置放，因流鼻水、咳嗽及輕微發燒被送到急診室，給 予症狀性治療後送回護理之家，3天後病人被帶回門診追蹤，此時病人只有輕微咳嗽，餵食情況良 好，而在急診室所送檢之尿培養報告有糞腸球菌 (Enterococcus faecalis)，此時應給 予ciprofloxacin治療", "E": "腎移植病人、嗜中性白血球數低下、要接受尿路手術者，有菌尿但沒有症狀，尿培養報告 有Vancomycin抗藥性尿腸球菌 (Enterococcus faecium)，此時可以給予口服linezolid治療"}, "answer": "D", "is_endocrine": true, "subtopic": "DM", "explanation": "D 錯：長期導尿管置放病人尿培養陽性 (asymptomatic catheter-associated bacteriuria) 不應例行性抗生素治療 (IDSA 2009 Guidelines)。除非有 UTI 症狀 (發燒、腰痛、尿道感染症狀)，否則不需要 ciprofloxacin。此病人主要為上呼吸道症狀，與菌尿無關。A/B/C/E 為正確 UTI 概念。本題為感染題，DM 標籤為 keyword 誤抓。", "evidence": "IDSA Guidelines for Asymptomatic Bacteriuria 2019"}, {"year": 113, "no": 87, "stem": "最近有關食肉菌 (flesh-eating bacteria) 中A族鏈球菌造成的感染症之新聞報導令大眾害怕，以下敘述何者 正確？ (1) A族鏈球菌造成的急性咽喉炎(pharyngitis)常有程度不等的發燒、喉痛、咽喉紅腫、扁桃腺和後咽部化 膿，也可以有猩紅熱表現。 (2) 臨床表現可以是膿痂疹 (impetigo)、丹毒或蜂窩組織炎。 (3) 嚴重可造成壞死性肌筋膜炎，甚或毒性休克症候群。 (4) 同住家人、或密切接觸者、或在擁擠環境中容易傳播。 (5) 10天口服Amoxicillin治療急性咽喉炎可縮短疾病症狀、可降低急性風濕熱之風險。", "choices": {"A": "(1)+(2)+(3)", "B": "(1)+(3)+(5)", "C": "(1)+(2)+(3)+(4)", "D": "(1)+(2)+(3)+(5)", "E": "(1)+(2)+(3)+(4)+(5)"}, "answer": "E", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 113, "no": 88, "stem": "Klebsiella pneumoniae是重要且常見的致病菌，常造成社區性肝膿瘍、泌尿道感染，也常造成嚴重的院內 感染，以下相關敘述，何者正確？", "choices": {"A": "臨床上wild type K. pneumoniae 可用Ampic
