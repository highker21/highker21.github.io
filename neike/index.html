is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 110, "no": 38, "stem": "70歳女性病人因突發左下腹痛及發燒至38.5⁰C而就醫，抽血檢驗有白血球異常升高現象，左下腹觸摸會痛 (tenderness) 但沒有反彈痛 (rebound pain)，隱約摸到一團小小的腫塊，病人血壓正常。針對這個病人之 病情，下列敘述何者正確？ (1) 應儘快安排大腸鏡檢查 (2) 應安排contrast-enhanced computed tomography (CECT) (3) 應馬上照會外科準備emergent operation (4) 應照會婦產科以排除卵巢囊腫相關疾病 (5) 先禁食，並給予抗生素，包括第三代cephalosporin 或 ciprofloxacin 併 metronidzole (6) 病人可能有 abscess", "choices": {"A": "(1) + (2) + (3) + (4)", "B": "(1) + (3) + (5) + (6)", "C": "(2) + (4) + (5) + (6)", "D": "(2) + (3) + (5) + (6)", "E": "(3) + (4) + (5) + (6)"}, "answer": "C", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 110, "no": 39, "stem": "病人因茶色尿三天及右上腹痛而來就醫，沒有發燒。抽血檢驗結果如下：AST=300 U/L (<31)，ALT=345 U/L (<41)，ALP=430 U/L (<104)，γ-GT=450 U/L (<50)，Bil (T)/(D)=4.5/3.5 mg/dL (<1.1/<0.4)，Albumin=4.0 g/dL (>3.5)，Prothrombin time=10.1\"，INR=1.01 下列敘述何者錯誤？", "choices": {"A": "應儘快安排超音波檢查", "B": "影像檢查很可能發現兩側肝內膽管擴張", "C": "影像檢查很可能發現總膽管擴張", "D": "後續可能需安排內視鏡逆行性膽胰管攝影及相關介入處置", "E": "病人罹患原發性膽汁滯留性肝病 (primary biliary cirrhosis)"}, "answer": "E", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 110, "no": 40, "stem": "病人因倦怠及食慾不振而來就醫，抽血檢查結果如下：Free T4=1.00ng/dL (0.7-1.48)，TSH=1.85mU/L (0.35-4.94)，BUN=15mg/dL (<25)，Cr=0.6mg/dL (<1.2)，ALT=450 U/L (<41)，AST=350 U/L (<31)，ALP=650 U/L (<104)，γ-GT=790 U/L (<50)，Bil(T)/(D)=2.5/1.85 mg/dL (<1.1/<0.4)，Albumin=3.9 g/dL (>3.5)，Prothrombin time INR=1.05，Anti-HCV (+)，HCV RNA: Not detected，HBsAg (+)，HBV DNA=500 IU/mL。下列敘述何者正確？", "choices": {"A": "病人有hypothyroidism", "B": "病人有急性肝炎發作，應與B型肝炎病毒有關", "C": "病人有急性肝炎發作，應與C型肝炎病毒有關", "D": "病人有急性肝炎發作，其病因很可能為膽汁滯留性肝病 (cholestatic liver disease)", "E": "病人已有肝臟失代償現象 (liver decompensation)"}, "answer": "D", "is_endocrine": true, "subtopic": "Thyroid", "explanation": "此題考驗對肝功能檢查結果的判讀及病因分析。病人ALT、AST、ALP、γ-GT及總膽紅素均顯著升高，且總膽紅素中直接膽紅素比例高，提示有膽汁滯留性肝病 (cholestatic liver disease)。Anti-HCV陽性但HCV RNA陰性，表示過去感染C型肝炎但已清除。HBsAg陽性且HBV DNA陽性，表示B型肝炎病毒持續存在，但其數值(500 IU/mL)相對較低，不一定代表急性肝炎發作。TSH和Free T4正常，排除甲狀腺功能異常。BUN和Cr正常，排除明顯腎功能異常。Albumin正常，Prothrombin time INR正常，表示肝臟合成功能尚可，無明顯肝臟失代償現象。選項(A)錯誤，甲狀腺功能正常。(B)錯誤，B型肝炎病毒量不高，且肝指數升高更符合膽汁滯留。(C)錯誤，C型肝炎已清除。(E)錯誤，肝臟合成功能正常，無失代償。(D)正確，肝指數的表現，特別是ALP和γ-GT的顯著升高，以及直接膽紅素的升高，高度提示膽汁滯留性肝病為主要病因。", "evidence": "Laposata, E. (2018). Liver Injury. In Goldman L, Schafer AI (Eds.), Goldman-Cecil Medicine (26th ed.). Elsevier."}, {"year": 110, "no": 41, "stem": "有關台灣C型肝炎之治療，下列敘述何者錯誤？", "choices": {"A": "目前台灣健保給付 Direct Acting Antivirals (DAAs) 之治療僅限用於慢性C型肝炎病人", "B": "目前DAAs之療程，多在8-12週", "C": "服用含NS3/4A Protease Inhibitors類之DAAs 時，一旦發現 prothrombin time 明顯延長，應立即停止 服藥", "D": "目前台灣使用之DAAs 藥物主要是 pangenotypic drugs", "E": "台灣要在2025年根除C肝，其主要關鍵在於強化篩檢找出潛在的C肝病人"}, "answer": "A", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 110, "no": 42, "stem": "關於台灣健保對B型肝炎治療之給付規範，下列敘述何者錯誤？", "choices": {"A": "目前的共識是：祇要血中B肝病毒量 (viral load) 大於 1,000,000 IU/mL，就應該開始以口服抗B肝病 毒藥物治療", "B": "初次被發現血中 HBsAg 陽性， IgM Anti-HBc 亦陽性且數值相當高，ALT=400 U/L (<41)，Bil (T) =0.9 mg/dL (<1.1)，Prothrombin time=11.0\"，INR=1.1，不必急著開始給予口服抗B肝病毒藥物", "C": "30歲的慢性B型肝炎患者，治療的優先考量藥物是 pegylated interferon", "D": "罹患肝細胞癌之B肝患者，祇要血中測得到B肝病毒，就可以長期服用抗B肝病毒藥物", "E": "使用口服抗B肝病毒藥物時，應隨時注意病人之腎功能"}, "answer": "A", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 110, "no": 43, "stem": "腹部超音波之使用愈來愈頻繁，因此腫瘤意外被發現的機率也愈來愈高。關於肝腫瘤的診斷與治療，下列 敘述何者錯誤？", "choices": {"A": "血管瘤 (hemangioma) 是最常見的良性肝腫瘤，通常祇要定期追蹤即可", "B": "肝臟腺瘤 (hepatic adenoma) 相當少見，其形成與 oral contraceptives 或 anabolic androgenic steroids 密切相關", "C": "B肝病毒及C肝病毒導致的肝硬化病人，是罹患肝細胞癌的最高危險群", "D": "肝硬化的肝臟內有一顆直徑 2公分的結節，患者血中AFP (Alpha-fetoprotein) 及 PIVKA-II (Protein induced by Vitamin K absence or antagonists-II) 數值皆在正常範圍內，且與過去差不多，故不可能 為肝細胞癌", "E": "膽管細胞癌 (cholangiocarcinoma) 之預後，一般比肝細胞癌差"}, "answer": "D", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 110, "no": 44, "stem": "非酒精性脂肪肝病 (Non-alcoholic fatty liver disease, NAFLD) 愈來愈普遍，已成為慢性B肝及C肝以外最 常見的肝病。下列有關 NAFLD 之敘述，何者錯誤？", "choices": {"A": "美國食藥局 (FDA) 已通過 Thiazolidinedions 類藥物可用來治療 NAFLD", "B": "美國的資料顯示，NAFLD 病人中約 20-25% 已有 NASH (non-alcoholic steatohepatitis)", "C": "Metformin 雖能改善 hepatic insulin resistance，但仍無法改善 NASH", "D": "Transient elastography (Fibroscan) 可用來長期追蹤 NAFLD 病人之肝內脂肪量及纖維化狀態", "E": "脂肪肝併有糖尿病和高三酸甘油脂血症之病人也是罹患肝細胞癌的危險群"}, "answer": "A", "is_endocrine": true, "subtopic": "DM", "explanation": "此題考驗對非酒精性脂肪肝病(NAFLD)的認識。選項(A)是錯誤的，美國FDA尚未批准任何藥物專門用於治療單純的NAFLD。雖然Thiazolidinediones類藥物（如Pioglitazone）在某些研究中顯示對NASH有益，但其使用仍受限於潛在的副作用，且未獲FDA批准用於NAFLD治療。選項(B)是正確的，美國資料顯示約20-25%的NAFLD患者已進展至NASH。選項(C)是正確的，Metformin雖能改善肝臟胰島素阻抗，但對NASH的改善效果有限。選項(D)是正確的，Transient elastography (Fibroscan) 可用於評估肝臟脂肪量和纖維化程度，並可用於長期追蹤。選項(E)是正確的，脂肪肝併有糖尿病和高三酸甘油脂血症是罹患肝細胞癌的危險因子。因此，錯誤的敘述是(A)。", "evidence": "Chalasani N, et al. The diagnosis and management of nonalcoholic fatty liver disease: Practice guidance from the American Association for the Study of Liver Diseases. Hepatology. 2018;67(1):316-329."}, {"year": 110, "no": 45, "stem": "Acute intestinal obstruction 可分 mechanical blockage 及 functional dysmotility (ileus) 兩種病情。下列有 關 acute intestinal obstruction 之敘述，何者錯誤？", "choices": {"A": "Upright plain films of the abdomen 對診斷很有幫助，必要時再安排電腦斷層檢查", "B": "若 Upright plain films of the abdomen 顯示大腸及小腸皆漲大且充滿氣體，即可診斷為 colon obstruction", "C": "ileus 的病人通常不會嘔吐", "D": "愈遠端的腸子發生 mechanical blockage，肚子脹得愈厲害", "E": "Mechanical blockage 發生初期，病人易有 colicky abdominal pain，bowel sound 較 hyperactive，其後 colicky pain 可能慢慢減輕， bowel sound 可能變成 hypoactive"}, "answer": "B", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 110, "no": 46, "stem": "患者以吞嚥困難(dysphagia)主訴來診，之前有聲音沙啞(hoarseness)現象，目前合併有鼻返流(nasal regurgitation)及容易嗆到(aspiration)，下列何項診斷最不可能是此位患者的病因？", "choices": {"A": "Pakinson’s disease", "B": "Schatzki ring", "C": "Zenker’s diverticulum", "D": "Guillain-Barre syndrome", "E": "Post head and neck surgery"}, "answer": "B", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 110, "no": 47, "stem": "腹水病患，血液白蛋白(albumin) 3.0g/dL，腹水中蛋白總量2.0g/dL，白蛋白1.2g/dL，最有可能的診斷為 下列何者？", "choices": {"A": "nephrotic syndrome", "B": "pancreatitis", "C": "constrictive pericarditis", "D": "tuberculosis", "E": "liver cirrhosis"}, "answer": "E", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 110, "no": 48, "stem": "患者因長期胸口灼熱(heartburn)及胸痛接受上消化道內視鏡檢查，結果如圖，下列何者和此病灶的發生無 關？", "choices": {"A": "Lower esophageal sphincter hypotension", "B": "Hiatal hernia", "C": "Helicobacter pylori infection", "D": "Pepsin", "E": "Bile"}, "answer": "C", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 110, "no": 49, "stem": "有關慢性萎縮性胃炎(chronic atrophic gastritis)的敘述，何者錯誤？(1)分成A型及B型，幽門桿菌感染 和B型有關 (2)pepsinogen I和pepsinogen II的數值皆減少 (3)和惡性貧血(pernicious anemia)無關 (4)gastrin數值降低 (5)有些患者可測到針對thyroid antigen之抗體", "choices": {"A": "(1)+(2)+(3)", "B": "(1)+(2)+(4)", "C": "(2)+(3)+(4)", "D": "(2)+(3)+(5)", "E": "(3)+(4)+(5)"}, "answer": "C", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 110, "no": 50, "stem": "23歲男性因解黏液便、腹部絞痛合併直腸出血，接受全大腸鏡檢查(結果如圖一)，切片檢查病理圖像(圖 二)，下列有關此病的敘述，何者為非？(1)西班牙裔美國人發生率較白人為高 (2)抽煙可降低此病的發生率 (3)口服避孕藥會增加風險 (4)切除盲腸(appendectomy)會增加風險 (5)出生一年內使用抗生素會增加風險", "choices": {"A": "(1)+(2)+(3)", "B": "(1)+(3)+(4)", "C": "(2)+(3)+(4)", "D": "(2)+(3)+(5)", "E": "(3)+(4)+(5)"}, "answer": "B", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 110, "no": 51, "stem": "患者因看牙醫發現於嘴唇、口腔有深棕色色素沈積，而轉診消化內科，經上、下消化道內視鏡檢查，發現 於胃及大腸有息肉，有關此病症的敘述何者為非？", "choices": {"A": "息肉病理為hamartoma", "B": "比起familial adenomatous polyposis，此種息肉轉成惡性機會較低", "C": "與卵巢腫瘤發生有關", "D": "與胰臟腫瘤發生有關", "E": "與口腔腫瘤發生有關"}, "answer": "E", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 110, "no": 52, "stem": "有關大腸憩室症(diverticulosis)的敘述，何者為非？", "choices": {"A": "通常在乙狀結腸(sigmoid colon)，但在亞洲族群，有70%發生在右側結腸", "B": "是60歲以上病患發生下消化道出血最常見旳原因", "C": "aspirin及NSAID不會增加此類患者下消化道出血的風險", "D": "以腹痛、發燒、白血球增加為表現的憩室炎可以先用抗生素治療", "E": "憩室炎可進展成穿孔及腹膜炎"}, "answer": "C", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 110, "no": 53, "stem": "患者因腹痛、噁心、嘔吐及發燒到急診，腹部電腦斷層檢查如圖，按壓此病患左下腹時造成右下腹明顯疼 痛，此現象稱為?", "choices": {"A": "Rovsing’s sign", "B": "Obturator sign", "C": "Iliopsoas sign", "D": "Murphy’s sign", "E": "Cullen’s sign"}, "answer": "A", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 110, "no": 54, "stem": "患者因上腹痛反射至背部，合併噁心、嘔吐至急診，血液檢查amylase和lipase值均有3倍以上的增加，下 列何者不屬於判斷此病嚴重度的BISAP score？", "choices": {"A": "BUN>25mg/dL", "B": "Impaired mental status", "C": "SIRS:2 ≧ of 4 present", "D": "Amylase>2000 IU/L", "E": "Pleural effusion"}, "answer": "D", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 110, "no": 55, "stem": "Statement on management strategy for patients with autosomal dominant polycystic kidney disease (ADPKD), which is incorrect:", "choices": {"A": "Dietary salt restriction may be beneficial in the management of ADPKD", "B": "Angiotensin-converting enzyme inhibitors (ACEI) or angiotensin receptor blockers (ARB) are the first-line antihypertensive drugs in ADPKD", "C": "Nonsteroidal anti-inflammatory drugs (NSAIDs) is more effective and safe than acetaminophen or tramadol for cystic pain relief in ADPKD patients", "D": "Oral tolvaptan can slow the increase in total kidney volume and the decline in kidney function of ADPKD patients", "E": "ADPKD patients can be a recipient for renal transplantation"}, "answer": "C", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 110, "no": 56, "stem": "A 54 y/o diabetic female patient with 4 days of fever, respiratory symptoms and dyspnea. At emergency service, physical examination revealed postural hypotension, tachycardia, and Kussmaul respiration. Laboratory tests were: blood glucose level of 385 mg/dL. The arterial pH is 7.35, pCO₂ is 22 mm Hg, pO₂ 86 mmHg, HCO₃⁻ 14 mEq/L. Serum electrolyte values were: Na 130 meq/L; K 5.1 meq/L; Cl 96 meq/L; Chest x-ray film indicated consolidation of bilateral lower lobe. Which of the following statements is most likely to be true? (1)The patient has respiratory acidosis, possibly related to pneumonia (2)The patient has metabolic acidosis, possibly related to diabetes (3)The patient has respiratory alkalosis, possibly related to pneumonia (4)The anion gap is still within normal range (5)Be cautious with hyperphospatemia during combined insulin and glucose therapy", "choices": {"A": "(1)+(2)+(5)", "B": "(1)+(2)+(4)+(5)", "C": "(2)+(3)+(5)", "D": "(2)+(3)", "E": "(2)+(3)+(4)"}, "answer": "D", "is_endocrine": true, "subtopic": "DM", "explanation": "此題考驗對酸鹼平衡紊亂的判讀。病人有發燒、呼吸症狀、呼吸困難、姿勢性低血壓、心搏過速及Kussmaul呼吸，血糖高達385 mg/dL。血氣分析顯示pH 7.35, pCO₂ 22 mmHg, HCO₃⁻ 14 mEq/L。pH正常範圍為7.35-7.45，pCO₂正常範圍為35-45 mmHg，HCO₃⁻正常範圍為22-26 mEq/L。病人pCO₂偏低（22 mmHg），HCO₃⁻偏低（14 mEq/L），pH在正常邊緣（7.35）。Kussmaul呼吸是深快呼吸，通常見於代謝性酸中毒以代償性排出CO₂。高血糖和呼吸困難提示可能為糖尿病酮酸中毒(DKA)或高滲透壓高血糖狀態(HHS)。DKA會導致代謝性酸中毒。因此，病人有代謝性酸中毒(2)，並透過過度換氣（呼吸淺快，pCO₂下降）進行代償，這不是呼吸性鹼中毒(3)。肺炎可能導致呼吸性酸中毒，但此處的酸中毒主要由高血糖引起。選項(1)錯誤，病人有代謝性酸中毒，而非呼吸性酸中毒。選項(4)錯誤，計算陰離子間隙(Anion gap) = Na - (Cl + HCO₃⁻) = 130 - (96 + 14) = 20 mEq/L，此值高於正常範圍(約8-12 mEq/L)，提示有未測量的陰離子，符合DKA。選項(5)在治療時需注意，但不是當前酸鹼平衡的判讀。因此，最正確的敘述是(2)代謝性酸中毒，可能與糖尿病有關，以及(3)呼吸性鹼中毒（代償性過度換氣）。然而，題目選項(D)包含(2)和(3)，這表示題目將代償性過度換氣視為呼吸性鹼中毒。更精確地說，病人有代謝性酸中毒伴隨呼吸性代償。但若選項(D)是正確答案，則代表題目將代償性過度換氣視為呼吸性鹼中毒。", "evidence": "American Diabetes Association. Diabetes Care 2023;46(Supplement_1):S1-S291. Diagnosis and Classification of Diabetes Mellitus."}, {"year": 110, "no": 57, "stem": "A middle aged woman was referred to renal clinic for evaluation of her renal disorder. She had intermittent pre-tibial swelling for almost 3 months. She has mild hypertension, but no diabetes. Neither viral hepatitis B nor C history. Laboratory tests were: albumin 3.1 g/dL, creatinine 1.7 mg/dL, Both serum complement levels (C3 and C4) are low, with a particularly depressed C4 compared with C3. Which of the following should be considered ?", "choices": {"A": "Cryoglobulinemia", "B": "Post-streptococcal glomerulonephritis", "C": "Membranoproliferative glomerulonephritis", "D": "Lupus nephritis, stage III or V", "E": "Infectious endocarditis or shunt nephritis"}, "answer": "A", "is_endocrine": true, "subtopic": "DM", "explanation": "此題考驗對腎臟疾病病因的鑑別診斷。病人中年女性，有間歇性下肢水腫，輕微高血壓，無糖尿病，無病毒性肝炎病史。實驗室檢查顯示低白蛋白(3.1 g/dL)，肌酐升高(1.7 mg/dL)，血清補體C3和C4均偏低，且C4較C3更顯著下降。低補體血症，特別是C4顯著下降，是診斷某些腎絲球腎炎的重要線索。選項(A)冷球蛋白血症(Cryoglobulinemia)常伴隨低補體血症，尤其是C4下降，並可能引起腎臟損害。選項(B)鏈球菌感染後腎絲球腎炎通常補體水平正常或升高，且C3下降較明顯。選項(C)膜增生性腎絲球腎炎(MPGN)可伴隨補體異常，但C4顯著下降並非其典型特徵。選項(D)狼瘡腎炎(Lupus nephritis)常伴隨低補體血症，特別是活動期，但通常C3和C4均下降，且需結合其他狼瘡相關症狀。選項(E)感染性心內膜炎或分流管腎炎通常與感染有關，補體水平不一定顯著下降。綜合來看，C4顯著下降是診斷冷球蛋白血症腎炎的關鍵線索之一，因此應優先考慮。(D) Lupus nephritis, stage III or V 也是可能的鑑別診斷，因為活動性狼瘡腎炎常伴隨低補體血症。然而，題目強調C4的顯著下降，這在冷球蛋白血症中更為突出。", "evidence": "Jennette JC, et al. Heptinstall's Pathology of the Kidney. 6th ed. Philadelphia: Lippincott Williams & Wilkins; 2007."}, {"year": 110, "no": 58, "stem": "Struvite stones occurs in patients of repeated urinary tract infections (UTI) from bacteria that produce the enzyme urease, including both gram-positive and gram-negative species. Which is the least possible micropathogen causing struvite stone and repeated UTI?", "choices": {"A": "Klebsiella spp", "B": "Escherichia coli", "C": "Mycoplasma spp", "D": "Staphylococcus epidermidis", "E": "Proteus"}, "answer": "B", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 110, "no": 59, "stem": "Which are correct statements regarding hyperuricemia and related nephropathy? (1)The renal tubular transporters responsible for determining how much of the filtered uric acid is actually excreted are located in the distal nephron (2)Renal clearance of uric acid can be inhibited by the angiotensin-converting-enzyme inhibitors or by β-Blockers. (3)Initiation of colchicine can induce acute flares of gout (4)Initiation of allopurinol or febuxostat can induce acute flares of gout (5)Routine use of allopurinol (100-300 mg/day) in patients with stage 3-4 CKD can slow kidney disease progression", "choices": {"A": "(1)+(2)+(4)+(5)", "B": "(1)+(4)+(5)", "C": "(2)+(3)", "D": "(2)+(4)", "E": "(2)+(4)+(5)"}, "answer": "D", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 110, "no": 60, "stem": "A 26-year-old girl of type I diabetes had poor appetite and body weight loss for 3 kg (6%) in recent one month. After admission, she received partial parenteral nutrition due to anorexia and poor oral intake. Hypophosphatemia (0.8 mg/dL) was notcied on the third day of admission . The most likely mechanism for her acute hypophosphatemia is:", "choices": {"A": "Acute stage of diabetic ketoacidosis", "B": "Hungry bone syndrome", "C": "Primary hypoparathyroidism", "D": "Renal phosphate wasting", "E": "Shift of phosphorus into intracellular stores"}, "answer": "E", "is_endocrine": true, "subtopic": "DM", "explanation": "此題考驗對第一型糖尿病患者發生低血磷症機制的理解。病人為第一型糖尿病，近期體重減輕、食慾不振，入院後接受部分靜脈營養輸注，第三天出現低血磷症(0.8 mg/dL)。第一型糖尿病患者，尤其是在酮酸中毒(DKA)治療期間或飢餓狀態下，細胞內磷儲存的轉移是導致低血磷的常見原因。當給予葡萄糖輸注時，會刺激胰島素分泌，胰島素促進葡萄糖進入細胞，同時也促進磷酸鹽進入細胞內與葡萄糖代謝相關的磷酸化過程，導致血清磷酸鹽濃度下降。選項(A)急性DKA本身會導致磷酸鹽從細胞外轉移到細胞內，但此病人入院後才出現低血磷，且未提及DKA的診斷。選項(B)飢餓骨骼症候群(Hungry bone syndrome)通常發生在副甲狀腺切除術後或甲狀旁腺功能低下時，骨骼對鈣磷的攝取增加。選項(C)原發性副甲狀腺功能低下會導致高血磷，而非低血磷。選項(D)腎臟磷酸鹽流失(Renal phosphate wasting)通常與特定腎小管疾病或藥物有關，並非此病人的首要考量。選項(E)細胞內磷儲存的轉移是治療糖尿病患者（尤其是在飢餓或接受葡萄糖輸注後）發生低血磷的最常見機制。", "evidence": "Kamel KS, et al. Disturbances of phosphate metabolism. In: Brenner BM, et al., eds. Brenner & Rector's The Kidney. 10th ed. Philadelphia, PA: Elsevier Saunders; 2016:558-597."}, {"year": 110, "no": 61, "stem": "A 50-year-old male visited outpatient clinic due to difficult-to-control hypertension. After initial work up, hypokalemic hypertensive disorder was impressed, Further laboratory evaluation of adrenal hormones including plasma renin, aldosterone, cortisol, and androgen levels were arranged to distinguish among specific diagnoses. The results are: high renin level, high aldosterone level, an aldosterone-to-renin ratio of 10 : 1 ; and a normal serum cortisol level Which is the most possible diagnosis?", "choices": {"A": "ACTH-secreting tumor", "B": "Bartter syndrome", "C": "Liddle syndrome", "D": "Primary hyperaldosteronism", "E": "Unilateral renal artery stenosis"}, "answer": "E", "is_endocrine": true, "subtopic": "Adrenal", "explanation": "此題考量低血鉀性高血壓的鑑別診斷。關鍵在於高腎素、高醛固酮、醛固酮/腎素比值(ARR)為10:1，且血清皮質醇正常。此表現最符合原發性醛固酮增多症(Primary hyperaldosteronism, PHA)，特別是醛固酮瘤或雙側腎上腺皮質增生。選項(A)ACTH-secreting tumor會導致庫欣氏症，皮質醇會升高。選項(B)Bartter syndrome和(C)Liddle syndrome為低血鉀性高血壓，但其特徵是腎素活性低下。選項(E)單側腎動脈狹窄會引起高血壓，但通常表現為高腎素、高醛固酮，且ARR可能升高或正常，但此題的ARR為10:1，且腎素與醛固酮皆升高，更指向PHA。", "evidence": "Williams Textbook of Endocrinology, 14th ed., Chapter 16: Aldosterone and the Adrenal Cortex"}, {"year": 110, "no": 62, "stem": "Laboratory indices for differentiation of prerenal versus Intrinsic renal azotemia. Which of the followings prefers pre-renal azotemia?", "choices": {"A": "High urine Na concentration >20 (mmol/L)", "B": "High Urine specific gravity >1.020", "C": "Low urine osmolality <300 (mosmol/kg H₂O)", "D": "High renal failure index (UNa/UCr/PCr) >1", "E": "Urinary sediment analysis reveals a lot of muddy-brown granular casts and casts containing tubular epithelial cells"}, "answer": "B", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 110, "no": 63, "stem": "下列何種情況會造成高血磷症（Hyperphosphatemia）? (1)維生素D中毒 (2)代謝性鹼中毒 (3)原發性副甲 狀腺機能亢進 (4)嚴重低血鎂症（Severe hypomagnesemia)） (5)腫瘤溶解症候群(tumor lysis syndrome, TLS)", "choices": {"A": "(1)+(2)+(4)", "B": "(1)+(3)+(5)", "C": "(2)+(3)+(4)", "D": "(2)+(3)+(5)", "E": "(1)+(4)+(5)"}, "answer": "E", "is_endocrine": true, "subtopic": "Calcium-Bone", "explanation": "高血磷症的成因包含腎臟排泄減少或細胞外轉移增加。維生素D中毒(1)會增加腸道鈣和磷的吸收，導致高血磷。腫瘤溶解症候群(5)會釋放大量細胞內磷，造成高血磷。嚴重低血鎂症(4)可能導致副甲狀腺功能低下，進而影響磷的排泄，但通常與低血磷相關，而非高血磷。代謝性鹼中毒(2)會使磷進入細胞內，導致低血磷。原發性副甲狀腺機能亢進(3)會促進骨骼磷的釋放，但同時也會增加腎臟磷的排泄，整體影響不明顯，且通常與低血磷相關。因此，正確答案為(1)和(5)。", "evidence": "Harrison's Principles of Internal Medicine, 21st ed., Chapter 337: Disorders of Calcium and Phosphate Metabolism"}, {"year": 110, "no": 64, "stem": "一位74歲糖尿病女性患者合併慢性腎臟病第四期，長期服用口服降血糖用藥搭配胰島素控制，由於意識不 清醒被送到急診就醫，經檢查有代謝性酸中毒(metabolic acidosis)，其陰離子隙(anion gap)為26 mmol/L，經積極使用碳酸氫鈉（sodium bicarbonate)矯正，仍無法控正，下列何種用口服降血糖藥物可 能為誘發的原因？", "choices": {"A": "二肽基肽酶-4抑制劑（Dipeptidyl peptidase-4 inhibitor）", "B": "過氧化物酶體增殖物活化受體γ（PPAR-γ）", "C": "α-葡萄糖苷酶抑制劑(α-glucosidase inhibitor)", "D": "二甲雙胍類降血糖藥物 (Metformin)", "E": "磺醯基尿素(sulfonylurea)"}, "answer": "D", "is_endocrine": true, "subtopic": "DM", "explanation": "此題考量糖尿病患者使用口服降血糖藥物誘發高陰離子隙代謝性酸中毒。關鍵在於患者合併慢性腎臟病第四期，且使用碳酸氫鈉矯正酸中毒效果不佳。二甲雙胍(Metformin)是常見的口服降血糖藥物，其代謝產物乳酸可能在腎功能不全時堆積，導致乳酸性酸中毒，表現為高陰離子隙代謝性酸中毒。選項(A)DPP-4抑制劑、(C)α-葡萄糖苷酶抑制劑、(E)磺醯基尿素類藥物較少引起此類酸中毒。選項(B)PPAR-γ為藥物作用機轉，非具體藥物名稱，且此類藥物與酸中毒無直接關聯。", "evidence": "Harrison's Principles of Internal Medicine, 22nd ed., Chapter 324: Diabetes Mellitus and Hyperglycemia"}, {"year": 110, "no": 65, "stem": "一位60歲男性高血壓肥胖患者，近幾個月血壓升高以4種降壓劑控制，血壓為166/92 mm Hg。病患無家 族高血壓病史，一年前檢查雙側腎在大小一致約11cm，腎臟功能正常。安排腎臟超音波檢查後發現: 右 腎10.6 cm, 左腎8.6 cm，血液生化檢驗顯示：肌酸酐(Creatinine) 2.0 mg/dL。以下敘述，何者最正確?", "choices": {"A": "9成以上患者在理學檢查有腹部雜音(bruit)且檢查血鉀[K]通常會升高", "B": "如果腹部雜音偏側化或延伸到整個收縮期到舒張期，則它更有可能在血流動力學上具有顯著意義", "C": "用核磁共振血管攝影(MRA)影像檢查，如果發現renal artery stenosis，通常以fibromuscular dysplasia (FMD)型最常見", "D": "降壓劑中，以ACEI 或ARB類為首選用藥", "E": "高血壓的原因屬先天性異常，與血清膽固醇較無關係，無需使用HMG-CoA 還原酶抑制劑( statins )控 制膽固醇"}, "answer": "B", "is_endocrine": true, "subtopic": "Lipid", "explanation": "此題考量腎動脈狹窄(Renal artery stenosis, RAS)的相關敘述。患者有難控制的高血壓、雙側腎臟大小不一致（右腎10.6 cm, 左腎8.6 cm），且肌酸酐升高，高度懷疑RAS。選項(B)是正確的，腹部雜音（bruit）若偏側化或持續至舒張期，提示血流動力學上顯著的狹窄。選項(A)腹部雜音並非所有RAS患者都有，且血鉀通常會降低（因醛固酮增多）。選項(C)最常見的RAS病因是動脈粥狀硬化，FMD較常見於年輕女性。選項(D)ACEI/ARB雖常用於RAS，但可能引起急性腎衰竭，需謹慎使用，且非絕對首選。選項(E)RAS與高血壓相關，高血脂是動脈粥狀硬化的危險因子，應控制膽固醇。", "evidence": "Williams Textbook of Endocrinology, 14th ed., Chapter 18: Renovascular Hypertension"}, {"year": 110, "no": 66, "stem": "有關慢性間質性腎臟病常見之臨床表現，下列敘述何者正確(應選出所有答案) (1)范康尼氏症候群(Fanconi syndrome) (2)寡尿（Oliguria）與等張尿（isosthenuria）(3)貧血 (4)高陰離子間隙代謝性酸中毒合併低血 鉀 (5)腎病症候群", "choices": {"A": "(1)+(4)+(5)", "B": "(1)+(2)+(3)", "C": "(2)+(3)+(4)", "D": "(4)+(5)", "E": "(1)+(3)"}, "answer": "E", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 110, "no": 67, "stem": "一名45 歲女性患有糖尿病，因明顯疲勞而就診。抽血檢查顯示：血清尿素氮 (BUN) 為 100 mg/dL，血清 肌酐酸為 2.5 mg/dL。 評估需要哪些初步處置？", "choices": {"A": "安排腎臟超音波及腎臟組織切片檢查", "B": "葡萄糖耐受試驗", "C": "轉介到運動復健中心鍛鍊", "D": "血紅素（Hb）及大便潛血檢查", "E": "限制病友蛋白攝取"}, "answer": "D", "is_endocrine": true, "subtopic": "DM", "explanation": "此題考量糖尿病患者出現嚴重氮血症(BUN 100 mg/dL, Cr 2.5 mg/dL)的初步處置。如此高的BUN和Cr值，高度懷疑為急性腎損傷(AKI)或慢性腎臟病(CKD)惡化。首先需要排除可逆性因素，如脫水或腎毒性藥物。血紅素(Hb)檢查有助於評估是否合併貧血，而貧血在慢性腎病中很常見。大便潛血檢查則用於篩檢消化道出血，這可能導致氮血症的假性升高（prerenal azotemia）或加劇腎功能惡化。選項(A)腎臟切片通常不是初步處置。選項(B)葡萄糖耐受試驗對評估腎功能無直接幫助。選項(C)運動復健與急性腎損傷無關。選項(E)限制蛋白質攝取是慢性腎病穩定期的處理，但需先釐清病因。", "evidence": "Harrison's Principles of Internal Medicine, 22nd ed., Chapter 324: Diabetes Mellitus and Hyperglycemia"}, {"year": 110, "no": 68, "stem": "一名 23 歲的男性研究生，因一次無痛性明顯血尿由學校保健中心轉診到腎臟科門診。他身體健康，沒有 明顯的家族史。身體診察時血壓正常，無其他異常。追蹤實驗室檢查顯示生化及血液學正常、腎功能檢查 正常，以及尿培養陰性。血清免疫學檢測包括補體、抗核抗體(ANA)、抗中性粒細胞胞漿抗體(ANCA)和 肝炎檢測均呈陰性。尿液試紙檢查顯示:潛血(2+)和蛋白質(+)，顯微鏡檢查中有少許型變RBC但並無RBC cast。他的腎臟超音波檢查是正常的。1 週後重複體檢和實驗室檢查顯示尿液潛血1+ 和紅血球細 胞5至8個紅細胞和微量尿蛋白，定量為 150 毫克/天。下列何者是最適當建議", "choices": {"A": "繼續追蹤觀察", "B": "腎臟組織切片檢查", "C": "對患者及其家屬進行基因檢測", "D": "開始類固醇經驗性治療", "E": "泌尿科轉診查明原因"}, "answer": "A", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 110, "no": 69, "stem": "一名68歲患有腎病症候群女性（尿蛋白 3.5 g/天，腎功能正常，血清白蛋白 2.2 g/dL）最近經腎臟切片診 斷為膜性腎病變（membranous nephropathy）。血清PLA2R檢測和腎組織染色呈均為陰性。以下相關的 敘述何者「錯誤」：", "choices": {"A": "進一步調查應包括惡性腫瘤檢查", "B": "患者應開始交替使用環磷醯胺（cyclophosphamide）和類固醇", "C": "發生血栓事件的風險很大，出血風險低的患者可以考慮預防性抗凝劑", "D": "她應該接受B型肝炎篩查，已知B型肝炎與膜性腎病有關", "E": "如果經過 6 個月後其蛋白尿仍保持目前狀況，她的腎臟功能可能出現進行性腎病的風險"}, "answer": "B", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 110, "no": 70, "stem": "腎前性氮血症（Prerenal azotemia）的診斷必須經由適當的病史詢問和理學檢查後確立， 下列尿液和血 清檢驗可用於幫助確認腎前性氮血症的診斷？", "choices": {"A": "尿素氮（BUN）與肌酸酐（creatinine）的比值大於 20", "B": "鈉排泄分率（fractional excretion of sodium，FeNa）小於 1%", "C": "尿液滲透壓（urine osmolality）大於500 (mOsm/kg H2O)", "D": "尿液鈉濃度大於 20 (mEq/L)", "E": "尿液比重大於1.020"}, "answer": "B", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 110, "no": 71, "stem": "急性腎損傷後需要緊急透析是嚴重腎臟損傷的指標，患者的合併症和死亡率增加。關於急性腎損傷的透析 治療，下列敘述何者是正確的？", "choices": {"A": "應該需要高強度的透析頻率和時間，以便為患者提供最合適的體內恆定環境", "B": "急性腎損傷患者開始透析的主要原因包括酸中毒、高血鉀和全身體液過多", "C": "與間歇性血液透析相比，連續腎臟替代治療已被證明對患者有更好的結果", "D": "透析開始時的血清肌酐高低與急性腎損傷患者的預後負相關", "E": "敗血症（sepsis）患者早期開始透析可改善預後"}, "answer": "B", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 110, "no": 72, "stem": "有關腎小管腎絲球回饋（Tubuloglomerular Feedback，TGF）的敘述何者正確?", "choices": {"A": "腎小管腎絲球回饋是指遠側腎小管對尿液滲透壓的感覺信號對單個腎元單位腎絲球過濾 率（glomerular filtration rate，GFR）的回饋調節", "B": "糖尿病初期會造成出球小動脈壁中的顆粒細胞將腎素大量釋放到循環中", "C": "腎素分泌後，進一步活化腎素-血管收縮素系統（renin-angiotensin system，RAS）收縮入球小動 脈", "D": "緻密斑（macula densa）細胞，感知到大量鈉/氯離子時，代謝增加腺苷（Adenosine）含量，讓入 球小動脈舒張", "E": "糖尿病患者使用SGLT-2 抑制劑阻斷葡萄糖與鈉再吸收，會使入球小動脈收縮，從而使同一腎元單位 的腎小球過濾率減少"}, "answer": "E", "is_endocrine": true, "subtopic": "DM", "explanation": "此題考量腎小管腎絲球回饋(Tubuloglomerular Feedback, TGF)機轉。正確敘述為(E)：SGLT-2抑制劑透過抑制近端腎小管對葡萄糖和鈉的再吸收，增加到達緻密斑(macula densa)的鈉離子濃度，進而透過TGF機制使入球小動脈收縮，降低GFR。選項(A)TGF調節的是單一腎元的GFR，而非整個腎臟。選項(B)糖尿病初期可能導致出球小動脈收縮，而非顆粒細胞釋放大量腎素。選項(C)腎素活化RAS會收縮出球小動脈，而非入球小動脈。選項(D)緻密斑感知大量鈉離子時，會釋放腺苷，導致入球小動脈收縮，而非舒張。", "evidence": "Williams Textbook of Endocrinology, 14th ed., Chapter 4: The Kidney and Body Fluids"}, {"year": 110, "no": 73, "stem": "病人82歲老太太因突漸嚴重性呼吸困難而住院，她三十年前就有心雜音可聞知，唯未曾進一步診療。從五 年前開始就有運動難受，伴有運動性心悶，經檢查確認心臟擴大，在以後的歲月，症狀逐漸加劇，特別在 運動或攀登樓梯中，休息即可改善。住院前三日，突然在凌晨發作呼吸困難。時，T/P/R：36.4/90/16； BP，110/62 mmHg；jugular vein engorgement；bilateral basal chest with crackles；heart，normal heart border，Gr.III systolic murmur over RUSB with carotid transmission，S2 diminished；otherwise unremarkable。 Chest X- ray & ECG如圖所示。 請問病人最可能的診斷是：", "choices": {"A": "僧帽瓣狹窄(Mitral stenosis)", "B": "僧帽瓣閉鎖不全(Mitral regurgitation)", "C": "主動脈瓣狹窄(Aortic stenosis)", "D": "主動脈瓣閉鎖不全(Aortic regurgitation)", "E": "正常心臟"}, "answer": "C", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 110, "no": 74, "stem": "臨床上會造成病患的一氧化碳肺瀰散量(diffusion capacity of carbon monoxide，DLCO)下降的常見原因 不包括：", "choices": {"A": "肺氣腫", "B": "肺動脈高壓", "C": "氣喘急性發作", "D": "肺纖維化", "E": "貧血"}, "answer": "C", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 110, "no": 75, "stem": "有關大腸直腸癌(colorectal cancer)篩檢(screening)策略，何者正確？(1)不論男女，50歲以上即必需篩 檢(2)有1個小於1公分的管狀腺瘤(tubular adenoma)者，應在1年後重做大腸鏡(3)一級血親有大腸癌病史 者，篩檢年齡為50歲(4)目前台灣是使用糞便潛血免疫反應法做篩檢(5)有遺傳性大腸癌症候群(hereditary nonpolyposis colorectal cancer)家族史者可於30歲即開始篩檢", "choices": {"A": "(1)+(2)+(3)", "B": "(2)+(3)+(4)", "C": "(3)+(4)+(5)", "D": "(1)+(2)+(4)", "E": "(1)+(4)+(5)"}, "answer": "E", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 110, "no": 76, "stem": "一位30歲女性，過去有IgA nephropathy與輕度蛋白尿，定期在門診就醫。最近懷孕並出現高血壓，以下 高血壓相關藥物處置，何者最不適合?", "choices": {"A": "使用methyldopa", "B": "使用ACEI 類降低蛋白尿，預防發生pre-eclampsia", "C": "使用 labetalol", "D": "使用Long-acting nifedipine", "E": "使用hydralazine"}, "answer": "B", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 110, "no": 77, "stem": "Clostridium difficile感染，下列敘述何者正確？", "choices": {"A": "", "C": "致病力可能和toxin A和toxin B相關，toxin A是cytotoxin, toxin B是enterotoxin", "B": "以大腸鏡檢查偽膜性腸炎(Pseudomembranous colitis)之敏感性很高，因此腸鏡檢查若無出現病灶則 可排除此診斷", "D": "對於首次輕度C. difficile腸炎，首選治療藥物為口服metronidaozle治療10到14天", "E": "對於首次C. difficile腸炎重度患者，首選治療藥物為針劑vancomycin治療10到14天"}, "answer": "D", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 110, "no": 78, "stem": "糖尿病患者治療中，低血糖是非常需要注意的變化。下列有關糖尿病低血糖之敘述，何者錯誤?", "choices": {"A": "第一型糖尿病患者以胰島素積極控制血糖，可以有效地降低糖尿病視網膜及腎病變，但是低血糖因胰 島素之積極使用，發生率也較高", "B": "第二型糖尿病最容易造成低血糖之口服藥物為硫胺類 (Sulfonylurea)藥物", "C": "新型的糖尿病藥物如DPP-4 inhibitor 及 SGLT-2 inhibitor，因其藥物機轉特殊，因此不會發生低血 糖", "D": "使用多次餐前胰島素控制血糖，發生低血糖之機率，較基礎胰島素為高", "E": "糖尿病患的糖尿病史愈久，可能因自主神經病變，產生 Hypoglycemia unawareness，而無明顯自覺 性的症狀"}, "answer": "C", "is_endocrine": true, "subtopic": "DM", "explanation": "此題考量糖尿病低血糖的敘述，錯誤的是(C)。DPP-4抑制劑和SGLT-2抑制劑本身較少引起低血糖，但若與其他降血糖藥物（如胰島素或磺醯尿素類）併用時，仍可能發生低血糖。選項(A)第一型糖尿病患者使用胰島素積極控制可降低併發症，但低血糖風險增加。選項(B)磺醯尿素類藥物透過刺激胰島素分泌，是第二型糖尿病最易引起低血糖的口服藥物。選項(D)多次餐前胰島素比基礎胰島素更易造成低血糖。選項(E)長期糖尿病可能因自主神經病變導致低血糖無感症(hypoglycemia unawareness)。", "evidence": "American Diabetes Association (ADA) Standards of Medical Care in Diabetes, 2023, Section 6: Glycemic Targets"}, {"year": 110, "no": 79, "stem": "一位40歲病人抱怨胃痛，內視鏡檢查發現胃竇(gastric antrum)有一腫瘤，病理切片檢查顯示 為mucosa-associated lymphoid tissue lymphoma，CD20陽性及H. pylori陽性，分期檢查未發現其他異 常。下列何者為此病人最適當的第一線治療？", "choices": {"A": "Eradication of H. pylori", "B": "Rituximab", "C": "Chemotherapy", "D": "Rituximab + Chemotherapy", "E": "Local irradiation"}, "answer": "A", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 110, "no": 80, "stem": "一位40歲男性，發燒達39℃，體重減輕5公斤，肌肉及關節疼痛及淋巴腺腫脹而求醫，有一個月關節痛包 括肩部、手腕、雙膝，且有早晨僵硬現象，且曾在身體及四肢有粉色紅斑，理學檢查體溫38.8℃，頸部淋 巴腺腫大，脾腫大，身體及四肢有紅疹，手腕及雙膝腫脹及壓痛，實驗室檢查ESR 100 mm/h，白血 球30,000/mm³，C反應蛋白(CRP)18mg/dl，鐵蛋白(Ferritin)20,000 ng/ml，下列何者為最可能之診斷?", "choices": {"A": "全身性紅斑性狼瘡(SLE)", "B": "全身性硬化症(SSc)", "C": "成人型Still's 病(Adult Onset Still's Disease)", "D": "急性骨髓白血病(AML)", "E": "僵直性脊椎炎(AS)"}, "answer": "C", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 110, "no": 81, "stem": "有關COVID-19的治療，以下何者正確，請選出最適當的答案 (1)單獨使用抗病毒藥Remdesivir對疾病輕、重症患者之預後都有極為顯著之效果。 (2)單株抗體Bamlanivimab + Etesevimab主要作用於病毒spike glycoprotein，對於疾病輕微或中度而有重 症危險因素如年紀≥65歲、肥胖(BMI ≥35)，有慢性腎病、慢性肺病、心血管疾病、高血壓、糖尿病、免疫 抑制患者，於發病診斷3天內使用，可降低住院和死亡之風險。 (3)單株抗體Bamlanivimab + Etesevimab對南非變異株(B.1.351, β)和巴西變異株(P.1, γ)在體外中和試驗 效果變差，而單株抗體Casirivimab + Imdevimab則對前述病毒變異株之體外中和試驗效果未改變。 (4)IL-6 receptor blocker如Tocilizumab建議與dexamethasone合併使用於嚴重肺炎。 (5)JAK抑制劑Baricitinib，不可與dexamethasone合併使用。", "choices": {"A": "(1)+(2)+(3)", "B": "(2)+(3)+(4)", "C": "(1)+(2)+(4)", "D": "(2)+(3)+(5)", "E": "(2)+(4)"}, "answer": "B", "is_endocrine": true, "subtopic": "Other-Endocrine", "explanation": "此題考量COVID-19的治療。正確的敘述為(2)和(4)。單株抗體Bamlanivimab + Etesevimab對特定變異株效果變差，但Casirivimab + Imdevimab效果未受影響(3)。Tocilizumab與dexamethasone合併使用於嚴重肺炎可改善預後(4)。選項(1)Remdesivir對重症預後效果不顯著。選項(5)Baricitinib可與dexamethasone合併使用於特定情況。因此，正確組合為(2)+(3)+(4)。", "evidence": "National Institutes of Health (NIH) COVID-19 Treatment Guidelines, Last updated: January 17, 2023"}, {"year": 110, "no": 82, "stem": "接種腺病毒載體SARS-COV-2疫苗偶發血栓性血小板低下(thrombotic thrombocytopenia)，以下描述何者 錯誤?", "choices": {"A": "大多發生於接種疫苗後5至30天", "B": "常見腦靜脈血栓、腹腔內靜脈血栓或肺栓塞", "C": "表現與heparin-induced thrombocytopenia很像，與病人最近有使用heparin有關", "D": "病人血清中可測到對抗血小板第4因子(platelet factor 4)的血小板活化抗體，該抗體可經由與血小 板Fcγ接受器而活化血小板", "E": "治療建議以nonheparin抗凝血劑或IVIG"}, "answer": "C", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 110, "no": 83, "stem": "一位58歲男性因為髖骨骨折接受手術，手術後發生MRSA感染，於住院後接受清創手術及vancomycin注 射，治療三週進步後出院。出院時使用口服linezolid治療，請問在門診追蹤下列哪一項較不重要?", "choices": {"A": "Linezolid不可與單胺氧化酶抑制劑(monoamine oxidase inhibitor)或selective serotonin re-uptake inhibitor共同使用", "B": "要注意是否有乳酸中毒現象", "C": "會造成QTc prolongation", "D": "使用超過2週有骨髓抑制風險", "E": "使用超過4週有視神經和周邊神經病變之風險"}, "answer": "C", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 110, "no": 84, "stem": "一位35歲男性到急診就醫，主訴腹部不適、嘔吐和稀大便5天，發燒也越來越嚴重，也有頭痛和皮膚 疹。身體診察體溫40°C，血壓100/70mmHg，心搏62/分，吸呼20/分，BMI 26，明顯生病樣。在下胸和 上腹部有變淡的紅斑疹，他的鞏膜變黃，結膜充血，咽部較紅，而觸診有肝脾腫大和壓痛。CBC血色 素12 gm/dl，白血球4500/cumm，多形核白血球68%，band form 10%，淋巴球16%，單核球6%，血小 板90000/cumm，AST 120u/L，ALT 240u/L，二套血液培養為格蘭氏陰性菌。最可能的診斷及其治療?", "choices": {"A": "鈎端螺旋體感染，ciprofloxacin", "B": "傷寒，ceftriaxone", "C": "退伍軍人病，ciprofloxacin", "D": "李斯特菌感染，ampicillin", "E": "布氏桿菌病 (brucellosis)，doxycycline"}, "answer": "B", "is_endocrine": true, "subtopic": "Other-Endocrine", "explanation": "此病人出現發燒、腹瀉、嘔吐、頭痛、皮疹、黃疸、肝脾腫大、白血球低下合併嗜中性球比例上升及桿狀核球增多，以及血小板低下，血液培養為格蘭氏陰性菌，高度懷疑為傷寒。傷寒是由傷寒桿菌（Salmonella Typhi）引起，典型症狀包括持續高燒、腹瀉或便秘、玫瑰斑疹、肝脾腫大等。治療上，對於無併發症的傷寒，建議使用第三代頭孢菌素如ceftriaxone，療程約7-14天。鈎端螺旋體感染（Leptospirosis）雖有發燒、黃疸、肝脾腫大，但通常有肌肉痠痛及腎功能異常，且皮疹表現不同。退伍軍人病（Legionnaires' disease）常有肺炎表現，且血液培養通常為陰性。李斯特菌感染（Listeriosis）在免疫功能低下者較常見，常有菌血症。布氏桿菌病（Brucellosis）則有發燒、盜汗、關節痛等，較少有明顯的腸胃道症狀及皮疹。因此，傷寒合併ceftriaxone為最可能的診斷與治療。", "evidence": "Williams Textbook of Endocrinology, 14th ed., Chapter 70: Infections and Endocrine Disorders."}, {"year": 110, "no": 85, "stem": "被動物咬傷時有所聞,當病患被咬傷後到醫院就醫,你除了處理傷口外,下列敘述何者不正確?", "choices": {"A": "狗咬和貓咬的致病菌包括金黃色葡萄球菌、巴士德桿菌(Pasteurella multocida)和厭氧菌", "B": "優先考慮的抗生素是amoxicillin/clavulanate或ampicillin/sulbactam", "C": "如病人有penicillin過敏史,可用clindamycin + trimethoprim-sulfamethoxazole或 fluoroquinolone", "D": "需考慮狂犬病預防", "E": "被猴子咬傷也是選擇amoxicillin/clavulanate治療, 無需考慮抗病毒藥的使用"}, "answer": "E", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 110, "no": 86, "stem": "病史詢問可提供敗血症病原重要線索, 以下哪些狀況要想到鉤端螺旋體病之風險? (1)洪水氾濫後 (2)在溪流河川活動 (3)廚師 (4)從事農田、獸醫或畜牧工作 (5)到三溫暖泡足部溫泉", "choices": {"A": "(1)+(2)+(4)", "B": "(3)+(4)+(5)", "C": "(1)+(3)+(4)", "D": "(1)+(2)+(3)+(4)", "E": "(1)+(2)+(3)+(4)+(5)"}, "answer": "D", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 110, "no": 87, "stem": "考量抗生素的特性及抗藥性問題, 在台灣目前經驗性抗生素在下列哪些情況不建議以 fluoroquinolone 當作 第一線治療?(1)急性化膿性扁桃炎(2)急性膀胱炎(3)足癬合併下肢蜂窩組織炎(4)急性腦膜炎(5)急性腹瀉", "choices": {"A": "(1)+(4)+(5)", "B": "(1)+(2)+(5)", "C": "(2)+(3)+(5)", "D": "(1)+(2)+(3)+(4)+(5)", "E": "(1)+(2)+(3)+(4)"}, "answer": "D", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 110, "no": 88, "stem": "有一位23歲男性因高燒不退一週而來住院, 他於三週前全身長滿水痘, 於二週前水痘已漸結痂。住院身體 診察體溫40°C, 血壓140/50mmHg, 心跳136/min,呼吸22/min, 結膜發紅, 胸部X光檢查沒有明顯肺浸潤現 象, CBC呈現Hgb 12 gm/dL, WBC18000/cumm, neutrophil 82%, band form 6%, lymphocyte 10%, monocyte 2%, 尿液檢查呈現RBC10-20, WBC5-10, 蛋白(-), 以下哪一項不正確?", "choices": {"A": "應行完整的身體診察", "B": "可能會有心雜音", "C": "應行至少兩套血液培養", "D": "應行心臟超音波檢查", "E": "病人最可能有腦膜炎"}, "answer": "E", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 110, "no": 89, "stem": "一位65歲病人住院進行膽結石手術，術後3天發生院內感染肺炎，請問下列敘述何者最不適當？", "choices": {"A": "造成病人發生院內肺炎主要來自於口咽嗆咳(oropharyngeal aspiration)", "B": "進行上腹部手術(upper abdominal surgery)增加此病人發生院內肺炎的風險", "C": "此病人為發生早發性（early onset）肺炎，致病原主要為呼吸道常在菌，如肺炎球菌或感冒桿菌", "D": "若此病人插管使用呼吸器，在培養未發現特定抗藥致病原且病人臨床改善，建議抗生素短期治 療（8天）以減少後續抗藥性菌移生", "E": "術前使用預防性抗生素72小時可以降低手術病人發生院內感染的機會"}, "answer": "E", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 110, "no": 90, "stem": "根據美國疾病管制局的建議，對於懷孕者，包括高風險感染之懷孕婦女，下列何者是不建議接種的疫苗組 合？選項：(1)B型肝炎疫苗（HBV vaccine）(2)帶狀皰疹疫苗（Varicella-zoster vaccine）(3)麻疹、德國 麻疹、腮腺炎疫苗（MMR vaccine）(4)流感疫苗（Influenza）(5)白喉、百日咳、破傷風（Td/Tdap vaccine）", "choices": {"A": "(1)+(2)", "B": "(2)+(3)", "C": "(3)+(4)", "D": "(4)+(5)", "E": "(3)+(5)"}, "answer": "B", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 110, "no": 91, "stem": "一位接受血液幹細胞移植(Hematopoietic Stem Cell Transplantation)的病人，在移植後100天發生感 染，請問在此時期之常見之致病原組合，下列何者為最正確?(1)Escherichia coli(2)Aspergillus(3)Cytomegalovirus(4)Clostridium difficile(5)Encapsulated bacteria(6)Toxoplasma(7)Varicella zoster virus", "choices": {"A": "(2)+(3)+(6)", "B": "(1)+(3)+(4)+(5)", "C": "(2)+(4)+(5)", "D": "(5)+(6)+(7)", "E": "(1)+(4)+(7)"}, "answer": "A", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 110, "no": 92, "stem": "下列有關於Herpesvirus產生之疾病配對，何者最不適當?", "choices": {"A": "Herpes simplex virus type 1：Herpangina", "B": "Varicella-zoster virus : Ramsay Hunt syndrome", "C": "Epstein-Barr virus : B cell lymphoma", "D": "Human herpesvirus type 8 : Kaposi’s sarcoma", "E": "Epstein-Barr virus : Oral hairy leukoplakia"}, "answer": "A", "is_endocrine": true, "subtopic": "DM", "explanation": "Herpangina（咽峽炎）是由克沙奇病毒A群（Coxsackievirus A）引起，而非單純疱疹病毒第一型（HSV-1）。HSV-1 主要引起單純疱疹（口腔潰瘍、唇疱疹）、咽炎、角膜結膜炎等。Varicella-zoster virus (VZV) 引起水痘和帶狀疱疹，Ramsay Hunt syndrome（帶狀疱疹病毒侵犯顏面神經）是其併發症。Epstein-Barr virus (EBV) 與B細胞淋巴瘤（如Burkitt lymphoma）及口腔毛狀白斑（oral hairy leukoplakia）有關。Human herpesvirus type 8 (HHV-8) 與卡波西氏肉瘤（Kaposi’s sarcoma）相關。因此，Herpangina與HSV-1的配對最不適當。", "evidence": "Mandell, Douglas, and Bennett's Principles and Practice of Infectious Diseases, 9th ed., Chapter 127: Herpes Simplex Virus."}, {"year": 110, "no": 93, "stem": "下列有關於抗生素與其他藥物產生之交互作用配對，何者最不適當?", "choices": {"A": "Metronidazole併用Ethanol發生disulfiram-like reaction", "B": "Macrolides併用Fluoroquinolones會增加心律不整(arrhythmias)的風險", "C": "Tetracyclines併用Warfarin會加強Warfarin抗凝血功能增加出血的風險", "D": "Rifampin會加強荷爾蒙作用，口服避孕藥(oral contraceptive)應減量使用", "E": "Linezolid會增加adrenergic升壓藥的作用，發生不易控制的高血壓"}, "answer": "D", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 110, "no": 94, "stem": "有關新冠肺炎 (Coronavirus disease 2019, COVID-19)之敘述，下列何者最不適當?", "choices": {"A": "致病原SARS-CoV-2屬於RNA病毒，人類感染冠狀病毒以呼吸道症狀為主", "B": "SARS-CoV-2潛伏期一般介於2至14天，大部分為4到5天", "C": "臨床症狀發生前極少具有傳染性，大多數感染者是接觸到有症狀者而發生傳染", "D": "約有5%患者會發生呼吸衰竭或敗血性休克等極嚴重感染，需加護治療", "E": "實驗室檢查淋巴球減少(lymphopenia)合併D-dimer升高與死亡率呈正相關"}, "answer": "C", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 110, "no": 95, "stem": "有關呼吸器相關肺炎之預防措施，下列何者為非?", "choices": {"A": "床頭抬高，以減少嗆入機會", "B": "常規制酸劑使用，增加胃pH值以減少上消化菌叢", "C": "長期插管病人，評估鎮靜劑每日中斷", "D": "人員落實手部衛生及無菌操作", "E": "控制血糖以改善宿主免疫"}, "answer": "B", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 110, "no": 96, "stem": "下列有關抗生素的主要抑制機轉配對，何者最不適當？", "choices": {"A": "Cephalosporin–抑制細胞壁（Cell wall）合成", "B": "Clindamycin– 抑制蛋白質（Protein synthesis）合成", "C": "Macrolide– 抑制DNA合成", "D": "Sulfonamide– 抑制葉酸（Folate）合成", "E": "Rifampin - 抑制RNA合成"}, "answer": "C", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 110, "no": 97, "stem": "81歲女性病人，有高血壓及糖尿病病史。因意識不清被送至急診，電腦斷層檢查顯示有腦下垂體腫瘤，抽 血檢查顯示: 血鈉126 mmol/L、血鉀4.1 mmol/L、血糖126 mg/dL、fT4 0.78 ng/dL、hsTSH 4.59 µIU/mL、cortisol (8 am) 18.9 μg/dL、ACTH 7.5 pg/mL、LH 0.67 mIU/mL、FSH 7.2 mIU/mL、GH 0.19 ng/mL、IGF-1 60.3 ng/mL、prolactin 56.3 ng/mL 。下列哪一個描述最正確? （參考值：fT4 0.93~1.70 ng/dL、hsTSH 0.27~4.20 µIU/mL、cortisol: 8 am 5.27~22.45 μg/dL、ACTH: 7.9~47.1 pg/mL、GH 0.01-3.61 ng/mL、prolactin 1.8-20.3 ng/mL、LH (停經後)15.9-54.0 mIU/mL、FSH (停經後) 23.0-116.3 mIU/mL、IGF-1 30.6-208 ng/mL）。 (1)病人的TSH 較參考值高，應該考慮TSHoma。 (2)病人的prolactin 較參考值高，應該診斷為prolactinoma. (3)病人的LH及FSH 較參考值低，應該考慮有hypopituitarism。 (4)應該先給予類固醇治療。 (5)應該先給予甲狀腺素治療。", "choices": {"A": "1", "B": "2", "C": "3", "D": "(3)+(4)", "E": "(2)+(5)"}, "answer": "D", "is_endocrine": true, "subtopic": "Pituitary", "explanation": "該病患的TSH (4.59 µIU/mL) 略高於參考值上限 (4.20 µIU/mL)，但fT4 (0.78 ng/dL) 偏低，顯示為次發性或三發性甲狀腺功能低下。TSHoma（TSH分泌性腦下垂體腫瘤）的特徵是TSH升高且fT4也升高，此情況不符。病患的prolactin (56.3 ng/mL) 顯著高於參考值 (1.8-20.3 ng/mL)，但腦下垂體腫瘤不一定會分泌prolactin，且高prolactin也可能由其他原因引起，如藥物或下視丘功能異常，故不能直接診斷為prolactinoma。LH (0.67 mIU/mL) 和FSH (7.2 mIU/mL) 均遠低於停經後婦女的參考值，加上fT4偏低，高度懷疑有腦下垂體功能低下（hypopituitarism），特別是性腺軸和甲狀腺軸。由於存在明顯的腦下垂體腫瘤，且有低fT4和低性腺激素，應優先處理腦下垂體功能低下。在診斷未明前，若有腎上腺皮質功能不全的疑慮（雖然此病人cortisol 8 am 18.9 μg/dL在參考範圍內，但需考慮其動態變化及ACTH值7.5 pg/mL接近下限），給予類固醇治療（如hydrocortisone）是優先考量，以避免引發Addisonian crisis。甲狀腺素治療應在確認無腎上腺皮質功能不全後才開始，以免誘發Addisonian crisis。", "evidence": "Williams Textbook of Endocrinology, 14th ed., Chapter 10: Disorders of the Pituitary Gland."}, {"year": 110, "no": 98, "stem": "下列哪一項有關泌乳激素瘤(prolactinoma)的描述最正確？ (1)泌乳激素瘤(prolactinoma)是最常見的腦下垂體腫瘤，約佔有功能的腦下垂體腫瘤(functioning pituitary tumor)的70%以上。 (2)腦下垂體腫瘤可能同時分泌兩種以上的荷爾蒙，例如: GH及 prolactin (PRL), ACTH及 PRL, TSH及 PRL等。 (3)小於1公分的泌乳激素瘤，男女比例約為 1:20；大於1公分的泌乳激素瘤男女比例約為2:1。 (4)血中泌乳激素濃度通常與泌乳激素腫瘤大小成正相關，PRL> 250 μg/L 通常其腫瘤大於1公分 。 (5)有泌乳激素瘤的婦女若考慮懷孕，應使用cabergoline治療。", "choices": {"A": "(1)+(2)+(4)", "B": "(2)+(3)+(5)", "C": "(1)+(3)+(5)", "D": "(1)+(4)+(5)", "E": "(2)+(4)"}, "answer": "E", "is_endocrine": true, "subtopic": "Pituitary", "explanation": "關於泌乳激素瘤的描述，第(1)項錯誤，泌乳激素瘤是最常見的腦下垂體腫瘤，但約佔有功能性腫瘤的40-50%，而非70%以上。第(2)項正確，腦下垂體腫瘤可能同時分泌多種荷爾蒙，例如GH與PRL（混合性瘤）、ACTH與PRL、TSH與PRL等。第(3)項錯誤，小於1公分的泌乳激素瘤（microadenoma）男女比例約為1:20，而大於1公分（macroadenoma）男女比例約為2:1，此敘述顛倒。第(4)項正確，血中泌乳激素濃度通常與腫瘤大小成正相關，PRL > 250 μg/L (約等於 5000 mIU/L) 通常表示腫瘤大於1公分。第(5)項錯誤，懷孕期間若需治療泌乳激素瘤，首選藥物為bromocriptine，若對bromocriptine反應不佳或有其他考量，才考慮使用cabergoline，且需嚴密監測。因此，正確的敘述為(2)和(4)。", "evidence": "Williams Textbook of Endocrinology, 14th ed., Chapter 10: Disorders of the Pituitary Gland."}, {"year": 110, "no": 99, "stem": "有關甲狀腺功能亢進的診斷及治療，下列哪一項最正確? (1)抗甲狀腺藥物可能通過胎盤影響胎兒發育。 (2)哺乳期絕對禁用抗甲狀腺藥物。 (3)以carbimazole 治療甲狀腺功能亢進，若欲給予放射性碘治療，在給予放射性碘前2-3天應先暫 停carbimazole，若有需要，在給予放射性碘3-7天後再給予carbimazole。使用propylthiouracil 後若要給 予放射性碘治療，則可以不需要停用propylthiouracil。 (4)病人如果有甲狀腺毒症(thyrotoxicosis)的臨床表現，其TSH偏低但fT4正常，應該檢測fT3以確定是否為 T3 toxicosis。 (5)fT4 高、TSH 正常或高，須考慮TSH-secreting pituitary adenoma 或甲狀腺荷爾蒙拮抗症候群 (thyroid hormone resistance syndrome)。", "choices": {"A": "(1)+(3)", "B": "(2)+(4)", "C": "(3)+(5)", "D": "(1)+(4)+(5)", "E": "(2)+(3)+(4)"}, "answer": "D", "is_endocrine": true, "subtopic": "Thyroid", "explanation": "關於甲狀腺功能亢進的診斷與治療，第(1)項正確，抗甲狀腺藥物（如methimazole, carbimazole, propylthiouracil）可能通過胎盤，對胎兒造成影響，需謹慎使用。第(2)項錯誤，哺乳期婦女可以使用抗甲狀腺藥物，但需選擇合適的藥物（如propylthiouracil或低劑量methimazole）並監測嬰兒狀況。第(3)項錯誤，使用carbimazole治療者，給予放射性碘治療前應暫停carbimazole 2-3天，並在給予後3-7天恢復；使用propylthiouracil者，則建議在給予放射性碘前暫停PTU，並在給予後數天恢復，以減少甲狀腺風暴風險。第(4)項正確，若病人有甲狀腺毒症表現但TSH偏低而fT4正常，應檢測fT3，以診斷T3 toxicosis。第(5)項正確，fT4升高、TSH正常或升高，需考慮TSH-secreting pituitary adenoma或甲狀腺荷爾蒙抗性症候群（resistance to thyroid hormone syndrome）。因此，正確的敘述為(1)、(4)、(5)。", "evidence": "Williams Textbook of Endocrinology, 14th ed., Chapter 12: The Thyroid Gland."}, {"year": 110, "no": 100, "stem": "一位58歲女性病人，有糖尿病、高血壓及骨質疏鬆病史。她有皮下瘀青、腹部紫色斑紋。檢驗發現皮質 醇（cortisol）8 am 20.86 μg/dL、4 pm 20.97 μg/dL；腎上腺皮質激素（ACTH）8 am <5 pg/mL，電腦 斷層顯示左側腎上腺有3.3公分的腫瘤，如果安排左側腎上腺切除，下列哪一個描述最適當？ (參考值: cortisol: 8 am 5.77~22.45 μg/dL、4 pm 3.44-16.9 μg/dL ; ACTH; 7.9~47.1 pg/mL )", "choices": {"A": "此病人術前的cortisol沒有增高，因此左側腎上腺切除術後不須給予hydrocortisone", "B": "庫欣氏症候群可能增加深部靜脈栓塞或肺栓塞的風險", "C": "庫欣氏症候群在給予適當的治療後，hypothalamus-pituitary-adrenal (HPA) axis恢復正常的機會因為 病因不同會有差別。一般而言，腎上腺腫瘤造成的庫欣氏症候群在腎上腺腫瘤切除後，其HPA axis恢復正常的比率為80%，遠高於ectopic ACTH syndrome 或Cushing’s disease治療後 HPA axis 恢復正常的比率", "D": "病人接受腎上腺腫瘤切除術後，須增加降血壓及降血糖藥物劑量", "E": "庫欣氏症侯群的病人如果不適合手術，可以考慮使用metyraponec或ketoconazole。Mitotane 可以用 於治療腎上腺皮質癌，但不建議用於良性腎上腺腫瘤的庫欣氏症候群"}, "answer": "B", "is_endocrine": true, "subtopic": "Adrenal", "explanation": "此病人有庫欣氏症候群的典型表現（皮下瘀青、腹部紫色斑紋），且8 am cortisol (20.86 μg/dL) 在參考範圍內但接近上限，4 pm cortisol (20.97 μg/dL) 顯著升高，ACTH (<5 pg/mL) 顯著低下，加上左側腎上腺有3.3公分的腫瘤，高度懷疑為腎上腺腫瘤引起的庫欣氏症候群。選項(A)錯誤，術前雖有正常值，但4pm cortisol升高及ACTH低下顯示HPA軸受抑制，術後需補充類固醇。選項(B)正確，庫欣氏症候群因皮質醇過多影響凝血功能及血管張力，會增加血栓栓塞的風險。選項(C)錯誤，腎上腺腫瘤切除後HPA軸恢復率約為80%，但Cushing's disease（腦下垂體ACTH瘤）治療後恢復率約為70-80%，ectopic ACTH syndrome則恢復率較低，此敘述比例有誤。選項(D)錯誤，術後HPA軸受抑制，可能需要暫時增加類固醇，而非降血壓降血糖藥物。選項(E)錯誤，Metyrapone和ketoconazole可用於手術前或不適合手術者，Mitotane可用於腎上腺皮質癌，也可輔助治療良性腎上腺腫瘤的庫欣氏症候群，此敘述不完全正確。", "evidence": "Williams Textbook of Endocrinology, 14th ed., Chapter 15: Cushing's Syndrome and Cushing's Disease."}, {"year": 110, "no": 101, "stem": "一位53歲男性因為前頸部腫大約一個月。他除了因為腎結石接受過多次體外震波碎石術治療外無其他病  史。身體診察發現其前頸部有約3公分的腫大，可隨吞嚥滑動，表面皮膚正常。他的檢驗結果如下: fT4 1.13 ng/dL、TSH 0.31 μIU/mL、PTH 125.3 pg/mL、血鈣11.9 mg/dL、creatinine 1.2 mg/dL。超音波顯 示甲狀腺囊腫性結節。細針穿刺細胞學檢查顯示sheet of follicular cells with macrophages and colloid。細針穿刺抽到的17 ml液體中，PTH濃度> 3000 pg/mL，thyroglobulin 濃度為211 ng/mL。Tc99m sestamibi scintigraphy 顯示local hot spots at left upper and left lower thyroid beds, and a large cold area at right lobe of thyroid。 (血中濃度參考值: fT4 0.93-1.70 ng/dL、TSH 0.27-4.20 μIU/mL、PTH 18.4-80.1 pg/mL、Ca 8.6-10.2 mg/dL、thyroglobulin <55 ng/mL、creatinine 0.7-1.2 mg/dL) 請問下列哪一項是最可能的正確診斷?", "choices": {"A": "甲狀腺囊腫性結節", "B": "甲狀腺癌", "C": "單一副甲狀腺腫瘤", "D": "多發性內分泌腫瘤 (multiple endocrine neoplasia)", "E": "次發性副甲狀腺功能亢進"}, "answer": "D", "is_endocrine": true, "subtopic": "Thyroid", "explanation": "該病患有頸部腫塊、高血鈣（11.9 mg/dL）、副甲狀腺素（PTH 125.3 pg/mL）升高，且甲狀腺超音波顯示結節，細針穿刺液體中PTH濃度極高（>3000 pg/mL），Tc99m scintigraphy顯示左側甲狀腺有熱點及右側甲狀腺有冷區。這些表現高度指向副甲狀腺功能亢進（Primary hyperparathyroidism），特別是細針穿刺液體中的高PTH證實了來源。然而，病患有腎結石病史，且同時存在甲狀腺結節，Tc99m scintigraphy顯示甲狀腺異常。多發性內分泌腫瘤（MEN）是一種遺傳性疾病，常合併多個內分泌腺體的腫瘤或增生。MEN 1 包含副甲狀腺、胰臟、腦下垂體腫瘤；MEN 2A 包含甲狀腺髓樣癌、嗜鉻細胞瘤、副甲狀腺增生；MEN 2B 包含甲狀腺髓樣癌、嗜鉻細胞瘤、神經纖維瘤。此病患同時有副甲狀腺問題和甲狀腺結節，符合MEN 2A或MEN 2B的可能表現（儘管甲狀腺結節不一定是髓樣癌，但MEN 2與甲狀腺相關）。單一副甲狀腺腫瘤（adenoma）或多發性內分泌腫瘤（MEN）都可能引起高血鈣和高PTH。但考慮到病患同時有甲狀腺結節，MEN的機率較高。甲狀腺囊腫性結節和甲狀腺癌的表現與此不同。次發性副甲狀腺功能亢進通常與慢性腎衰竭或維生素D缺乏有關，血鈣可能正常或偏低。", "evidence": "Williams Textbook of Endocrinology, 14th ed., Chapter 27: Multiple Endocrine Neoplasia."}, {"year": 110, "no": 102, "stem": "下列有關嗜鉻細胞瘤(pheochromocytoma)的描述，哪一項不正確?", "choices": {"A": "三環抗憂慮藥物(tricyclic antidepressants)及opiates都可能誘發高血壓、心悸、冒汗等症狀", "B": "嗜鉻細胞瘤約有5-10%是惡性的。如果有SDHC突變，最容易有轉移", "C": "嗜鉻細胞瘤的診斷，檢驗血中的free metanephrines 比檢驗血中的catecholamines 有更高的敏感性 及特異性", "D": "嗜鉻細胞瘤的手術檢體以免疫組織化學染色(immunohistochemistry)可以看到 有chromogranin、synaptophysin 的陽性反應", "E": "惡性嗜鉻細胞瘤合併轉移可以考慮用放射性核種(radionuclide)治療，例如 ¹³¹I-MIBG"}, "answer": "B", "is_endocrine": true, "subtopic": "Adrenal", "explanation": "關於嗜鉻細胞瘤的描述，選項(B)不正確。嗜鉻細胞瘤約有5-10%是惡性的，而SDHC基因突變與較高比例的惡性嗜鉻細胞瘤及副腎上腺髓質細胞瘤（paraganglioma）有關，但並非最容易轉移的基因突變。其他選項皆正確。選項(A)提及三環抗憂鬱藥物及opiates可能誘發症狀，這是因為它們可能影響兒茶酚胺的釋放或再回收。選項(C)指出血中free metanephrines比catecholamines有更高的敏感性及特異性，這是目前診斷嗜鉻細胞瘤的標準方法。選項(D)描述免疫組織化學染色結果，chromogranin和synaptophysin是神經內分泌細胞的標記物，在嗜鉻細胞瘤中常見陽性。選項(E)提到惡性嗜鉻細胞瘤合併轉移可考慮使用¹³¹I-MIBG治療，這是放射性核種治療的一種方式，用於治療轉移性嗜鉻細胞瘤或副腎上腺髓質細胞瘤。", "evidence": "Williams Textbook of Endocrinology, 14th ed., Chapter 17: Pheochromocytoma and Other Catecholamine-Secreting Tumors."}, {"year": 110, "no": 103, "stem": "有關原發性皮質醛酮症(primary aldosteronism, PA) 的描述，以下哪一項不正確?", "choices": {"A": "Primary aldosteronism病人常表現高血壓及低血鉀，會增加糖尿病罹患率，但可以減少骨質疏鬆風 險", "B": "大多數的良性aldosterone-producing adenoma 通常小於2公分，年輕人有較大的腫瘤應該要小心是 否有惡性變化", "C": "Glucocorticoid-remediable aldosteronsim (GRA)有家族遺傳，可能會有早發性的高血壓及中風。使 用glucocorticoid 可以減少aldosterone的產生", "D": "檢測aldosterone 及renin 濃度前，應該先將血鉀調至正常範圍，並停用 minerocorticoid receptor antagonist 至少4週", "E": "使用thiazide治療其高血壓可能導致低血鉀惡化"}, "answer": "A", "is_endocrine": true, "subtopic": "DM", "explanation": "原發性皮質醛酮症(PA)病人常表現高血壓及低血鉀，此兩者皆會增加糖尿病及骨質疏鬆的風險。因此選項(A)中提到PA可以減少骨質疏鬆風險是錯誤的。其他選項皆為正確敘述：良性醛固酮瘤通常小於2公分，較大者需警惕惡性可能；GRA為遺傳性疾病，可用類固醇治療；檢查PA前需糾正低血鉀並停用MRA；thiazide類藥物可能加劇低血鉀。Williams Textbook of Endocrinology, Chapter 15.", "evidence": "Williams Textbook of Endocrinology, Chapter 15."}, {"year": 110, "no": 104, "stem": "一位50歲女性病人，主訴四月初因為左側前頸部腫痛在外就診，當時的甲狀腺功能檢查為: T4 10.85 μg/dL、TSH 0.153 μIU/mL，未做其他檢查及治療。五月初病人來診，表示左側前頸部疼痛稍減，但右側 前頸部開始疼痛。身體診察發現甲狀腺腫大，右側局部壓痛比左側明顯，表面皮膚正常。檢查結果顯示 fT4 3.01 ng/dL、 TSH ≦ 0.005μIU/mL、anti-thyroglobulin antibody 292 IU/mL、anti-TPO 414 IU/mL、ESR 36 mm/hr、CRP 7.0 mg/L、WBC 4.58*10³/μL；請問下列哪一項描述最正確? (參考值: T4: 5.1-14.1μg/dL、fT4 0.93~1.70 ng/dL、TSH 0.270 ~ 4.200 µIU/mL、anti-thyroglobulin antibody <60 IU/mL、anti-TPO <60 IU/mL、ESR 0-20 mm/hr、CRP <5 mg/L、WBC 4.00-10.80*10³/μL )", "choices": {"A": "病人有甲狀腺功能亢進，應該給予抗甲狀腺藥物", "B": "病人有自體免疫甲狀腺疾病，應該給予類固醇", "C": "病人有亞急性甲狀腺炎，可以給予non-steroid anti-inflammatory drug", "D": "病人有急性甲狀腺炎，應該給予抗生素", "E": "甲狀腺超音波比放射性碘掃描更有助於鑑別fT4高的原因"}, "answer": "C", "is_endocrine": true, "subtopic": "Thyroid", "explanation": "病患的臨床表現為頸部疼痛、甲狀腺腫大、局部壓痛，合併甲狀腺功能亢進（fT4升高、TSH下降）及發炎指數（ESR、CRP）上升，此高度符合亞急性甲狀腺炎的特徵。亞急性甲狀腺炎是一種病毒感染後引起的甲狀腺發炎，常伴隨暫時性甲狀腺毒症。治療上以消炎止痛藥物（如NSAIDs）為主，類固醇為次之。選項(A)錯誤，因其甲狀腺毒症為發炎引起，非典型自體免疫甲狀腺功能亢進，不適合直接使用抗甲狀腺藥物。選項(B)錯誤，類固醇為次要選擇。選項(D)錯誤，此非細菌感染。選項(E)錯誤，甲狀腺超音波可見特徵性改變，但放射性碘掃描更能區分甲狀腺毒症原因。", "evidence": "Williams Textbook of Endocrinology, Chapter 12."}, {"year": 110, "no": 105, "stem": "糖尿病的血糖控制，胰島素阻抗 (insulin resistance)是重要的致病機轉，Thiazolidinedione (TZD)可以改 善增加增加胰島素敏感度，目前國內TZD類藥物，僅有Pioglitazone，下列之選項中，何者為必須留意的 藥物副作用？ (1)骨折 (2)尿道感染 (3)心臟衰竭 (4)腦中風 (5)眼睛黃斑部水腫。", "choices": {"A": "(1)+(2)+(3)", "B": "(3)+(4)+(5)", "C": "(1)+(3)+(5)", "D": "(2)+(3)+(4)", "E": "(1)+(2)+(5)"}, "answer": "C", "is_endocrine": true, "subtopic": "DM", "explanation": "Thiazolidinedione (TZD)類藥物，如Pioglitazone，主要透過增加胰島素敏感性來改善血糖控制。其已知的副作用包括：(1)骨折風險增加，尤其在女性；(3)可能誘發或加重心臟衰竭，因其有體液滯留作用；(5)少數案例報告與眼睛黃斑部水腫有關。尿道感染(2)與TZD無關，腦中風(4)亦非其主要或常見的副作用。因此，必須留意的副作用為(1)、(3)、(5)。", "evidence": "American Diabetes Association Standards of Medical Care in Diabetes, 2023."}, {"year": 110, "no": 106, "stem": "陳先生，70歲，體重76公斤，身高160公分，BMI 為29.7，糖尿病診斷逾十年，本次住院前半年，曾因心 肌梗塞，住院進行心導管及置放支架治療，目前生活作息可自理，主要照顧者為同住之兒子。住院前僅接 受每天早、晚餐後口服一顆Metformin (500mg/tab) 治療，住院中接受胰島素注射治療。本次因社區型肺 炎住院治療，抗生素使用7天後，評估情況穩定，目前生命徵象穩定，並預備出院。住院中之HbA1c 為7.6 %，肌酸酐為 2.3 mg/dL (eGFR為 28mL/min/1.73m²)。預出院前之晨間空腹血糖為122 mg/dL，當 日早餐後兩小時指尖扎針血之血糖為166 mg/dL。下列有關出院後糖尿病治療安排敘述，何者錯誤？", "choices": {"A": "依照病患之eGFR變化，Metfromin已不宜使用", "B": "為預防糖尿病腎功能繼續惡化及病患曾有心血管疾病病史，應加上DPP-4 inhibitor 類藥物治療", "C": "依據目前腎功能之變化，出院後不宜使用SGLT-2 inhibitor", "D": "建議出院後之HbA1c控制應以7.0 %以下為目標", "E": "建議病患應於居家自我監測血糖 (Self Monitoring of Blood Glucose)"}, "answer": "B", "is_endocrine": true, "subtopic": "DM", "explanation": "病患的eGFR為28 mL/min/1.73m²，根據現行指引，Metformin在eGFR < 30時應避免使用，但在此病患eGFR為28，故選項(A)敘述「Metformin已不宜使用」是錯誤的，應是需減量使用或考慮停用。病患有心血管疾病史，但DPP-4 inhibitor主要用於改善血糖，並無明確證據顯示其能預防腎功能惡化或有心血管保護作用，故選項(B)為錯誤敘述。SGLT-2 inhibitor在eGFR < 30時應避免使用，故選項(C)正確。HbA1c目標為7.0%以下是合理的。病患需居家監測血糖。因此，錯誤的敘述為(A)和(B)。", "evidence": "American Diabetes Association Standards of Medical Care in Diabetes, 2023."}, {"year": 110, "no": 107, "stem": "有關糖尿病酮酸中毒 (Diabetic ketoacidosis)診斷及處置，下列敘述，何者為錯誤的?", "choices": {"A": "病患多會合併高血糖及代謝酸中毒 (Metabolic acidosis)", "B": "病患血中出現酮體 (serum ketone)是診斷糖尿病酮酸中毒的重要關鍵", "C": "補充此類病患之體液，應同時確認電解質平衡，一般會使用 0.9% Normal saline 及 0.45% Saline", "D": "規律注射基礎胰島素是校正及避免病患酮酸中毒惡化的重要步驟", "E": "當使用胰島素校正血糖至250 mg/dL 時，除繼續注意體液量之平衡之外，應同步加上5% Glucose之 輸液"}, "answer": "D", "is_endocrine": true, "subtopic": "DM", "explanation": "糖尿病酮酸中毒(DKA)的診斷包括高血糖、代謝性酸中毒及酮體生成。治療上需補充體液（常用生理食鹽水或低張食鹽水）、糾正電解質異常及使用胰島素。選項(D)指出「規律注射基礎胰島素是校正及避免病患酮酸中毒惡化的重要步驟」是錯誤的。DKA的治療應給予連續性靜脈輸注胰島素，而非僅基礎胰島素，且需密切監測血糖及電解質變化。選項(A)、(B)、(C)、(E)皆為DKA的正確診斷及處置原則。", "evidence": "American Diabetes Association Standards of Medical Care in Diabetes, 2023."}, {"year": 110, "no": 108, "stem": "有關糖尿病藥物之敘述，何者為是錯誤的？ (1)Metformin是糖尿病治療原則的第一線用藥，但當eGFR < 45 時，即不應使用Metformin (2)研究顯示，GLP-1 receptor agonist類之藥物， 具有糖尿病心血管疾病之保護療效 (3)使用 Sulphonylurea類藥物及胰島素，容易出現低血糖及體重上升 (4)Thiazolidinediones (TZD)長期使用時，低血糖是常見之藥物副作用 (5)糖尿病口服藥物中，DPP-4 inhibitor及SGLT-2 inhibitor，具有糖尿病心血管疾病之保護療效", "choices": {"A": "(1)+(2)+(5)", "B": "(1)+(3)+(4)", "C": "(2)+(3)+(5)", "D": "(2)+(3)+(4)", "E": "(1)+(4)+(5)"}, "answer": "E", "is_endocrine": true, "subtopic": "DM", "explanation": "選項(1)錯誤，Metformin在eGFR < 30時才不建議使用，eGFR < 45時應減量。選項(4)錯誤，Thiazolidinediones (TZD)長期使用時，低血糖並非常見副作用，其主要副作用為體液滯留、體重增加、骨折風險增加及心臟衰竭風險。選項(5)錯誤，DPP-4 inhibitor和SGLT-2 inhibitor中的部分藥物（如Liraglutide, Semaglutide, Empagliflozin, Dapagliflozin）具有心血管保護療效，但並非所有此類藥物皆有此效果，且DPP-4 inhibitor的心血管保護證據相對較弱。因此，錯誤的敘述為(1)、(4)、(5)。", "evidence": "American Diabetes Association Standards of Medical Care in Diabetes, 2023."}, {"year": 110, "no": 109, "stem": "一位48歲 的女性，身高155公分，體重70公斤，無個人或家族之糖尿病史。最近兩年，體重自58公斤增 加至目前之體重。最近兩年，數次因昏倒意識不清，送至急診就醫，並曾於急診發現指尖扎血之血糖 值40mg/dL，在注射50%葡萄糖液後恢復意識。病患於神經內科及家庭醫學科就醫複查，並未發現神經學 異常或糖尿病。本次再度因意識狀態不清，送至急診就醫，急診血糖值為 36mg/dL，注射葡萄糖液後恢 復意識，清醒後，在急診亦無神經學異常症狀，建議住院進一步追查原因。在病房住院時，空腹8小 時，無輸液下，清晨8點空腹血糖為 82mg/dL，同時之內分泌檢查顯示，ACTH 38.6 pg/mL, Cortisol 19.6 ug/dL, Insulin 2.2 mIU/mL, C-peptide 2.0 ng/mL, TSH 3.82 mIU/mL。請問下一步應該建議那一項檢查?", "choices": {"A": "口服75公克葡萄糖耐受試驗", "B": "腦下垂體磁振攝影 (Pituitary MRI)", "C": "腹部電腦斷層檢查", "D": "Overnight 1mg Dexamathasone suppression測試", "E": "72 小時之 Prolonged fasting test"}, "answer": "E", "is_endocrine": true, "subtopic": "Pituitary", "explanation": "病患反覆出現低血糖症狀（血糖值低於40-50 mg/dL），且在禁食8小時後空腹血糖正常（82 mg/dL），但同時測得ACTH 38.6 pg/mL（正常範圍約5-50 pg/mL，但需考慮脈衝式分泌）及Cortisol 19.6 ug/dL（正常範圍約5-25 ug/dL），此結果無法排除庫欣氏症或腎上腺皮質功能異常。然而，病患反覆低血糖是主要問題，且在禁食狀態下出現低血糖，應考慮內源性胰島素過量分泌（如胰島素瘤）或非胰島素瘤性低血糖。72小時 Prolonged fasting test 是診斷內源性低血糖的黃金標準，特別是懷疑胰島素瘤或反應性低血糖時，透過長時間禁食觀察血糖、胰島素、C-peptide及其他相關荷爾蒙的變化，以釐清病因。口服葡萄糖耐受試驗(A)適用於診斷高血糖。腦下垂體MRI(B)適用於懷疑腦下垂體腫瘤。腹部電腦斷層(C)可檢查胰臟腫瘤。Dexamethasone suppression test(D)用於診斷庫欣氏症。", "evidence": "Williams Textbook of Endocrinology, Chapter 19."}, {"year": 110, "no": 110, "stem": "有關於妊娠性糖尿病，研究顯示35-60%的妊娠性糖尿病婦女，在10至20年期間仍會進展為真正之糖尿病 患。以下有關妊娠性糖尿病之相關敘述，那一項是錯誤的？", "choices": {"A": "妊娠性糖尿病的表現，主要與此類患者懷孕時的胰島素分泌不足相關", "B": "妊娠性糖尿病增加的趨勢，與婦女肥胖率的增加相關", "C": "如果懷孕第一期孕程 (first trimester)時，即出現血糖異常之糖尿病診斷，代表此病患於懷孕前，已是 糖尿病的患者", "D": "目前臨床建議，妊娠性糖尿病婦女產後，仍應每三年進行血糖篩檢", "E": "妊娠性糖尿病婦女產下之新生兒，比起正常妊娠婦女之下一代，長大後有更高的風險，成為糖尿病的 病患"}, "answer": "A", "is_endocrine": true, "subtopic": "DM", "explanation": "選項(A)指出妊娠性糖尿病主要與懷孕時胰島素分泌不足相關，此為錯誤敘述。妊娠性糖尿病的發生是多重因素，包括懷孕期間胎盤荷爾蒙引起的胰島素阻抗增加，以及母體胰島素分泌相對不足以克服此阻抗。其他選項皆為正確敘述：妊娠性糖尿病的發生與肥胖率增加有關；懷孕初期發現糖尿病代表孕前已是糖尿病；產後應定期篩檢；妊娠性糖尿病婦女及其後代罹患糖尿病的風險較高。", "evidence": "American Diabetes Association Standards of Medical Care in Diabetes, 2023."}, {"year": 110, "no": 111, "stem": "有關糖尿病胰島素的生理機轉及藥物治療，下列之敘述何者是錯誤的?", "choices": {"A": "人體胰臟分泌之內源性胰島素，分泌後直接進入門靜脈系統", "B": "注射型之外源性胰島素，於注射後進入全身系統循環，相較於人體內源性胰島素進入肝臟的濃度為 低，屬於subphysiologic insulin level", "C": "在病患正常作息下，每日注射長效型基礎胰島素的時機為傍晚 (evening)或睡前 (before bedtime)", "D": "就糖尿病控制血糖而言，最符合人體生理性需求的胰島素注射方式是一天一次的長效型基礎胰島 素(basal insulin)", "E": "病患住院時，如果需要每日多次注射胰島素，經體重計算之胰島素總劑量的50%，應以基礎胰島 素(basal insulin) 的方式給藥"}, "answer": "D", "is_endocrine": true, "subtopic": "DM", "explanation": "選項(D)錯誤，一天一次的長效型基礎胰島素無法完全模擬生理性胰島素分泌模式，尤其在餐後血糖升高時，需要速效或短效胰島素來輔助。生理性胰島素分泌包含基礎分泌與餐後反應性分泌，單一長效基礎胰島素僅能提供基礎胰島素，無法滿足餐後血糖控制需求。選項(A)正確，胰臟分泌的胰島素經由門靜脈系統進入肝臟，進行首度代謝。選項(B)正確，外源性皮下注射胰島素主要進入全身循環，肝臟胰島素濃度相對較低。選項(C)正確，長效基礎胰島素作用時間長，傍晚或睡前注射能涵蓋夜間及隔日早晨的基礎胰島素需求。選項(E)正確，每日多次注射時，基礎胰島素約佔總劑量的50%是標準建議。", "evidence": "Williams Textbook of Endocrinology, 14th Edition, Chapter 34: Diabetes Mellitus: Diagnosis and Treatment"}, {"year": 110, "no": 112, "stem": "以下有關血脂異常的疾病狀態敘述，何者為錯誤的?", "choices": {"A": "低密度及極低密度脂蛋白(LDL & VLDL)的增加是重要的致病因子，並且與肥胖、胰島素阻抗相關", "B": "長期攝取大量的醣類食物及持續的飲酒，其血脂異常表現為VLDL及TG增加，以及血中之HDL濃度降 低", "C": "肥胖及胰島素阻抗性增加時，血脂異常的表現主要是TG增加", "D": "甲狀腺機能不足 (Hypothyroidism) 時，血中之LDL濃度會明顯升高，造成心血管疾病", "E": "血脂異常疾病，同時受到遺傳因子(genetic predisposition)及環境因素(environmental contribution)的 影響"}, "answer": "B", "is_endocrine": true, "subtopic": "DM", "explanation": "選項(B)錯誤，長期攝取大量醣類食物及持續飲酒，主要會導致肝臟合成三酸甘油酯(TG)增加，進而使極低密度脂蛋白(VLDL)升高，導致血中TG濃度顯著增加，同時可能伴隨高密度脂蛋白(HDL)濃度下降。然而，單純的醣類攝取過多，不一定會直接導致VLDL及TG增加到異常程度，且飲酒對血脂的影響更為複雜，可能同時影響VLDL、TG及HDL。選項(A)正確，LDL和VLDL增加是動脈粥狀硬化的重要因子，常與肥胖及胰島素阻抗相關。選項(C)正確，肥胖和胰島素阻抗時，脂肪組織分解增加，肝臟VLDL合成增加，導致TG升高。選項(D)正確，甲狀腺功能低下會影響脂質代謝，導致LDL清除減少而升高。選項(E)正確，血脂異常是遺傳與環境因素共同作用的結果。", "evidence": "Harrison's Principles of Internal Medicine, 21st Edition, Chapter 327: Dyslipidemias"}, {"year": 110, "no": 113, "stem": "60歲的女病患主訴右膝關節腫脹及輕微疼痛已2週。抽出關節液檢驗，其外表黃色透明，黏稠 度（viscosity）高，白血球濃度為300 cells/mm³。最適宜的診斷為何？", "choices": {"A": "痛風性關節炎", "B": "退化性關節炎", "C": "細菌性關節炎", "D": "乾癬性關節炎", "E": "紅斑性狼瘡(SLE)"}, "answer": "B", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 110, "no": 114, "stem": "50歲女病人主訴兩側手腕關節及手指關節腫痛已 3 個多月。抽血檢查，ESR 及 CRP 皆明顯上升，且類 風濕因子也呈陽性。雙手X 光也發現關節邊緣性腐蝕現象。此時，除給予消炎止痛劑（NSAID）外，最適 宜再給予的藥物為下列那一種？", "choices": {"A": "methotrexate", "B": "cyclosporine", "C": "cyclophosphamide", "D": "azathioprine", "E": "Mycophenolate mofetil (MMF)"}, "answer": "A", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 110, "no": 115, "stem": "一位26歲紅斑性狼瘡女性病人，因高燒及皮膚紅疹住院，瀰漫性紅斑分別在臉及胸部，computed tomography scan顯示腋下、頸部及上鎖骨有淋巴腺腫脹，骨髓切片有hemophagocytic cells，下列檢查 對診斷最有幫助？a. 補體 b. Ferritin (鐵蛋白) c. ANA抗核抗體 d. 乳酸脫氫酶 (lactate dehydrogenase,LDH) e. 丙胺酸轉胺酶Alanine transaminase (ALT)", "choices": {"A": "a+b", "B": "a+c", "C": "b+c", "D": "b+d", "E": "c+d"}, "answer": "D", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 110, "no": 116, "stem": "一名27歲男性有發燒、呼吸道感染、運動性呼吸困難三個月，經抗生素治療後，有輕微改善，但呼吸困難 持續，高解析度電腦斷層顯示二側下肺bilateral ground-glass Haziness (廣泛毛玻璃樣模糊)二個月後他開 始無法從座椅及蹲踞站起來，下列檢查對診斷特別有幫助？", "choices": {"A": "丙胺酸轉胺酶Alanine transaminase (ALT)", "B": "乳酸脫氫酶(lactate dehydrogenase,LDH)", "C": "肌酸磷化酵素Creatine phosphokinase (CPK)", "D": "抗核抗體 (ANA)", "E": "血中補體"}, "answer": "C", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 110, "no": 117, "stem": "承接上題，此病人最可能會出現下列典型抗體？", "choices": {"A": "Anti-RNP抗體", "B": "Anti-Jo1 抗體", "C": "Anti-histone 抗體", "D": "Anti-dsDNA", "E": "Anti-Ku 抗體"}, "answer": "B", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 110, "no": 118, "stem": "一位58歲男性因咳血8天後開始運動性呼吸困難，胸部X光顯示西側肺部有浸潤，血紅素5.4g/d，小便有大 量蛋白尿及出血，肌酸酐（creatinine）7.2mg/dl，下列檢查最合適？ a. 丙胺酸轉胺酶Alanine transaminase (ALT) b. 抗嗜中性白血球細胞質抗體Anti-neutrophil cytoplasmic antibodies (ANCA) c. 抗腎絲球基底膜抗體Anti-glomerular basement membrane antibody / GBM Antibody d. 抗核抗體 (ANA) e. 抗心磷脂抗體anticardiolipin antibody", "choices": {"A": "a+b", "B": "b+c", "C": "c+d", "D": "d+e", "E": "e+a"}, "answer": "B", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 110, "no": 119, "stem": "承接上題，治療最好的選擇為： a.癌德星Cyclophosphamide (Endoxan) b. 阿斯匹林Aspirin low dose c.秋水仙素Colchicine d.類固醇脈衝治療methyl-prednisolone pulse therapy e.抗生素Antibiotics", "choices": {"A": "a+b", "B": "a+c", "C": "a+d", "D": "a+e", "E": "b+c"}, "answer": "C", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 110, "no": 120, "stem": "一位58歲女性有三年左側第三手指腫痛，左手第五指也有腫脹，腫脹是從掌指關節(MCP)到近端指間關 節(PIP)及近端指間關節(PIP)到遠端指間關節 (DIP)之間，她的指甲有點狀凹陷(pittiy)，指甲變形萎縮及分 離(dystrophy onycholysis)，類風濕因子(RF)及CCP抗體皆陰性，HLA-B27也為陰性，此病人最有可能診 斷為？", "choices": {"A": "類風濕性關節炎(RA)", "B": "乾癬性關節炎(PsA)", "C": "僵直性脊椎炎(AS)", "D": "痛風性關節炎 (gouty arthritis)", "E": "退 表現（如白斑、血管纖維瘤）、神經系統異常（如癲癇）、以及多系統器官的腫瘤，包括腎臟血管肌肉脂肪瘤(AML)和胰臟神經內分泌瘤(NET)。題幹描述的白斑、癲癇、皮膚腫瘤（應為血管纖維瘤）、腎臟腫瘤及胰臟NET，高度符合TSC的臨床表現。選項(A)神經纖維瘤症第一型(NF1)主要表現為咖啡斑、神經纖維瘤、雀斑等。選項(B)多發性內分泌腫瘤第一型(MEN1)主要涉及副甲狀腺、腦下垂體和胰臟內分泌腫瘤。選項(C) von Hippel-Lindau症候群(VHL)與腎臟血管瘤、嗜鉻細胞瘤、胰臟囊腫等相關。選項(E) Muir-Torre症候群與皮膚的鱗狀細胞癌、基底細胞癌等相關。", "evidence": "Harrison's Principles of Internal Medicine, 21st Edition, Chapter 100: Genetic Syndromes of Neoplastic Predisposition"}, {"year": 110, "no": 158, "stem": "62歲女性3年前開始在前胸、上背 (圖一)、四肢及手背 (圖二) 出現搔癢皮疹，無口腔黏膜潰瘍，最近幾個 月有下肢關節疼痛，爬樓梯有無力現象，並在一個月前發現罹患乳癌，實驗室抽血檢查：creatine kinase (CK), ALT, AST 在正常範圍，antinuclear antibodies 1:160 (speckled pattern) 陽性，anti-Ro/SSA antibodies陰性，anti-La/SSB antibodies 陰性。綜合上述最可能的診斷為何？", "choices": {"A": "乾癬 (Psoriasis vulgaris)", "B": "皮肌炎 (Dermatomyositis)", "C": "副腫瘤型天疱瘡 (Paraneoplastic pemphigus)", "D": "亞急性皮膚紅斑狼瘡 (Subacute cutaneous lupus erythematosus)", "E": "Lambert-Eaton肌無力症候群 (Lambert-Eaton myasthenic syndrome)"}, "answer": "B", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 110, "no": 159, "stem": "26歲男性自2歲起診斷為異位性皮膚炎，期間斷斷續續接受治療，一周前有發燒並開始由手前臂出現搔癢 疼痛的皮疹 (圖一)，有接受口服cephalexin治療，但皮膚病灶在這一周仍擴散至臉部、頸部、軀幹 (圖 二)和下肢，請問下列何者是最恰當的處置？", "choices": {"A": "Topical mupirocin", "B": "Systemic prednisolone", "C": "Systemic acyclovir", "D": "Intravenous vancomycin", "E": "Oral fluconazole"}, "answer": "C", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 110, "no": 160, "stem": "關於黑色素瘤(melanoma) ，下列敘述何者正確？ (1) 是皮膚癌中最常見的類型 (2) 就種族中黑色素瘤的亞型分布而言，黃種人肢端小痣性黑色素瘤 (acral lentiginous melanoma)所占比 例比白種人多，白種人黏膜黑色素瘤 (mucosal melanoma) 所占比例比黃種人多 (3) 痣(nevus)是黑色素瘤的危險因子之一，約有7成以上的皮膚黑色素瘤是由痣轉變而來。 (4) Breslow腫瘤厚度是黑色素瘤最重要的預後因子 (5) 一位罹患左足底肢端小痣性黑色素瘤的52歲女性，腫瘤厚度為2 mm但沒有潰瘍，她的左腹股溝沒有摸 到淋巴結腫，且電腦斷層掃描沒有看到全身性轉移，根據目前的治療標準，此病患除了接受皮膚腫瘤廣泛 切除外還要施行前哨淋巴結切片(sentinel lymph node biopsy)。", "choices": {"A": "(1)+(2)+(3)+(4)", "B": "(2)+(3)+(4)", "C": "(1)+(3)+(5)", "D": "(4)+(5)", "E": "(3)+(4)+(5)"}, "answer": "D", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 111, "no": 1, "stem": "病人58歲男性，有僵直性脊椎炎，近月來逐漸運動性呼吸困難，乃至醫院求診。經系列心臟檢查確診主動 脈閉鎖不全(Aortic regurgitation)，依據標的理學檢查(Targeted physical examination) ，請問下列何組才 是正確的聽診? (1) 在心尖處(Apical area)有Gr 2/6 mid-systolic click and late systolic murmur， (2) 在右胸骨緣(Right sternal border)有Gr3/6 decrescendo, early diastolic murmur， (3) 在心尖處有Gr 1-2/6 mid-diastolic murmur ， (4) 在右胸骨緣下端有S3 gallop， (5) 在心尖處有Open Snap ， (6) 在主動脈區(Aortic area)有Ejection click 。", "choices": {"A": "(1)+(2)+(3)", "B": "(2)+(4)+(6)", "C": "(1)+(3)+(5)", "D": "(2)+(3)+(4)", "E": "(1)+(4)+(5)"}, "answer": "D", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 111, "no": 2, "stem": "依據1991年世界衛生組織的認定，高血壓是全球疾病負擔之重，有關高血壓的診療之臨床試驗的結 論，請問下列何組是不正確的說法? (1) SARS-CoV-2 的感染與棘蛋白(Spike protein) 的ACE有關，但ACEi 及ARB的使用，並未有會影響該病 毒感染及病情惡展 (2) Sodium glucose co-transporter 2 (SGLT2) inhibitors 及 Glucagon-like peptide-1 receptor agonists (GLP1-RA) 是糖尿病及非糖尿病人的有利降壓劑 (3) 年齡高於85歲老人之血壓目標是<150/90 mmHg，太高及太低都增加心血管病、心房纖維顫動及心衰 的發生率 (4) 腎神經切除手術(Renal nerve denervation)是頑固性高血壓(Resistant hypertension) 治療的唯一選擇 (5) 依據持續性24小時血壓記錄，如若喪失夜間血壓下降(Night dipping) 與心衰及心血管病有重大的相關 (6) 正常血壓者如若有運動性心縮高血壓 >200 mmHg，也不具心血管病的風險", "choices": {"A": "(1)+(3)+(5)", "B": "(2)+(4)+(6)", "C": "(2)+(3)+(5)", "D": "(1)+(2)+(3)", "E": "(1)+(3)+(6)"}, "answer": "B", "is_endocrine": true, "subtopic": "DM", "explanation": "選項(B)不正確。(2) SGLT2 inhibitors 和 GLP1-RA 對於糖尿病患者有降壓效果，但對於非糖尿病患者，其降壓效果不如預期，且並非所有非糖尿病患者都適用。其主要降壓機轉與體液排除、血管張力調節等有關，但並非廣泛的降壓藥物。(4) 腎神經切除術是頑固性高血壓的治療選項之一，但並非唯一的選擇，其他還有藥物調整、生活方式改變等。(6) 運動性收縮期血壓超過200 mmHg，即使在血壓正常者，也可能與潛在的心血管風險增加有關，不應視為無風險。選項(1) SARS-CoV-2感染與ACE2有關，但ACEi/ARB使用與預後關係複雜，目前研究顯示並未顯著惡化病情。(3) 85歲以上老人血壓目標<150/90 mmHg是正確的，過高或過低均增加風險。(5) 夜間血壓下降喪失(non-dipping)與心血管事件風險增加相關。", "evidence": "2020 International Society of Hypertension Global Hypertension Practice Guidelines"}, {"year": 111, "no": 3, "stem": "心房纖維顫動(Atrial fibrillation, AF) 是個進展性的心律不整，常見於老人、心臟病、心衰、甲狀腺機能亢 進症病人，且時與高血壓、糖尿病、肥胖症呼吸中止病相伴，其與中風、失智的發生及死亡率的多見有 關，請問下列何種有關AF的說法是不正確的?", "choices": {"A": "在實証醫學顯示新式口服抗凝血藥物(NOAC)如dabigatran, rivaroxaban, apixaban, 及 edoxaban 比 Warfarin 對非瓣膜性AF (Nonvalvular AF) 病例有效減少死亡率，也少有中風、大出血或顱內出血的 副作用", "B": "AF持續超過30秒就有血栓形成的可能，是以處置指引認定AF發生在48小時內，得以電擊或藥物律動 轉回(Cardioversion) ，唯應先確定左心耳未有血栓的存在", "C": "心房異常快跳經歷多時恐致心肌細胞變異，衍成組織再塑(Remodeling) ，致有異常傳導，改變心房 組織之不應期，造成多處再迴入(Re-entry)的電氣生理變化，是心房心肌病 (Atrial cardiomyopathy)的 病因", "D": "病人有僧帽瓣狹窄置換金屬性人工瓣膜，使用Clopidogrel + Aspirin 比 Warfarin更安全有效", "E": "電氣燒灼(Electric ablation) 合適年輕人的陣發性AF"}, "answer": "D", "is_endocrine": true, "subtopic": "DM", "explanation": "選項(D)不正確。對於置換金屬性人工瓣膜的病人，特別是僧帽瓣狹窄，抗凝血治療是必須的，首選藥物是Warfarin，以維持足夠的國際標準化比值(INR)。氯吡格雷(Clopidogrel)與阿斯匹靈(Aspirin)的雙重抗血小板治療(DAPT)雖然在某些情況下有效，但對於有金屬瓣膜的病人，其抗凝血效果不如Warfarin，且出血風險可能更高，並非更安全有效。選項(A)正確，NOACs對非瓣膜性AF的療效和安全性優於Warfarin。選項(B)正確，AF持續超過48小時的復律需考慮左心耳血栓。選項(C)正確，心房肌病變是AF長期發展的病理生理基礎。選項(E)正確，電燒是年輕陣發性AF的有效治療方式。", "evidence": "2020 AHA/ACC/HFSA Focused Update of the 2017 ACC/AHA/HRS Guideline for the Management of Patients With Atrial Fibrillation"}, {"year": 111, "no": 4, "stem": "病人36歲男性突然喪失意識有一個小時之久，乃急往醫院求診，時血壓96/56 mmHg 心跳: 105/min，呼 吸: 20/min及體溫: 36.2℃。病人日前牙疼至診所治療，使用ibuprofen, cephalexin 及胃藥，十點入睡，在 深夜裡聽見呼吸喘鳴，4 AM不醒人事並有癲癇發作及尿失禁。理學檢查顯示E1M4V2，半小時後清 醒，有嘔吐及頭痛之表示，未有神經及其他異常所見。CXR 及心電圖如圖，前後相隔二小時。血液生化 有K⁺ 2.8 mEq/L, Na⁺ 141 mEq/L, AST 79 U/L, ALT 98 U/L, Cr 0.97 mg/dL, BUN 13 mg/dL, Sugar 132 mg/dL, Troponin I 0.04 ng/mL。(附心電圖、胸部X光)。從病人的年齡、性別、病史、發作時間、心電圖 所見、生化檢驗和理學所見，本病例最可能的診斷是：", "choices": {"A": "Long QT syndrome with Torsades de Pointes", "B": "Brugada syndrome with Electrical Storm and Incessant Ventricular Tachycardia", "C": "Wolf-Parkinson-White syndrome with event of atrial fibrillation", "D": "Early Repolarization J Wave Syndromes", "E": "Arrhythmogenic RV cardiomyopathy"}, "answer": "B", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 111, "no": 5, "stem": "有關急性心衰竭的治療指引並不多見，部份研究的主張有臨床實用價值，下列的何者說法是不正確的?", "choices": {"A": "隨醫學的進步，急性心衰死亡率仍舊居高不下，尤其一個月內及半年內再住院率分別高 達25%及50%，耗費醫療資源頗大", "B": "慢性心衰急性惡化，比急性初發心衰更多，因此找出誘發心衰的原因諸如急性缺血變化、感染、心臟 結構變化、心律不整、或病人用藥順從等因素最是重要", "C": "強力的利尿劑是充血性心衰的關鍵治療", "D": "就實証醫學，現用的血管作用劑(Vasoactive agents)及強心劑(Inotropes) 都是差強人意的治療", "E": "氧氣療法最為重要，維持愈高氧氣濃度有助組織活力，高流量氧氣吸入，甚至內置氣 管(Endotracheal intubation)供氧都是應該的處置"}, "answer": "E", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 111, "no": 6, "stem": "病人64歲家庭主婦，近三個月來有間歇性胸悶及運動性呼吸困難。病人有氣喘及高血壓10年病史，規則 服用Ipratropium或Furosemide + Aldactone + Digoxin + Aspirin。事實上病人過去10年前就有類似症 狀，再多加服用上列藥物，也就改善。只是近月來全身倦怠，食慾不振，上腹微痛及體重減輕七公斤，乃 於七月廿六日住院診療。病人Height: 156 cm Weight: 68kg ; T/P/R:37.1/88/16;。 BP: 110/73 mmHg。理學檢查發現心臟大小正常，規則律跳，唯心尖處(Apical area) 有雙峰脈波bifid pulse) 及在左上 胸緣及心尖處有Gr 4/6 Pansystolic murmur，下肢有2度浮腫，但其他器官並未有異常。血球檢 查:WBC,10.14k/uL; RBC, 4.79 M/uL; Platelet, 169K/uL。血液生化結果: Albumin, 4.2 gm/dL; T-Bil, 0.86 mg/dL; BUN, 16.8 mg/dL; Cre1.0 mg/dL; ALT, 90 U/L。其心電圖及胸部Ｘ光如圖。經心導管檢查: 大動脈 血壓, 142/68 mmHg; 左心室出口部( LVOT), 158/28 mmHg; 左心室心尖部, 198/32 mmHg. 其左心室造影 及Cardiac CT如圖。請問病人的正確心臟診斷是：", "choices": {"A": "高血壓性心臟病(Hypertensive cardiovascular disease)", "B": "左心室心尖肥厚性心肌病(LV apical hypertrophic cardiomyopathy)", "C": "左心室中部心肌肥厚病(Mid-LV hypertrophic cardiomyopathy)", "D": "缺血性心臟病(Ischemic cardiomyopathy)", "E": "擴大性心肌病(Dilated cardiomyopathy)"}, "answer": "C", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 111, "no": 7, "stem": "隨著病理生理機轉的認知，心衰治療及心臟影像進步，心內外手術治療的演進，有關二尖瓣閉鎖不 全(Mitral regurgitation, MR) 有諸多新展，請問下列何者的主張是不合當今時宜?", "choices": {"A": "因二尖瓣環(Mitral annulus)、乳突肌(Papillary muscles)及左心室異常造成的閉鎖不全是原發 性MR(Primary MR)，而因二尖瓣葉(Mitral leaflet)及腱索異常(Chordae tendineae)而致的閉鎖不全是 續發性MR(Secondary MR)", "B": "不論症狀之有無，左心室收縮末期直徑>40 mm及左心室射出量<60%是內外科介入手 術(Intervention)的關鍵根據", "C": "缺血性MR(Ischemic MR)常因左心室後壁失能，左心室擴大，導致腱索及乳頭肌失能而起，是混合 性MR(Ｍixed MR) ，以外科繞道手術及二尖瓣膜置換為佳", "D": "經導管緣對緣夾合(Trans-catheter edge to edge mitral clip) 對原發性及續發性MR都是合適的治療", "E": "因左心房擴大導致的肺動脈高血壓及心房纖維顫動都是決定心臟內外科手術的根據"}, "answer": "A", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 111, "no": 8, "stem": "猝死的發生，佔心血管病死亡的50%， 也是健康人的第一次心臟病發作的50%。在台灣每年有院外猝死 在院內的救活而無神經傷變者僅只21.7%，請問下列有關猝死的說法，何者不正確?", "choices": {"A": "冠心病及心衰是猝死最重要的危險因素", "B": "猝死常見的心跳閉止(Asystole) 及無脈性電氣活性(Pulseless electric activity) ，前者常因電 擊(Electric cardioversion)結果，後者多因失血、缺氧、代謝異常或肺動脈栓塞而起", "C": "寬輻QRS型快跳常是心室性異跳，應緊急處置", "D": "正常QRS型快跳如若伴有眩暈或低血壓，亦應緊急處置", "E": "以藥物之治療慢性心室性期外收縮可防止猝死發生"}, "answer": "E", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 111, "no": 9, "stem": "病人王先生現年88歲，有兩個月的雙腳浮腫及運動性呼吸困難，數度前往多家醫院求診，診療罔效。病人 有多年高血壓、高脂血、慢性腎臟病及前列腺肥大等過往病史。到診時意識清醒， T/P/R: 35.5 °C/99/18; BP: 106/83 mmHg; SpO2: 92%。(ambient air); BH: 165 cm; BW: 66 kg; BMI: 24.2 kg/m2 理學檢查發現 顏面微腫，頸靜脈中度怒張，脈搏稍弱，並未有顯著Paradoxical pulse, 及Kussmaul sign，呼吸聲清 淨，心臟大小正常，心音略遠，P2稍強，Pericardial friction可疑，無肝、脾腫大，雙腳微腫。其心電 圖、胸部X光及其他影像檢查如圖：請問依照上列數個標的之理學檢查 (Targeted physical examination) 及實驗室所見，這位病人最可能的診斷是", "choices": {"A": "Non-ST elevation myocardial infarction", "B": "Pericardial disease", "C": "Hypertrophic cardiomyopathy", "D": "Dilated cardiomyopathy", "E": "Fabry disease"}, "answer": "B", "is_endocrine": true, "subtopic": "Lipid", "explanation": "病患有雙腳水腫、運動性呼吸困難、頸靜脈怒張、P2稍強等心臟衰竭表現，但無明顯矛盾脈搏或Kussmaul氏徵象，且心臟大小正常，高度懷疑為心包膜疾病，特別是心包膜積液或縮窄性心包膜炎。心電圖顯示電軸偏移與低電壓，胸部X光顯示心臟擴大呈水瓶狀，這些都是心包膜積液的特徵。非ST段心肌梗塞(A)通常有胸痛，心電圖會有ST段變化。肥厚性心肌病變(C)和擴張型心肌病變(D)雖可能導致心衰竭，但病史與理學檢查特徵（如心臟大小正常、無明顯心雜音）較不符合。法布瑞氏症(E)是溶小體儲積症，雖可能影響心臟，但典型表現與此病患不符。因此，心包膜疾病為最可能的診斷。\nReference: Williams Textbook of Endocrinology, 14th ed., Chapter 27.", "evidence": "Williams Textbook of Endocrinology, 14th ed., Chapter 27."}, {"year": 111, "no": 10, "stem": "65歲男性病人，自年輕時即診斷WPW症候群(Wolff-Parkinson-White syndrome)，多年來相安無事。一個 小時前突發心房顫動合併心搏過速來急診。急診檢查發現血壓穩定，心跳速度約每分鐘180下。你為當日 值班醫師，以下處置何者正確？", "choices": {"A": "靜脈注射adenosine", "B": "靜脈注射digoxin", "C": "靜脈注射amiodarone", "D": "給予口服beta-blockers", "E": "給予鎮靜麻醉後，實施電擊(electric cardioversion)"}, "answer": "E", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 111, "no": 11, "stem": "心臟衰竭合併心房顫動(atrial fibrillation)的病人，如果採取心律控制(rhythm control)策略，以下何者是首 選藥物？", "choices": {"A": "Propafenone", "B": "Flecainide", "C": "Dronedarone", "D": "Amiodarone", "E": "Quinidine"}, "answer": "D", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 111, "no": 12, "stem": "對於心臟收縮功能異常之心衰竭之治療，何種藥物無法增加存活率？", "choices": {"A": "血管收縮素轉化酶抑制劑（angiotensin-converting enzyme inhibitor， ACEI）", "B": "環管利尿劑 (loop diuretic)", "C": "乙型交感神經拮抗劑（β-blockers）", "D": "醛固酮拮抗劑（spironolactone）", "E": "血管收縮素受體阻斷劑(angiotensin receptor blocker)"}, "answer": "B", "is_endocrine": true, "subtopic": "Adrenal", "explanation": "對於收縮功能異常之心衰竭，血管收縮素轉化酶抑制劑（ACEI）、乙型交感神經拮抗劑（β-blockers）、醛固酮拮抗劑（spironolactone）及血管收縮素受體阻斷劑（ARBs）均已被證實能改善症狀、減少再住院率並增加存活率。環管利尿劑（loop diuretic）主要用於緩解心衰竭的症狀，如水腫和呼吸困難，但並未被證實能直接增加心衰竭病患的存活率。因此，環管利尿劑是唯一無法增加存活率的藥物選項。\nReference: 2022 ACC/AHA/HFSA Guideline for the Management of Heart Failure.", "evidence": "2022 ACC/AHA/HFSA Guideline for the Management of Heart Failure."}, {"year": 111, "no": 13, "stem": "下列有關ST節段上升的心肌梗塞（ST-elevation myocardial infarction，STEMI）的敍述，何者錯誤？", "choices": {"A": "主要的發病機轉為血管內粥狀硬化斑瑰破裂，產生急性血栓將血管完全阻塞", "B": "抗血板藥物clopidogrel效果的臨床效果與ticargrelor, prasugrel相似", "C": "病發如在12小時內，要照會心臟科儘快進行心導管打通血管", "D": "可使用肝素(heparin)或低分子量肝素(low-molecular-weigth heparin, LMWH)治療", "E": "下壁心肌梗塞合併右心梗塞時，如血壓不穩，可考慮輸液治療"}, "answer": "B", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 111, "no": 14, "stem": "有關心房纖維顫動(Atrial fibrillation)相關的敘述，下列何者說法是錯誤的？", "choices": {"A": "最常見的持續性心律不整，一般而言80歲以上盛行率約10％", "B": "引起心房顫動的危險因子包括年老，高血壓，糖尿病，肥胖，呼吸終止症等", "C": "心房顫動約增加5倍中風的機會", "D": "抗凝血劑如aspirin等能有效預防中風發生", "E": "約30％的開心手術患者術後可能產生長短不等的陣發性心房顫動"}, "answer": "D", "is_endocrine": true, "subtopic": "DM", "explanation": "選項(D)錯誤。 Aspirin為抗血小板藥物，對於預防心房顫動（AF）相關之中風效果有限，尤其對於中度至高度風險的患者，應優先考慮使用口服抗凝血劑（如warfarin或新型口服抗凝血劑NOACs）。選項(A)正確，AF是最常見的持續性心律不整，高齡是其重要危險因子，80歲以上盛行率約10%。選項(B)正確，年老、高血壓、糖尿病、肥胖、睡眠呼吸中止症等均為AF的危險因子。選項(C)正確，AF會使中風機率增加約5倍。選項(E)正確，術後心房顫動（POAF）是開心手術後常見的併發症，發生率約20-40%。\nReference: 2020 ESC Guidelines for the diagnosis and management of atrial fibrillation in adults.", "evidence": "2020 ESC Guidelines for the diagnosis and management of atrial fibrillation in adults."}, {"year": 111, "no": 15, "stem": "70歲陳先生，因為發燒合併喘與端坐呼吸至急診，身體檢查在心尖部位聽到第四級收縮期雜音，且肺部有 囉音(rales）。心臟超音波在二尖瓣發現贅生物(vegetation)，三套血液培養呈現streptococcus gallolyticus。請問除了心內膜炎外，下列疾病必須列入考慮？", "choices": {"A": "腦膜病變", "B": "腎結石引發腎水腫", "C": "大腸息肉或大腸癌", "D": "肺部病變", "E": "攝護腺發炎"}, "answer": "C", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 111, "no": 16, "stem": "王老太太三個月前接受心臟瓣膜置換手術，近一個月來，運動時呼吸困難逐漸加重且有下肢水腫。經檢查 肝腎功能正常，給予利尿劑治療但頸靜脈仍有顯著擴張。門診胸部X光顯示心臟並未擴大，身體診察無心 雜音，肝臟稍腫大，有腹水及雙側下肢水腫。心導管檢查右心房平均壓力增加且右心房壓力曲線呈現明顯 的Y下降波。以下有關本病人的描述何者正確？", "choices": {"A": "血壓上升且脈搏壓變寬", "B": "胸部X光片呈現肺鬱血（lung congestion）現象", "C": "左右心室舒張末期壓力(end-diastolic pressure)不等", "D": "聽診時有可能會有心包敲擊音（pericardial knock），有些會出現｢奇脈｣（paradoxical pulse）", "E": "呼氣時，頸動脈擴張可能更形顯著"}, "answer": "D", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 111, "no": 17, "stem": "有關心臟衰竭 (Heart failure) 的敘述，下列何項不正確？", "choices": {"A": "左心室射出率保留心臟衰竭(heart failure with preserved ejection fraction, HFpEF)病患，給予血管收 縮素轉化酶抑制劑（angiotensin-converting enzyme inhibitor，ACEI）可有效改善預後", "B": "毛地黃(digoxin)因無法改善病人預後，目前僅在其它藥物充分使用後仍有明顯症狀時考慮給予", "C": "強心藥物(inotropic agents)無法改善預後，甚至可能增加死亡率及併發症，盡量在有需要時短期使 用", "D": "急性失調性心臟衰竭(Acute decompensated heart failure，ADHF)可能會併發心腎症候 群(Cardio-renal syndrome)，使用利尿量增加此類病人之排尿量不盡有效", "E": "在左心室射出減少心臟衰竭(heart failure with reduced ejection fraction, HFrEF)病 患，LCZ696(Sacubitril/Valsartan)較Ramipril更能有效減少死亡率"}, "answer": "A", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 111, "no": 18, "stem": "吳先生為慢性腎臟病病人，因為全身無力就診，抽血發現血清肌酸酐（creatinine）為5.0 mg/dL ，血 鉀（K）7.2 mmol/L，有關心電圖可能的變化下列何者有誤？", "choices": {"A": "高尖T波（peaked T wave）", "B": "PR期間變長", "C": "QRS波變寬", "D": "QT期間變長", "E": "P波變扁"}, "answer": "D", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 111, "no": 19, "stem": "關於慢性阻塞性肺病(Chronic obstructive pulmonary disease, COPD)的描述，下列何者錯誤？", "choices": {"A": "COPD患者若休息時血氧飽和度≤88%，接受長期氧療(long-term oxygen therapy, LTOT)可改善存 活", "B": "不建議長期使用口服類固醇", "C": "急性發作(COPD exacerbation) 大約有1/3是呼吸道病毒感染引起的", "D": "急性發作時，血氧不足時應給予氧氣以維持血氧飽和度≥90%", "E": "急性發作時，給予全身性類固醇(systemic corticosteroid)治療可以降低死亡率"}, "answer": "E", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 111, "no": 20, "stem": "周先生65歲，每天抽兩包菸共抽30年，五年前由於較劇烈運動後會呼吸急促，因此戒菸。最近一年大約 爬到二樓就要休息，慢慢的連稍微走一點平路都會覺得喘，常常需要停下來休息。他到附近醫院就醫，胸 部X光呈現兩側肺上葉大肺泡(bullae)。肺功能檢查結果為：FEV1/FVC=50%，FEV1為預測值的35%，給 予短效β2-agonist 15分鐘後FEV1改善3%。最近半年因為喘的症狀加重到醫院急診就醫三次，門診藥物治 療下列何者較不恰當？", "choices": {"A": "單獨給予吸入型Long-acting β2-agonist (LABA)", "B": "單獨給予吸入型Long-acting Muscarinic Antagonists (LAMA)", "C": "合併吸入型LAMA與LABA", "D": "合併LABA與吸入型類固醇", "E": "合併吸入型LAMA，LABA以及吸入型類固醇"}, "answer": "A", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 111, "no": 21, "stem": "下列哪一項不屬於第二型氣喘(Type 2 high-inflammation asthma)相關之生物標記？", "choices": {"A": "嗜酸性白血球 (eosinophils)", "B": "嗜中性白血球 (neutrophils)", "C": "白血球介素-4 (Interleukin-4)", "D": "白血球介素-5 (Interleukin-5)", "E": "白血球介素-13 (Interleukin-13)"}, "answer": "B", "is_endocrine": true, "subtopic": "DM", "explanation": "第二型氣喘（Type 2 high-inflammation asthma）的特徵是與過敏反應相關的發炎，其生物標記主要包括嗜酸性白血球（eosinophils）、白血球介素-4（IL-4）、白血球介素-5（IL-5）及白血球介素-13（IL-13）。嗜中性白血球（neutrophils）則與第一型氣喘（Type 1 or non-T2 asthma）的發炎途徑較為相關，該途徑通常與細菌感染或肥胖有關，而非典型的過敏反應。因此，嗜中性白血球不屬於第二型氣喘的生物標記。\nReference: Global Initiative for Asthma (GINA) Report 2023.", "evidence": "Global Initiative for Asthma (GINA) Report 2023."}, {"year": 111, "no": 22, "stem": "以下哪些因素有可能引發氣喘急性發作？ (1)運動 (2) 過度換氣 (3) 冷空氣 (4) SARS-CoV-2 病毒感染 (5) 使用beta-adrenergic blockers, aspirin等藥 物。", "choices": {"A": "(1)+(2)+(3)", "B": "(1)+(2)+(5)", "C": "(1)+(2)+(3)+(4)", "D": "(1)+(3)+(4)+(5)", "E": "(1)+(2)+(3)+(4)+(5)"}, "answer": "E", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 111, "no": 23, "stem": "關於社區性肺炎 (Community-acquired pneumonia) 的描述，下列何者正確？", "choices": {"A": "胸腔超音波診斷肺炎的靈敏度較胸部X光高", "B": "慢性肺疾病(chronic lung diseases, structure lung diseases)是綠膿桿菌社區性肺炎(Pseudomonas aeruginosa caused community-acquired pneumonia)的危險因子之一", "C": "尿液Streptococcus pneumoniae 與 Legionella pneumophila抗原檢驗都有很高的診斷靈敏度", "D": "CURB-65較The Pneumonia Severity Index (PSI)簡便且有效地判斷病患需要住院或只要接受門診治 療", "E": "接受門診治療的病患，只有在pneumococcal resistant to macrolide小於50%的地區方可單獨使 用macrolide治療"}, "answer": "B", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 111, "no": 24, "stem": "關於氧氣治療(Oxygen Therapy)的描述，下列何者錯誤？", "choices": {"A": "鼻導管（Nasal cannula）的氧氣流量以不超過 6 liters/min為原則", "B": "使用簡單式面罩（Simple face mask）時，若固定氧氣流速( 5 liters/min)，當病患每分鐘換氣量升 高，則FiO2會隨之下降", "C": "非再吸入性面罩（nonrebreather face mask）給予病患的氧氣FiO2可達0.6-1.0", "D": "Venturi mask的好處是可以提供病患相對固定的FiO2", "E": "高流量鼻導管（High-flow nasal cannula）可產生吐氣末正壓(positive end-expiratory pressure)，以 避免肺泡塌陷"}, "answer": "C", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 111, "no": 25, "stem": "下列有關急性呼吸窘迫症候群(acute respiratory distress syndrome, ARDS)的描述何者錯誤？", "choices": {"A": "根據Berlin definition，嚴重度是以PaO2/FiO2 ratio來區分", "B": "最常見造成ARDS的原因是肺炎及敗血症", "C": "呼吸器的設定應採用肺保護通氣策略(lung protective strategy)，使用較低的潮氣容積(Tidal Volume; 6 mL/kg)，以降低死亡率", "D": "Mild to moderate ARDS應考慮使用俯臥式通氣模式(Prone positioning) 以降低死亡率", "E": "類固醇的使用無法降低ARDS的死亡率"}, "answer": "D", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 111, "no": 26, "stem": "下列哪些原因會造成滲出肋膜積液(exudative pleural effusion)?(1) Peritoneal dialysis (2) Superior ve
