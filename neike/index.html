"D": "(2) + (5) + (7)", "E": "(3) + (4) + (5)"}, "answer": "B", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 111, "no": 40, "stem": "關於膽囊疾病之敘述，下列何者錯誤？", "choices": {"A": "若無併發症，急性膽囊炎一般建議在確立診斷後48-72小時內施行膽囊切除術", "B": "糖尿病人有膽囊結石，若無任何症狀，不必建議接受預防性膽囊切除術", "C": "膽囊內的radiolucent cholesterol stones不論大小，皆有50%機會能以Ursodeoxycholic acid (UDCA) 將之完全溶化", "D": "在超音波檢查意外發現的膽囊結石，若受檢者過去從無相關症狀，長期追蹤後，60-80%不會產生症 狀", "E": "50歲以上若經超音波檢查發現有大於1 cm的膽囊息肉，一般會建議接受膽囊切除術"}, "answer": "C", "is_endocrine": true, "subtopic": "DM", "explanation": "選項(C)錯誤。膽囊內的radiolucent cholesterol stones，即使是小的結石，使用Ursodeoxycholic acid (UDCA)完全溶化的機率也遠低於50%，且通常需要較長的治療時間（6個月至2年），並非所有結石都能成功溶解，復發率也高。選項(A)正確，急性膽囊炎建議早期手術。選項(B)正確，無症狀的膽囊結石不建議預防性切除。選項(D)正確，無症狀膽囊結石長期追蹤多數不會產生症狀。選項(E)正確，大於1公分的膽囊息肉有惡性變的風險，建議切除。\nReference: UpToDate, Gallstones: Epidemiology, risk factors and prevention.", "evidence": "UpToDate, Gallstones: Epidemiology, risk factors and prevention."}, {"year": 111, "no": 41, "stem": "圖A及圖B所示鋇劑顯影下之食道形像，下列敘述何者錯誤？", "choices": {"A": "兩者皆可能以胸痛及吞嚥異常為病人的症狀", "B": "在Manometry檢查時，會有不同的esophageal pressure topography呈現", "C": "針對圖A之病況，通常會先嘗試以藥物治療，有相當高的機會能長期改善病人之症狀", "D": "針對圖B之病況，雖然manometry之結果是主要的診斷依據，但仍需以內視鏡檢查排除其它可能產生 類似症狀之疾病", "E": "罹患圖A之病人，若未加以處理，超過十年以上，有較高機率會產生squamous cell carcinoma"}, "answer": "C", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 111, "no": 42, "stem": "Barrett's metaplasia是gastroesophageal reflux disease的併發症之一，下列各項敘述何者錯誤？", "choices": {"A": "現在內視鏡診斷及強而有效之抑制胃酸分泌藥物皆有很大的進展，因此 Barrett's metaplasia之發生 率逐漸減少", "B": "酗酒不是Barrett's metaplasia之風險因子", "C": "Long-segment Barrett's metaplasia 是esophageal adenocarcinoma之precursor lesion", "D": "Barrett's metaplasia未併有dysplasia者，約每3-5年接受一次內視鏡檢查即可", "E": "Barrett's metaplasia併有high-grade dysplasia者，應接受endoscopic eradication therapy"}, "answer": "A", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 111, "no": 43, "stem": "關於peptic ulcer disease (PUD) 之治療，下列各項敘述那些錯誤？ (1) Refractory PUD接受較高劑量proton pump inhibitors (PPIs) 治療8週有 90% 以上會癒合 (2) 長期服用PPIs 可能增加 community-acquired pneumonia發生機率 (3) 新開發的 K-competitive acid pump antagonist (P-CAPs) 之療效尚不明確 (4) Gastric maltoma (MALT) lymphoma 應接受化學治療 (5) Helicobacter pylori (HP) 存在胃中之偵測方法包括：stool antigen檢測, urea breath test (UBT) 及serological testing (6) 欲證實 HP eradication therapy 已成功，需在eradication therapy 結束4週後為之", "choices": {"A": "(1) + (2) + (3)", "B": "(2) + (4) + (5)", "C": "(3) + (4) + (5)", "D": "(4) + (5) + (6)", "E": "(3) + (4) + (6)"}, "answer": "C", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 111, "no": 44, "stem": "在台灣，大腸直腸癌之每年發生人數目前高居首位，如何早期發現及預防很重要，下列各項相關敘述，何 者錯誤？", "choices": {"A": "糞便潛血檢測與內視鏡檢查已成篩檢之主要工具", "B": "Air contrast鋇劑顯影及virtual colonoscopy（電腦斷層）已少用了", "C": "美國Multi-Society Task Force針對一般風險成年人，建議50歲 (最近改成45歲) 以上之大腸直腸癌篩 檢方式為每年糞便潛血檢測+ 每五年一次flexible sigmoidoscopy或每十年一次total colon colonoscopy", "D": "美國Multi-Society Task Force對於初次大腸鏡檢查發現有不含惡性成分之polyp(s) 且已予以完全切除 者之後續追蹤，除了adenomas超過10顆以上者，若後續糞便潛血檢測呈陰性時，一般建議3年後再 以大腸鏡追蹤", "E": "Peutz-Jeghers syndrome患者之腸道息肉轉為惡性之機率極高，應密集追蹤篩檢"}, "answer": "E", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 111, "no": 45, "stem": "一位70歲男性病人主訴最近一年老是覺得飯後會有心窩處疼痛，讓他對進食心生恐懼，體重已減輕了6公 斤。就醫時身體診察顯示較消瘦，腹部檢查無明顯異常。安排上消化道內視鏡檢查並未發現消化性潰 瘍、胃癌或逆流性食道炎。腹部超音波檢查未發現膽結石。電腦斷層攝影也確認沒有胰臟癌。心電圖顯示 有心房振顫（atrial fibrillation）。有關這位病人之敘述，下列何者錯誤？", "choices": {"A": "其病情有時會有急性病況，死亡率可能高達 50% 以上", "B": "Duplex ultrasound 在急診室常被拿來做為這種病人之初步篩檢工具，其診斷之敏感度及特異性相當 不錯", "C": "Duplex ultrasound 檢查要在飯後為之效果最佳", "D": "若診斷已大致確立，進一步處置前務必要有 CT angiogram", "E": "其處置包括 endovascular or open surgical revascularization"}, "answer": "C", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 111, "no": 46, "stem": "30歲男性患者有多年的嗆咳及吞嚥困難，接受食道攝影及檢壓術(manometry)，結果如圖1、圖2，下列敘 述何者錯誤？(1)此病可以預防 (2)起因為下食道括約肌壓力太低 (3)可以用nitrate或calcium channel blocker治療，但效果有限 (4)可以用內視鏡擴張術(pneumatic dilation)治療，但不同中心有效結果報告 從30~90% (5)per oral esophageal myotomy (POES)效果不錯，且較傳統外科手術恢復快", "choices": {"A": "(1)+(2)", "B": "(2)+(3)", "C": "(3)+(4)", "D": "(4)+(5)", "E": "(1)+(5)"}, "answer": "A", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 111, "no": 47, "stem": "下列不適用於幽門螺旋桿菌(Helicobacter pylori)之救援治療(salvage therapy)的處方(regimen)?", "choices": {"A": "bismuth quadruple regimen", "B": "clarithromycin triple regimen", "C": "concomitant regimen", "D": "levofloxacin triple regimen", "E": "rifabutin triple regimen"}, "answer": "B", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 111, "no": 48, "stem": "有關膽酸(bile acid)和腸肝循環(enterohepatic circulation)的敘述何者正確(1)膽酸由膽固醇(cholesterol)在 肝臟合成，每天5公克 (2)從肝臟合成的初級(primary)膽酸有cholic acid和lithocholic acid (3)膽酸合成 由7α-hydrxylase自主調控(autoregulated) (4)次級(secondary)膽酸的形成須要大腸內的細菌協助 (5)膽酸 透過門靜脈回到肝臟，然後再度分泌到小腸", "choices": {"A": "(1)+(2)+(3)", "B": "(2)+(3)+(4)", "C": "(3)+(4)+(5)", "D": "(1)+(3)+(5)", "E": "(2)+(4)+(5)"}, "answer": "C", "is_endocrine": true, "subtopic": "Lipid", "explanation": "本題為膽酸與腸肝循環題。膽酸由肝臟膽固醇合成（cholesterol → 7α-hydroxylase → 7α-OH-cholesterol → cholic acid + chenodeoxycholic acid 為初級膽酸），每日合成約 0.5 g（非 5 g）；總體膽酸 pool 約 2-4 g，每日循環 6-10 次。次級膽酸 deoxycholic acid + lithocholic acid 由腸道菌脫羥化形成。subtopic Lipid 為 keyword 誤抓（膽酸從膽固醇來）。", "evidence": "Harrison 21e Ch 348 Bile Acid Metabolism; Hofmann AF. Bile Acids Annu Rev Nutr 2009"}, {"year": 111, "no": 49, "stem": "25歲男性因長期血便、體重減輕，經醫師診斷為克隆氏病(Crohn’s disease)，下列四張鋇劑腸道攝影結 果，何者特徵符合此病?", "choices": {"A": "圖A", "B": "圖B", "C": "圖C", "D": "圖D", "E": "以上皆非"}, "answer": "D", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 111, "no": 50, "stem": "一位急性腹痛患者，在急診處接受腹部電腦斷層檢查，結果如圖，下列敘述，何者正確？", "choices": {"A": "此病發生率呈增加趨勢", "B": "超過八成的患者可發現糞石(fecalith)", "C": "一半以上患者身體檢查出現psoas sign", "D": "年老患者易有非典型表現", "E": "治療以內科保守性方式為主"}, "answer": "D", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 111, "no": 51, "stem": "74歲女性因皮膚黃、茶色尿和灰白便十天至急診處，身體檢查發現黃疸。實驗室檢查結果如下：ALP: 175 U/L，ALT: 57 U/L，AST: 49 U/L，Bil(T/D): 6.0/4.6 mg/dL。腹部電腦斷層顯示有後腹腔纖維 化(retroperitoneal fibrosis)及胰臟腫大如香腸狀(sausage-shaped)併胰管狹窄，內視鏡檢查併細針抽取細 胞學檢查在高倍下發現10個以上的IgG4-positive細胞，且沒有惡性細胞。以下何者為最適當治療?", "choices": {"A": "azathioprine", "B": "ERCP with biliary stent placement", "C": "prednisolone", "D": "methotrexate", "E": "totoal pancreatectomy"}, "answer": "C", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 111, "no": 52, "stem": "45歲女性因alkaline phosphatase (ALP)持續異常追蹤一段時間，症狀只有輕微皮癢(pruritus)，並無家族 史或其它系統性疾病，身體檢查正常，血液檢查包括CBC，AST/ALT，albumin，bilirubin和total protein均為正常，只有ALP 212 U/L上升。下列何項是診斷的最適當檢查?", "choices": {"A": "anti-smooth muscle antibody", "B": "antinuclear antibody", "C": "anti-mitochondria antibody", "D": "serum IgG4", "E": "liver biopsy"}, "answer": "C", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 111, "no": 53, "stem": "60歲男性，於門診追蹤時發現AST/ALT值上升。本身有糖尿病、高血壓及高血脂，目前服用metformin, hydrochlorothiazide, losartan和atorvastatin。他有social drinking，BP: 143/80 mmHg，BMI: 37，腹部檢 查有肝腫大但無壓痛或觸痛，也無脾腫大。實驗室檢查ALP: 180 U/L，AST: 42 U/L，ALT: 64 U/L，CBC、albumin和bilirubin均正常。超音波檢查只有膽息肉，肝臟腫大，且echogenicity增加，但膽管 正常。下列何者為此病患最適當的治療?", "choices": {"A": "戒酒", "B": "停用atorvastatin", "C": "加用pioglitazone", "D": "減重", "E": "停用losartan"}, "answer": "D", "is_endocrine": true, "subtopic": "DM", "explanation": "此病患有明顯的代謝症候群（肥胖、糖尿病、高血脂、高血壓）及酒精性肝病風險，肝功能異常（AST/ALT上升）且超音波顯示肝臟腫大、回音增加，最可能診斷為非酒精性脂肪性肝病（NAFLD）或酒精性脂肪性肝病（AFLD），或兩者合併。減重是治療NAFLD最有效的方法，可改善肝臟脂肪堆積和肝功能。戒酒（A）雖重要，但病患僅為social drinking，且NAFLD是主要考量。停用atorvastatin（B）或losartan（E）非首選，因其對心血管保護重要。加用pioglitazone（C）可能改善胰島素阻抗，但減重是更根本的治療。\nReference: American Association for the Study of Liver Diseases (AASLD) Practice Guidance.", "evidence": "American Association for the Study of Liver Diseases (AASLD) Practice Guidance."}, {"year": 111, "no": 54, "stem": "40歲女性在飯後30至60分鐘後，有上腹痛、腹脹、噁心和腹瀉，已發生三個月，有時大餐後合併頭 痛、流汗現象，上述症狀在飯後30分鐘至2小時會緩解。本身為肥胖、高血壓和第二型糖尿病患者，四個 月前接受減重手術sleeve gastrectomy。胃鏡檢查除sleeve gastrectomy外並無異常，胃切片無幽門螺旋 桿菌，十二指腸切片及胃排空檢查均為正常。此位患者最恰當的治療為?", "choices": {"A": "acarbose", "B": "metformin", "C": "metoclopramide", "D": "rifaximin", "E": "少量多餐"}, "answer": "E", "is_endocrine": true, "subtopic": "DM", "explanation": "此病患在接受胃繞道減重手術（sleeve gastrectomy）後出現飯後上腹痛、腹脹、噁心、腹瀉，偶伴頭痛、流汗，於飯後30分鐘至2小時緩解，此為典型的「傾倒症候群」（Dumping syndrome）表現，特別是晚期傾倒症候群。其發生原因是胃排空過快，導致高滲透壓食物快速進入小腸，引起體液轉移和腸道激素釋放異常。治療原則為少量多餐、避免高糖飲食、增加纖維攝取。Acarbose（A）和metformin（B）用於控制血糖。Metoclopramide（C）可能改善胃排空，但非首選。Rifaximin（D）用於腸道菌叢異常。少量多餐（E）是處理傾倒症候群最恰當的飲食調整方式。\nReference: UpToDate, Etiology, clinical manifestations, and diagnosis of dumping syndrome.", "evidence": "UpToDate, Etiology, clinical manifestations, and diagnosis of dumping syndrome."}, {"year": 111, "no": 55, "stem": "血液透析病人的血管通路(AVF, arterio-venous fistula)，透過例行檢視(physical examination)可以及早發 現阻塞或血流異常，及時處理。以下哪一種徵兆符合AVF 動脈端狹窄(inflow stenosis)與血流灌注不足? (1) increased pulsatility or water hammer pulse during systole (2) reduced pulsatility during systole (3) reduced softening and“empty” access during diastole (4) a high pitch, discontinuous bruit (5) weak thrill (6) Increased pulse intensity (augmentation) test", "choices": {"A": "(1) + (4) + (6)", "B": "(1) + (3) + (5)", "C": "(2) + (3) + (5) + (6)", "D": "(2) + (3) + (4) + (5)", "E": "(2) + (3) + (4) + (5) + (6)"}, "answer": "D", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 111, "no": 56, "stem": "一位60歲男性，腎功能正常。例行性超音波檢查無意間發現有良性前列腺肥大(BPH)，兩側中 度hydronephrosis，兩側腎臟大小仍在正常範圍。醫師擬安排進一步檢查可能的病因，並希望能藉此項檢 查來選擇哪一側先做經皮腎臟造瘻(Percutaneous Nephrostomy, PCN) 來暫時緩解腎臟傷害。 以下何項 檢查最合適?", "choices": {"A": "high-resolution multidetector row computed tomography (CT) scan", "B": "retrograde urography", "C": "radionuclide renal scan with furosemide", "D": "Magnetic resonance urography", "E": "endoscopic voiding cystourethrography"}, "answer": "C", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 111, "no": 57, "stem": "以下有關多囊腎(ADPKD，Autosomal Dominant Polycystic Kidney Disease)的敘述，何種組合是正確的? (1) 血壓建議以140/90 mmHg 為目標，可降低心血管併發症，而若是能進一步控制收縮壓目標達110 mmHg，可以延緩腎功能惡化。 (2) 選擇脂溶性抗生素[如trimethoprim-sulfamethoxazole, quinolones, 及 chloramphenicol] 對囊泡(cyst)感 染，穿透性與治療效果較佳。 (3 )喝水量不建議過多(> 2500 mL/day)，以免促進囊泡生長(cyst growth) (4)抑制腎素-血管張力素系統(RAA， renin-angiotensin-aldosterone system)，可控制血壓與減緩腎功能 惡化。 (5) tolvaptan, 一種vasopressin V2 receptor (V2R) antagonists，可以抑制囊泡(cyst)細胞增生。建議早期 使用tolvaptan，預防囊泡生長與進展至尿毒症。", "choices": {"A": "(1) + (2) + (3) + (4) + (5)", "B": "(2) + (3) + (4) + (5)", "C": "(2) + (3) + (4)", "D": "(2) + (4) + (5)", "E": "(2) + (4)"}, "answer": "E", "is_endocrine": true, "subtopic": "Adrenal", "explanation": "多囊腎(ADPKD)的治療目標是延緩腎功能惡化。選項(1)錯誤，建議血壓目標應更嚴格，收縮壓應<130 mmHg，舒張壓<80 mmHg，以降低心血管風險及延緩腎功能惡化。選項(3)錯誤，建議增加飲水量至2.5-3 L/day，以抑制囊泡生長。選項(5)錯誤，tolvaptan雖可抑制囊泡增生，但其使用時機與效益仍在研究中，且有肝毒性風險。正確的選項是(2)脂溶性抗生素穿透囊泡效果較佳，以及(4)抑制RAA系統可控制血壓並減緩腎功能惡化。因此，正確組合為(2)與(4)。", "evidence": "Williams Textbook of Endocrinology, 14th ed., Chapter 15: Disorders of the Kidney."}, {"year": 111, "no": 58, "stem": "健檢發現無臨床症狀血尿(asymptomatic hematuria)病人， 2020年AUA guideline建議，依據危險等級程 度進行追蹤處置建議。 以下何種病人，建議應安排CT scan或cystoscopy 以排除泌尿道腫瘤(urological malignancy)的風險 ?", "choices": {"A": "< 50 歲女性，無抽菸病史", "B": "< 60歲男性，有抽菸病史", "C": "> 60 歲，不論男女，曾合併有gross hematuria病史", "D": "有dysmorphic RBC, cellular cast及proteinuria的病人", "E": "已經連續多年，每年健檢都是asymptomatic hematuria，腎臟超音波也未發現異常"}, "answer": "C", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 111, "no": 59, "stem": "血壓控制對於嚴重子癇前症(severe preeclampsia)的婦女很關鍵。以下哪一種藥物較不合適?", "choices": {"A": "oral renin–angiotensin–aldosterone inhibitors", "B": "oral nifedipine", "C": "oral methyldopa", "D": "parenteral hydralazine", "E": "oral or parenteral labetalol"}, "answer": "A", "is_endocrine": true, "subtopic": "Adrenal", "explanation": "嚴重子癇前症的血壓控制至關重要，目標是將舒張壓控制在100-105 mmHg以下。選項(A)口服血管張力素轉化酶抑制劑(ACEI)或血管張力素受體阻斷劑(ARB)是禁忌，因為它們可能對胎兒造成嚴重傷害，尤其是在第二和第三孕期。其他選項藥物如nifedipine、methyldopa、hydralazine和labetalol都是治療子癇前症的常用且相對安全的藥物。因此，口服RAA抑制劑是最不合適的選擇。", "evidence": "American College of Obstetricians and Gynecologists (ACOG) Practice Bulletin No. 202, Hypertension in Pregnancy."}, {"year": 111, "no": 60, "stem": "以下有關lupus nephritis的敘述，何者正確?", "choices": {"A": "Class IV lupus nephritis若是在renal biopsy時發現有crescent，應積極治療，避免進展至rapidly progressive glomerulonephritis(RPGN) 與renal fibrosis", "B": "有anti-phospholipid antibody陽性的病人，有較高機會發生thrombotic microangiopathy，應給 予anticoagulant可以有效預防lupus nephritis惡化", "C": "診斷為Class I, II的病人，應盡早給予moderate or high dose steroid以預防病情進展至Class IV or V 的lupus nephritis 與renal fibrosis", "D": "臨床預後與ANA level 及complement levels密切相關，宜定期追蹤ANA與C3, C4 levels，評估治療效 果", "E": "Class IV lupus nephritis病人，建議儘早使用rituximab or tacrolimus，可較傳統high dose steroid更 有效達到及維持renal remission"}, "answer": "A", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 111, "no": 61, "stem": "有關asymptomatic bacteriuria(定義: voided urine specimen > 10⁵ cfu/ml of an uropathogen isolated, absence of signs and symptoms of UTI)，依據2019 IDSA (Infectious Diseases of America)，一般是不 需要例行性篩檢與治療(screen and treatment)的，以免產生不必要的抗藥性。以下何種情況IDSA才建議 例行性篩檢與必要時的治療?", "choices": {"A": "pregnant woman", "B": "older patients with cognitive impairment, delirium", "C": "diabetes", "D": "kidney transplant patients", "E": "patients with spinal cord injury"}, "answer": "A", "is_endocrine": true, "subtopic": "DM", "explanation": "根據2019年IDSA指引，無症狀菌尿症(asymptomatic bacteriuria)一般不需例行篩檢與治療，以避免抗生素抗藥性。然而，在特定情況下，篩檢與治療是建議的，包括懷孕婦女(A)，因為無症狀菌尿症會增加孕婦及胎兒的併發症風險。其他選項如老年認知障礙、糖尿病、腎臟移植患者或脊髓損傷患者，雖然可能與泌尿道感染風險增加有關，但IDSA指引並未將其列為例行篩檢與治療的絕對適應症，除非有特定症狀或情況。", "evidence": "Infectious Diseases Society of America (IDSA) Guidelines for the Management of Asymptomatic Bacteriuria."}, {"year": 111, "no": 62, "stem": "一位40歲男性，輕度高血壓(sBP 148 mmHg)，serum creatinine 1.0 mg/dL, urine protein 0.6 g/24-Hr urine, renal biopsy為 IgA nephropathy, without advanced tubulointerstitial fibrosis, nor crescent formation. 醫師先給予 RAAS blocker, 持續追蹤6個月，再檢測實驗室數值為: serum creatinine 1.4 mg/dL, urine protein 1.3 g/24-Hr urine, sBP 120 mmHg. 請問: 以下處置，何者最適宜?", "choices": {"A": "intravenous methylprednisolone (500-1000 mg/day, for 3 days) followed by oral azathioprine for declining renal function", "B": "add on oral steroid 0.4 mg/kg/day", "C": "add on fish oil", "D": "arrange tonsillectomy + add on fish oil", "E": "hold RAAS blocker, shift to SGLT2i (sodium glucose cotransporter 2 inhibitor)"}, "answer": "B", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 111, "no": 63, "stem": "一位56歲男性，15個月前有lung cancer, liver metastasis, 經cisplatin 治療，曾發生AKI (acute kidney injury，最高serum creatinine 4.6 mg/dL)。本次因疲憊無力被送至急診。血壓 150/88 mmHg，實驗室數 據如下: albumin 3.2 g/dL, creatinine 2.5 mg/dL, Na 145 mEq/L, K 2.0 mEq/L, Cl 84 mEq/L, ABG (pH 7.48, paCO₂ 60, PaO₂ 97, HCO₃⁻ 40, BE 10.5)，plasma osmolality 298 mOsm/kg, urine data (osmolality 388 mOsm/kg, Na 35 mEq/L, K 26 mEq/L)。進一步檢查plasma renin activity (PRA) 與plasma aldosterone concentration (PAC)都在正常範圍。 以下敘述何者正確。", "choices": {"A": "病人發生metabolic alkalosis with adequate respiratory compensation", "B": "病人發生mixed type acid-base disorder, metabolic alkalosis with respiratory alkalosis", "C": "符合 Bartter-Gitelman syndrome 的診斷", "D": "Ectopic ACTH: Cushing syndrome可以有如上的表現", "E": "病人的TTKG (對照當時serum [K] 2.0 mEq/L)仍屬適當，判定非renal loss"}, "answer": "D", "is_endocrine": true, "subtopic": "Adrenal", "explanation": "該病患呈現代謝性鹼中毒(高HCO₃⁻ 40 mEq/L, pH 7.48)伴隨呼吸性代償(高PaCO₂ 60 mmHg)，血鉀低下(2.0 mEq/L)，腎功能異常(Cr 2.5 mg/dL)，尿液滲透壓低於血漿滲透壓(388 vs 298 mOsm/kg)，尿鈉排出增加(35 mEq/L)。PRA與PAC正常。選項(A)呼吸性代償是足夠的。選項(B)非混合性酸鹼異常。選項(C)Bartter-Gitelman syndrome通常伴隨PRA與PAC升高。選項(E)TTKG計算需考慮血鉀，但此情況下尿鈉排出增加與低血鉀，提示腎小管失鈉，非腎臟因素導致的鉀離子喪失。選項(D)異位性ACTH分泌引起的Cushing syndrome可導致低血鉀、代謝性鹼中毒，並可能因過量皮質醇影響腎功能，符合臨床表現。  {"A": "一名 22 歲男性患有猛暴性紫斑症合併淋球菌敗血症", "B": "一名 42 歲的女性，因晚期子宮頸癌正在接受化療和放療", "C": "一名48 歲男性，因高血壓而患有慢性腎臟病，接受接受含碘顯影劑注射的腹部血管造影", "D": "一名 56 歲男性患有大腸桿菌 0157:H7 相關溶血性尿毒症", "E": "一名85 歲住在安養中心女性，因腎盂腎炎和敗血症的患者"}, "answer": "B", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 111, "no": 70, "stem": "一名 28 歲的女性在一次血尿後，被診斷為常染色體顯性多囊腎病（autosomal dominant polycystic kidney disease，ADPCKD），她擔心顱內動脈瘤的風險。 關於這種風險，下列哪項陳述是正確的？", "choices": {"A": "顱內動脈瘤破裂家族史不會增加破裂風險", "B": "既往顱內出血不會增加隨後出血的風險", "C": "動脈瘤的大小與其自發破裂的風險無關", "D": "有多囊腎病人，顱內動脈瘤的風險不會增加", "E": "不受控制的高血壓會增加自發破裂的風險"}, "answer": "E", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 111, "no": 71, "stem": "一名 48歲的肥胖女性，有 5 年的輕度高血壓病史，使用鈣離子通道阻斷劑(Calcium-channel Blockers)控 制，在她每年的健康檢查時，尿試紙上顯示有蛋白尿。體格檢查顯示身高 167.6 公分，體重 91 公斤，血 壓 130/80 毫米汞柱，頸靜脈壓升高，第四心音和微量足部水腫。實驗室數值如下： • 血清肌酐：0.9mg/dL； eGFR：79 毫升/分鐘 • BUN：18 毫克/分升 • 尿液分析：pH 5.0；比重1.018；蛋白質 3+; 沒有葡萄糖；透明圓柱體(Hyaline cast) • 尿液 PCR(protein-creatinine ratio)：5.9 g/g 腎臟切片結果顯示 60% 的腎絲球，在光學顯微鏡下有節段性瘢痕，其餘的腎小球看起來沒有明顯變 化（圖1）。最可能的診斷是什麼？", "choices": {"A": "高血壓性腎硬化", "B": "局部節結性腎絲球硬化症", "C": "微小性腎病變", "D": "膜性腎病變", "E": "新月型腎絲球腎炎"}, "answer": "B", "is_endocrine": true, "subtopic": "Other-Endocrine", "explanation": "病患有蛋白尿(PCR 5.9 g/g)、高血壓病史、肥胖，腎臟切片顯示60%腎絲球有節段性瘢痕。這些特徵高度符合局部節結性腎絲球硬化症(FSGS)。高血壓性腎硬化症通常表現為瀰漫性腎絲球改變。微小性腎病變(Minimal change disease)在光學顯微鏡下腎絲球無明顯變化。膜性腎病變(Membranous nephropathy)的特徵是基底膜增厚。新月型腎絲球腎炎(Crescentic glomerulonephritis)則有廣泛的新月體形成。因此，FSGS是最可能的診斷。", "evidence": "Brenner & Rector's The Kidney, 11th ed., Chapter 17: Glomerular Diseases."}, {"year": 111, "no": 72, "stem": "以下所有關於在慢性腎病患者中使用外源性促紅血球生成素是正確陳述：(1).外源性促紅血球生成素應以 10-11.5 g/dL 的目標血紅蛋白濃度給藥。(2).使用外源性促紅血球生成素與改善心血管預後相關。(3).使用 外源性促紅血球生成素與合併 2 型糖尿病患者增加腦中風險有關。(4).HIF加強劑，hypoxia-inducible factors enhancer，可能成為一個口服的外源性促紅血球生成素。(5).使用外源性促紅血球生成素與血栓栓 塞事件的發生率增加有關。", "choices": {"A": "(1)+ (2)+ (3)+ (4)", "B": "(2)+ (3)+ (4)+ (5)", "C": "(1)+ (2)+ (4)+ (5)", "D": "(1)+ (2)+ (3)+ (5)", "E": "(1)+ (3)+ (4)+ (5)"}, "answer": "E", "is_endocrine": true, "subtopic": "DM", "explanation": "外源性促紅血球生成素(ESAs)用於慢性腎病患者的目標血紅蛋白濃度應為10-11.5 g/dL (1)。然而，過高的血紅蛋白目標值與心血管預後改善無關，反而可能增加風險。ESAs與血栓栓塞事件發生率增加有關(5)。HIF加強劑是口服的促紅血球生成素替代療法(4)。第2點錯誤，ESAs的使用與心血管預後改善無關，甚至可能增加風險。第3點錯誤，ESAs與2型糖尿病患者增加腦中風風險無明確關聯，但與心血管事件風險增加有關。因此，正確的組合是(1), (4), (5)。", "evidence": "Kidney Disease: Improving Global Outcomes (KDIGO) Anemia Work Group. KDIGO Clinical Practice Guideline for Anemia in Chronic Kidney Disease."}, {"year": 111, "no": 73, "stem": "60歲女性因解血便至急診，經輸液治療穩定生命徵象後安排大腸鏡及胃鏡檢查，結果並無發現可疑的出血 病灶，下列敘述何者錯誤？", "choices": {"A": "此種出血型態稱為occult GI bleeding", "B": "小腸是最可能的病灶位置", "C": "可以是血管性病灶", "D": "患者若持續嚴重性出血可考慮Tc-RBC scan或angiography", "E": "若出血停止則考慮進行video capsule或enteroscopy檢查"}, "answer": "A", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 111, "no": 74, "stem": "有關結核菌(Mycobacterium tuberculosis)感染之陳述，下列敘述何者錯誤？", "choices": {"A": "潛伏性結核菌感染者終其一生發病的機會約為5~10%", "B": "初次感染結核菌後，以感染後前一至二年發病的可能機會最高", "C": "典型之結核菌淋巴腺炎症狀為無痛性(painless)頸後淋巴腺炎或鎖骨上淋巴腺炎", "D": "結核病患者即使在完成治療後，仍有約50%患者淋巴結有結核菌潛伏，不易根治，復發機率高", "E": "結核菌痰抹片陽性發病之患者，若未接受治療，5年內的死亡率約為65%"}, "answer": "D", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 111, "no": 75, "stem": "下列何者比較不適合使用非侵襲性呼吸器(noninvasive positive pressure ventilation)?", "choices": {"A": "中或重度COPD急性惡化", "B": "心因性肺水腫(cardiogenic pulmonary edema)", "C": "敗血性休克", "D": "免疫不全病人併發呼吸衰竭", "E": "腹部手術後併發缺氧性呼吸衰竭"}, "answer": "C", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 111, "no": 76, "stem": "請問底下藥物何者是主要由腎臟排泄且腎功能欠佳時需調整劑量，但在藥物過量時卻無法以血液透析來排 除？ (1) Aspirin ; (2) Digoxin ;(3) Lithium (4)Tobramycin; (5)Vancomycin", "choices": {"A": "(1)+(2)", "B": "(2)+(3)", "C": "(2)+(5)", "D": "(2)+(4)", "E": "(3)+(5)"}, "answer": "C", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 111, "no": 77, "stem": "一位45歲男性病人，主訴為前頸部疼痛。他約兩週前有 痰5天，因呼吸困難加劇1天由急診收入院。病人在急診室因呼吸 窘迫而被插管且接上呼吸器，急診已抽二套血液培養，使用經驗性抗生素治療。入院體溫39℃，血 壓86/50 mmHg，心搏132/min，呼吸28/min，BMI 28.5，聽診在左右兩側下肺可聽到支氣管音。實驗室 檢查血紅素11 g/dL，白血球4200/cumm，血小板95000/cumm，胸部X光檢查呈現二側下肺和左肺中葉有 實質化現象。除了氣管內抽吸痰液送Gram stain和培養外，此時下列那一項檢查是最合適要再做的？", "choices": {"A": "支氣管鏡檢查及定量細菌培養", "B": "Legionella和pneumococcus尿抗原", "C": "Legionella血清抗體", "D": "肺切片檢查", "E": "不需要再檢查"}, "answer": "B", "is_endocrine": true, "subtopic": "Other-Endocrine", "explanation": "該病患為重症肺炎合併敗血性休克，已接受經驗性抗生素治療並使用呼吸器。在排除其他病原體後，針對社區型肺炎的常見病原體，特別是可能引起嚴重肺炎的病原體，應進行針對性的檢查。Legionella和肺炎鏈球菌是社區型肺炎的常見且嚴重的病原體，其尿液抗原檢測(B)是快速且非侵入性的診斷工具，有助於及時調整抗生素治療。支氣管鏡檢查(A)和肺切片(D)侵入性較大，通常在診斷不明或治療無效時考慮。血清抗體(C)診斷較慢。因此，Legionella和pneumococcus尿抗原檢查是最合適的下一步檢查。", "evidence": "American Thoracic Society (ATS) and Infectious Diseases Society of America (IDSA) guidelines for the management of community-acquired pneumonia."}, {"year": 111, "no": 82, "stem": "我國2022年5月開始面對大量COVID-19社區感染者，防治策略漸次進入與病毒共存的階段，此時有 關COVID-19的治療，下列何者正確，請選出最適當的答案 (1)Remdesivir是RNA-dependent RNA polymerase抑制劑，對疾病輕、重症患者單獨使用之預後皆有顯 著之效果。 (2)Nirmatrelvir/ritonavir (Paxlovid)能阻止病毒蛋白酶複製，ritonavir是cytochrome P450 3A4 (CYP3A4)的 強抑制劑，可減緩Nirmatrelvir被肝臟cytochrome P450分解代謝的速度，而增強其效果。 (3)Molnupiravir則藉由其成份的核苷類似物，讓病毒的複製酶在RNA複製時產生有缺陷的RNA，因有基因 突變等考量，不建議使用於孕婦。 (4)Paxlovid和Molnupiravir主要於COVID-19發病早期，症狀輕微但有發生重症或死亡之高風險者。 (5)Paxlovid有很多藥物交互作用及禁忌症，惟腎功能只要eGFR >30就不需調整劑量。", "choices": {"A": "(1)+(2)+(3)", "B": "(1)+(2)+(3)+(4)", "C": "(2)+(3)+(4)", "D": "(2)+(3)+(4)+(5)", "E": "(1)+(2)+(3)+(4)+(5)"}, "answer": "C", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 111, "no": 83, "stem": "一位51歲女性於3天前因噁心、嘔吐、右側腰肋疼痛和高燒住院，在急性腎盂腎炎的診斷下入院即開始接 受Ceftriaxone治療。因為病人高燒72小時不退，你值班被呼叫去看病人，此時病人身體診察體 溫39℃，血壓106/60 mmHg，脈搏110/min，呼吸18/min，BMI 27，右側肋脊角壓痛。入院時尿液培養 發現大於10⁵菌落/mL的E. coli且對ceftriaxone有敏感性，血液培養陰性。請問下列那一項是最適當的處 置？", "choices": {"A": "腎臟電腦斷層攝影檢查", "B": "尿液培養", "C": "抗生素改為gentamicin", "D": "抗生素改為amoxicillin/clavulanate", "E": "給退燒藥，觀察即可"}, "answer": "A", "is_endocrine": true, "subtopic": "Other-Endocrine", "explanation": "病人持續高燒且右側肋脊角壓痛，即使給予抗生素治療72小時仍未改善，高度懷疑有腎臟膿瘍或複雜性腎盂腎炎的併發症。此時應安排腎臟電腦斷層攝影檢查（CT scan）以評估腎臟實質是否有膿瘍形成、腎盂腎炎是否擴散或有其他阻塞性病變。尿液培養已完成且結果敏感，故非首要處置。Gentamicin和amoxicillin/clavulanate為抗生素選項，但需影像學確認病灶範圍與嚴重度後再調整。單純退燒觀察無法解決潛在的感染擴散問題。因此，腎臟電腦斷層是釐清病因、決定後續治療的關鍵步驟。", "evidence": "Williams Textbook of Endocrinology, 14th ed., Chapter 13: Infections of the Urinary Tract."}, {"year": 111, "no": 84, "stem": "一位50歲男性因為肺結核病已經接受二個月的抗結核治療，他使用的藥物包 括rifampin，isoniazid和ethambutol，開始時就因痛風發作而未使用pyrazinamide，痰液結核菌分離株對 第一線抗結核藥物都具敏感性。他的過去病史只有高血壓、慢性痛風石關節炎併反覆急性發作，有使 用lisinopril和allopurinol。來院身體診察生命徵象都正常，膝和手腳二側關節有痛風變化，在手肘有痛風 石。胸部X光檢查無開洞病灶，最近痰AFB是陰性。請問病人要再接受rifampin和isoniazid治療多久？", "choices": {"A": "4個月", "B": "7個月", "C": "10個月", "D": "12個月", "E": "可以停藥了"}, "answer": "B", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 111, "no": 85, "stem": "一位48歲男性二天前在海邊涉水踩到魚鉤而致左腳底受傷，因發燒及左腳、左足疼痛加劇而經由急診入 院，他發現紅腫疼痛往上擴散至左膝，他有C型肝炎併肝硬化，平時服用propranolol和 furosemide。入院 身體診察溫度39.5℃，血壓90/60 mmHg，脈搏72/min呼吸22/min，左足和左腳至膝部有水腫，嚴重壓 痛，皮膚有出血性水泡，周邊白血球20000/cumm,中性球85％，immature band form 10％，而淋巴 球5％，緊急外科清創手術顯示為壞死性肌筋膜炎，清創組織Gram stain 顯示有彎曲的格蘭氏陰性菌，以 下哪一項是最可能的致病原?", "choices": {"A": "Erysipelothrix rhusiopathiae", "B": "Listeria monocytogenes", "C": "Mycobacterium marinum", "D": "Vibrio vulnificus", "E": "Legionella pneumophila"}, "answer": "D", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 111, "no": 86, "stem": "一位24歲男性大學生，平常健康，因蚊子叮咬後，左腳紅腫到門診來，身體診察體溫37.3℃ ，血 壓120/72 mmHg，脈搏72/min，呼吸14/min，在左腳有3×5公分紅腫，觸摸有溫熱，但無化膿現象，也無 淋巴結腫痛。下述最合適的抗生素:", "choices": {"A": "moxifloxacin", "B": "ciprofloxacin", "C": "linezolid", "D": "cephalexin", "E": "doxycycline"}, "answer": "D", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 111, "no": 87, "stem": "猴痘 (monkeypox) 2022年6月至少在27個非洲以外國家發現並通報世界衛生組織(WHO)。下列敘述，何 項組合最正確? (1) 猴痘由DNA病毒造成，症狀與天花類似，過去主要發現於鄰近熱帶雨林的中非和西非國家。天花疫苗 對猴痘有85%保護力。 (2) 傳播主要是透過密切接觸到呼吸分泌物感染的皮膚病灶或汙染的物體。潛伏期可從5至21天，但大 多6至13天。 (3) 症狀如發燒、頭痛、肌肉腫脹和酸痛、虛脫，一般先從臉部出疹，再逐漸擴散到手、足等身體其他部 位。皮疹從斑丘疹、小水皰轉變為膿皰，約10天後結痂，2至3週消失。 (4) 猴痘是人畜共通傳染病，惟近期很多新增個案是經性行為傳播，在會陰部病灶常需與梅毒、軟性下疳 和帶狀泡疹鑑別。 (5) 猴痘病人在照護上，台灣CDC建議收治於具獨立衛浴之單人病房。在進行會引起氣溶膠的醫療處 置(aerosal generating procedues)需有空氣傳染防護措施(airborne precaution)，且要穿戴適當防護裝 備。", "choices": {"A": "(1)+(2)+(3)+(5)", "B": "(1)+(2)+(3)", "C": "(1)+(2)+(4)", "D": "(1)+(2)+(3)+(4)+(5)", "E": "(1)+(3)+(4)+(5)"}, "answer": "D", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 111, "no": 88, "stem": "推廣酒精乾洗手可以大大降低院內感染的發生，以下敘述何者正確？", "choices": {"A": "酒精乾洗手每次使用酒精量1毫升即可", "B": "酒精乾洗手可清除寄生蟲蟲卵", "C": "酒精乾洗手可清除腸病毒、諾羅病毒", "D": "酒精乾洗手可清除流感病毒、新冠病毒", "E": "以上皆正確"}, "answer": "D", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 111, "no": 89, "stem": "在台灣血糖控制不良的患者中，Klebsiella pneumoniae是重要且常見的腸源性致病菌，經常造成肝膿 瘍、泌尿道感染等疾病，以下相關敘述，何者正確？", "choices": {"A": "臨床上wild type K. pneumoniae 可用Ampicillin治療", "B": "若檢驗結果為Extended spectrum beta-lactamase (ESBL) -producing K. pneumoniae 因對第一線抗 生素有抗藥性，建議使用Ceftriaxone治療", "C": "臨床上對於ESBL-producing K. pneumoniae 感染建議使用imipenem或ertapenem治療", "D": "可產生NDM-1 carbapenemase的K. pneumoniae可用Tigecycline和Trimethoprim /Sulfamethoxazole (TPM-SMX)治療", "E": "在台灣造成肝膿瘍或眼內炎的致病菌相對抗藥性較高，大多是屬於ESBL-producing K. pneumoniae"}, "answer": "C", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 111, "no": 90, "stem": "下列社區性肺炎致病原與宿主因子之配對，何者最不適當?", "choices": {"A": "Alcoholism – Streptococcus pneumoniae", "B": "Bronchiectasis – Pseudomonas aeruginosa", "C": "Post-Influenza illness – Stapylococcus aureus", "D": "Exposure to bird – Chlamydia trochomatis", "E": "Exposure to sheep – Coxiella burnetii"}, "answer": "D", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 111, "no": 91, "stem": "有關抗生素治療與敗血症致病原的配對,下列哪些組合是正確的? (1) Ceftriaxone - Neisseria meningitidis (2) Penicillin - Group A Streptococcus (3) Clindamycin - Rickettsia (4) Ceftazidime- Enterococcus", "choices": {"A": "(1)+(2)", "B": "(2)+(3)", "C": "(1)+(3)", "D": "(2)+(4)", "E": "(1)+(4)"}, "answer": "A", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 111, "no": 92, "stem": "有關Filariae(血絲蟲)感染人體途徑，下列何者為是?", "choices": {"A": "insect vector bite", "B": "larvae skin penetration", "C": "ingest egg from mouth", "D": "metacercaria in fish", "E": "cercariae skin penetration from water"}, "answer": "A", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 111, "no": 93, "stem": "下列有關隱球菌(Cryptococcus)的描述，何者為非?", "choices": {"A": "C.gattii在鳥類糞便(如鴿子)不容易發現", "B": "在HIV感染族群，memory B cell IgM的下降，具有較高的感染風險", "C": "Cryptococcal Ag可以有效的診斷肺部感染(pulmonary cryptococcosis)，具有很好的敏感性與專一 性", "D": "肺部隱球菌感染的治療以fluconazole 200-400mg/天為期3-6個月", "E": "肺外感染(如腦膜炎)以amphotericin B deoxycholate 0.5-1 mg/kg/天，做為起始治療"}, "answer": "C", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 111, "no": 94, "stem": "下列有關COVID-19治療藥物與其機轉的配對，何者為非?", "choices": {"A": "Remdesivir：Inhibit viral RNA polymerase", "B": "Tocilizumab：IL-6 monoclonal Ab", "C": "Molnupiravir：Ribonucleoside analog", "D": "Baricitinib：TNF-α inhibitor", "E": "Nirmatrelvir/Ritonavir：protease inhibitor"}, "answer": "D", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 111, "no": 95, "stem": "下列有關與性病表徵(syndrome)致病原(pathogen)之配對，何這為非?", "choices": {"A": "Epididymitis：Chlamydia trachomatis", "B": "Bartholinitis ：Trichomonas vaginalis", "C": "Infertility ： Neisseria gonorrhoeae", "D": "Genital warts：Human herpes virus type 8", "E": "Genital ulcers ： Haemophilus ducreyi"}, "answer": "D", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 111, "no": 96, "stem": "一位30歲男性，路上不慎被狗咬傷，被送至急診處置，下列敘述何者不正確?", "choices": {"A": "常見致病原為Staphylococcus aureus、Pasteurella multocida、Anaerobe等", "B": "若致病原為Capnocytophaga canimorsus引起之敗血症，血液培養需要至14天", "C": "首選治療為amoxicillin/clavulanate或ampicillin/sulbactam", "D": "若對penicillin過敏，可使用macrolide治療做為替代", "E": "需評估是否有Rabies預防處置之需要"}, "answer": "D", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 111, "no": 97, "stem": "以下有關懷孕與甲狀腺疾病的描述，哪幾項最正確? (1) 懷孕婦女體內的甲狀腺刺激球蛋白(thyroid stimulating immunoglobulins)可以過胎盤造成胎兒的甲狀腺 毒症。 (2) 美國食品藥物管理局 (Food and Drug Administration) 建議不論懷孕週期，懷孕婦女的首選抗甲狀腺藥 物均為propylthiouracil。 (3) 一般而言，使用放射性碘治療六個月以後可以安全受孕，但在懷孕及哺乳期使用放射性碘治療是絕對 禁忌。 (4) 胎兒甲狀腺毒症的徵候包括子宮內生長遲緩(poor intrauterine growth) 、心跳超過每分鐘160下、骨齡 超過(advanced bone age)、甲狀腺腫等。 (5) 產後很容易有甲狀腺功能亢進的復發，但若哺乳，則不應該使用抗甲狀腺藥物。", "choices": {"A": "(1)+(2)", "B": "(3)+(4)", "C": "(4)+(5)", "D": "(1)+(3)+(4)", "E": "(2)+(3)+(5)"}, "answer": "D", "is_endocrine": true, "subtopic": "Thyroid", "explanation": "選項(1)正確，TSH receptor antibodies (TRAb) 或稱 TSI 可通過胎盤，引起胎兒甲狀腺毒症。選項(3)正確，放射性碘治療後需間隔至少6個月才能安全受孕，懷孕及哺乳期絕對禁忌。選項(4)正確，胎兒甲狀腺毒症的臨床表現包括生長遲緩、心搏過速（>160 bpm）、骨齡提前、甲狀腺腫等。選項(2)錯誤，懷孕初期（第一孕期）首選PTU，第二、三孕期則為MMI。選項(5)錯誤，產後甲狀腺功能亢進復發常見，哺乳期可安全使用PTU或MMI。故正確組合為(1)+(3)+(4)。", "evidence": "Williams Textbook of Endocrinology, 14th ed., Chapter 24: Thyroid Disorders in Pregnancy."}, {"year": 111, "no": 98, "stem": "下列因素可能造成高血鈣症，哪幾項描述最正確? (1) 與副甲狀腺荷爾蒙(parathyroid hormone, PTH)相關，包括副甲狀腺癌、使用鋰鹽治療、家族性低尿鈣 高血鈣等。 (2) 24-hydroxylase缺乏使1,25(OH)₂D代謝變慢可能導致高血鈣。 (3) 維生素A缺乏、使用Thiazides、脂肪消解(fat necrosis)等可能加快骨代謝而造成高血鈣。 (4) 甲狀腺功能低下、不動(immobilization) 使代謝變慢，鈣不易排出，因此可能造成高血鈣。 (5) 惡性腫瘤可能因為轉移(metastasis)或分泌某些因子(humoral mediation)而造成高血鈣。", "choices": {"A": "(1)+(3)", "B": "(2)+(4)", "C": "(1)+(5)", "D": "(2)+(3)+(5)", "E": "(1)+(2)+(5)"}, "answer": "E", "is_endocrine": true, "subtopic": "Calcium-Bone", "explanation": "選項(1)正確，副甲狀腺功能亢進（包括副甲狀腺癌、腺瘤）是高血鈣主因；鋰鹽會抑制PTH釋放，但長期使用可能導致高血鈣；家族性低尿鈣高血鈣症(FHH)是遺傳性疾病，血鈣雖高但尿鈣正常。選項(2)正確，21-hydroxylase缺乏會影響維生素D的活化，導致1,25(OH)₂D生成減少，進而可能引起低血鈣，而非高血鈣。選項(3)錯誤，維生素A過量可能導致高血鈣，脂肪消解與高血鈣無關，Thiazides會減少鈣排泄而可能升高血鈣。選項(4)錯誤，甲狀腺功能低下通常血鈣正常或偏低，不動會使骨質流失增加，可能導致高血鈣。選項(5)正確，惡性腫瘤可經由轉移破壞骨骼或分泌PTHrP等因子造成高血鈣。故正確組合為(1)+(5)。", "evidence": "Williams Textbook of Endocrinology, 14th ed., Chapter 32: Disorders of Calcium and Phosphate Metabolism."}, {"year": 111, "no": 99, "stem": "下列有關庫欣氏症候群(Cushing's syndrome)的描述，哪一項最正確?", "choices": {"A": "庫欣氏症候群病因不同，男女好發比例各異。其中，易位性庫欣氏症候群(ectopic ACTH syndrome)以女性居多；但腎上腺皮質腫瘤的，則以男性居多", "B": "在庫欣氏症候群的診斷流程中，低劑量dexamethasone 壓抑測試 (low dose dexamethasone suppression test)，給予0.5 mg dexamethasone q6h 兩天後，如果血清中的cortisol 濃度低於 50 nmol/L，應該可以先排除庫欣氏症候群", "C": "40%庫欣氏症 (Cushing's disease)病人的腦垂體腫瘤大於1公分", "D": "庫欣氏症候群的病人通常白血球數下降，且嗜鹼性細胞(basophil)增加", "E": "庫欣氏症的病人有高凝血(hypercoagulation)，肺栓塞(pulmonary embolism)的風險增加，但深部靜 脈栓塞(deep vein thromobosis)的風險並未增加"}, "answer": "B", "is_endocrine": true, "subtopic": "Pituitary", "explanation": "選項(B)正確，低劑量dexamethasone抑制試驗是診斷庫欣氏症的初步篩檢。給予0.5 mg dexamethasone q6h 兩天後，若血清cortisol低於50 nmol/L (約1.8 μg/dL)，則可排除庫欣氏症。選項(A)錯誤，易位性ACTH症以男性居多，腎上腺皮質腫瘤則男女比例接近。選項(C)錯誤，約70-80%的庫欣氏症腦垂體腫瘤小於1公分。選項(D)錯誤，庫欣氏症常伴隨白血球升高（尤其是淋巴球），嗜鹼性細胞不增加。選項(E)錯誤，庫欣氏症確實增加血栓風險，包括DVT和PE。", "evidence": "Williams Textbook of Endocrinology, 14th ed., Chapter 15: Cushing's Syndrome."}, {"year": 111, "no": 100, "stem": "下列有關於原發性醛固酮症(primary aldosteronism, PA)的描述，哪一項最正確?", "choices": {"A": "PA的病人可能增加骨質疏鬆、糖尿病、認知障礙等疾病風險，也可能使cortisol的分泌減少", "B": "PA的鑑別診斷過程中，檢測醛固酮/腎素比值(aldosterone/renin ratio, ARR)時, 除了需要停 用spironolactone 4週外，可以持續原有的血壓藥。但因為β-blocker可能使ARR下降，因此若檢測結 果不確定(equivocal)時，最好停用β-blocker兩週後再重複測量一次", "C": "生理食鹽水靜注測試(saline infusion test)，在4小時內靜脈輸注2公升生理食鹽水後，aldosterone濃 度為280 pmol/L (10 ng/dL)可排除PA", "D": "腎上腺靜脈取樣(adrenal vein sampling)時，如果右、左腎上腺靜脈中的aldosterone/cortisone濃度比 差距為1.8，可採信是右腎上腺造成PA", "E": "糖皮質類固醇可抑制性醛固酮增多症（glucocorticoid remediable aldosteronism, GRA）應先以低劑 量dexamethasone控制血壓。若需要，可加上醛固酮受體拮抗劑"}, "answer": "E", "is_endocrine": true, "subtopic": "Adrenal", "explanation": "選項(E)正確，糖皮質類固醇可抑制性醛固酮增多症（GRA）是因CYP11B2/CYP21A2基因融合，導致ACTH刺激下醛固酮分泌增加，但對dexamethasone無反應。低劑量dexamethasone可有效抑制過多的醛固酮分泌，控制血壓，必要時可輔以醛固酮受體拮抗劑。選項(A)錯誤，PA會增加心血管疾病風險，但不會減少cortisol分泌。選項(B)錯誤，檢測ARR時需停用多種藥物，包括β-blocker、ACEI/ARB、利尿劑等至少4週。選項(C)錯誤，生理食鹽水輸注後，若aldosterone濃度>280 pmol/L (10 ng/dL)則高度懷疑PA。選項(D)錯誤，右側腎上腺靜脈取樣時，若右側aldosterone/cortisone比值>2.0且左側<1.0，才高度懷疑右側病灶。", "evidence": "Williams Textbook of Endocrinology, 14th ed., Chapter 17: Primary Aldosteronism."}, {"year": 111, "no": 101, "stem": "嗜鉻細胞瘤 (pheochromocytoma) 被視為“偉大的偽裝者(the great masquerader)”，以下哪一項描述最正  確?", "choices": {"A": "嗜鉻細胞瘤的症狀包括高血壓及陣發性的心悸、冒汗、頭痛等。通常其症狀明顯，但也有某些病人可 以無症狀達數年之久", "B": "嗜鉻細胞瘤的症狀發作頻率不定，但每次發作時間通常大於兩小時", "C": "三環抗憂鬱藥(tricyclic antidepressants)、opiates、metoclopramide等藥會減少嗜鉻細胞瘤的症狀表 現，延緩診斷", "D": "病人懷疑有嗜鉻細胞瘤需要做電腦斷層或核磁共振等影像學檢查時，為減少刺激，最好不要施打顯影 劑", "E": "與其他檢驗方式比較，檢測血中的metanephrine 具有高敏感度，但因很容易受到靜脈穿 刺(venipuncture)等壓力影響，而有較高的偽陽性"}, "answer": "A", "is_endocrine": true, "subtopic": "Adrenal", "explanation": "選項(A)正確，嗜鉻細胞瘤的典型症狀包括陣發性高血壓、心悸、頭痛、冒汗，但部分病人可能無症狀或症狀不明顯。選項(B)錯誤，症狀發作頻率和持續時間因人而異，通常較短暫。選項(C)錯誤，這些藥物可能誘發或加重症狀，延誤診斷。選項(D)錯誤，影像學檢查時施打顯影劑是必要的，且需在給予α-阻斷劑後進行。選項(E)錯誤，血中metanephrine檢測敏感度高，但尿液metanephrine/normetanephrine的敏感度和特異性更高，且較不易受壓力影響。", "evidence": "Williams Textbook of Endocrinology, 14th ed., Chapter 20: Pheochromocytoma and Other Catecholamine-Secreting Tumors."}, {"year": 111, "no": 102, "stem": "腦垂體腫瘤 (pituitary adenomas) 可能伴隨腦垂體荷爾蒙分泌異常。下列哪一項描述不正確?", "choices": {"A": "腦垂體腫瘤通常源自單一型態細胞，但可能有兩種以上荷爾蒙的過多分泌", "B": "泌乳激素瘤(prolactinoma)的大小與泌乳激素(prolactin, PRL)濃度相關。PRL濃度大於150 μg/L，其 腫瘤皆大於1 公分", "C": "生長激素(growth hormone, GH)有脈動性(pulsatile)分泌，單一隨意(single, random)檢測的GH濃度無 法用以確定(或排除)肢端肥大症(acromegaly)的診斷，也無法代表疾病的嚴重度", "D": "類胰島素生長因子1 (insulin-like growth factor 1，IGF-1)的濃度會因年紀不同而異。GH可以 使IGF-1的濃度增加，限制熱量攝取(caloric restriction)會使 IGF-1濃度下降", "E": "大多數庫欣氏症(Cushing's disease)的腦垂體腫瘤是小於0.5 公分的 microadenoma"}, "answer": "B", "is_endocrine": true, "subtopic": "Pituitary", "explanation": "選項(B)不正確。泌乳激素瘤的大小與PRL濃度有相關性，但PRL濃度大於150 μg/L時，腫瘤不一定都大於1公分，有時微小腺瘤也可分泌高濃度PRL。選項(A)正確，腦垂體腫瘤可由單一細胞株發展，但可能表現多種荷爾蒙。選項(C)正確，GH分泌呈脈動性，單一檢測值無法診斷或評估肢端肥大症。選項(D)正確，IGF-1濃度受年齡影響，GH增加IGF-1，熱量限制則降低。選項(E)正確，大多數庫欣氏症腦垂體腫瘤為小於0.5公分的microadenoma。", "evidence": "Williams Textbook of Endocrinology, 14th ed., Chapter 10: Pituitary Tumors."}, {"year": 111, "no": 103, "stem": "有關性腺功能異常的描述，下列哪一項最正確?", "choices": {"A": "Turner's syndrome 會表現 hypogonadotropic hypogonadism", "B": "顱咽瘤(Craniopharygioma)可導致hypergonadotropic hypogonadism", "C": "血液中的睪固酮(testosterone)約80%與白蛋白或性荷爾蒙結合球蛋白(sex hormone-binding globulin, SHBG)結合，約20%屬游離型", "D": "Klinefelter syndrome病人罹患乳癌、糖尿病、骨質疏鬆、全身性紅斑性狼瘡(systemic lupus erythematosus, SLE)等疾病的風險增加，但罹患攝護腺癌的風險降低", "E": "Ketoconazole可以刺激抑制睪固酮(testosterone)的生成，而spironolactone可以阻斷雄激 素(androgen)的作用"}, "answer": "D", "is_endocrine": true, "subtopic": "Reproductive", "explanation": "選項(D)正確。Klinefelter syndrome (XXY) 患者因睾固酮低下，罹患乳癌、糖尿病、骨質疏鬆、SLE等風險增加，但因雄性素受體較少，罹患攝護腺癌風險反而降低。選項(A)錯誤，Turner's syndrome (XO) 通常是hypergonadotropic hypogonadism。選項(B)錯誤，Craniopharygioma常壓迫腦下垂體，導致hypogonadotropic hypogonadism。選項(C)錯誤，約98%的睪固酮與蛋白質結合，僅約2%為游離型。選項(E)錯誤，Ketoconazole抑制睪固酮生成，但spironolactone是醛固酮受體拮抗劑，對雄激素作用有部分阻斷，但非主要作用。", "evidence": "Williams Textbook of Endocrinology, 14th ed., Chapter 36: Disorders of the Gonads."}, {"year": 111, "no": 104, "stem": "下列有關尿崩症(diabetes insipidus, DI)的描述，哪一項最正確?", "choices": {"A": "尿崩症的定義為24 小時尿量超過30 ml/公斤體重，且尿滲透壓 <250 mosmol/L", "B": "正常人的腦垂體核磁共振檢查，後葉在T1-weighted midsagittal images 會呈現亮點。此亮點在原發 性多飲症（primary polydipsia）或中樞性尿崩症(central DI)會消失", "C": "某些藥物，例如lithium、amphotericin B、aminoglycosides等可能導致腎性尿崩症 (nephrogenic DI)", "D": "懷孕期尿崩症(gestational DI) 常表現於懷孕的頭三個月，隨孕期之增加而逐漸改善", "E": "Desmopressin(DDAVP)可治療原發性多飲症(primary polydipsia)或中樞性尿崩症(central DI)。腎性 尿崩症 (nephrogenic DI)應以thiazide利尿劑、 amiloride、indomethacin 等藥物治療"}, "answer": "C", "is_endocrine": true, "subtopic": "Pituitary", "explanation": "選項(C)正確，因為某些藥物如lithium、amphotericin B、aminoglycosides會干擾腎臟對抗利尿激素的反應，導致腎性尿崩症。選項(A)錯誤，尿崩症的定義是24小時尿量超過3000 ml或50 ml/公斤體重，且尿滲透壓低於正常值（通常<250 mosmol/L是診斷依據之一，但尿量是關鍵）。選項(B)錯誤，正常人腦垂體後葉T1影像的亮點（posterior pituitary bright spot）在中樞性尿崩症會消失，但在原發性多飲症通常不會消失。選項(D)錯誤，懷孕期尿崩症通常發生在孕晚期，且隨孕期增加而加劇，產後會改善。選項(E)錯誤，DDAVP僅對中樞性尿崩症有效，對腎性尿崩症無效；腎性尿崩症的治療重點是減少水分攝取及使用噻嗪類利尿劑。", "evidence": "Williams Textbook of Endocrinology, 14th Edition, Chapter 31."}, {"year": 111, "no": 105, "stem": "糖尿病與肥胖組成糖胖症(Diabesity)，在新陳代謝疾病的範疇內，肥胖已經成為控制糖尿病血糖之重要障 礙，下列之有關糖胖症之描述，何者有誤?", "choices": {"A": "運動對於體重控制非常重要，實證研究顯示運動強度愈強時，可以降低糖尿病發病率，也可以降低心 臟血管疾病之死亡率", "B": "美國國衛院進行之生活型態研究LOOKAHEAD，針對糖尿病的患者安排營養諮詢及體重管理，雖然 可以改善血糖及HbA1c之控制，但是最終研究結果，卻顯示無法降低糖尿病患者心臟血管疾病死亡 率", "C": "生活型態之於糖尿病飲食控制原則，計畫性飲食及運動降低的體重及脂肪組織，可以預防疾病之進 展", "D": "目前實證醫學上，針對糖胖症之血糖控制，以及有效降低體重，使用Glucagon-like peptide-1 receptor agonist (GLP-1 RA)是治療上常見的考量之一", "E": "過去二十年之減重手術研究，顯示體重減輕之過程中，糖尿病進展及心臟血管死亡率均得到統計學 上，有意義之改善"}, "answer": "A", "is_endocrine": true, "subtopic": "DM", "explanation": "選項(A)錯誤。雖然運動對體重控制和整體健康很重要，但實證研究並未顯示運動強度越高，就能越降低糖尿病或心血管疾病的發病率或死亡率；運動的益處是綜合性的，而非單純強度決定。選項(B)正確指出LOOKAHEAD研究結果，該研究顯示生活型態介入（包括飲食與運動）雖能改善血糖與體重，但未能降低糖尿病患者心血管事件的死亡率。選項(C)正確，生活型態介入能減重並改善代謝。選項(D)正確，GLP-1 RA是治療糖胖症的重要藥物，能降血糖並減重。選項(E)正確，減重手術對糖尿病進展及心血管死亡率有顯著改善。", "evidence": "American Diabetes Association Standards of Medical Care in Diabetes—2023."}, {"year": 111, "no": 106, "stem": "楊先生，56歲，身高164公分，體重 77 公斤，並無糖尿病之家族及個人病史，最近半年，體重增加了4公 斤。近一年以來，數次因不明原因昏倒，送至急診就醫。病史有高血壓，每日規則服用Losartan 50mg及Amlodipine 5mg，過去門診無異常神經血管之異常狀況。本次居家時，再度昏倒，並且意識持續 不清，因此送到急診。本次急診之血壓為98/60 mmHg，脈搏為規律的84 bpm，急診之血糖顯示為22 mg/dL，給予50%之葡萄糖輸液後，恢復意識。因此建議住院診察，在病房無點滴輸液的前提下，空腹8 小時後，抽血報告為: 空腹血糖 76 mg/dL ，Insulin 3.6 mIU/mL ，C-peptide 2.6 ng/mL，ACTH 62.2 pg/mL，Cortisol 16.3 ug/dL，IGF-1 106 ng/mL，TSH 4.32 mIU/mL，於此時應考慮之優先檢查項目為 何?", "choices": {"A": "腹部肝胰磁振攝影 (Magnetic resonance image, MRI)", "B": "72小時延長禁食測試 ( Prolonged fasting test)", "C": "24小時心電圖 (Holter ECG monitor)", "D": "腦下垂體磁振攝影(MRI)", "E": "經食道內視鏡超音波 (Endoscopic ultrasound, EUS)"}, "answer": "B", "is_endocrine": true, "subtopic": "Pituitary", "explanation": "此病人有反覆性低血糖發作（急診血糖22 mg/dL，住院空腹血糖76 mg/dL伴隨胰島素及C-peptide升高），高度懷疑是胰島素瘤。空腹8小時後抽血數據顯示：血糖76 mg/dL，胰島素3.6 mIU/mL，C-peptide 2.6 ng/mL，此時胰島素與C-peptide皆升高，符合內源性高胰島素血症。ACTH 62.2 pg/mL及Cortisol 16.3 ug/dL的數值可能為反應性變化或需進一步評估。IGF-1和TSH在正常範圍。優先檢查應針對胰島素瘤進行診斷，因此72小時延長禁食測試是診斷胰島素瘤的金標準，可在禁食期間誘發低血糖並測量胰島素、C-peptide等數值。腹部MRI或EUS可用於定位，但禁食測試是診斷的首要步驟。", "evidence": "Williams Textbook of Endocrinology, 14th Edition, Chapter 37."}, {"year": 111, "no": 107, "stem": "糖尿病降血糖藥物眾多，下列之降血糖藥物中，實證研究顯示那些藥物，有明確可降低 Major adverse cardiovascular events (cardiovascular death, non-fatal myocardial infarctiomn, non-fatal stroke) 之結果? (1) Alpha-glucosidase inhibitors (2) Glucagon-like peptide 1 receptor agonists (3) Sulfonylurea (4) Dipepetidyl peptidase inhibitor (5) Sodium-glucose co-transporter-2 inhibitors", "choices": {"A": "(1)+(3)", "B": "(2)+(4)", "C": "(1)+(4)", "D": "(3)+(5)", "E": "(2)+(5)"}, "answer": "E", "is_endocrine": true, "subtopic": "DM", "explanation": "實證醫學研究顯示，特定類型的降血糖藥物能顯著降低主要不良心血管事件（MACE）。選項(E)正確，GLP-1受體促效劑（GLP-1 RA）和SGLT2抑制劑（SGLT2i）已被證實能降低心血管死亡、非致命性心肌梗塞和非致命性中風的風險。選項(1)α-葡萄糖苷酶抑制劑（如acarbose）主要用於延緩碳水化合物吸收，對心血管事件的影響證據較少。選項(3)磺醯尿素類藥物（Sulfonylurea）可能增加心血管風險。選項(4)DPP-4抑制劑對心血管事件的影響中性，但未顯示明確的降低效益。", "evidence": "American Diabetes Association Standards of Medical Care in Diabetes—2023."}, {"year": 111, "no": 108, "stem": "Thiazolidinedione (TZD)類之胰島素增敏劑，可以改善胰島素在人體內之敏感度，文獻報告顯示也可以改 善蛋白尿，但是本類藥物也有些副作用。以Pioglitazone為例，使用相關藥物副作用包括下列何者? (1) 水腫 (edema) (2) 認知障礙 (cognitive dysfunction) (3 )脆弱性骨折 (fragility frcuture) (4) 腦中風 (Storke) (5) 體重及脂肪組織增加", "choices": {"A": "(1)+(2)+(4)", "B": "(1)+(2)+(3)", "C": "(1)+(3)+(5)", "D": "(2)+(3)+(5)", "E": "(3)+(4)+(5)"}, "answer": "C", "is_endocrine": true, "subtopic": "DM", "explanation": "選項(C)正確。Pioglitazone作為TZD類藥物，常見副作用包括水腫（(1)）、體重增加及脂肪組織增加（(5)）。此外，TZDs類藥物與骨質疏鬆和脆弱性骨折的風險增加有關（(3)）。選項(2)認知障礙和選項(4)腦中風並非TZDs類藥物的典型或主要副作用，儘管有時可能與心血管事件相關，但水腫、骨折和體重增加是更為確定的副作用。", "evidence": "Harrison's Principles of Internal Medicine, 21st Edition, Chapter 340."}, {"year": 111, "no": 109, "stem": "李先生，64歲，糖尿病病史為8年，一年前因冠狀動脈疾病(three vessles disease )進行心導管，並置放 支架，目前使用之血糖控藥物為胰島素 insulin degludec (70%)/aspart (30%)。高血壓藥物為每 日Valsatan 160mg 及Amlodipine 5mg ，膽固醇藥物為 Atorvastatin 每日40mg。目前之空腹血糖為 132 mg/dL，HbA1c 為 7.0 %，LDL cholesterol 為 55 mg/dL，HDL cholesterol 48 mg/dL，Triglyceride 為 628 mg/dL，尿液顯示有巨量白蛋白尿 (macroalbuminuria)，且有非增殖型視網膜病變 (Non-proliferative retinopathy)，目前應該增加使用下列哪一項藥物?", "choices": {"A": "Ezetimibe", "B": "Cholestyramine", "C": "PCSK9 (Proprotein convertase subtilisin/kexin type9) inhibitor", "D": "Fenofibrate", "E": "Sodium-glucose Cotransporter-2 (SGLT2) Inhibitors"}, "answer": "D", "is_endocrine": true, "subtopic": "Lipid", "explanation": "此病人有糖尿病、冠狀動脈疾病、巨量蛋白尿及非增殖型視網膜病變，顯示有明顯的糖尿病血管併發症。目前血糖控制HbA1c 7.0%尚可，但三酸甘油酯(Triglyceride)高達628 mg/dL，是需要積極處理的風險因子。選項(D) Fenofibrate是一種纖維酸衍生物，能有效降低三酸甘油酯，並可能對蛋白尿和視網膜病變有益。選項(A) Ezetimibe和(C) PCSK9抑制劑主要用於降低LDL-C，病人LDL-C已達標。選項(B) Cholestyramine是樹脂類降血脂藥，效果較弱且可能影響其他藥物吸收。選項(E) SGLT2抑制劑雖對糖尿病血管病變有益，但在此情況下，優先處理極高三酸甘油酯更為迫切。", "evidence": "American Diabetes Association Standards of Medical Care in Diabetes—2023."}, {"year": 111, "no": 110, "stem": "GLP-1 receptor agonist與DPP-4 inhibitors屬於Incretin 腸泌素類類藥物。以下有關 腸泌素之敘述，何者 為正確? (1) GLP-1 (Glucagon like peptide-1) 由腸道之L cell分泌 (2) GLP-1 可刺激胰島素分泌，但也刺激昇糖激素 (Glucagon)分泌 (3) 使用GLP-1 receptor agonist治療糖尿病患者時，也有明顯減輕體重之效果 (4) 第一型糖尿病患者也適用GLP-1 receptor agonist (5) 使用GLP-1 receptor agonist可降低糖尿病患之食慾及延緩胃排空時間", "choices": {"A": "(1)+(2)+(3)", "B": "(2)+(3)+(4)", "C": "(2)+(3)+(5)", "D": "(1)+(4)+(5)", "E": "(1)+(3)+(5)"}, "answer": "E", "is_endocrine": true, "subtopic": "DM", "explanation": "選項(E)正確。GLP-1由腸道L細胞分泌（(1)）。GLP-1能刺激胰島素分泌，但同時會抑制昇糖激素（Glucagon）分泌，選項(2)錯誤。GLP-1 RA能顯著減輕體重（(3)）並降低食慾、延緩胃排空（(5)）。GLP-1 RA主要用於第二型糖尿病，對第一型糖尿病的療效和安全性證據不足，通常不作為首選（(4)錯誤）。", "evidence": "Williams Textbook of Endocrinology, 14th Edition, Chapter 34."}, {"year": 111, "no": 111, "stem": "Biguanides 類的藥物，是目前全世界大多數糖尿病治療指引的建議首選用藥，以下有關Metformin之敘述 何者為錯誤的?", "choices": {"A": "腎功能不佳的糖尿病患者，eGFR小於30 ml/min/1.73㎡時，不應使用Metformin", "B": "Metformin可能造成維他命B12 (Vitamin B12)之malabsorption", "C": "雖然Metfmornin之使用可以降低血糖，但是根據Diabetes Prevention Program之研究，Metformin並 無法延緩糖尿病之發病病程", "D": "乳酸中毒是罕見的Metformin藥物副作用，統計上，延遲診斷之死亡率可達50%", "E": "目前糖尿病之孕婦懷孕時，依據美國及台灣之治療指引，Metformin是安全的糖尿病用藥選擇之一"}, "answer": "C", "is_endocrine": true, "subtopic": "DM", "explanation": "選項(C)錯誤。Diabetes Prevention Program (DPP) 研究顯示，生活型態介入和Metformin均能顯著延緩第二型糖尿病的發病病程，Metformin組的糖尿病發生率較安慰劑組降低了31%。選項(A)正確，eGFR <30 ml/min/1.73㎡時應避免使用Metformin。選項(B)正確，Metformin可能干擾維生素B12吸收。選項(D)正確，乳酸中毒是罕見但嚴重的副作用。選項(E)正確，根據ADA和台灣內分泌學會指引，孕婦可考慮使用Metformin。", "evidence": "American Diabetes Association Standards of Medical Care in Diabetes—2023."}, {"year": 111, "no": 112, "stem": "糖尿病新型用藥中，SGLT-2抑制劑 (Sodium-glucose Cotransporter 2 inhibitor)，最近數年廣泛使用的於 糖尿病之新興治療藥物。下列有關SGLT-2抑制劑的敘述，何者是錯誤的?", "choices": {"A": "SGLT-2抑制劑的作用機轉，主要是抑制尿糖之再吸收，因此葡萄糖大量的從尿中排出", "B": "目前大多數的SGLT-2抑制劑，使用之腎功能之限制為 eGFR > 45 ml/min/1.73㎡以上", "C": "此類藥物在降血糖的過程中，糖尿病患者體重多半也會隨之減輕", "D": "實證醫學研究顯示，SGLT-2抑制劑也可以使用於非糖尿病之慢性腎臟病患者", "E": "由於此類藥物增加尿糖排出，因此容易發生泌尿道感染，而且可能發生嚴重之生殖器感染"}, "answer": "B", "is_endocrine": true, "subtopic": "DM", "explanation": "B 錯：SGLT-2 inhibitor 在 2020-2022 年的 EMPA-KIDNEY、DAPA-CKD trial 後，FDA/EMA 已將 eGFR 下限放寬，empagliflozin/dapagliflozin/canagliflozin 可用至 eGFR ≥20-25 mL/min/1.73m²（DM 或 CKD 適應症皆然）。「>45」為 2018 年的舊版限制。A 對：機轉為阻斷近端腎小管 SGLT-2 → 增加尿糖排出。C 對：caloric loss → 體重下降約 2-3 kg。D 對：DAPA-CKD/EMPA-KIDNEY 證實 non-DM CKD 病人也獲益。E 對：尿糖環境利於 Candida 與細菌 → UTI + 嚴重時 Fournier gangrene。", "evidence": "ADA Standards of Medical Care in Diabetes 2024; EMPA-KIDNEY (NEJM 2023); DAPA-CKD (NEJM 2020)"}, {"year": 111, "no": 113, "stem": "一位30歲女性打完COVID-19疫苗10天後開始頭痛，經檢查後確定有疫苗引起血栓塞(thrombosis)，下列 何種疫苗較易引起此副作用？", "choices": {"A": "核酸疫苗(mRNA Vaccine)", "B": "病毒載體疫苗(Viral Vector Vaccine)", "C": "蛋白質次單位疫苗(Protein Subunit Vaccine)", "D": "不活動疫苗(Inactivated Vaccine)", "E": "減毒疫苗(Live- Attenuated Vaccine)"}, "answer": "B", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 111, "no": 114, "stem": "承接上題，此病人因疫苗引起的栓塞其機轉與下列何種血液細胞的成份抗體有關？", "choices": {"A": "白血球(Leukocyte)", "B": "血小板(Platelet)", "C": "淋巴球(Lymphocyte)", "D": "巨噬細胞(Macrophag tion": null, "evidence": null}, {"year": 111, "no": 135, "stem": "一位65歲病人抱怨胃痛，內視鏡檢查發現胃竇有一腫瘤，病理切片檢查顯示為mucosa associated lymphoid tissue lymphoma，CD20陽性及H. Pylori陽性，分期檢查未發現其他異常。下列何者為此病人最 適當的第一線治療？", "choices": {"A": "Eradication of H. Pylori", "B": "Chemotherapy", "C": "Rituximab", "D": "Rituximab + Chemotherapy", "E": "Watchful waiting"}, "answer": "A", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 111, "no": 136, "stem": "下列有關TRALI (transfusion-related acute lung injury)的敍述何者是正確的? (1) 多在輸血3天後發生 (2) 發生的原因常與捐血者體內有抗受血者HLA class II之抗體有關 (3) 病人的胸部X光會出現兩邊肺葉的浸潤", "choices": {"A": "(1)", "B": "(3)", "C": "(2)+(3)", "D": "(1)+(3)", "E": "(1)+(2)+(3)"}, "answer": "C", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 111, "no": 137, "stem": "腫瘤關聯症候群(Paraneoplastic syndromes)有時由於腫瘤產製「異位性的荷爾蒙」(ectopic hormone)所 造成。譬如:「Syndrome of inappropriate antidiuretic hormone secretion (SIADH)」常引發臨床的低血鈉 症(hyponatremia)。SIADH常由下列何種「異位性的荷爾蒙」(ectopic hormone) 產製與分泌過多所造成?", "choices": {"A": "Parathyroid hormone-related protein (PTHrP)", "B": "1,25-Dihydroxyvitamin D", "C": "Vasopressin", "D": "Adrenocorticotropic hormone (ACTH)", "E": "Insulin-like growth factor type II (IGF-II)"}, "answer": "C", "is_endocrine": true, "subtopic": "Pituitary", "explanation": "C 對：SIADH 由 ectopic vasopressin (AVP/ADH) 分泌過多造成 → 水分過度滯留 → 稀釋性低血鈉、高滲透壓尿、euvolemic。最常見原因為 small cell lung carcinoma 異位分泌 AVP，其次為頭頸部癌、CNS 病變、藥物。A PTHrP → 惡性高血鈣，最常見 squamous cell carcinoma 肺癌。B 1,25-D → 淋巴瘤、肉芽腫病造成 PTH-independent hypercalcemia。D ACTH → ectopic Cushing's（small cell lung, carcinoid）。E IGF-II → tumor-induced hypoglycemia（IGF-IIoma、mesenchymal tumor）。", "evidence": "Williams Endo 14e, Ch 10; Ellison DH, Berl T. NEJM 2007 The Syndrome of Inappropriate Antidiuresis"}, {"year": 111, "no": 138, "stem": "有關原發部位不明的上皮癌(Carcinoma of unknown primary, CUP)，除了病理組織的H&E染色型態之 外，有時需借助於免疫組織化學染色來協助判斷CUP的原發器官。下列哪一種標記的抗體核染色，約 有68%肺腺癌(adenocarcinoma of lung) 呈陽性，約有 25%的肺鱗狀上皮癌(squamous cell carcinoma of lung)呈陽性，經常做為肺臟(lung)為CUP原發器官之鑑別診斷輔助標記之ㄧ？", "choices": {"A": "CDX-2 transcription factor (CDX-2)", "B": "Thyroglobulin", "C": "Thyroid transcription factor 1 (TTF-1)", "D": "Cytokeratin (CK)", "E": "Leucocyte common antigen (LCA)"}, "answer": "C", "is_endocrine": true, "subtopic": "Thyroid", "explanation": "C 對：TTF-1 (Thyroid Transcription Factor 1) 為核轉錄因子，肺腺癌約 65-70% 陽性、肺鱗癌約 20-25% 陽性，亦見於甲狀腺（filiform、papillary、follicular thyroid Ca 都陽性，髓樣癌也陽性）。當鑑別 CUP 是否來自肺 vs 其他器官，TTF-1 + Napsin A 為核心 IHC 標記。A CDX-2 → GI（結直腸、胃腺癌）。B Thyroglobulin → 甲狀腺濾泡/乳突癌特異（不見於肺）。D CK → 上皮癌泛指標（無器官特異性）。E LCA (CD45) → 淋巴瘤標記，排除上皮癌用。本題實質為病理/腫瘤題，Thyroid 標籤為 keyword 誤抓（TTF-1 + thyroglobulin）。", "evidence": "WHO Classification of Tumours of the Lung 2021; Rosai and Ackerman's Surgical Pathology 11e"}, {"year": 111, "no": 139, "stem": "在 COVID-19 新冠疫情大流行(pandemic)危機期間，關於癌症病人即時提供治療的建議指引，發表於 (Kutikov A, et al. Ann Intern Med. 2020, DOI: 10.7326/M20-1133)。該一指引建議對下列癌症病人“高度 優先（理想情況下, 不應延遲）”即時提供癌症治療，但以下情況可能除外：", "choices": {"A": "Chemotherapy for testicular cancers", "B": "Chronic lymphocytic leukemia", "C": "Small cell lung cancer", "D": "Colon cancer with imminent obstruction", "E": "High-grade soft tissue sarcomas"}, "answer": "B", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 111, "no": 140, "stem": "一66歲男性病人，診斷罹患乙狀結腸癌(adenocarcinoma, sigmoid colon)，以根治性手術切除左側乙狀結 腸與淋巴結廓清術，病理組織確定手術邊緣沒有癌細胞，清除淋巴結共22顆中病理檢查有10顆已有癌細 胞，沒有遠處器官轉移。醫師建議手術後，再給予6個月「輔助性(adjuvant) 化學治療」以降低復發率與 增加存活。依據各種「臨床指引」，醫師建議下列何者「輔助性化學治療」處方較為合適？", "choices": {"A": "Irinotecan plus 5-FU or Capecitabine (FOLFIRI or CAPIRI/XELIRI)", "B": "Oxaliplatin plus 5-FU or Capecitabine (FOLFOX or CAPOX/XELOX)", "C": "Cetuximab, combined with (FOLFIRI or CAPIRI//XELIRI)", "D": "Bevacizumab, combined with (FOLFOX or CAPOX/XELOX)", "E": "Panitumumab, combined with (FOLFIRI or CAPIRI/XELIRI)"}, "answer": "B", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": nu : null, "evidence": null}, {"year": 111, "no": 149, "stem": "關於口服抗凝血劑相關之腦內出血（anticoagulant related intracerebral hemorrhage）的處置，下列敘述 何者較正確： (1) 維他命K抗凝血劑（vitamin K antagonists）：先給新鮮冷凍血漿（fresh frozen plasma, FFP），再給 凝血酶複合濃縮物（prothrombin complex concentrate, PCC）與vitamin K (2) Dabigatran：立即給予單株抗體idarucizumab (3) Factor Xa inhibitors：若無andexanet alpha，則給予PCC (4) Factor Xa inhibitors：若無andexanet alpha，也可考慮腎臟替代療法（renal replacement therapy）", "choices": {"A": "(1)+(3)", "B": "(2)+(4)", "C": "(1)+(4)", "D": "(2)+(3)", "E": "(1)+(2)+(3)+(4)"}, "answer": "D", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 111, "no": 150, "stem": "昏厥病人進行自主神經功能測試，下列何者主要為副交感神經功能測試： (1) 每分鐘6次深呼吸時的心律變異（heart rate variation with deep breathing） (2) 流汗測試（quantitative sudomotor axon reflex test, QSART） (3) 閉氣用力--伐氏操作時最快心跳比最慢心跳（Valsalva ratio） (4) 傾斜床測試（head-up tilt table test）", "choices": {"A": "(1)+(3)", "B": "(2)+(4)", "C": "(1)+(4)", "D": "(2)+(3)", "E": "(1)+(2)+(3)+(4)"}, "answer": "A", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 111, "no": 151, "stem": "關於自殺防治工作，下列何者為非？", "choices": {"A": "影視名人自殺的新聞報導與自殺率增加有關", "B": "預防自殺必須包括臨床與社會支持等多面向投入", "C": "氣候變遷(climate change)導致之自殺和自殘，是一個逐漸被重視的全球關鍵風險因素", "D": "使用藥物來妥善治療潛在的精神疾患，無助於預防自殺", "E": "對醫療保健專業人員而言，當有患者不幸自殺身亡，可能會在情緒與專業工作上造成衝擊，為醫療保 健專業人員提供支持以及身心照顧是重要的"}, "answer": "D", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 111, "no": 152, "stem": "關於治療「軀體症狀疾患」(somatic symptom disorder)，也就是過去稱之為「身體化症」(somatoform disorder)這類具有「查無實據」或「言過其實」身體抱怨的患者，下列何者為非？", "choices": {"A": "軀體症狀疾患個案，經常接受許多診斷檢查和探索性手術，試圖找到他們「真正」的疾病", "B": "抗憂鬱藥物對於軀體症狀疾患個案的症狀緩解完全無效", "C": "任何與患者對質(confrontation)其心理歸因的嘗試，通常都會產生羞辱感，導致患者放棄該醫療人員 的治療，持續遊走就醫", "D": "比較有幫助的策略是引入心理因果關係作為討論鑑別診斷中的許多可能解釋之一", "E": "在避免將心理因素作為患者身體抱怨病因唯一解釋的氛圍下，可以為患者保留面子，通過這種間接稀 釋心理歸因的方式，反而有機會發展出調整患者生活壓力源的方法"}, "answer": "B", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 111, "no": 153, "stem": "關於憂鬱症與身體疾病的關聯性，項列何者為非？", "choices": {"A": "在癌症患者中，憂鬱症的平均罹病率可以高達 25%，而40-50% 的胰臟癌或口咽癌患者會出現憂鬱 症", "B": "胰臟癌與憂鬱症的關聯不僅僅由於惡病質(cachexia)影響，與晚期胃癌患者相比，胰臟癌患者的憂鬱 症患病率明顯較高", "C": "不穩定型心絞痛、心肌梗塞、心臟繞道手術或心臟移植後患者，若發生憂鬱症狀，被證明會影響康 復，並與日後較高的死亡率(mortality)和醫療發病率(morbidity)相關", "D": "糖尿病患者的憂鬱症患病率從 8% 到 27% 不等，憂鬱情緒的嚴重程度，與高血糖程度(level of hyperglycemia)和糖尿病併發症的風險相關", "E": "三環抗憂鬱藥(TCA)會產生低血糖和對碳水化合物的嫌惡"}, "answer": "E", "is_endocrine": true, "subtopic": "DM", "explanation": "E 錯：TCA 的代謝副作用為「對碳水化合物的渴求 (craving)」+ 「體重增加」+ 「高血糖」而非低血糖與碳水嫌惡。其餘 A-D 均為已立論的 depression-illness 關聯：癌症 25% 罹患率（胰臟/口咽更高 40-50%）、心血管疾病後憂鬱影響預後、DM 病人憂鬱症 8-27% 與血糖控制相關。本題實質為精神科題，DM 標籤為 keyword 誤抓。", "evidence": "Harrison 21e, Ch 466 Depression; APA Practice Guideline for Treatment of Patients with MDD"}, {"year": 111, "no": 154, "stem": "關於電氣痙攣治療法(Electroconvulsive Therapy, ECT)的敘述下列何者為是？ (1) 在特定族群中，ECT 可以迅速改善憂鬱、精神病和緊張(catatonia)症狀，並可以減少自殺衝動 (2) 與 ECT 相關的嚴重不良事件很罕見，包括心律不整與呼吸窘迫等 (3) 在一項涉及難治型精神分裂症患者的研究中，ECT 有效率在 80% 到 90% 之間 (4) ECT 的估計死亡率約為每 100,000 次治療中有 21 人死亡 (5) 現代化的ECT 的治療流程包括誘導短暫的全身麻醉（通常持續不到 10 分鐘）、藥物性肌肉放鬆，以 及持續監測血氧飽和度、血壓、心率和節律", "choices": {"A": "(1)+(2)+(3)", "B": "(1)+(3)+(5)", "C": "(2)+(3)+(4)", "D": "(1)+(2)+(5)", "E": "(3)+(4)+(5)"}, "answer": "D", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 111, "no": 155, "stem": "關於譫妄(delirium)下列何者為是？ (1) 住院病患的譫妄風險因子包括：使用膀胱導管插入術、身體約束、睡眠和感覺剝奪，以及添加三種或 更多的新藥物 (2) 譫妄患者的住院死亡率估計在 2% 到 4% 之間，遠低於敗血症引起的死亡率 (3) 藥物仍然是譫妄的預防及保護因子，尤其是具有抗膽鹼或鎮靜特性的藥物 (4) 盲目地針對譫妄症狀進行藥物治療只會延長患者處於混亂狀態的時間，並可能掩蓋重要的潛在病因診 斷線索 (5) 應避免化學約束(chemical restrain)，必要時使用極低劑量的典型或非典型抗精神病藥物，且應該留給 嚴重躁動和明顯可能傷害自己或工作人員的患者", "choices": {"A": "(1)+(2)+(3)", "B": "(1)+(3)+(5)", "C": "(2)+(3)+(4)", "D": "(3)+(4)+(5)", "E": "(1)+(4)+(5)"}, "answer": "E", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 111, "no": 156, "stem": "20歲男性自孩童期起診斷為異位性皮膚炎，期間斷斷續續接受治療，一周前有發燒並在臉頸部出現搔癢疼 痛的皮疹 (如圖)，請問最可能的感染病原是?", "choices": {"A" 心臟學會」截至 2022 年並未正式列入官方指引，故敘述不正確。A-D 皆為現代「妊娠心血管照護」共識：第四 trimester 概念 (postpartum 12 週)、APO 為非傳統 risk factor、APO 與高齡/環境/代謝/基因相關、女性 hormone protective effect 受到挑戰。本題實質為產科/心血管題。", "evidence": "ACOG Committee Opinion #736 Optimizing Postpartum Care; AHA Scientific Statement APO and CVD 2021"}, {"year": 112, "no": 6, "stem": "有關心房纖維顫動(Atrial fibrillation, AF) 的盛行，幾乎每四人就有一人發生，多見於心血管病人，尢其心 衰及年逾80歲婦女。下列何者說法不確實?", "choices": {"A": "AF是腦血栓最重要的原因，佔非腔隙腦梗(Lacunar infarct) 的35%及腦梗(Cerebral infarct)的15-24%", "B": "心律控制與心跳控制皆屬重要", "C": "新式口服抗凝血藥物(Novel oral anti-coagulants, NOAC)比傳統Warfarin安全又有效", "D": "有AF的腦梗的死亡率多增五倍", "E": "依据心臟學會指引認定急性腦梗後兩週才可回復使用NOAC，但ATTEST及STOP AF First兩個臨床 試驗都証明急性腦梗後四天即可回復使用NOAC"}, "answer": "E", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 112, "no": 7, "stem": "依據Harrison’s Principle of Internal medicine的說法，請問下列何者才符合當今的內科學道理? (1)醫師職責在於防止病人生病，如若有病，應早期診斷及提供有效的治療。 (2)稱職醫師應有能力從病史及理學檢查中找出關鍵的元素。 (3)從適切的實驗數據、檢查影像及診斷試驗中，粹取關鍵結果以為治療及觀察之決定。 (4)當今人們繁忙，以「病人為中心」應多樣檢查，以為診斷的參考，兼以方便病人，節省時間。 (5)檢查的多樣增加，可能出現與求診臨床問題不相符合的意外所見，也是醫師處置的重要根據。 (6)結合醫學知識、經驗、直覺及判定是不符合醫學藝術的內涵。", "choices": {"A": "(1)+(2)+(3)", "B": "(4)+(5)+(6)", "C": "(1)+(3)+(5)", "D": "(2)+(4)+(6)", "E": "(2)+(3)+(6)"}, "answer": "A", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 112, "no": 8, "stem": "請問下列有關主動脈瘤(Aortic aneurysm) 的說法，何者是不正確的?", "choices": {"A": "腹部主動脈瘤多因高血壓而致，胸部主動脈瘤則以動脈粥狀硬化為因", "B": "不管有無症狀，年過65-75歲應作腹部主動脈瘤的篩檢，一旦直徑大於 3 cm的主動脈瘤應持續追 蹤，大於5 Cm應作血管內修護 (Endovascular repair)", "C": "腹部主動脈瘤遠比胸部主動脈瘤多見，前者臨床表現多謂有腹痛、低血壓及脈動式腹部腫塊", "D": "未剝離的下降胸部主動脈瘤，適用內科療法；而主動脈壁內血塊 (Intramural hematoma)及A型胸部 主動脈瘤，則以外科手術為宜", "E": "有關腹部主動脈瘤的危險因素有老齡、男性、抽煙、家族病史及阻塞性動脈硬化最多見，糖尿病少 見"}, "answer": "A", "is_endocrine": true, "subtopic": "DM", "explanation": "A 錯：腹部 AA 主要由「動脈粥狀硬化」造成 (而非高血壓)；胸部 AA 主要與「囊狀中層退化、cystic medial degeneration、Marfan/Loeys-Dietz、二瓣性主動脈」相關，與高血壓較相關的是 dissection 不是 aneurysm 本身。B-E 為標準 AA 監測與處置敘述。本題實質為心血管外科題。", "evidence": "ACC/AHA/SVS Guidelines for AAA 2018; ESC Guidelines on Aortic Diseases 2014/2024"}, {"year": 112, "no": 9, "stem": "肺動血栓症(Pulmonary embolism)的病人約40%有下肢靜脈栓塞(Deep vein thrombosis, DVT) ，伴有呼 吸困難、低血氧及低二氧化碳，甚至血行力學不穩。有關的急症處置，請問下列何者是不正確?", "choices": {"A": "如若血行力學不穩應以血栓溶解藥物、但外科手術或經皮肺動脈取栓治療肺動脈血栓，確為不可或缺 的治療", "B": "應即時使用抗凝血藥物(Anti-coagulants) ，但Warfarin 遠比新式抗凝血藥物(New oral anticoagulant, NOAC) 為佳", "C": "嚴重肝、腎衰竭病人應避免使用如 Dabigaran, Apixaban, Edoxabin及 Rivaroxaban等 NOAC", "D": "孕婦及授乳病人不宜使用Warfarin 及NOAC，得以Unfractionated heparin 或Low molecular weight heparin代替", "E": "胃癌合併DVT所致凝血異常(Coagulopathy)的肺動脈血栓及DVT應忌用Endoxaban"}, "answer": "B", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 112, "no": 10, "stem": "下列有關心臟衰竭神經賀爾蒙(neurohormonal)調節的敘述，何者為非?", "choices": {"A": "代償的機轉包括交感神經系統(sympathetic nervous system)以及腎素血管張力素系 統(renin-angiotensin aldosterone)的活化，增加鹽分及水分的堆積，以維持足夠的心輸出量", "B": "心臟衰竭的患者，迷走神經(baroreceptors)以及機械式(mechanoreceptors)受器所傳達的抑制刺激下 降，活化交感神經系統(sympathetic nervous system)，導致心律變異(heart rate variability)喪失，並 增加周邊血管的阻力", "C": "越來越多證據顯示，副交感神經系統(parasympathetic system)功能喪失，主要導致norepinephrine 上升，影響心臟的再塑(remodeling)，也是心臟衰竭的成因之一", "D": "血管張力素II (angiotensin II)可以不經由腎素(renin)的刺激產生，心肌組織中的局部酵素(kallikrein, cathepsin G)便可以將血管張力素元(angiotensinogen) 轉換成血管張力素II (angiotensin II)", "E": "血管張力素II (angiotensin II)的下游受器，第一型血管張力素受器(angiotensin type I receptor)主要表 現在周邊血管，而第二型血管張力素受器(angiotensin type II receptor)主要表現心臟肌肉"}, "answer": "C", "is_endocrine": true, "subtopic": "Adrenal", "explanation": "C 錯：副交感神經 (parasympathetic) 功能喪失主要影響的是「acetylcholine 訊號傳遞減少」與「心律變異降低」，導致心臟 remodeling，但並非「使 norepinephrine 上升」(NE 上升主要是交感神經活化所致)。A/B/D/E 皆為正確的心衰神經內分泌調節機轉描述。本題實質為心臟學病理生理題，Adrenal 標籤為 keyword 誤抓 (RAAS/adrenergic 提及)。", "evidence": "Bristow MR. NEJM 1984 Beta-adrenergic receptor downregulation in heart failure"}, {"year": 112, "no": 11, "stem": "有關心臟衰竭病患的理學檢查，如果要評估病患的體液狀態，下列哪一種方式不論敏感度或者專一度在臨 床上最合適?", "choices": {"A": "評估頸靜脈的壓力 (jugular venous pressure)", "B": "下肢水腫 2+以上", "C": "聽診心音是否出現S3 gallop", "D": "肺部聽診出現囉音 (rales)", "E": "病患出現明顯的orthopnea (需要使用兩個枕頭才會呼吸平順)"}, "answer": "A", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 112, "no": 12, "stem": "有關於經皮冠狀動脈處理(percutaneous coronary intervention)以及冠狀動脈繞道手術(CABG)治療冠狀動 脈疾病之選擇，SYNTAX 指標達到幾分以上時應該優先考慮冠狀動脈繞道手術處理?", "choices": {"A": "18", "B": "20", "C": "22", "D": "24", "E": "26"}, "answer": "C", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 112, "no": 13, "stem": "下列何者不是心臟衰竭的生理代償機轉?", "choices": {"A": "心臟衰竭時將代償性的刺激交感神經活性(sympathetic activity)，導致心跳加速，加強心臟收縮 力，增加靜脈回流(venous return)", "B": "根據Laplace law，心臟衰竭時，心臟擴大，左心室內徑也隨之增加，所以相對於正常大小的左心 室，需花費更多的功 (energy)來排出相同體積血液至系統中", "C": "心臟衰竭時也會活化腎素血管升壓素系統(renin-angiotensin-aldosterone system)將鈉跟水份保留在 體內，以增加靜脈回流", "D": "Frank-Starling relation 說明了各種不同狀態時，心臟體積與壓力變化的相關性", "E": "我們可以用直接或者間接的Fick method來計算心輸出率"}, "answer": "D", "is_endocrine": true, "subtopic": "Adrenal", "explanation": "D 錯：Frank-Starling 描述的是「end-diastolic volume (preload) 與 stroke volume 的關係」(體積對體積)，並非「壓力對體積」的全面關聯，且這是心臟正常生理而非代償機轉。A/B/C 為心衰標準代償機轉。E Fick method 為心輸出量量測方式正確。本題實質為心臟生理題。", "evidence": "Guyton Textbook of Medical Physiology 14e, Ch 9 Cardiac Mechanics"}, {"year": 112, "no": 14, "stem": "如圖同時呈現右心房的壓力曲線圖和心電圖，下列何者的描述是正確的。", "choices": {"A": "1 為 a wave，2 為 c wave, 3 為 v wave", "B": "1 為 v wave，2 為 a wave, 3 為 c wave", "C": "1 為 c wave，2 為 v wave, 3 為 a wave", "D": "1 為 a wave，2 為 v wave, 3 為 c wave", "E": "1 為 c wave，2 為 a wave, 3 為 v wave"}, "answer": "A", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 112, "no": 15, "stem": "一名30歲的男性因高速公路車禍被送到急診，到院時無脈搏呼吸，心電圖如圖，請問診斷？", "choices": {"A": "無收縮心搏停止 Asystole", "B": "無脈性心電器活動(PEA, pulseless electrical activity)", "C": "第三度房室阻斷", "D": "W-P-W 症候群 (Wolff-Parkinson-White Syndrome)", "E": "竇性緩脈"}, "answer": "B", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 112, "no": 16, "stem": "55 歲劉先生，於2002年開始接受血液透析，2003年心臟超音波顯示有心包膜積水，追蹤超音波顯示心包 膜積水的量逐漸消失，但病患的血壓在沒有使用藥物的情況下逐漸下降，接受左右心導管檢查如圖，壓力 同步紀錄如圖，請問下列處置何者正確?", "choices": {"A": "可能是肥厚性心肌病變，左心室造影可以更進一步確認", "B": "可能為心包膜填塞，應該立即排除積液", "C": "應該幫病患施予左心室切片，觀察特殊病理變化", "D": "考慮心包膜切開術", "E": "病患可能合併二尖瓣膜逆流，可以考慮經導管二尖瓣膜修補術治療"}, "answer": "D", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 112, "no": 17, "stem": "以慢性腎病的病患(chronic kidney disease)之冠狀動脈疾病發生的機轉為例，下列何者為非。", "choices": {"A": "慢性腎病患者有較高的脂肪異常，高血壓，糖尿病的機會，導致內皮功能異常的比率增加，而增加冠 狀動脈疾病的機會", "B": "末期腎病患者的內皮發炎反應，氧化壓力(oxidative stress)，明顯的比較高，伴隨而生 的cytokines，發炎指數上升，而增加內皮發炎病變的機會", "C": "Fibrinogen 在慢性腎病患者上升，也和心血管疾病的發生有顯著的相關性", "D": "Hyperhomocysteinemia 的比率在慢性腎病患者減少，這是因為血清中的葉酸，維他命B的攝取減 少，而增加腎臟排出homocysteine的機會", "E": "腎病患者的自主神經調節功能變差(autonomic dysfunction)，其中交感神經(sympathetic)的活性較副 交感神經(parasympathetic)為強"}, "answer": "A", "is_endocrine": true, "subtopic": "DM", "explanation": "A 錯：CKD 患者「脂肪異常 / 高血壓 / 糖尿病」確實較高，但敘述方向反了——應為 CKD 本身就是這些 risk factor 的累積結果，而不是「導致」內皮功能異常的初因；或選項描述有歧義。B/C/E 皆為 CKD-CVD 已立論機轉。D 錯：CKD 病人 hyperhomocysteinemia 是「增加」不是「減少」(腎排出 homocysteine 減少所致)，與 B12/folate 不足共同惡化內皮。實際正確 → A 描述順序問題。本題為心腎題。", "evidence": "KDIGO Clinical Practice Guideline for Lipid Management in CKD 2013"}, {"year": 112, "no": 18, "stem": "有關糖尿病患的冠狀動脈疾病，下列敘述何者不正確?", "choices": {"A": "通常是影響是多血管(multivessel)，瀰漫性(diffuse)，以血管的末端(distal)居多", "B": "內皮細胞功能異常是主要的危險因子", "C": "通常有明顯的側枝循環供應(coronary collateral circulation)", "D": "選取支架的時候應該考慮到放置支架時的發炎反應會比一般人來的厲害", "E": "目前為止的整合分析(meta-analysis)顯示，糖尿病合併多血管疾病(兩條以上的主要冠狀動脈疾 病)，繞道手術較經皮冠狀動脈支架置放可以減少五年的死亡率"}, "answer": "C", "is_endocrine": true, "subtopic": "DM", "explanation": "C 錯：糖尿病冠心病的特徵之一是「side collateral circulation 不發達」(microvascular disease 損害 collateral 形成)，與糖尿病人口袋型缺血、無聲無感心肌梗塞相關。A 對：多血管、瀰漫、distal predominant 為 DM 冠心病典型。B 對：endothelial dysfunction 是核心 risk。D 對：DM 病人支架後 in-stent restenosis 與發炎反應較強。E 對：FREEDOM trial 證實 multivessel DM 病人 CABG > PCI 5 年 mortality。", "evidence": "ADA Standards of Care 2024 Cardiovascular Disease Section; FREEDOM Trial NEJM 2012"}, {"year": 112, "no": 19, "stem": "吳先生70歲，每天抽一包菸共抽50年，五年前開始從事較劇烈運動後會有呼吸急促現象。最近半年大約 爬到二樓就要休息，慢慢的連稍微走一點平路都會覺得喘。他到附近醫院就醫，胸部X光呈現兩側肺野透 光性增加(hyperlucency)。肺功能檢查結果為：FEV1/FVC=55%，FEV1為預測值的40%，給予短 效β2-agonist二十分鐘後FEV1改善8%，之後接受吸入型Long-acting Muscarinic Antagonists (LAMA)治 療。最近半個月因為喘的症狀加重曾經住院治療一次，出院後門診治療下列何者較不恰當？", "choices": {"A": "藥物以外建議肺部復健 (Pulmonary rehabilitation)", "B": "合併吸入型LAMA與吸入型類固醇", "C": "合併吸入型LAMA與吸入型Long-acting β2-agonist (LABA)", "D": "合併吸入型LABA與吸入型類固醇", "E": "合併吸入型LAMA，LABA以及吸入型類固醇"}, "answer": "B", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 112, "no": 20, "stem": "關於慢性阻塞性肺病患者(Chronic obstructive pulmonary disease, COPD)使用吸入型類固醇的時機，下 列哪些錯誤？(1)吸入型類固醇可以減少急性發作(COPD exacerbation)。 (2)穩定且不再有急性發作 的COPD患者不適合停止使用吸入型類固醇，以免症狀加劇。(3)反覆發生肺炎的患者不建議使用吸入型類 固醇。(4)合併氣喘的病患建議合併使用吸入型類固醇。(5)血液eosinophil count <100 cells per microliter建議合併使用吸入型類固醇。", "choices": {"A": "(1)+(2)", "B": "(3)+(4)", "C": "(2)+(5)", "D": "(2)+(3)+(5)", "E": "(3)+(4)+(5)"}, "answer": "C", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 112, "no": 21, "stem": "下列哪一項不屬於過敏性支氣管性肺部麴菌症(Allergic bronchopulmonary aspergillosis, ABPA)之特徵。", "choices": {"A": "最常引起ABPA之黴菌為Aspergillus fumigatus", "B": "血液IgE >1000 IU/mL", "C": "血液Eosinophils >500/μL", "D": "主要針對aspergillus產生non-type 2 airway inflammatory response", "E": "時常造成中央性支氣管擴張症(Central bronchiectasis)"}, "answer": "D", "is_endocrine": true, "subtopic": "DM", "explanation": "D 錯：ABPA 主要由 type 2 (Th2) immune response 媒介 (IL-4, IL-5, IL-13, IgE 升高, eosinophilia)，與 helminth infection 同類；非 type 2 (Th1/Th17) 為 chronic pulmonary aspergillosis (CPA) 或 invasive aspergillosis 的反應。A/B/C/E 皆為 ABPA 標準 criteria (Rosenberg-Patterson 或 ISHAM)。本題為呼吸/感染題，DM 標籤為 keyword 誤抓。", "evidence": "ISHAM ABPA Working Group Criteria 2013; Patterson R. et al. ABPA classification"}, {"year": 112, "no": 22, "stem": "以下哪些因素有可能引發氣喘急性發作？(1)空氣污染 (2) 服用阿斯匹靈(Aspirin) (3) 乾燥空氣 (4) 胃食道 逆流（Gastroesophageal reflux disease，GERD） (5) 焦慮(Anxiety), 憂鬱(Depression), 或慢性壓 力(Chronic stress)。", "choices": {"A": "(1)+(2)+(3)", "B": "(1)+(2)+(5)", "C": "(1)+(2)+(3)+(4)", "D": "(1)+(3)+(4)+(5)", "E": "(1)+(2)+(3)+(4)+(5)"}, "answer": "E", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 112, "no": 23, "stem": "厭氧菌(anaerobes)在下列何種胸腔感染疾病較不常扮演致病菌之角色？", "choices": {"A": "口腔衛生不佳之患者感染吸入性肺炎", "B": "支氣管擴張症併急性下呼吸道感染(Bronchiectasis with acute lower respiratory infection)", "C": "肺膿瘍(Lung abscess)", "D": "壞死性肺炎(Necrotizing pneumonia)", "E": "膿胸(Empyema)"}, "answer": "B", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 112, "no": 24, "stem": "關於社區性肺炎(Community-Acquired Pneumonia)的描述，下列何者錯誤？", "choices": {"A": "Urinary pneumococcal antigen test在使用抗生素後仍有機會檢測陽性", "B": "如果procalcitonin (PCT)在懷疑肺炎初期為正常值，仍無法排除肺炎診斷", "C": "最近曾住院或使用抗生素的病患須考量抗藥性肺炎鏈球菌感染(Penicillin resistant pneumococcal infection)的可能性", "D": "如果病患同時有支氣管擴張症，須考量Pseudomonas aeruginosa感染的可能性", "E": "嚴重社區性肺炎需入住加護病房接受照護之患者，24小時內開始給予每天200mg hydrocortisone四天 或七天然後逐步減低劑量無法改善病患28天存活率"}, "answer": "E", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 112, "no": 25, "stem": "下列何種治療或處置可降低急性呼吸窘迫症候群(acute respiratory distress syndrome, ARDS)的死亡率？", "choices": {"A": "注射類固醇", "B": "早期使用神經肌肉阻斷劑(Early neuromuscular blockade)", "C": "呼吸器設定使用潮氣容積10 mL/kg (Tidal Volume; 10 mL/kg)", "D": "Severe ARDS病患使用俯臥式通氣模式(Prone positioning)", "E": "一氧化氮吸入療法(Inhaled nitric oxide)"}, "answer": "D", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 112, "no": 26, "stem": "下列關於乳糜胸(Chylothorax)的描述何者錯誤?", "choices": {"A": "最常造成乳糜胸的原因是胸腔手術(Thoracic surgery)", "B": "診斷依據為肋膜積液(Pleural effusion)三酸甘油脂（Triglyceride）超過110 mg/dL", "C": "最佳治療方式為胸管引流加上注射octreotide", "D": "持續性乳糜胸可考慮胸管結紮(ligation of the thoracic duct)", "E": "如果治療效果不佳可考慮長期胸管引流"}, "answer": "E", "is_endocrine": true, "subtopic": "Lipid", "explanation": "E 錯：乳糜胸不應「長期胸管引流」(會造成蛋白 + 淋巴球 + 脂肪持續流失導致 immune deficiency + malnutrition)；治療失敗應改 pleurodesis、pleurovenous shunt、或 thoracic duct embolization。A/B 對：手術為最常因，TG >110 為診斷標準。C 對：保守治療 + octreotide 為一線。D 對：thoracic duct ligation 為手術選項。本題為胸腔題，Lipid 標籤為 keyword 誤抓 (TG)。", "evidence": "Maldonado F et al. Chest 2009 Chylothorax Management; ACCP Pleural Disease Guidelines"}, {"year": 112, "no": 27, "stem": "下列關於第一、二期非小細胞肺癌的治療何者錯誤？", "choices": {"A": "病患如果身體狀況許可，應接受手術切除治療", "B": "第一期非小細胞肺癌的病患，接受楔狀切除術(Wedge resection)與肺葉切除術(Lobectomy)的復發機 率一致", "C": "接受手術切除且無殘餘的腫瘤細胞(Negative margins), 則不需要接受術後放射性治療", "D": "第二期非小細胞肺癌的病患，術後建議接受輔助性化療(adjuvant chemotherapy)", "E": "第二期非小細胞肺癌且有EGFR突變(EGFR exon 19 deletion or L858R)的病患，術後建議接受輔助 性化療與服用三年osimertinib"}, "answer": "B", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 112, "no": 28, "stem": "某69歲病人發生氣喘急性惡化被送至急診室。有咳嗽、黃痰與呼吸困難但意識清楚。血壓130/72 mmHg，心跳99次/分鐘。聽診兩側肺部有喘鳴聲。動脈血氣體分析於使用鼻導管氧氣5 L/min時顯示: pH 7.34、PaCO₂ 45 mmHg、PaO₂ 68 mmHg。下列處置何者最不適當?", "choices": {"A": "給予吸入性short acting muscarinic antagonist (SAMA)", "B": "給予aminophylline iv infusion", "C": "給予吸入性short acting β₂ agonist (SABA)", "D": "給予靜脈注射抗生素", "E": "給予靜脈注射類固醇治療"}, "answer": "B", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 112, "no": 29, "stem": "某19歲女性病患因胸悶至門診就醫。血壓 105/50 mmHg，心跳80次/分鐘。胸部X光顯示如圖。此時在門 診應優先安排下列何種檢查最為適當?", "choices": {"A": "安排胸部電腦斷層檢查", "B": "偵測手指血氧(pulse oximetry)", "C": "安排核醫肺灌流顯影(perfusion scan)", "D": "抽血檢查D-dimer", "E": "安排心電圖(ECG)"}, "answer": "B", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 112, "no": 30, "stem": "某病患因急性呼吸窘迫症候群(ARDS)接受呼吸器治療。如圖顯示其呼吸器面板波形。請問其使用之呼吸 器模式(mode)為下列何者?", "choices": {"A": "Pressure support ventilation (PSV)", "B": "Volume control ventilation (VCV)", "C": "Pressure control ventilation (PCV)", "D": "Pressure-regulated volume control (PRVC)", "E": "Continuous positive airway pressure (CPAP)"}, "answer": "A", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 112, "no": 31, "stem": "某72歲COPD病人，吸入支氣管擴張劑前FEV₁為預測值之61%，吸入 支氣管擴張劑 後FEV₁為68%，COPD評估測驗(CAT)分數為12， 過去一年有2次COPD急性惡化住院。請問根據最 新2023 GOLD指引，其肺功能分級與COPD嚴重度分群為何？", "choices": {"A": "肺功能分級為GOLD 3，COPD嚴重度為B群", "B": "肺功能分級為GOLD 2，COPD嚴重度為D群", "C": "肺功能分級為GOLD 3，COPD嚴重度為E群", "D": "肺功能分級為GOLD 2，COPD嚴重度為D群", "E": "肺功能分級為GOLD 2，COPD嚴重度為E群"}, "answer": "E", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 112, "no": 32, "stem": "某47歲病人因呼吸困難就醫。胸部X光如圖所示。請問安排下列何種檢查最能確定其診斷?", "choices": {"A": "抽血D-dimer + 胸部電腦斷層", "B": "動脈血氣體分析 + 胸部電腦斷層", "C": "心電圖 + 核醫肺灌流顯影(perfusion scan)", "D": "心臟超音波 + 右心導管檢查", "E": "心臟超音波 + 左心導管檢查"}, "answer": "D", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 112, "no": 33, "stem": "某位體重70公斤之75歲男性病患因急性呼吸窘迫症候群(ARDS)接受呼吸器治療。其呼吸器設定(PC mode)為: FiO₂ 0.85、呼吸速率: 18次/min、peak inspiratory pressure: 20 cmH₂O、吐氣末陽壓(PEEP): 6 cmH₂O。其動脈血液氣體分析為：pH 7.34、PaO₂ 55 mmHg、PaCO₂ 41 mmHg、HCO₃ 26 mEq/L。請 問應調整那個呼吸器參數值最為妥當？", "choices": {"A": "增加呼吸速率", "B": "減少FiO₂", "C": "減少潮氣容積(tidal volume)", "D": "增加吸氣壓力(inspiratory pressure)", "E": "增加吐氣末陽壓(PEEP)"}, "answer": "E", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 112, "no": 34, "stem": "某呼吸衰竭病患接受呼吸器治療時突然產生血氧與血壓下降，聽診時右側肺部呼吸音明顯減低。下列何者 為適當之處置?(1)增加吸入氧氣分率(FiO₂)至100% (2)暫時脫離呼吸器，使用甦醒球(Ambu) 急救 (3)立刻 用超音波檢查肺部與心臟 (4)立刻安排胸腔X光檢查 (5)增加吐氣末陽壓(PEEP)", "choices": {"A": "(1)+(2)+(3)+(4)", "B": "(2)+(3)+(4)", "C": "(3)+(4)+(5)", "D": "(2)+(3)+(4)+(5)", "E": "(1)+(3)+(5)"}, "answer": "A", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 112, "no": 35, "stem": "某60歲女性因慢性咳嗽與濃痰來內科門診。聽診時在雙側下肺葉有聽到crackles。胸部電腦斷層如圖。請 問下列診斷何者可能性最高？", "choices": {"A": "Organizing pneumonia", "B": "硬皮症相關間質性肺病 (SSc-ILD)", "C": "Bronchiectasis", "D": "Fibrotic hypersensitivity pneumonitis", "E": "Sarcoidosis"}, "answer": "C", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 112, "no": 36, "stem": "有關特發性肺纖維化(Idiopathic pulmonary fibrosis)病患產生低血氧(hypoxemia)的病生理機制, 下列何者 為最重要?", "choices": {"A": "Diffusion impairment", "B": "Shunting", "C": "Hypoventilation", "D": "Ventilation-perfusion mismatch", "E": "Hyperventilation"}, "answer": "A", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 112, "no": 37, "stem": "關於C型肝炎之治療，下列敘述何者錯誤？(以台灣健保給付規範為準)", "choices": {"A": "目前大多數是以Epclusa (Sofosbuvir+Velpatasvir) 或Glecaprevir-Pibrentasvir (G/P) 這兩種 DAAs (Direct Acting Anti-virals) 治療為主", "B": "在台灣，現在所有執業西醫師皆可開立 DAAs 給C肝病人", "C": "只要血中測得到C肝病毒，皆可立即接受 DAAs 治療", "D": "急性C型肝炎病人應觀察其是否轉變成慢性才開始使用 DAAs", "E": "失代償性肝病患者，不可服用 G/P，但可接受 Epclusa 治療"}, "answer": "D", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 112, "no": 38, "stem": "下列關於C型肝炎之敘述，何者錯誤？(1)慢性C型肝炎可能合併肝外病況，包括 essential mixed cryoglobulinemia、membranoproliferative glomerulonephritis、non-Hodgkin lymphoma 等。 (2)慢性C型肝炎較易有下列共病 (comorbidity)：第二型糖尿病、慢性腎病、心血管疾病、風濕/免疫疾病 等。(3)服用DAAs (Direct Acting Anti-virals) 達成 SVR12 (完成治療後12週有 sustained virologic response) 者，其血中 Anti-HCV 會轉變成陰性。(4)台灣努力要在2025年根除C肝，而C肝篩檢是關鍵步 驟，故自2020年9月28日起 45-79歲成年人 (原住民同胞 40-79歲) 一生可接受一次 HBsAg 及 Anti-HCV之 血液檢測。 (5)懷孕婦女之C肝患者，目前仍不建議服用 DAAs。(6)正常成年C肝患者服用 DAAs 達成 SVR12後，仍 有相當高比例的人會再度感染C肝病毒。(7)HIV-HCV co-infection 患者，服用 DAAs 達成 SVR12 之機率 比 HCV monoinfection 患者差", "choices": {"A": "(1)+(2)+(3)", "B": "(2)+(4)+(5)", "C": "(3)+(4)+(6)", "D": "(3)+(6)+(7)", "E": "(4)+(6)+(7)"}, "answer": "D", "is_endocrine": true, "subtopic": "DM", "explanation": "選項(D)錯誤，因為達成SVR12後，血中Anti-HCV抗體通常不會轉為陰性，且C肝病毒再感染率並非相當高比例，HIV-HCV co-infection患者達成SVR12的機率也與HCV monoinfection者相似。關鍵在於SVR12定義為病毒學上的清除，而非抗體清除。選項(1)、(2)、(3)皆為慢性C肝的正確敘述。選項(4)關於台灣C肝篩檢政策，自2020年9月28日起，45-79歲成人（原住民40-79歲）一生可接受一次Anti-HCV篩檢，此為正確資訊。選項(5)目前DAAs已建議用於懷孕婦女，但需謹慎評估。然而，題目問的是錯誤敘述，而(D)中的(3)、(6)、(7)皆為錯誤，故為正確答案。", "evidence": "Williams Textbook of Endocrinology, 14th Edition, Chapter 101: Viral Hepatitis."}, {"year": 112, "no": 39, "stem": "下列關於慢性B型肝炎治療之敘述，何者錯誤？（以台灣健保規範為準）", "choices": {"A": "HBeAg (-) 且血清ALT數值持續正常，超音波檢查正常者，不必接受 Interferon (IFN) 或口服抗病毒藥 物之治療", "B": "HBeAg (+) 且 HBV DNA > 2 X 10⁴ IU/mL，血清 ALT 數值初次 > 正常值上限 2 倍時，需觀察 3 個月 才能開始給予 IFN 或口服抗病毒藥物治療", "C": "HBeAg (+) 患者接受口服抗病毒藥物治療，需持續至血清 HBeAg 陰轉後再服用一年", "D": "HBeAg (-) 且 HBV DNA > 2 X 10³ IU/mL，血清 ALT 數值 > 正常值上限2倍，半年內有兩次且相 隔3個月以上，即可接受口服抗病毒藥物治療2-3年", "E": "經證實有肝硬化者，只要血中測到B肝病毒，即使血清 ALT 數值正常，仍可長期接受口服抗病毒藥物 治療"}, "answer": "B", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 112, "no": 40, "stem": "下列關於消化系統 polypoid lesion 之敘述，何者錯誤？", "choices": {"A": "胃部之 fundic gland polyps 小於0.5 公分，一般建議不必切除", "B": "胃體部（body）有 > 1.0 公分之 hyperplastic polyp，應予以切除", "C": "胃體部有一顆 2.5 公分之gastrointestinal stromal tumor (GIST)，應以微創手術或經內視鏡切除之", "D": "50 歲以上患者，膽囊壁上有個 1.2 公分之 polyp，一般建議應予以切除", "E": "大腸發現一顆 0.8 公分之 polyp，切除後病理顯示為 tubular adenoma，一般建議 1 年後應再接受大 腸鏡追蹤"}, "answer": "E", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 112, "no": 41, "stem": "下列各項敘述，何者錯誤？(1)肝臟的大囊泡（liver cyst）若併發腹痛，應優先考慮開刀切除。(2)肝臟的 cystic lesion 若疑似cystadenoma，可考慮以 sclerotherapy with absolute alcohol 處理。(3)胰臟的IPMN (Intraductal Papillary Mucinous Neoplasm) 若在 main pancreatic duct 發生，malignant transformation 機率較高。(4)胰臟的serous cystic lesion較不必擔心 malignant transformation。(5)針對胰臟疑似惡性腫 瘤的cystic lesion施以 EUS (Endoscopic Ultrasound) with fine needle aspiration cytology，診斷之敏感度 高達 90%。(6)十二指腸之ampullary adenocarcinoma施以EUS with biopsy，其診斷之準確度高達 90%", "choices": {"A": "(1)+(2)+(3)", "B": "(1)+(2)+(5)", "C": "(2)+(3)+(6)", "D": "(3)+(4)+(5)", "E": "(4)+(5)+(6)"}, "answer": "B", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 112, "no": 42, "stem": "一位65歲女性病人於4月初吃到好市多的莓果，他擔心會感染A型肝炎，因此在5月初抽血檢驗，其結果 為：ALT=84 (< 41)，AST=70 (< 31)。IgM anti-HAV (-)，IgG anti-HAV (+)， HBsAg (+)，HBeAg (-)，Anti-HCV (+)。下列敘述何者錯誤？", "choices": {"A": "他確實得到急性A型肝炎", "B": "若HBV DNA=30 IU/mL，其肝炎不可能是B肝病毒造成的", "C": "他不一定有慢性C型肝炎", "D": "若最近有服用statin類藥物，可能是藥物性肝炎", "E": "若再抽血檢驗發現 ALP=300 (< 104)，γ-GT=400 (< 50)，超音波檢查正常，應再進一步加驗 Anti-mitochondrial antibody (AMA)"}, "answer": "A", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 112, "no": 43, "stem": "下列各項敘述，何者錯誤？", "choices": {"A": "Hyperparathyroidism, hypokalemia 及hypomagnesemia 皆可能造成 ileus", "B": "接受腹腔鏡微創手術者，不會發生 adhesion ileus", "C": "Crohn's disease 可能造成 enterocutaneous fistula", "D": "Ulcerative colitis 患者不可能在右下腹部摸到 mass formation", "E": "Inflammatory bowel disease (IBD) 患者在發病後的前 10 年發生大腸直腸癌之機率甚低"}, "answer": "B", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 112, "no": 44, "stem": "下列各項敘述，何者錯誤？", "choices": {"A": "自體免疫性慢性萎縮性胃炎與惡性貧血 (pernicious anemia) 有關", "B": "接受 Helicobacter pylori (HP) eradication therapy後，最好隔4週後再進行檢測是否成功根除HP", "C": "糞便 HP antigen 檢測可用來判斷治療效果", "D": "有明顯 heartburn等胃食道逆流症狀患者，接受內視鏡檢查卻未發現 reflux esophagitis，此時應優先 安排 esophageal manometry 檢查以排除胃食道逆流之可能性", "E": "NASID-induced esophagitis 一般僅持續 1-2週，但亦可能發生食道狹窄等後遺症"}, "answer": "D", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 112, "no": 45, "stem": "下列各項敘述，何者錯誤？", "choices": {"A": "Hypertriglyceridemia 導致急性胰臟炎之患者，其血清 amylase 可能未明顯升高", "B": "End stage renal disease 患者欲確認是否有急性胰臟炎，宜直接驗 lipase", "C": "非酒精性脂肪肝併有第二型糖尿病和高三酸甘油脂血症患者，也是罹患肝細胞癌的高危險群", "D": "Transient elastography (Fibroscan) 可用來長期追蹤非酒精性脂肪肝病患者肝內之脂肪量及纖維化狀 態", "E": "有大腸adenomatous polyp 之患者，其 stool occult blood (+) 之機率可達 20%"}, "answer": "E", "is_endocrine": true, "subtopic": "Lipid", "explanation": "選項(E)錯誤。大腸腺瘤性息肉患者，其糞便潛血陽性率約為30-50%，而非20%。關鍵在於腺瘤性息肉的惡性轉化潛力，因此篩檢很重要。選項(A)正確，高三酸甘油酯引起的急性胰臟炎，血清澱粉酶可能因脂肪干擾而未明顯升高。選項(B)正確，ESRD患者血清澱粉酶清除率下降，脂酶(lipase)是診斷急性胰臟炎的較佳指標。選項(C)正確，NAFLD併T2DM及高三酸甘油酯是肝細胞癌的高危險群。選項(D)正確，Fibroscan可非侵入性評估肝臟脂肪量及纖維化。", "evidence": "Harri ear": 112, "no": 56, "stem": "慢性腎臟病(chronic kidney disease, CKD)病人的治療，以下敘述何者錯誤?", "choices": {"A": "合併有高血壓、糖尿病與蛋白尿的病人，宜優先使用ACEi or ARB, 以降低glomerular hyperfiltration，減少蛋白尿，預防CKD 惡化", "B": "ACEi or ARB單獨使用皆可藉由afferent arteriole vasoconstriction，而降低glomerular hyperfiltration，減少蛋白尿", "C": "目前的臨床指引，不建議ACEi 和 ARB合併使用，這是因為ACEi 和 ARB合併使用，未必更能有效預 防CKD 惡化，卻可能會增加高血鉀(hyperkalemia)的風險", "D": "non-steroidal MRA (mineralocorticoid receptor antagonists) 對CKD的治療，目前實證上以 type 2 diabetes的CKD病人族群為主", "E": "SGLT2 (sodium glucose co-transport 2) inhibitors 可抑制近端腎小管的Na吸收，及藉 由tubuloglomerular feedback 調控afferent arteriole vasoconstriction，而減少glomerular hyperfiltration，降低蛋白尿，預防CKD 惡化"}, "answer": "B", "is_endocrine": true, "subtopic": "DM", "explanation": "選項(B)錯誤。ACEi或ARB主要透過舒張輸出小動脈(efferent arteriole)來降低腎絲球內壓，進而減少蛋白尿，而非收縮輸入小動脈(afferent arteriole)。關鍵在於藥物作用機轉的血管選擇性。選項(A)正確，ACEi/ARB是治療蛋白尿的首選。選項(C)正確，不建議合併使用ACEi和ARB。選項(D)正確，MRA在T2DM的CKD病人有實證效益。選項(E)正確，SGLT2i透過多重機轉保護腎臟。", "evidence": "Kidney Disease: Improving Global Outcomes (KDIGO) guidelines for the management of chronic kidney disease."}, {"year": 112, "no": 57, "stem": "一位48歲孕婦，妊娠約28週，因高血壓而轉介至內科門診。醫師建議將血壓維持在140/80-90 以下，若需 使用下列降血壓藥物，何者不適當?", "choices": {"A": "labetalol", "B": "long-acting or extended-released nifedipine", "C": "captopril", "D": "methyldopa", "E": "thiazide diuretics for resistant hypertension and edema"}, "answer": "C", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 112, "no": 58, "stem": "診斷急性腎損傷(acute kidney injury)，以下對於prerenal azotemia的描述，何者最不符合?", "choices": {"A": "urine osmolality > 500 mOsm/kg", "B": "尿液鏡檢 brown granular cast, WBC casts", "C": "FEurea < 35%", "D": "FENa < 1%", "E": "recent use of diuretics"}, "answer": "B", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 112, "no": 59, "stem": "一位26歲女性，被診斷SLE約3年，平時有使用prednisolone 10 mg/dL維持SLE病情穩定，一直以來腎功 能皆正常，urine protein-creatinine ratio (UPCR)大約在350-500 mg/g。最近在確診COVID-19兩個月以 來，
