 113, "no": 93, "stem": "Extended-spectrum β-lactamase（ESBL）可以水解下列那些β-lactam抗生素，何者除外？", "choices": {"A": "Cefotaxime (Third-generatioin cephalosporin)", "B": "Aztreonam（Monobactam）", "C": "Meropenem（Carbapenem）", "D": "Piperacillin (anti-pseudomonal Penicillin)", "E": "Ceftazidime (anti-pseudomonal cephalosporin)"}, "answer": "C", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 113, "no": 94, "stem": "下列何者不是醫療人員建議應常規評估施打的疫苗？", "choices": {"A": "B型肝炎疫苗（HBV vaccine）", "B": "水痘疫苗（chickenpox vaccine）", "C": "帶狀皰疹疫苗（Varicella-zoster vaccine）", "D": "麻疹、腮腺炎疫苗、德國麻疹（MMR vaccine）", "E": "流感疫苗 (influenza vaccine)"}, "answer": "C", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 113, "no": 95, "stem": "血液幹細胞移植後使用一年TMP-SMX預防，可以減少的致病原感染，下列何者最不適當？", "choices": {"A": "Listeria monocytogenes", "B": "Nocardia", "C": "Streptococcus pneumoniae", "D": "Pseudomonas aeruginosa", "E": "Pneumocystis"}, "answer": "D", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 113, "no": 96, "stem": "下列那一個致病原較不常出現於早期（1個月內）血液幹細胞移植(Hematopoietic Stem Cell Transplantation)後感染？", "choices": {"A": "E.coli", "B": "Candida albicans", "C": "Cytomegalovirus", "D": "Clostridium difficile", "E": "Aspergillus fumigatus"}, "answer": "C", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 113, "no": 97, "stem": "下列有關腦垂體功能檢查的描述, 那一項最正確? (1) 胰島素耐性測驗(insulin tolerance test):給予胰島素(0.05-1.15 U/Kg IV)，於 -30分、0分、30分、60分、120分測量血糖及生長激素(growth hormone，GH)濃度，若血糖 <40 mg/dL時，GH為 2.5 цg /L，應視為無生長激素缺乏。 (2) 甲狀腺促素釋素測驗(thyrotropin- releasing hormone (TRH) test): 給予TRH 200-500 μg IV，於0分、20分及60分測量甲促素(TSH)及泌乳激素(prolactin)，若prolactin上升基礎值的1.5倍，應視為 正常反應。 (3) 胰島素耐性測驗(insulin tolerance test):給予胰島素(0.05-1.15 U/Kg IV)，於 -30分、0分、30分、60分、90分測量血糖及可體松(cortisol)濃度，若血糖<40 mg/dL時，cortisol 濃度上 升 >7 μg/dL 或濃度>20 μg/dL，應視為無促腎上腺皮質激素(Adrenocorticotropic hormone, ACTH )之缺 乏。 (4) 口服葡萄糖耐性測驗(oral glucose tolerance test)於0分、30分、60分測量生長激素(GH) 濃度，若GH 濃度為2 μg/L，應視為正常反應。 (5) 於 11 pm 給予dexamethasone 1 mg, 第二天早上8 am 的cortisol 濃度若為4 μg/dL，應視為正常反 應。", "choices": {"A": "(1)+(3)", "B": "(2)+(4)", "C": "(3)+(5)", "D": "(1)+(2)+(3)", "E": "(2)+(4)+(5)"}, "answer": "C", "is_endocrine": true, "subtopic": "Pituitary", "explanation": "C 對 (3)+(5)。(3) 對：ITT cortisol response >7 ug/dL 或 absolute >18-20 為正常 (排除 ACTH 缺乏)。(5) 對：1 mg overnight dexamethasone suppression test 後 cortisol <1.8 ug/dL 為正常 (排除 Cushing's)。(1) 錯：ITT GH peak 應 >5 ug/L 為正常，2.5 太低反映 GH 缺乏。(2) 錯：TRH stim prolactin 應上升 >2 倍 baseline (1.5 倍不足)。(4) 錯：OGTT 應「壓抑」GH <1 ug/L 為正常 (用於診斷 acromegaly)，2 ug/L 仍偏高。", "evidence": "Williams Endo 14e, Ch 8 Anterior Pituitary; Endocrine Society Adult Growth Hormone Deficiency Guideline 2011"}, {"year": 113, "no": 98, "stem": "下列有關尿崩症(diabetes insipidus, DI)的描述，哪一項不正確?", "choices": {"A": "希罕氏症候群(Sheehan’s syndrome) 可能造成中樞性尿崩症(central DI)", "B": "鋰鹽（lithium）及cisplatin可能造成腎源性尿崩症 (nephrogenic DI)", "C": "Sarcoidosis 可能造成中樞性尿崩症及腎源性尿崩症", "D": "懷孕第二及第三孕期(second and third trimesters)可能造成尿崩症", "E": "高血鈣(hypercalcemia)及高血鉀(hyperkalemia)可能造成腎源性尿崩症"}, "answer": "E", "is_endocrine": true, "subtopic": "Pituitary", "explanation": "E 錯：低血鈣 (hypocalcemia) 與低血鉀 (hypokalemia) 才會造成 nephrogenic DI (透過影響 ADH receptor signaling)；高血鈣與「高血鉀」並不會造成 nephrogenic DI (應為「低」血鉀)。A 對：Sheehan's syndrome (postpartum hemorrhage 致 pituitary necrosis) 可導致 central DI。B/C/D 對：lithium/cisplatin → nephrogenic DI；sarcoidosis → 兩種 DI；妊娠 → vasopressinase 增加致 transient DI。", "evidence": "Williams Endo 14e, Ch 10 Posterior Pituitary"}, {"year": 113, "no": 99, "stem": "有關甲狀腺功能低下的描述，哪一項最正確?", "choices": {"A": "先天性甲狀腺發育異常，男性約為女性的兩倍", "B": "橋本氏甲狀腺炎 (Hashimoto’s thyroiditis)的病人可以呈現瀰漫性甲狀腺腫，身體診察時常發現其甲狀 腺不會很大，不規則且軟(irregular and soft)", "C": "碘缺乏或碘過量都可能造成甲狀腺腫及甲狀腺功能低下。自體免疫性甲狀腺炎的病人較易受碘影 響(susceptible)，臨床上我們常建議橋本氏甲狀腺炎的病人要多攝取碘", "D": "三碘甲狀腺素(triiodothyronine, T3) 的生理活性比四碘甲狀腺素 (levothyroxine, LT4)強，臨床上多建 議以T3治療甲狀腺功能低下", "E": "臨床前期甲狀腺功能低下（subclinical hypothyroidism）的病人大多沒有症狀，一般至少每年一次定 期監測甲狀腺功能即可。但若病人想要懷孕或是TSH>10 mIU/L持續三個月以上，就應該給予藥物治 療"}, "answer": "E", "is_endocrine": true, "subtopic": "Thyroid", "explanation": "E 對：subclinical hypothyroidism 多無症狀，一般每 6-12 月追蹤；但「想懷孕」或「TSH >10 持續 3 個月」應給予治療。A 錯：先天甲狀腺發育異常「女性多於男性」(約 2:1)。B 錯：Hashimoto 腫大常為「irregular and firm/hard」(因纖維化)，不是 soft。C 錯：Hashimoto 病人對碘「敏感」(碘可惡化 autoimmune 反應)，臨床「不建議」過量碘攝取。D 錯：T3 半衰期短、心律不整風險高，臨床標準治療為 levothyroxine (T4)。", "evidence": "ATA Guidelines for Hypothyroidism 2014 (Garber JR et al.)"}, {"year": 113, "no": 100, "stem": "有關甲狀腺結節及甲狀腺癌的描述，下列哪一項最正確?", "choices": {"A": "甲狀腺超音波檢查，有點狀鈣化(punctate calcification)的結節，其惡性風險低於有周邊環狀鈣 化(peripheral rim calcification)的結節", "B": "毒性多發性甲狀腺結節腫(toxic multinodular goiter)的病人，其三碘甲狀腺素(T3)的升高通常比四碘甲 狀腺素(T4)的升高明顯，首選治療是手術切除", "C": "甲狀腺惡性腫瘤中，乳突癌(papillary thyroid carcinoma, PTC)、濾泡癌 (follicular thyroid carcinoma, FTC)、甲狀腺髓質癌(medullary thyroid cancer, MTC)的佔比大約各為80-85%、5-12%、<10%。手 術治療後，使用放射性碘治療的效益MTC 比PTC 及FTC 佳", "D": "多發性內分泌腫瘤(Multiple endocrine neoplasia, MEN) 有不同的亞型。MEN 2B中的 MTC一般 比MEN 2A 中的MTC侵襲性更高，有家族遺傳(familial)的MTC一般比偶發性(sporadic) MTC的侵襲性 高", "E": "甲狀腺癌病人經全切除及接受必要的放射性碘治療後，應該長期補充甲狀腺素(levothyroxine, LT4)，以維持TSH在正常參考值的上限為原則"}, "answer": "D", "is_endocrine": true, "subtopic": "Thyroid", "explanation": "D 對：MEN2B 的 MTC 比 MEN2A 侵襲性高 (mutation Met918Thr 為高風險，腫瘤出現年齡更小、更早轉移)；家族遺傳 MTC 也比 sporadic 一般侵襲性高 (germline RET mutation 機轉)。A 錯：punctate calcification (microcalcification) 為高度懷疑惡性，比 peripheral rim 風險高 (相反)。B 錯：toxic multinodular goiter 首選為 radioactive iodine 或抗甲狀腺藥，手術為次選。C 錯：MTC 不對放射性碘攝取 (因不來自 follicular epithelium)，RAI 對 MTC 無效。E 錯：DTC 術後 LT4 應壓制 TSH 至 0.1-0.5 (高危更低 <0.1)，非「正常上限」。", "evidence": "ATA Medullary Thyroid Cancer Guidelines 2015 (Wells SA et al.); ATA DTC Guidelines 2015 (Haugen BR)"}, {"year": 113, "no": 101, "stem": "下列有關副甲狀腺的描述哪一項最正確?", "choices": {"A": "高血鈣(hypercalcemia)最常見的病因是副甲狀腺功能亢進，其次是癌症，這兩者約佔高血鈣個案 的90%。Vitamin D 缺乏、甲狀腺功能亢進、vitamin A中毒、脂肪壞死(fat necrosis) 等也可能造成高 血鈣", "B": "雙磷酸鹽 (bisphosphonates)可以增加骨密度但不影響血鈣濃度。擬鈣劑(calcimimetics)可以減 少PTH 分泌降低血鈣，但不會影響骨密度", "C": "原發性副甲狀腺功能亢進(primary hyperparathyroidism)的無症狀病人，應該建議開刀的狀況包括:年 齡 > 60歲、血鈣大於正常參考值 1 mg/dL 以上、肌酸酐廓清率(creatinine clearance) < 50 mL/min、腰椎骨密度T score < -2.5 等", "D": "單一副甲狀腺腫瘤造成的原發性副甲狀腺功能亢進在手術切除腫瘤後血鈣通常在24小時內就會下 降，3至5天內血鈣可能低於正常值。通常手術後之低血鈣可以自動恢復正常，可以不需要處理", "E": "抑鈣素(calcitonin) 可以抑制噬骨細胞(osteoclast)的骨吸收作用，並減少腎臟的鈣排出。腦、腸 胃、免疫系統都有抑鈣素接合器 (receptors)"}, "answer": "B", "is_endocrine": true, "subtopic": "Calcium-Bone", "explanation": "B 對：bisphosphonates 主要降低骨吸收 → 改善 BMD 但「血鈣多無明顯下降」(reset feedback maintained)；calcimimetics (cinacalcet) 透過活化 CaSR 抑制 PTH → 降血鈣，但長期使用 BMD 反而略下降 (因 bone turnover 下降)。A 錯：應為「primary HPT (~54%) > malignancy (~25%)」共佔 80%；Vit D 缺乏不會造成高血鈣 (相反)。C 錯：手術指徵應為 >50 歲、Ca >1 mg/dL 高於正常、CrCl <60、T-score <-2.5、有腎結石。D 對 (但問題問哪項最正確 → B 較明確)。E 錯：calcitonin 抑制骨吸收 + 增加尿鈣排出，腦/腸/免疫有 receptor 正確。", "evidence": "Endocrine Society/IFCC 4th International Workshop on Asymptomatic PHPT 2014"}, {"year": 113, "no": 102, "stem": "有關原發性皮質醛酮症(primary aldosteronism, PA)的描述，哪一項最正確?", "choices": {"A": "皮質腫瘤(adrenal adenoma, Conn’s syndrome)約佔60%，雙側(小結節性)腎上腺增生(bilateral (micronodular) adrenal hyperplasia)約佔40%", "B": "糖皮質類固醇可抑制性醛固酮增多症 (Glucocorticoid-remediable alsoteronism, GRA)病人 的aldosterone產生受到ACTH 調控而非renin", "C": "PA常見的症狀包括高血壓、低血鉀、代謝性鹼中毒(metabolic alkalosis)等。約有 80% 的PA病人會 有低血鉀", "D": "PA 病人罹患第2型糖尿病的風險增加、但罹患骨質疏鬆的風險降低", "E": "懷疑有PA 的病人要檢測 aldosterone-renin ratio (ARR)時，須注意降血壓藥物的可能影響。沒有停用 乙型阻斷劑(β-blocker)的情況下，如果ARR低，仍然需要考慮PA 的可能"}, "answer": "B", "is_endocrine": true, "subtopic": "Adrenal", "explanation": "B 對：GRA (FH-1, Glucocorticoid-remediable aldosteronism) 為 CYP11B1/CYP11B2 chimeric gene 造成 aldosterone 由 ACTH 調控 (而非 renin/K+)，故 dexamethasone suppression test 可降低 aldosterone → 治療用低劑量 glucocorticoid。A 錯：adrenal adenoma (Conn's) 約 30-40% (非 60%)；bilateral hyperplasia (IHA) 60% (非 40%)。C 錯：PA 中只約 30% 有 hypokalemia (非 80%)。D 錯：PA 病人 T2DM 與 osteoporosis 風險「皆增加」。E 錯：β-blocker 使 renin 下降 → ARR「上升」(假陽性)，應停藥 2-4 週後重測。", "evidence": "Endocrine Society Primary Aldosteronism Guideline 2016"}, {"year": 113, "no": 103, "stem": "有關嗜鉻細胞瘤(pheochromocytoma)的描述, 下列哪一項正確?", "choices": {"A": "嗜鉻細胞瘤病人可能有多尿(polyuria)、多渴(polydipsia)、姿勢性低血壓(orthostatic hypotension)、血糖高、高血鈣等臨牀表現", "B": "使用利尿劑、三環抗憂鬱劑、α及β阻斷劑會減少catecholamine濃度，可能造成尿液檢驗偽陰性(false negative)結果", "C": "嗜鉻細胞瘤的病理常呈現”Zellballen(細胞球)”型態，免疫組織染色通常呈現chromogranin 陽 性，synaptophysin 陰性", "D": "大約65%的嗜鉻細胞瘤病人有遺傳相關的症候群(inherited syndrome)，這些病人的發病年齡通常比 偶發性(sporadic)嗜鉻細胞瘤病人年輕大約15歲", "E": "約有5%的腎上腺偶發瘤(adrenal incidentaloma) 是嗜鉻細胞瘤。嗜鉻細胞瘤在未靜脈注射顯影劑的 電腦斷層(unenhanced CT)通常其attenuation <10 HU"}, "answer": "A", "is_endocrine": true, "subtopic": "Adrenal", "explanation": "A 對：嗜鉻細胞瘤可造成 catecholamine-mediated polyuria/polydipsia (因 hyperglycemia 滲透性 diuresis + 直接 ADH 抑制)、orthostatic hypotension (volume contraction)、hyperglycemia (catecholamine 抑制 insulin)、hypercalcemia (PTHrP/RANKL 機轉)。B 錯：上述藥物「不會減少」catecholamine 濃度 (反而干擾正向)，造成 false positive 而非 negative。C 錯：synaptophysin 通常陽性 (neuroendocrine marker)。D 錯：30-40% 為遺傳，發病年齡早 15 歲對。E 錯：嗜鉻細胞瘤 unenhanced CT 通常 >10 HU (高 cellularity)，不像 lipid-rich adenoma <10 HU。", "evidence": "Endocrine Society Pheochromocytoma Guideline 2014"}, {"year": 113, "no": 104, "stem": "下列有關自體免疫性多發性內分泌症候群(autoimmune polyendocrine syndrome, APS)的描述，哪一項不 正確?", "choices": {"A": "APS 多見內分泌功能低下，例如Addison’s disease、副甲狀腺功能低下、第一型糖尿病、性腺功能 低下等。但APS 第一型(APS-1)及第二型(APS-2)都可見甲狀腺功能亢進的葛雷夫氏症(Graves’ disease)", "B": "不同亞型APS 的非內分泌表現各有不同。APS-1常見皮膚粘膜念珠菌病(mucocutaneous candidiasis)；APS-2會表現乳糜瀉(celiac disease)", "C": "APS-1常以慢性皮膚粘膜念珠菌病為最早的病徵，其發病年齡通常為30-40歲。第一個病徵出現後可 以間隔數年才出現第二個病徵", "D": "APS-2 的病人女性多於男性。APS-2病人對於特定的器官可能有自體免疫抗體(autoantibodies)，但 通常沒有針對細胞激素(cytokines)的抗體", "E": "APS-1 的病人以ketoconazole治療皮膚粘膜念珠菌病時，需要小心是否可能造成腎上腺危症(adrenal crisis)"}, "answer": "C", "is_endocrine": true, "subtopic": "Thyroid", "explanation": "D 錯：APS-2 病人「也有」cytokine antibodies (特別 anti-interferon 抗體, 在 AIRE-related APS-1 也明確)。準確說法是「APS-1 (AIRE mutation) 有 broad anti-cytokine antibodies (anti-IFNα, anti-IL-17, anti-IL-22)」，這些 antibodies 阻礙抗真菌防禦 → CMC。APS-2 cytokine antibodies 較少見但非完全沒有。A 對：兩型 APS 均可見 Graves。B 對：APS-1 CMC 為標誌；APS-2 celiac 常見。C 對：APS-1 (autosomal recessive) 多在兒童期發病，但成人發病確有 (30-40 歲)。E 對：ketoconazole 抑制 cortisol synthesis 可誘發 adrenal crisis。", "evidence": "Husebye ES et al. NEJM 2018; Williams Endo 14e Ch 41 APS"}, {"year": 113, "no": 105, "stem": "糖尿病降血糖藥物中，有些與胰島素分泌或胰島素阻抗性有關，有些則無直接關聯(non-insulin dependent)，以下降血糖藥物中，何項藥物為非胰島素相關(non-insulin dependent)之機轉?", "choices": {"A": "Sodium-glucose co-transporter 2 inhibitor (SGLT 2 inhibitor)", "B": "Metformin", "C": "Thiazolidinedione（TZD）", "D": "Glucagon like peptide 1 receptor agonist (GLP 1 RA)", "E": "Sulfonylurea"}, "answer": "A", "is_endocrine": true, "subtopic": "DM", "explanation": "A 對：SGLT-2 inhibitor 作用於腎近端小管阻斷 sodium-glucose 共同運輸蛋白 → 增加尿糖排出，「完全 insulin-independent」。B Metformin 主要透過 AMPK 活化抑制 hepatic gluconeogenesis + 增加周邊 insulin 敏感度 (insulin sensitizer)。C TZD 活化 PPAR-γ → 增加 insulin 敏感度。D GLP-1 RA → 增加 glucose-dependent insulin 分泌。E SU → 直接刺激 β-cell 釋放 insulin。", "evidence": "ADA Standards of Care 2024; Williams Endo 14e, Ch 50"}, {"year": 113, "no": 106, "stem": "下列哪一種糖尿病降血糖藥物之藥理機轉，可能會造成下肢水腫?", "choices": {"A": "Sulfonylurea", "B": "Sodium-glucose co-transporter 2 inhibitor (SGLT 2 inhibitor)", "C": "Metformin", "D": "Thiazolidinedione（TZD）", "E": "Dipeptidyl dipeptidase 4 inhibitor (DPP4 inhibitor)"}, "answer": "D", "is_endocrine": true, "subtopic": "DM", "explanation": "D 對：TZD (pioglitazone) 因活化 PPAR-γ → 增加 ENaC 表現 → 鈉水滯留 → 下肢水腫 + 體重上升 + 惡化 HF。FDA 黑框警告 NYHA III/IV HF 禁用。A SU 不致水腫。B SGLT-2i 反而 diuretic 效果。C Metformin 無此副作用。E DPP-4i 一般 well-tolerated 不致水腫。", "evidence": "ADA Standards of Care 2024 TZD; PROactive Trial Side Effects"}, {"year": 113, "no": 107, "stem": "有關Sodium-glucose co-transporter 2 inhibitor (SGLT 2 inhibitor)藥品之敘述，何者為錯誤的?", "choices": {"A": "SGLT 2 inhibitor 所形成之高尿糖，可能增加泌尿道及生殖器感染之風險", "B": "臨床試驗研究顯示SGLT 2 inhibitor 可以降低糖尿病及非糖尿患者，因心臟衰竭住院的機率", "C": "SGLT 2 inhibitor可以與胰島素同時合併使用來控制血糖", "D": "腎功能 eGFR > 60 mL/min/1.73m² 以上之糖尿病患者，都可以使用SGLT 2 inhibitor", "E": "SGLT 2 inhibitor 在降低血糖之際，也同時降低病患產生酮酸中毒(diabetic ketoacidosis) 的機率"}, "answer": "E", "is_endocrine": true, "subtopic": "DM", "explanation": "E 錯：SGLT-2 inhibitor 反而「增加」euglycemic DKA 風險 (尤其在 T1DM、有手術、脫水、酒精時)。其他敘述皆正確：A UTI/真菌感染風險、B 心衰 hospitalization 下降 (DAPA-HF/EMPEROR-Reduced)、C 可與胰島素併用、D eGFR >60 標準適應症 (但現已可用至 eGFR ≥20)。", "evidence": "FDA SGLT-2i euglycemic DKA Black Box; DAPA-HF Trial; EMPEROR-Reduced Trial"}, {"year": 113, "no": 108, "stem": "李先生，46歲，身高168公分，體重 78 公斤，近一年來，體重增加了8 公斤。病患無糖尿病之家族及個 人病史，近來有數次不明原因的昏倒紀錄，均約30 分鐘內甦醒過來。門診無心律不整或神經血管之異常 狀況。本次因再度於工作時昏倒，但是意識持續不清，因此送到急診。急診之血壓為110/58 mmHg，脈 搏為規律的84bpm，急診之血糖顯示為20 mg/dL，給予50%之葡萄糖輸液後，即恢復意識。在住院診察 後，無點滴輸液的前提下，空腹8 小時，抽血報告為: 空腹血糖 76 mg/dL， Insulin 2.8 mIU/mL ，C-peptide 2.2 ng/mL，ACTH 66.8 pg/mL，Cortisol 18.8 ug/dL，IGF-1 230 ng/mL，TSH 3.48 mIU/mL，此時應考慮之優先檢查項目為何?", "choices": {"A": "腦下垂體磁振攝影(MRI)", "B": "抽血檢查血中 Chromogranin A 濃度", "C": "腹部電腦斷層", "D": "72小時之 Prolonged fasting test", "E": "Inferior petrosal sinus sampling (IPSS) 下岩竇靜脈血液取樣檢測"}, "answer": "D", "is_endocrine": true, "subtopic": "Pituitary", "explanation": "D 對：低血糖 + insulin 不被壓抑 + C-peptide 不低 + ACTH/cortisol/IGF-1/TSH 正常 → 高度懷疑 insulinoma。72-hr prolonged fasting test 為 gold standard 診斷工具 (>72% 在 24 hr 內、95% 在 72 hr 內出現低血糖症狀)。A 腦下垂體 MRI 用於 panhypopituitarism (但 ACTH/cortisol 正常排除)。B Chromogranin A 為 NET marker 輔助。C abdominal CT 為定位 (確診後)。E IPSS 為 Cushing's 鑑別。", "evidence": "Endocrine Society Hypoglycemia Guideline 2009; Williams Endo 14e, Ch 48"}, {"year": 113, "no": 109, "stem": "以下有關糖尿病、高血壓及高血脂治療藥物的敘述，何者為錯誤的? (1)隨著年齡的老化，血糖控制的HbA1c控制範圍，高齡的糖尿病病患會較年輕的糖尿病患者寬鬆些 。 (2)目前糖尿病高血壓治療的首選藥物為 Angiotensin-converting enzyme inhibitor (ACEI)或 angiotension receptor blocker (ARB) 。 (3)糖尿病患者如需藥物控制治療高血脂，其低密度脂蛋白膽固醇(LDL-cholestrol) 之治療標的為低於130 mg/mL。 (4)糖尿病患者之高血壓控制目標，基本上定在低於120/80 mmHg，如果合併蛋白尿時，血壓控制建議為 低於110/70 mmHg。 (5)當HbA1c、血壓及血脂均達到控制標準時，戒菸已無助於降低糖尿病血管併發症之風險。", "choices": {"A": "(1)+(2)+(3)", "B": "(1)+(4)+(5)", "C": "(2)+(4)+(5)", "D": "(1)+(3)+(5)", "E": "(3)+(4)+(5)"}, "answer": "E", "is_endocrine": true, "subtopic": "Lipid", "explanation": "E 對 (錯誤組合)。(3) 錯：DM 病人 LDL 目標 <100 (或 <70 高風險)，不是 <130 (此為一般人群)。(4) 錯：DM + HT 目標 <130/80 (KDIGO/ADA)，不是 <120/80 + 蛋白尿 <110/70 (過嚴格)。(5) 錯：戒菸「永遠」降低 vascular complication 風險，即使三項都達標。(1)/(2) 對：老年放寬 HbA1c (<8%)；DM HT 首選 ACEI/ARB。", "evidence": "ADA Standards of Care 2024; KDIGO BP in CKD 2021"}, {"year": 113, "no": 110, "stem": "Metformin是目前國際上大多數糖尿病治療指引之首選藥物建議。以下有關Metformin之敘述何者為錯誤 的?", "choices": {"A": "Metformin可能造成維他命B12 (Vitamin B12)之malabsorption", "B": "腎功能不佳的糖尿病患者，eGFR小於30 ml/min/1.73㎡，不應使用Metformin", "C": "糖尿病前期病患使用Metformin，可以延緩糖尿病前期到發生糖尿病之病程", "D": "乳酸中毒是罕見的Metformin藥物副作用，但是文獻記載之死亡率可達50%", "E": "Metformin之每日最高使用劑量為 2000mg"}, "answer": "E", "is_endocrine": true, "subtopic": "DM", "explanation": "E 錯：Metformin 每日最高劑量為 2,550 mg (台灣藥廠) 或 2,000 mg (歐美一般臨床上限)，但部分指引允許 2,550 mg。「2000 mg」非絕對最高 — 此題敘述視「每日最高 2000mg」為錯誤可能因 immediate-release tablet 上限 2,550，extended-release 2,000；以實際指引 2,000-2,550 mg 為常見 ceiling。A 對：B12 malabsorption (10-30%, 長期使用)。B 對：lactic acidosis 罕見 (3-9/100,000) 但 mortality 30-50%。C 對：DPP/DPS 證實延緩 DM 進展。D 對：MALA 死亡率高。", "evidence": "ADA Standards of Care 2024; FDA Metformin Label"}, {"year": 113, "no": 111, "stem": "糖尿病患者，併有膀胱癌(Bladder cancer)時，不可使用下列哪一種降血糖藥物?", "choices": {"A": "Metformin", "B": "Sodium-glucose co-transporter 2 inhibitor (SGLT 2 inhibitor)", "C": "Dipeptidyl dipeptidase 4 inhibitor (DPP4 inhibitor)", "D": "Thiazolidinedione (TZD)", "E": "Insulin glargine"}, "answer": "D", "is_endocrine": true, "subtopic": "DM", "explanation": "D 對：Pioglitazone (TZD) 與膀胱癌風險上升相關 (KPNC observational study; FDA 黑框警告)，故有膀胱癌病人應禁用。其他降糖藥物 (Metformin、SGLT2i、DPP4i、insulin) 與膀胱癌無已知關聯。", "evidence": "FDA Drug Safety Communication on Pioglitazone 2011; KPNC Cohort Study"}, {"year": 113, "no": 112, "stem": "低血糖是糖尿病治療過程中，以及非糖尿病患者相關疾病或使用特定藥物治療時常見的併發症，下列何者 是發生低血糖的原因? (1) 不當使用胰島素或口服降血糖藥物。 (2) 肢端肥大症。 (3) 胃切除手術後 (Post-gastric bypass surgery)。 (4) 腎上腺機能不足 (Adrenal insufficiency)。 (5) 庫欣氏症候群 (Cushing's syndrome)。", "choices": {"A": "(1)+(2)+(4)", "B": "(2)+(3)+(4)", "C": "(1)+(2)+(5)", "D": "(1)+(3)+(5)", "E": "(1)+(3)+(4)"}, "answer": "E", "is_endocrine": true, "subtopic": "DM", "explanation": "E 對 (1)+(3)+(4)。(1) 不當胰島素或 SU 為最常見藥物性低血糖。(3) Post-gastric bypass 造成「late dumping syndrome with hypoglycemia」(胰島素過度分泌)。(4) Adrenal insufficiency 致 cortisol 缺乏 → 低血糖 (尤其禁食時)。(2) Acromegaly (GH 過量) 造成 insulin resistance + hyperglycemia 而非低血糖。(5) Cushing's syndrome 同樣造成 hyperglycemia。", "evidence": "Endocrine Society Hypoglycemia Guideline 2009 (Cryer PE)"}, {"year": 113, "no": 113, "stem": "一位64歲男性施打COVID-19 AZ疫苗7天後發生發燒，反應遲鈍及肚子痛，到醫院急診實驗室檢查顯示血 小板下降，腎功能下降，皮質酮(cortisol)低，電腦斷層掃描顯示多處動脈及靜脈栓塞，下列檢查那些是最 適合本疾病 ?(1) 纖維蛋白溶解(D-Dimer) (2) 抗血小板因子4抗體anti-PF4-IgG (anti-Platelet-Factor IgG antibodies) (3) 紅血球下降速度(ESR) (4) C-反應蛋白(CRP) (5) 紅血球數目(RBC)", "choices": {"A": "(1)+(2)", "B": "(1)+(3)", "C": "(1)+(4)", "D": "(2)+(5)", "E": "(2)+(4)"}, "answer": "A", "is_endocrine": true, "subtopic": "Adrenal", "explanation": "A 對 (1)+(2)。COVID-19 AZ 疫苗後血小板下降 + 多處血栓 → VITT (vaccine-induced immune thrombotic thrombocytopenia)。診斷需 D-dimer 明顯上升 + anti-PF4 IgG (與 HIT 機轉類似但無 heparin 暴露)。(3) ESR (4) CRP 為非特異性發炎標記。(5) RBC 對 VITT 診斷無價值。本題實質為血液學題，Adrenal 標籤為 keyword 誤抓 (cortisol 提及)。", "evidence": "Greinacher A et al. VITT in COVID-19 Vaccine NEJM 2021"}, {"year": 113, "no": 114, "stem": "病人出現下列何種抗體常合併細胞內細菌，黴菌及非結核分枝桿菌(non-tuberculous mycobacteria)之感 染? (1) anti-IL-4 (2) anti-IL-23 (3) anti-interferon-γ (4) anti-IL-5 (5) anti-IL-13。", "choices": {"A": "(1)+(2)", "B": "(2)+(3)", "C": "(3)+(4)", "D": "(4)+(5)", "E": "(5)+(1)"}, "answer": "B", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 113, "no": 115, "stem": "下列何種疾病較會合併惡性腫瘤?", "choices": {"A": "高血壓", "B": "硬皮症", "C": "急性心肌梗塞", "D": "肺結核", "E": "急性腎盂腎炎"}, "answer": "B", "is_endocrine": false, "subtopic": null, "explanation" nt Guideline"}, {"year": 113, "no": 139, "stem": "62歲女性病人，罹患轉移性肺腺癌(NSCLC, adenocarcinoma)，已接受第一線carboplatin、paclitaxel，合 併bevacizumab治療，有效”緩解”(partial response)一段期間之後”惡化”(disease progression)。病人 的ECOG體能狀態(performance status, PS)為1，針對病人周邊肺野的較大病灶安排重新切片，分子檢測 發現ROS1基因rearrangement陽性。你建議下一步的治療，何者最為適宜?", "choices": {"A": "Docetaxel", "B": "Pemetrexed", "C": "Gemcitabine", "D": "Crizotinib", "E": "Erlotinib"}, "answer": "D", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 113, "no": 140, "stem": "一位66歲男性病人，接受上消化道內視鏡檢查與切片確定罹患胃的「神經內分泌瘤(Neuroendocrine tumor, NET) 」。電腦斷層掃描顯示肝臟已有多發轉移病灶。病理組織除了確定為神經內分泌瘤之外，腫 瘤的「分化」(grading)對病人臨床預後(prognosis)的判定與治療選項的選擇，有重要的參考價值。 倘若病理組織顯微鏡檢查，每10個高倍數視野 (10 HPF, high power field), 平均有13個有絲分裂(mitotic count)，與Ki-67指數(Ki-67 index)計算為12%。依照世界衛生組織(WHO) NET分類系統的grading建 議，這樣的病理組織的「分化」(grading)屬於第幾級?", "choices": {"A": "Neuroendocrine carcinoma (NEC)", "B": "Grade 4", "C": "Grade 3", "D": "Grade 2", "E": "Grade 1"}, "answer": "D", "is_endocrine": true, "subtopic": "Other-Endocrine", "explanation": "D 對：WHO 2019 NET 分類，根據 mitotic count + Ki-67 index：G1 (mitosis <2/10HPF, Ki-67 <3%)、G2 (mitosis 2-20/10HPF, Ki-67 3-20%)、G3 well-differentiated NET (mitosis >20/10HPF, Ki-67 >20%) 或 NEC (poorly differentiated)。本例 mitosis 13、Ki-67 12% → 落在 G2 範圍。NEC 是 G3 poorly differentiated。", "evidence": "WHO Classification of Tumors of Endocrine Organs 2019; ENETS NET Guidelines"}, {"year": 113, "no": 141, "stem": "有關原發部位不明的上皮癌(Carcinoma of unknown primary, CUP)，除了病理組織的H&E染色型態之 外，有時需借助於免疫組織化學染色(immunohistochemical stain)來協助判斷CUP的原發器官。下列哪一 組標記的抗體染色profiles，經常做為「大腸癌(colon cancer) 」為CUP原發器官之輔助(very suggestive)診斷標記？", "choices": {"A": "CDX-2(+), CK20(+) , CK7(+)", "B": "CDX-2(+), CK20(−), CK7(+)", "C": "CDX-2(+), CK20(+), CK7(−)", "D": "CDX-2(−), CK20(−), CK7(+)", "E": "CDX-2(−), CK20(+) , CK7(−)"}, "answer": "C", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 113, "no": 142, "stem": "一位 67 歲的婦女來健 s_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 113, "no": 155, "stem": "下列關於抗憂鬱藥物與其常見副作用組合，何者為非？", "choices": {"A": "Sertraline：噁心", "B": "Escitalopram：頭痛", "C": "Fluoxetine：失眠", "D": "Bupropion：口乾", "E": "Mirtazapine：體重減輕"}, "answer": "E", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 113, "no": 156, "stem": "請問關於藥物反應伴隨嗜伊紅性白血球增加與全身症狀(Drug reaction with eosinophilia and systemic symptoms, DRESS)的描述，以下何者為非？", "choices": {"A": "患者可能呈現發燒、淋巴結腫大、及全身紅疹之症狀", "B": "此藥物反應常造成內部器官的損傷，且不同藥物好發之內部器官損傷不盡相同，如allopurinol易引起 腎臟的影響，而minocycline常造成肺部的影響", "C": "此藥物疹多半在第一次使用藥物的7-10天發生", "D": "可能藥物疹可能伴隨著人類疱疹病毒的復發，其中可能包含Epstein-Barr virus (EBV) 及第六型人類 疱疹病毒", "E": "藥物反應緩解後還須持續追蹤隨後可能發生的自體免疫性甲狀腺炎(autoimmune thyroiditis)及糖尿 病(diabetes mellitus)"}, "answer": "C", "is_endocrine": true, "subtopic": "Thyroid", "explanation": "C 錯：DRESS 通常在「第一次使用藥物的 2-8 週」(平均 3-6 週) 才發生，而非 7-10 天。常見藥物：abacavir、allopurinol、antiepileptics (carbamazepine, phenytoin)、sulfa、minocycline。A 對：發燒 + 紅疹 + lymphadenopathy 三聯。B 對：藥物特異性內臟侵犯。D 對：HHV-6 reactivation 為 DRESS 特徵。E 對：DRESS 後 autoimmune thyroiditis + T1DM 可發生數月後。", "evidence": "Cacoub P et al. DRESS Syndrome AmJM 2011; Husain Z et al. DRESS Review JAAD 2013"}, {"year": 113, "no": 157, "stem": "一位 27歲的男性到皮膚科門診就診，主訴最近一週左右背部、上臂及手背出現無症狀皮膚病灶(如圖1所 示)，病人過去病史為肥胖，飲食習慣為高油，並經常喝酒。理學檢查發現粉紅至黃色丘疹散在於背 部、上臂及手背。請問此案例相關敘述何者錯誤？", "choices": {"A": "鑑別診斷包括傳染性軟疣(molluscum contagiosum)、皮脂腺增生(sebaceous hyperplasia) 、發疹性 黃色瘤(eruptive xanthoma)以及發疹性組織細胞瘤(eruptive histiocytoma)", "B": "診斷需考量病人是否具有代謝症候群之危險因子", "C": "實驗室檢查需包含空腹時血中三酸甘油脂及膽固醇濃度", "D": "此皮膚病灶表現與三酸甘油脂過高最相關", "E": "此皮膚病灶表現與低密度膽固醇過高最相關"}, "answer": "E", "is_endocrine": true, "subtopic": "Lipid", "explanation": "E 錯：本例為 eruptive xanthoma — 多發性、突然出現、黃色或粉紅丘疹，發生於背部、上臂、手背、臀部，「強烈與 triglyceride 過高 (>1000 mg/dL) 相關」(非 LDL)。需檢查空腹 TG 與 cholesterol，治療為控制 TG (fibrate / fish oil / 減重)。A 鑑別診斷正確。B/C 對：metabolic syndrome workup。D 對：與 TG 最相關。E 與 LDL 相關的是 tendinous/tuberous xanthoma 而非 eruptive。", "evidence": "Harrison 21e, Ch 407 Lipid Disorders; AAD Xanthoma Classification"}, {"year": 113, "no": 158, "stem": "有關二期梅毒(secondary syphilis)的皮膚臨床表現，下列何者錯誤?", "choices": {"A": "不規則禿髮(patchy alopecia, moth-eaten hair loss)", "B": "斑狀丘狀軀幹發疹(Maculopapular truncal eruption)", "C": "手掌腳掌丘疹(Papules on the palms and soles)", "D": "結節性梅毒腫(nodular gumma)", "E": "扁平濕疣(condylomata lata)"}, "answer": "D", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 113, "no": 159, "stem": "下列關於嚴重皮膚藥物疹之敘述，何者錯誤? (1) Sulfamethoxazole、sulfasalazine等磺胺類藥物為常見引起史帝芬-強生症候群(Stevens-Johnson syndrome)之藥物之一。 (2) Allopurinol、carbamazepine、phenytoin皆屬於低風險藥物，不太可能引起史帝芬-強生症候 群(Stevens-Johnson syndrome)。 (3) 毒性表皮壞死症候群(toxic epidermal necrolysis)侵犯體表面積至少需>70%，且可能有致命風險。 (4) 發病晚期投予系統性類固醇(systemic glucocorticoids)仍舊能夠改善預後，且臨床實證充足。 (5) 治療毒性表皮壞死症候群(toxic epidermal necrolysis)時，除了停藥之外，重點是支持性療法如輸 液、維持電解質平衡、感染控制、傷口照護等。", "choices": {"A": "(1)+(2)+(3)", "B": "(2)+(3)+(4)", "C": "(1)+(5)", "D": "(4)+(5)", "E": "(3)+(4)+(5)"}, "answer": "B", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 113, "no": 160, "stem": "有位病人右臉疼痛數日後出現水泡，經診斷為帶狀疱疹 (Herpes zoster)。有關此疾病之敘述，以下何者 錯誤：", "choices": {"A": "由Varicella-zoster virus (VZV) 造成", "B": "病人通常在近期內有VZV接觸史", "C": "皮疹常沿神經皮節 (dermatome) 分布", "D": "可侵犯中樞神經", "E": "口服抗病毒藥物可促進病灶癒合、疼痛改善"}, "answer": "B", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 114, "no": 1, "stem": "有關低收縮分率心衰竭的藥物治療(Heart Failure with Reduced Ejection Fraction)，下列何者不是指引導 向藥物治療 (guideline directed medical therapy, GDMT) 可以改善病患預後的 Class I 藥物。", "choices": {"A": "Angiotensin-converting enzyme inhibitors（ACEI，血管張力素轉換酶抑制劑）", "B": "Beta受體阻滯劑 (beta-blocker)", "C": "奇特電流通道抑制劑 (ivabradine)", "D": "鹽皮質激素受體拮抗劑(mineralocorticoid receptor antagonist，MRA)", "E": "SGLT2 抑制劑（sodium–glucose cotransporter 2 inhibitors）"}, "answer": "C", "is_endocrine": true, "subtopic": "DM", "explanation": "C 對：Ivabradine 為 funny channel (If) inhibitor，僅用於「HFrEF + sinus rhythm + HR ≥70 bpm despite β-blocker」族群 (SHIFT trial)，屬「Class IIa」推薦 (非 Class I)。Class I GDMT 為 ACEI/ARB/ARNI、β-blocker、MRA、SGLT-2i (即 'fantastic four')。E SGLT-2 inhibitor 在 2022 AHA/ACC/HFSA 指引中加入為 Class I。", "evidence": "2022 AHA/ACC/HFSA HF Guidelines; SHIFT Trial Lancet 2010"}, {"year": 114, "no": 2, "stem": "65歲林先生，三年前心臟超音波顯示左心室射出分率為 32% ，左心室舒張末期直徑為6.4公分，經藥物治 療之後，兩個月前追蹤心臟超音波顯示，左心室射出分率為48%，抽血的血漿中之NT-proBNP指數為 545 pg/mL，心臟衰竭症狀根據美國紐約心臟學會分級為NYHA Fc II，有關本患者的治療診斷下列何者正確?", "choices": {"A": "根據最新的美國心臟學會指南，病患的心臟衰竭分類是正常收縮力心臟衰竭(heart failure with preserved ejection fraction)", "B": "肥胖病患的體重，通常NT-proBNP的數值會較預期的為高 (higher than expected)", "C": "隨著病患的症狀改善，左心室射出率回復到50%以上，可以逐漸減少guideline-directed medical therapy 的種類，研究上此類病患不會因為減少藥物而影響左心室的射出分率", "D": "血漿中的ST2 和心臟的纖維化有關，合併NTproBNP檢測，可以預測HFrEF (heart failure with reduced ejection fraction)或者HFpEF (heart failure with preserved ejection fraction)病患的預後", "E": "運動生理測試指標，吐氣換氣量 (expiratory ventilation, VE)除以攝氧量(oxygen uptake, VO2) 的斜 率，可以代表運動時肺部的代謝效率，和心臟衰竭患者的預後有密切的關係"}, "answer": "D", "is_endocrine": true, "subtopic": "Other-Endocrine", "explanation": "D 對：ST2 為 IL-1 receptor family，soluble ST2 上升反映心肌纖維化、心衰預後不佳，與 NT-proBNP 結合可預測 HFrEF/HFpEF 預後 (PRIDE trial)。本例 LVEF 由 32% 改善至 48% 屬「HFrecEF (recovered EF)」，仍需持續 GDMT 否則 TRED-HF Trial 顯示 50% 復發。A 錯：原本為 HFrEF (start at 32%)。B 錯：肥胖 NT-proBNP 偏低。C 錯：停藥會復發。E 對 VE/VO2 但 D 較直接。", "evidence": "PRIDE Trial; TRED-HF Trial Lancet 2019; AHA/ACC/HFSA 2022 HF Guidelines"}, {"year": 114, "no": 3, "stem": "下列何者不是急性心衰竭的理學檢查或臨床觀察可能的發現。", "choices": {"A": "聽診的時候可以聽到囉音 (rales)", "B": "頸靜脈壓力(jugular venous pressure)上升，腹部頸靜脈回流(abdominojugular reflux)上升", "C": "出現交替脈(pulsus alternans )", "D": "出現高脈搏壓(pulse pressure)", "E": "聽診時S3變大聲，P2變得明顯"}, "answer": "D", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 114, "no": 4, "stem": "病患做運動心電圖需要觀察病人的症狀，心電圖變化，以及血壓的改變，何者還不需要立刻停止?", "choices": {"A": "病人 P 3000 pg/ml, 右心導管顯示低心輸出率 (cardiac index of 1.5 l/min/m²)，肺動脈楔壓(PCWP)為20 mmHg。下列心衰竭藥物的注射選擇何者最為 恰當?", "choices": {"A": "Dobutamine 1~2 ug/kg/min 靜脈注射", "B": "Dopamine 10 ug/kg/min 靜脈注射", "C": "Norepinephrine 3ug/kg/min 靜脈注射", "D": "Levosimendan 0.10 ug/kg/min 靜脈注射", "E": "Dopamine 2 ug/kg/min 靜脈注射"}, "answer": "D", "is_endocrine": true, "subtopic": "Other-Endocrine", "explanation": "D 對：嚴重 HF (LVEF 15%、SaO2 75%、低 cardiac index、PCWP 高) + ventricular tachycardia → Levosimendan 為 calcium-sensitizer 兼 K-ATP opener，較 dobutamine 不易引發心律不整、改善 hemodynamic 不增加心肌耗氧。A Dobutamine 1-2 ug/kg/min 太低劑量。B Dopamine 10 ug/kg/min 過大 (vasoconstriction)。C NE 3 ug/kg/min 為 vasopressor 不適合 cardiogenic shock 心輸出降。E 同樣 dopamine。本題為心衰加護題。", "evidence": "SURVIVE Trial; LIDO Trial; ESC HF Guidelines 2021 Inotropes Section"}, {"year": 114, "no": 9, "stem": "65歲王小姐，心臟超音波顯示左心室射出分率為35%，左心室舒張末期直徑為6.4公分，平常血壓 為120/80 mmHg，沒有服用血壓藥物，過去沒有中風病史，血中的HbA1C = 5.4%，心導管顯示冠狀動脈 左前降支阻塞30%，其他血管無異常，心電圖如附圖，有關本患者的治療診斷下列何者錯誤?", "choices": {"A": "病患如果反覆發生頻脈，產生心衰竭的症狀，電燒治療是class I的治療選擇", "B": "應該要給予病患服用直接口服抗凝血劑Direct oral anticoagulant, DOAC）", "C": "病患的中風CHA₂DS₂-VASc = 2", "D": "控制病患的心跳速率使用的藥物應該避免nondihydropyridine 的鈣離子阻斷劑", "E": "病患如果不適合使用口服抗凝血劑，可以考慮施行左心耳封填術"}, "answer": "C", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 114, "no": 10, "stem": "關於非ST段抬高心肌梗塞(NSTEMI, non-ST-elevation myocardial infarction )的處置，下列何者為錯誤？", "choices": {"A": "初期應給予抗血小板與抗凝血藥物", "B": "心肌酶陽性病人皆須安排侵入性導管檢查", "C": "低危險群病人可考慮非侵入性檢查作為第一線評估工具", "D": "GRACE風險評分有助決定侵入性策略時機", "E": "所有NSTEMI病人皆須使用高劑量statin治療"}, "answer": "B", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 114, "no": 11, "stem": "76歲男性於健康檢查發現心房顫動，過去有高血壓病史，腎功能正常，無出血病史。有關缺血性腦中風的 預防下列何者最合適？", "choices": {"A": "不需抗凝治療", "B": "建議使用aspirin", "C": "建議使用warfarin維持INR 2.0", "D": "建議使用DOAC(direct oral anticoagulant)如apixaban", "E": "建議左心耳封堵裝置"}, "answer": "D", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 114, "no": 12, "stem": "有關肥厚性阻塞性心肌病(HOCM, hypertrophic obstructive cardiomyopathy)的敘述(1) 心室舒張功能常受 限。(2) 可見於年輕猝死病人。(3) 心臟超音波檢查可見心室流出道阻力。(4) 心臟雜音在蹲下時會增 加。(5) 部分病人可用酒精消融治療(septal alcohol ablation)。以上五個敘述正確的有？", "choices": {"A": "(1)+(2)+(3)", "B": "(2)+(3)+(4)", "C": "(1)+(2)+(3)+(4)", "D": "(1)+(2)+(3)+(5)", "E": "(3)+(4)+(5)"}, "answer": "D", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 114, "no": 13, "stem": "一位72歲女性，有高血壓、肥胖與糖尿病病史，近月來活動時氣喘、易倦，夜間陣發性呼吸困難明顯。心 音可聽到S4，BNP為580 pg/mL，心電圖無明顯缺血變化。心臟超音波顯示LVEF 65%、左心室壁肥 厚、左心房擴大，肺動脈壓上升。下列關於該患者心衰診斷與治療的敘述，何者最正確？", "choices": {"A": "因射出分率正常，非屬心衰竭，不建議使用心衰藥物", "B": "治療首重強心劑與利尿劑合併以提升心輸出量", "C": "SGLT₂抑制劑(sodium-glucose cotransporter 2 inhibitor) 為治療的建議用藥", "D": "應啟用ARNI(angiotensin receptor-neprilysin inhibitor)以明確降低死亡率", "E": "若BNP升高但無肺水腫，不支持心衰診斷，應先排除COPD(chronic obstructive pulmonary disease)"}, "answer": "C", "is_endocrine": true, "subtopic": "DM", "explanation": "C 對：HFpEF (LVEF 65% + LVH + LA enlargement + BNP 上升) 治療：SGLT-2 inhibitor (empagliflozin EMPEROR-Preserved, dapagliflozin DELIVER) 為現代 Class I 一線。A 錯：HFpEF 仍是心衰須積極治療。B 錯：intropic agent 不用於 HFpEF (LVEF 已正常)。D 錯：ARNI 在 HFpEF 為 IIb (PARAGON-HF 邊緣達標)，非「明確降死亡率」。E 錯：BNP 升高不需肺水腫即可診斷 HFpEF (clinical + echo)。", "evidence": "2022 AHA/ACC/HFSA HF Guidelines; EMPEROR-Preserved NEJM 2021"}, {"year": 114, "no": 14, "stem": "一位78歲男性，患有冠心病與高血壓，因頭暈送至急診。心電圖顯示P波規律且約90 bpm、QRS波規律 但無固定P-QRS關係，心率38 bpm，為寬QRS節律，無ST段變化。病人目前神智清楚，血壓112/70 mmHg。下列處置最為合適為何？", "choices": {"A": "靜脈注射 atropine，為治療首選", "B": "若症狀改善，可觀察並門診追蹤", "C": "安裝暫時性心律調節器，並評估永久性節律器植入", "D": "立即給予beta-blocker以穩定節律", "E": "建議安排心導管以評估是否需冠狀動脈介入治療"}, "answer": "C", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 114, "no": 15, "stem": "一名70歲男性因活動性呼吸困難與頭暈至門診就醫，心音可聽及收縮期噴射性雜音。超音波心動圖顯示主 動脈瓣面積為0.9 cm²，平均跨瓣壓差為30 mmHg，左心室射出分率為65%。根據當前指引，對此病人最 佳處置為下列何者？", "choices": {"A": "定期追蹤，暫不需介入治療", "B": "轉介接受主動脈瓣置換術評估", "C": "開始β-blocker以減 三個月內曾因氣喘惡化口服類固醇兩次，並有一次急診就醫。近期白天每天幾乎都有 咳嗽與喘鳴，夜間也會醒來 1–2 次。肺功能如下：FEV₁：68% predicted；FEV₁/FVC：65%；支氣管擴 張測試：FEV₁ 增加 16%，350 mL。下列哪一項敘述正確？", "choices": {"A": "目前氣喘控制良好，不需調整治療", "B": "單純增加 SABA 使用頻率有助於降低急性惡化風險", "C": "支氣管擴張測試結果不符合氣喘的診斷標準，建議考慮其他診斷", "D": "ICS–formoterol 可作為維持與緩解兼用的治療策略", "E": "建議立即改用每日口服類固醇以維持長期控制"}, "answer": "D", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 114, "no": 20, "stem": "關於嚴重氣喘（severe asthma）之治療策略，下列哪一項敘述正確？", "choices": {"A": "對於所有嚴重氣喘患者，應常規併用兩種不同類型的長效β2促效劑（LABA）以增強支氣管擴張效 果", "B": "血中嗜酸性球小於150/μL時，更適合考慮使用抗IL-5或抗IL-5R單株抗體治療", "C": "長效抗膽鹼劑（LAMA）可作為中至高劑量吸入型類固醇(ICS)–LABA 控制不佳時的加成治療", "D": "Omalizumab 僅適用於高 IgE 濃度、無任何過敏性疾病的成人氣喘患者", "E": "使用生物製劑治療應在確診後立即開始，而無需考慮患者表現或表型特徵"}, "answer": "C", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 114, "no": 21, "stem": "下列哪些狀況屬於神經阻斷性惡性症候群（Neuroleptic Malignant Syndrome, NMS）常見的臨床表 現？(1) 高燒（Hyperthermia） (2) 僵直（Rigidity） (3) 高反射（Hyperreflexia） (4) 血壓變異大（血流動力學不穩定） (5) 肌酸激酶（CK）升高", "choices": {"A": "(1)+(2)", "B": "(1)+(2)+(4)", "C": "(1)+(2)+(4)+(5)", "D": "(1)+(2)+(3)+(4)+(5)", "E": "(1)+(2)+(3)+(5)"}, "answer": "C", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 114, "no": 22, "stem": "下列哪些狀況屬於肺臟移植的絕對禁忌症（Absolute contraindications）？ (1) 最近30天內發生急性心肌梗塞（demand ischemia除外） (2) 活動性肺外或播散性感染 (3) 嚴重的進行性認知功能障礙 (4) Glomerular filtration rate of < 40 ml/min/1.73 m² of body surface area（未規劃多器官移植） (5) 年齡超過70歲", "choices": {"A": "(1)+(2)", "B": "(3)+(4)", "C": "(1)+(2)+(3)", "D": "(1)+(2)+(3)+(4)", "E": "(1)+(2)+(3)+(4)+(5)"}, "answer": "D", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 114, "no": 23, "stem": "關於敗血症的病理生物學（Pathobiology of Sepsis），下列敘述何者正確？", "choices": {"A": "敗血症主要由過度炎症反應引起，免疫抑制在病理過程中不具重要性", "B": "微血管損傷在敗血症中表現為血管通透性降低，減少血栓形成風險", "C": "敗血症的病理特徵包括同時存在的過度炎症反應和免疫抑制，並伴隨微血管損傷", "D": "敗血症患者的淋巴細胞增生是免疫系統正常運作的標誌，與預後良好相關", "E": "敗血症的器官衰竭僅由病原體直接破壞組織引起，與宿主免疫反應無關"}, "answer": "C", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 114, "no": 24, "stem": "關於敗血性休克（Septic Shock）之處置與治療，下列何者正確？", "choices": {"A": "第一線升壓劑建議使用多巴胺(dopamine)，因其對腎臟有保護效果", "B": "血管加壓劑建議僅由中心靜脈注射，避免外滲風險", "C": "持續高乳酸濃度不需理會，只要血壓穩定即可", "D": "補液使用晶體液(crystalloid)為優先選擇，建議初始劑量為30 ml/kg", "E": "降低平均動脈壓（MAP）至50 mmHg 有助減少液體輸注需求"}, "answer": "D", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 114, "no": 25, "stem": "關於結核病診斷方法的敘述，下列何者正確？", "choices": {"A": "結核菌素皮膚試驗(TST)特異性高，不受卡介苗接種影響", "B": "痰液抗酸染色鏡檢敏感性高，可作為確診的黃金標準", "C": "分子檢測(Xpert MTB/RIF)可同時檢測結核菌和Rifampin耐藥性", "D": "胸部X光特異性達90%以上，可單獨作為確診依據", "E": "干擾素釋放試驗(IGRA)需培養結核菌，耗時較長"}, "answer": "C", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 114, "no": 26, "stem": "陳先生66歲，過去是一位水泥工，抽煙一天一包三十五年，長期咳嗽伴隨少量痰液。最近爬樓梯一層樓出 現呼吸急促症狀因此至門診就醫，胸部X光如圖所示，肺功能檢查結果為： FEV1/FVC=66.9% ，FEV1為 預測值的75.9%，FVC為預測值的90.2%，支氣管擴張劑測試為陰性（bronchodilator test negative），最 近這一年沒有因為上述症狀至急診就醫或住院。下列何種處置較不恰當？", "choices": {"A": "建議戒煙與接種肺炎鏈球菌疫苗", "B": "建議低劑量電腦斷層篩檢", "C": "給予短效支氣管擴張劑作為需要時使用", "D": "若其症狀影響活動能力，可考慮使用長效支氣管擴張劑", "E": "給予吸入型類固醇"}, "answer": "E", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 114, "no": 27, "stem": "呈上題，陳先生聽從醫師建議戒菸，並規則於門診追蹤治療。大約五年後出現咳嗽與呼吸急促症狀加 劇，因此到急診就醫，胸部X光如圖所示，下列何者錯誤？", "choices": {"A": "病患可接受胸部電腦斷層檢查", "B": "右側肋膜有大量積水，建議立刻豬尾巴導管(pigtail catheter)引流", "C": "可能發生右肺中葉與下葉塌陷", "D": "應考慮氣道阻塞，例如腫瘤或異物造成右邊中間支氣管( Intermediate bronchus)阻塞", "E": "可考慮安排支氣管鏡檢查"}, "answer": "B", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 114, "no": 28, "stem": "某70歲男性有慢性阻塞性肺病（COPD），平時有咳嗽與白痰的症狀。三個月前在門診使用吸入 劑Long-acting β2-agonist （LABA）與Long-acting Muscarinic Antagonists (LAMA)， 抽血嗜酸性球計數 (eosinophil count) 為 350/μL。兩週前因COPD exacerbation住院治療。返診追蹤時抱怨呼吸困難，根據 最新GOLD guideline，下列處置或敘述何者不正確？", "choices": {"A": "病人的血氧濃度若低於88%建議於家中準備氧氣", "B": "此病人應建議加上inhaled corticosteroids (ICS)成為 triple therapy", "C": "若治療後仍有慢性支氣管炎症狀且嗜酸性球計數＞300/μL，則使用生物製劑dupilumab可降低未來急 性惡化的風險", "D": "建議病人每年都要施打流感疫苗", "E": "此病人應改成inhaled conticosteroid (ICS) + LABA 治療"}, "answer": "E", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 114, "no": 29, "stem": "某特發性肺纖肺維化(IPF)病患因呼吸困難就醫，心臟超音波懷疑有肺動脈高壓。右心導管顯示平均肺動 脈壓力(mean PA pressure) = 38 mmHg，肺動脈wedge pressure (PAWP) = 10 mmHg，cardiac output = 2.8 L/min，下列敘述何者正確？ (1) 病患符合pre-capillary pulmonary hypertension之診斷標準 (2) 病患的肺血管阻力為 10 Wood units (3) 根據最新的肺高壓診斷標準病患屬於嚴重之WHO Group 3肺動脈高壓 (4) Inhaled Treprostinil已被臨床準則建議可用於此類病患", "choices": {"A": "(1)+(2)", "B": "(2)+(3)", "C": "(1)+(3)+(4)", "D": "(2)+(3)+(4)", "E": "(1)+(2)+(3)+(4)"}, "answer": "E", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 114, "no": 30, "stem": "一名男性患者因慢性阻塞性肺病（COPD）急性惡化入院，醫療團隊正在考慮使用非侵襲性正壓呼吸 器（non-invasive positive pressure ventilator，NPPV）治療。以下情況何者最不適合使用NPPV？", "choices": {"A": "年齡75歲", "B": "呼吸次數22/min", "C": "血壓150/90 mmHg", "D": "動脈血氣分析（ABG）顯示呼吸性酸中毒惡化", "E": "合併心因性肺水腫"}, "answer": "D", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 114, "no": 31, "stem": "有關肺炎的風險因子與可能病原菌的相關性，下列何者不正確？", "choices": {"A": "吸入或嗆咳：口腔厭氧菌", "B": "冷卻水塔相關：流感嗜血桿菌(H. Influenzae)", "C": "藥癮者：金黃色葡萄球菌", "D": "支氣管擴張症：綠膿桿菌", "E": "慢性支氣管炎: 肺炎鏈球菌"}, "answer": "B", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 114, "no": 32, "stem": "某位體重80公斤之70歲男性病患因急性呼吸窘迫症候群(ARDS)接受呼吸器治療。其呼吸器設定為: FiO₂ 0.50、呼吸速率: 18次/min、tidal volume: 560 mL、最高吸氣流速 70 L/min、吐氣末陽壓(PEEP): 10 cmH₂O。其動脈血液氣體分析為：pH 7.47、PaO₂ 85 mmHg、PaCO₂ 31 mmHg、HCO₃ 26 mEq/L。請 問應調整那個呼吸器參數值最為妥當？", "choices": {"A": "增加呼吸速率", "B": "減少FiO₂", "C": "減少潮氣容積(tidal volume)", "D": "增加最高吸氣流速", "E": "增加吐氣末陽壓(PEEP)"}, "answer": "C", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 114, "no": 33, "stem": "某67歲男性病患，有長期吸菸史，因呼吸困難求診。胸部電腦斷層顯示有肺氣腫。肺功能檢查post- bronchodilator FVC = 83%，post- bronchodilator FEV1 = 84%，post- bronchodilator FEV1/FVC = 0.72，一氧化碳肺瀰散量（DLCO）= 79%。根據最新GOLD指引，其臨床分期為何？", "choices": {"A": "GOLD 1", "B": "GOLD 2", "C": "Group A", "D": "Pre-COPD", "E": "Preserved ratio impaired spirometry (PRISM)"}, "answer": "D", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 114, "no": 34, "stem": "一位66歲女性，風濕免疫科確診為硬皮症(systemic sclerosis)，因活動性喘至胸腔科門診就診。胸部電腦 斷層掃描影像如附圖。經過風濕免疫科治療半年之後，病人咳嗽加劇，活動性喘更明顯，追蹤肺功能顯示 用力肺活量（FVC）降低4%，一氧化碳肺瀰散量（DLCO）降低8%。胸部電腦斷層掃描，顯示新的蜂窩 狀變化以及牽拉性支氣管擴張嚴重程度增加。關於此患者何者為錯誤？ (1) 此患者肺功能已達漸進性肺纖維化（Progressive Pulmonary fibrosis, PPF）之標準 (2) 影像表現為非特異性間質性肺炎（Non-Specific Interstitial Pneumonia） (3) 針對此患者目前已有充分臨床證據支持Pirfenidone之抗纖維化療效 (4) 結締組織疾病相關的間質性肺病(CTD-ILD)產生漸進性肺纖維化之比例，最常見的是紅斑性狼 瘡（SLE），其次是硬皮症", "choices": {"A": "(1)+(2)", "B": "(1)+(2)+(3)", "C": "(2)+(3)+(4)", "D": "(1)+(2)+(3)+(4)", "E": "(3)+(4)"}, "answer": "D", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 114, "no": 35, "stem": "經鼻高流量氧氣治療 ( nasal high flow oxygen therapy）以下敘述何者為誤 ?", "choices": {"A": "氣流量常介於 30-60L/min", "B": "可使吐氣末肺容積下降", "C": "可使病人每分鐘呼吸量下降", "D": "可能降低病人呼吸做功 ( work of breath）", "E": "可能小幅度增加呼吸道吐氣末正壓"}, "answer": "B", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 114, "no": 36, "stem": "35歲男性，理想體重為60公斤，因呼吸急促至急診就醫，被診斷為氣喘急性惡化。在接受短效支氣管擴 張劑與靜脈注射類固醇治療後仍持續嚴重的呼吸困難且合併高碳酸血症，因此接受插管與侵襲性呼吸器的 治療。其初始呼吸器設定為容量控制－輔助控制模式（Volume Control Assist-Control），潮氣容積450 mL，氧氣濃度30%，吐氣末正壓4 cmH₂O，呼吸速率每分鐘26次。病人在加護病房突然出現低血壓與心 搏過速的情形，初步判斷沒有氣胸，此時呼吸器面板出現以下波形（如附圖），請問下列哪一項處置最為 合理？", "choices": {"A": "俯臥治療 （prone positioning）", "B": "增加吸入的氧氣濃度", "C": "降低呼吸速率", "D": "降低吸氣流速", "E": "增加吐氣末正壓"}, "answer": "C", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 114, "no": 37, "stem": "有關Metabolic Dysfunction-Associated Steatotic Liver Disease (MASLD)之敘述，何者錯誤？", "choices": {"A": " hatemia induced by phosphate retention", "C": "Increased synthesis of FGF-23 by osteocytes", "D": "Low ionized calcium", "E": "Parathyroid gland hypertrophy and secondary hyperparathyoridism"}, "answer": "B", "is_endocrine": true, "subtopic": "Calcium-Bone", "explanation": "C 對：CKD 早期 (eGFR 60-89) → 腎臟磷排出減少 → 但血磷仍正常 (因 FGF-23 自 osteocyte 早期上升 → 增加尿磷排出 + 抑制 1α-hydroxylase → 1,25-D 下降)。FGF-23 為 CKD-MBD 最早出現的生化異常，比 hyperphosphatemia、低 1,25-D、低 ionized Ca、PTH 升高都更早。", "evidence": "KDIGO CKD-MBD Guideline Update 2017; Wolf M. FGF-23 in CKD JASN 2010"}, {"year": 114, "no": 61, "stem": "一位44歲男性，因意識模糊，呼吸急促被送至急診。抽血檢查:動脈氣體分析、血清電解質如下: glucose 148 mg/dL, BUN 52 mg/dL, Cr 1.8 mg/dL, ABG: pH 7.32，PCO2 20 mmHg, HCO3- 13 mEq/L; Na 144 mEq/L, K 4.1 mEq/L, Cl 102 mEq/L 。由以上數據分析，最符合以下何種診斷? (1) Metabolic acidosis with respiratory compensation (2) Mixed metabolic acidosis and respiratory alkalosis (3) Mixed metabolic acidosis and respiratory acidosis (4) Normal anion gap (5) Increased or high anion gap", "choices": {"A": "(1)+(4)", "B": "(1)+(5)", "C": "(2)+(4)", "D": "(2)+(5)", "E": "(3)+(4)"}, "answer": "D", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 114, "no": 62, "stem": "慢性腎病(CKD)病人常需同時使用多種藥品，除了利尿劑(loop diuretics, thiazide)之外，以下何者會增加 高尿酸(hyperuricemia) 與痛風的風險?", "choices": {"A": "SGLT2 inhibitors", "B": "metformin", "C": "losartan", "D": "fenofibrate", "E": "beta-blockers"}, "answer": "E", "is_endocrine": true, "subtopic": "DM", "explanation": "E 對：β-blocker 雖無直接 uric acid 升高機轉，但與 thiazide/loop diuretic 一同列入「增加高尿酸與痛風」風險的藥物 (large cohort studies)。Losartan (ARB) 反而「降」尿酸 (URAT1 抑制)。A SGLT2i 反而降尿酸。B Metformin 中性。D Fenofibrate 反而降尿酸 (PPARα 效應)。", "evidence": "ACR Gout Management Guidelines 2020; Choi HK et al. BMJ Gout Risk Factors"}, {"year": 114, "no": 63, "stem": "一名體重 60 公斤的病人，入院時基礎血清肌酐為 1.0 mg/dL。第三天測得血清肌酐上升至 2.2 mg/dL，且過去24小時總尿量為 700 mL。請問此病人的急性腎損傷（AKI）應屬於哪一個分期？", "choices": {"A": "Stage 1", "B": "Stage 2", "C": "Stage 3", "D": "無法分類，需腎臟切片", "E": "尚未符合 AKI 診斷標準"}, "answer": "B", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 114, "no": 64, "stem": "關於「腎前性氮血症（prerenal azotemia）」的敘述，下列何者正確？", "choices": {"A": "其本質為腎小管實質的永久性破壞", "B": "高血鉀通常是最早出現的生化變化", "C": "常因腎血流灌流不足導致過濾壓下降", "D": "必須先出現尿毒症症狀才能診斷", "E": "一旦發生即無法可逆"}, "answer": "C", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 114, "no": 65, "stem": "下列何者為「常染色體顯性多囊腎病（ADPKD）」最常見的致病基因？", "choices": {"A": "PKHD1", "B": "NPHP1", "C": "PKD1", "D": "HNF1B", "E": "CEP290"}, "answer": "C", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 114, "no": 66, "stem": "一名 68 歲男性，有高血壓與第二型糖尿病病史，因慢性腎臟病在門診追蹤腎 功能。實驗室結果顯 示：Creatinine 2.1 mg/dL, eGFR 32 mL/min/1.73 m², UACR 850 mg/g，病人目前無不適主訴及其他症 狀，請問以下哪一項最適合目前對此 病人之照護建議？", "choices": {"A": "此病人屬 CKD Stage 2，僅需年度追蹤即可", "B": "若無症狀可先停用腎臟保護藥物", "C": "鈉離子會大量流失，應提醒病人注意額外補充鈉離子攝取", "D": "開始準備透析導管放置與移植評估", "E": "調整降壓藥物以達<130/80 mmHg 為目標"}, "answer": "E", "is_endocrine": true, "subtopic": "DM", "explanation": "E 對：DM + HTN + UACR >300 mg/g + eGFR 32 → CKD G3b A3 (high risk)。BP 目標 <130/80 為 KDIGO 2021 強烈建議，使用 ACEi/ARB 為一線。A 錯：eGFR 32 屬 stage G3b 非 stage 2。B 錯：腎保護藥物應「加強」而非停。C 錯：CKD 病人應「限鈉」非補鈉。D 錯：透析準備從 eGFR <20 才開始討論，stage 3b 早。", "evidence": "KDIGO Blood Pressure Management in CKD 2021"}, {"year": 114, "no": 67, "stem": "一名 70 歲男性因敗血性休克住進加護病房，使用升壓劑、24 小時皆無尿，抽血鉀離子 6.8 mmol/L、代 謝性酸中毒且意識改變。請選出最合適的透析方式， 並配對正確的臨床因應理由。", "choices": {"A": "腹膜透析（Peritoneal Dialysis, PD），體液移除快，適合立即改善水腫與高血鉀症", "B": "間歇性血液透析（Intermittent Hemodialysis, IHD），清除效率高，可迅速改善酸中毒與高血鉀", "C": "連續腎臟替代治療（Continuous Renal Replacement Therapy, CRRT），溫和持續清除，可穩定血 壓並有效處理高鉀與酸中毒", "D": "先使用靜脈注射葡萄糖與胰島素合併鈣劑暫時穩定血鉀即可，暫不需透析治療", "E": "血液動力學不穩定，應避免進行透析處置，以免進一步惡化循環狀態"}, "answer": "C", "is_endocrine": true, "subtopic": "DM", "explanation": "C 對：敗血性休克 + 升壓劑 + AKI 無尿 + 高鉀 + acidosis + 意識改變 → 血流動力學不穩定 → CRRT (continuous renal replacement therapy) 為最適合方式 (溫和持續清除、穩定 BP)。A 錯：PD 不適合急性 AKI (需腹腔通暢、效率低)。B 錯：IHD 在血壓不穩時會惡化 hypotension。D 錯：高鉀 + uremia 已危及生命，需透析。E 錯：透析適應症明確必須做。本題為腎臟加護題。", "evidence": "KDIGO Acute Kidney Injury Guideline 2012; ATN Trial NEJM 2008"}, {"year": 114, "no": 68, "stem": "請問圖中選項與下列選項何者配對正確？", "choices": {"A": "Potassium", "B": "Aldosterone", "C": "Angiotensin I", "D": "Renin", "E": "Angiotensin II"}, "answer": "C", "is_endocrine": true, "subtopic": "Adrenal", "explanation": "本題為缺圖題 (圖中選項配對)，無法精確判斷。但根據 RAAS 系統典型描述：renin (kidney) → angiotensinogen → angiotensin I → ACE → angiotensin II → adrenal zona glomerulosa → aldosterone → 腎臟 sodium retention + potassium excretion。官方答案 C (angiotensin I) 應是配對 ACE 上游產物的位置。", "evidence": "Williams Endo 14e, Ch 16 The Adrenal Cortex"}, {"year": 114, "no": 69, "stem": "一名 68 歲男性為 CKD Grade 4 病人，主訴近來容易疲倦、胃口差、體重下降。他嘗試限制蛋白質攝取 以延緩腎衰竭惡化，但無營養師介入。下列哪項敘 述最適合作為營養指導原則？", "choices": {"A": "CKD 病人應全面高蛋白飲食以維持營養狀態", "B": "限制蛋白攝取應避免，因易導致低血鉀", "C": "CKD 不會影響營養狀態，不需特別飲食控制", "D": "限制蛋白攝取可能延緩尿毒症進展，但應避免營養不良", "E": "蛋白限制僅適用於已進入透析的病人"}, "answer": "D", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 114, "no": 70, "stem": "某男性在接受心臟手術後出現血壓下降與肌酸酐上升。尿液分析顯示尿比重 1.010，呈等張尿，尿中可見 顆粒管型（granular casts），FeNa 為 3%。 下列哪一種 AKI 類型最可能符合此病人的臨床與實驗室表 現？", "choices": {"A": "腎前性氮血症（Prerenal azotemia）", "B": "缺血相關急性腎損傷（Ischemia- associated AKI）", "C": "腎後性阻塞（Postrenal AKI）", "D": "溶血（Hemolysis）", "E": "造影劑腎病變（Contrast-induced nephropathy）"}, "answer": "B", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 114, "no": 71, "stem": "下列哪些病因與其對應的實驗室特徵配對是正確的？ (1) 腎前性氮血症（Prerenal azotemia）→BUN/Cr 比值 >20，FeNa 1.0% (2) 血栓性微血管病變（TTP/HUS） → 低 LDH、貧血、血小板減少 (3) 腫瘤溶解症候群（Tumor lysis syndrome）→ 高磷血症、高尿酸血症、低鈣血症 (4) 造影劑腎病變（Contrast-induced nephropathy）→ 肌酸酐在 3–5 天後上升、FeNa >2%、24 小時內 完全恢復 (5) 急性間質性腎炎（AIN） → 尿中嗜酸性球(Eosinophilia)增多、無菌性白血球尿(Sterile pyuria)、須配合 腎臟切片", "choices": {"A": "(1)+(2)+(3)", "B": "(1)+(2)+(4)", "C": "(1)+(3)+(4)", "D": "(1)+(3)+(5)", "E": "(2)+(3)+(5)"}, "answer": "D", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 114, "no": 72, "stem": "關於原發性醛固酮增多症（hyperaldosteronism）患者進行腎上腺評估的敘述，哪些正確？ (1) 精細切面電腦斷層是初步評估腎上腺病灶的首選方法。 (2) 所有確診患者都應立即進行選擇性腎上腺靜脈採樣（AVS）。 (3) 腎上腺靜脈採樣（AVS）可比較左右腎上腺靜脈與下腔靜脈中的醛固酮濃度。 (4) 若電腦顯示單側病灶，且病人年齡小於 40 歲，需避免手術。 (5) AVS的正確導管定位需同時量測皮質醇，並顯示下腔靜脈與腎上腺靜脈間的皮質醇濃度梯度大於3。", "choices": {"A": "(1)+(2)+(4)", "B": "(1)+(3)+(5)", "C": "(1)+(4)+(5)", "D": "(2)+(3)+(4)", "E": "(3)+(4)+(5)"}, "answer": "B", "is_endocrine": true, "subtopic": "Adrenal", "explanation": "B 對 (1)+(3)+(5)。(1) Adrenal CT (fine cuts) 為腎上腺評估首選影像。(3) AVS 比較左右 adrenal vein 與 IVC 的 aldosterone (lateralization ratio >4)。(5) AVS 正確 catheterization 需 cortisol 比 (adrenal/IVC) >3 (CRH-non-stimulated) 或 >5 (post-CRH) 才算 successful。(2) 錯：並非所有 PA 都需 AVS — <35 歲 + 單側病灶 + 典型生化可直接手術。(4) 錯：<40 歲應做 AVS 排除 bilateral disease 不是「避免手術」。", "evidence": "Endocrine Society Primary Aldosteronism Clinical Practice Guideline 2016"}, {"year": 114, "no": 73, "stem": "病人突發急性心肌梗塞後伴有心因性休克(Cardiogenic shock)，應首先穩定及復原血壓及組織灌 注(Tissue perfusion)，請問下列何者處置的說法不正確?", "choices": {"A": "病人因心肌梗塞後伴發心因性休克，迅即從事經皮介入手術 (Percutaneous coronary intervention,PCI)開通阻塞血管，可以降低休克死亡率", "B": "因心肌梗塞後休克，經PCI開通阻塞血管後，應盡早啓用主動脈內氣球幫浦(Intra-aortic balloon pump, IABP )，以降低病人的死亡率", "C": "病人心肌梗塞發生休克時，如在18小時內的PCI，經開通阻塞血管，仍舊有助存活率的提昇", "D": "病人有多條冠狀動脈阻塞時，只要首惡病變血管（Culprit lesion）以PCI開通阻塞即可，不必同時多 條血管一次全部完成血管開通", "E": "年過75歲的心梗休克病人以PCI開通阻塞血管，仍是合理的處置"}, "answer": "B", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 114, "no": 74, "stem": "下列有關急性呼吸窘迫症候群(acute respiratory distress syndrome, ARDS)插管使用呼吸器病患的處置何 者錯誤？", "choices": {"A": "建議使用低潮氣容積（4-8 mL/kg）", "B": "中重度ARDS 的病患建議使用俯臥式通氣模式(Prone positioning)", "C": "建議使用短暫高壓（50–60 cmH2O）肺泡再擴張術（recruitment maneuver）", "D": "不建議長時間使用神經肌肉阻斷劑", "E": "可以考慮將適合使用ECMO (extracorporeal membrane oxygenation) 的患者轉介至ECMO centers"}, "answer": "C", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 114, "no": 75, "stem": "一位慢性B型肝炎患者已有肝硬化時，在長期追蹤中應注意其是否發生併發症並予以妥善處理。下列相關 敘述何者錯誤？", "choices": {"A": "若腹水太多，使用利尿劑效果有限時，可考慮單次大量抽出腹水（> 5L），此時應同時輸注白蛋 白，每抽1L腹水應補充6-8g", "B": "若有腹水，本來在服用的ACE inhibitors及NSAIDs最好停止使用", "C": "若併發胸水（hydrothorax），且排除其它病因，應考慮以doxycycline行chemical pleurodesis來治療 之", "D": "若腹水中之中性球（neutrophil）＞250/μL，應立即以第三代cephalosporin予以治療", "E": "即使沒有併發胸水，亦可能出現dyspnea及hypoxemia之症狀"}, "answer": "C", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 114, "no": 76, "stem": "在一位有第2型糖尿病有明顯蛋白尿的患者中，區分單純性糖尿病腎臟病變與非糖尿病性腎絲球病變，下 列哪一項最沒有診斷價值？", "choices": {"A": "被診斷糖尿病的時間長短", "B": "有增殖性視網膜病變", "C": "蛋白尿的嚴重程度", "D": "有腎絲球性血尿", "E": "尿液出現紅血球圓柱體"}, "answer": "C", "is_endocrine": true, "subtopic": "DM", "explanation": "C 對：「蛋白尿嚴重程度」對區分 DKD 與 non-DKD「最沒有診斷價值」(同一個病人都可有 massive proteinuria)。A 對：DM <5 年 + 蛋白尿應懷疑 non-DKD。B 對：proliferative retinopathy 與 DKD 強相關。D/E 對：glomerular hematuria + RBC cast 為 GN 特徵，DKD 罕見。本題與 113#66 重複出題。", "evidence": "KDIGO Diabetes Management in CKD 2022"}, {"year": 114, "no": 77, "stem": "某特殊單位在員工年度體檢須對結核感染(潛伏性)進行篩檢，其中一位62歲員工一年前曾患膀胱癌並 以BCG 治療，最近膀胱鏡檢查並無活動性膀胱癌之證據，也沒有呼吸道或全身性症狀。身體診察生命徵 象和心肺都無異常。請問此時那一項檢查最適當?", "choices": {"A": "CXR", "B": "Tuberculin skin test", "C": "Interferon-γ release assay", "D": "Two-step tuberculin skin testing", "E": "以上皆是"}, "answer": "C", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 114, "no": 78, "stem": "一位40歲女性因為運動後呼吸急促應診，抽血檢查發現血紅素9.7 gm/dL，MCV 69.4 fL，白血球 數3200/μL，分類正常，血小板數335000/μL。回顧她5年前公司體檢，血紅素12.1 gm/dL，MCV 80.3fL，白血球數4300/μL，血小板數355000/μL。這位病人最可能的診斷為？", "choices": {"A": "再生不良性貧血", "B": "缺鐵性貧血", "C": "海洋性貧血", "D": "溶血性貧血", "E": "VitB12缺乏性貧血"}, "answer": "B", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 114, "no": 79, "stem": "下列有關副甲狀腺與血鈣平衡的描述哪一項最正確?", "choices": {"A": "約有10%長期使用鋰鹽的病人可能有高血鈣。一旦造成高血鈣，即使停用鋰鹽，血鈣仍無法恢復正 常", "B": "家族性低尿鈣性高鈣血症(familial hypocalciuric hy 形注射手術後，發生眼瞼下垂、複視及構音困難的狀況，請問下列敘述何者最 不適當？", "choices": {"A": "診斷為破傷風（tetanus），致病原為Clostridium tetani", "B": "治療以支持性治療為主，嚴重者可注射抗毒素", "C": "檢測血清毒素可以做為確診依據", "D": "無法以廣效性抗生素治療或預防", "E": "症狀與神經毒素（neurotoxin）有關"}, "answer": "A", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 114, "no": 95, "stem": "有關困難梭狀桿菌（Clostridioides [Clostridium] difficile）感染（CDI），下列何者組合皆為不適當的描 述？ (1) 萬古黴素（vancomycin）也具有引發後續發生C. difficile colitis的風險。 (2) 對於初次感染，以fidaxomicin或萬古黴素 (vancomycin) 口服持續10天為首選治療。 (3) 針對NAP1/BI/027菌株，CDI首選治療為口服 metronidazole 。 (4) 治療終點為腹瀉停止，不需要再檢測糞便的毒素清除情形。 (5) 多次治療後仍復發的患者，建議可使用針劑 vancomycin 做減量治療（tapered therapy）。", "choices": {"A": "(1)+(3)+(4)+(5)", "B": "(2)+(3)", "C": "(1)+(4)", "D": "(3)+(5)", "E": "(4)+(5)"}, "answer": "D", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 114, "no": 96, "stem": "下列所列致病原，哪一個細菌組合都是具有莢膜（capsulated）？ (1) Streptococcus pneumoniae (2) Haemophilus influenzae (3) Staphylococcus aureus (4) Neisseria meningitidis (5) Pseudomonas aeruginosa", "choices": {"A": "(1)+(2)+(4)", "B": "(3)+(4)", "C": "(4)+(5)", "D": "(1)+(3)", "E": "(1)+(3)+(5)"}, "answer": "A", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 114, "no": 97, "stem": "下列因子可以抑制腦垂體促甲狀腺細胞(thyrotrope) 分泌甲狀腺刺激素(thyroid stimulating hormone, TSH)，哪一項除外?", "choices": {"A": "胰島素(Insulin)", "B": "多巴胺(Dopamine)", "C": "體抑素(Somatostatin)", "D": "類固醇(Glucocorticoids)", "E": "三碘甲狀腺素(Triiodothyronine, T3)"}, "answer": "A", "is_endocrine": true, "subtopic": "Thyroid", "explanation": "A 對 (除外)：胰島素「不」抑制 TSH 分泌。B 多巴胺 (dopamine) 為強力 TSH suppressor (ICU 病人 sick euthyroid 機轉之一)。C somatostatin 直接抑制 thyrotrope TSH 分泌。D glucocorticoid 抑制 TRH/TSH (Cushing 病人 TSH 略低)。E T3 為 negative feedback 主要荷爾蒙 (free T3 進入 thyrotrope 直接抑制 TSH 表現)。", "evidence": "Williams Endo 14e, Ch 11 Thyroid Physiology and Tests"}, {"year": 114, "no": 98, "stem": "下列哪一項描述最正確?", "choices": {"A": "甲狀腺功能亢進合併低血鉀週期性無力症(Hypokalemic periodic paralysis)最常見於西方中年女性", "B": "甲狀腺功能亢進、低下或正常的人都可能有甲狀腺相關眼病變(thyroid-associated ophthalmopathy)", "C": "甲狀腺功能亢進病人最常見的心血管疾病表徵是心房顫動(atrial fibrillation)", "D": "葛雷夫氏症(Graves’ disease)患者的thyroid-stimulating immunoglobulins (TSIs)濃度與甲狀腺荷爾蒙 濃度直接相關", "E": "葛雷夫氏症(Graves’ disease)患者中約 30%、20%、10% 會合併眼病變(ophthalmopathy)、皮膚病 變(dermopathy)、指端粗厚(acropachy)"}, "answer": "B", "is_endocrine": true, "subtopic": "Thyroid", "explanation": "B 對：thyroid-associated ophthalmopathy (TAO/TED) 多見於 Graves' (90%)，但「hypothyroid、euthyroid、hyperthyroid」病人都可出現 (約 5-10% 為 euthyroid TED)。A 錯：thyrotoxic periodic paralysis 最常見於「亞洲中年男性」(尤其 25-40 歲)。C 錯：甲亢最常見 CV 是 sinus tachycardia (AF 約 10-25% 老年甲亢)。D 錯：TSI 與 TED 相關但與 hormone level 不直接相關 (Graves treated 後 TSI 持續高仍可有 TED)。E 錯：Graves 比例為 ophthalmopathy 30-50%、dermopathy 1-4%、acropachy <1%。", "evidence": "ATA Hyperthyroidism Guidelines 2016; EUGOGO Guidelines for TED 2021"}, {"year": 114, "no": 99, "stem": "有關甲狀腺疾病的描述，下列哪一項最正確?", "choices": {"A": "碘過量、碘缺乏、amiodarone、lithium等都可能造成甲狀腺功能低下。亞臨床性甲狀腺低能 症(subclinical hypothyroidism)的懷孕婦女不建議給予甲狀腺素治療", "B": "一位50歲男性被診斷有急性甲狀腺炎(acute thyroiditis)，除了使用抗生素治療，應於急性期趁早做吞 鋇劑顯影、喉頭鏡或電腦斷層等檢查以找出是否有梨狀竇瘻管 (pyriform sinus fistula)", "C": "甲狀腺分化癌經手術全切除後，應依據其癌症分期(cancer staging)考慮放射性碘治療。T1N0M0的病 人給予放射性碘治療，並不會影響再發率(recurrence rate)或存活率(survival rate)", "D": "亞急性甲狀腺炎 (subacute thyroiditis)好發於30-50歲之男性。病程中可以先看到甲狀腺素(thyroxine, T4)上升，甲狀腺刺激素(thyroid stimulating hormone, TSH) 下降，此時放射性碘之攝 取（radioactive iodine uptake）通常會減少或消失", "E": "橋本氏甲狀腺炎(Hashimoto’s thyroiditis) 屬自體免疫性甲狀腺疾病，應鼓勵病人多攝取碘，考慮甲狀 腺過氧化酶抗體(antithyroid peroxidase antibody）之高低給予適量之類固醇，並定期追蹤其甲狀腺 功能，若甲狀腺功能低下，應給予甲狀腺素治療"}, "answer": "C", "is_endocrine": true, "subtopic": "Thyroid", "explanation": "C 對：DTC (papillary/follicular) 經全切除後，T1N0M0 (<2 cm) low-risk 病人「不需 RAI」(no recurrence/survival benefit, RAI 反增 secondary malignancy 風險)。RAI 適用 intermediate-high risk (T2-T4、N1、M1)。A 錯：subclinical hypothyroidism + 懷孕應給 LT4。B 錯：acute thyroiditis pyriform fistula 檢查應在「炎症緩解後」做。D 錯：subacute thyroiditis 好發於「女性 30-50 歲」(非男性)；其餘描述正確。E 錯：Hashimoto 不應多攝取碘 (反加重 autoimmune)。", "evidence": "ATA DTC Guidelines 2015 (Haugen BR)"}, {"year": 114, "no": 100, "stem": "下列有關副甲狀腺及高血鈣的描述哪一項最正確?", "choices": {"A": "副甲狀腺荷爾蒙(parathyroid hormone, PTH) 含84個胺基酸，其碳端(carboxyl-terminal portion) 之34個胺基酸(PTH 1-34) 具生物活性", "B": "抑鈣激素(calcitonin) 可以抑制成骨細胞(osteoblast) 的骨生成(bone formation)，也可以刺激腎臟的鈣 排出(renal clearance)", "C": "甲狀腺功能亢進 (hyperthyroidism)、thiazides利尿劑、維他命A或D 中毒、鋰鹽(lithium)、脂肪溶 解(fat necrosis)等，均可能造成高血鈣(hypercalcemia)", "D": "副甲狀腺素相關胜肽(parathyroid hormone related peptide, PTHrP)可以結合並活化副甲狀腺荷爾蒙 第二型接合器(PTH-2 receptor)，但無法活化副甲狀腺荷爾蒙第一型接合器(PTH-1 receptor)", "E": "一位58歲男性病人兩年前被診斷有無症狀原發性副甲狀腺功能亢進(asymptomatic primary hyperparathyroidism)。他最近一次追蹤，血鈣高出正常值 0.8 mg/dL、肌酸軒廓清(creatinine clearance) 為65 mL/min、腰椎骨密度(lumbar spine bone mineral density) T score 為 -2.0。應該建 議他接受副甲狀腺切除手術治療"}, "answer": "C", "is_endocrine": true, "subtopic": "Calcium-Bone", "explanation": "C 對：高血鈣原因包括 hyperthyroidism (骨吸收增加)、thiazide (減少尿鈣排出)、vitamin A/D 中毒、lithium (CaSR set point 上升)、fat necrosis (saponification → 釋放 Ca + 1,25-D)、肉芽腫病 (sarcoidosis 透過 1α-hydroxylase 活化)。A 錯：PTH 1-84 amino acid，「N-terminal」(amino-terminal) 的 PTH 1-34 才有生物活性 (非 carboxyl-terminal)。B 錯：calcitonin 抑制 osteoclast (不是 osteoblast)，並「增加」尿鈣排出。D 錯：PTHrP 可同時活化 PTH-1R (與 PTH 共用)。E 錯：該病人 Ca 高 0.8 < 1.0、CrCl 65 > 60、T-score -2.0 > -2.5 → 不符 NIH 手術指徵。", "evidence": "Williams Endo 14e, Ch 28-29; Bilezikian JP. AsymptPHPT Guideline"}, {"year": 114, "no": 101, "stem": "有關腎上腺的描述，哪一項最正確?", "choices": {"A": "鹽皮質激素(mineralocorticoid)主要由腎素-血管張力素-醛固酮系統（renin-angiotensin-aldosterone system, RAAS）調控，下視丘-腦垂體(hypothalamus-pituitary)的損傷並不會顯著影響腎上腺合成醛 固酮(aldosterone)", "B": "庫欣氏症候群的病人常見的臨床表徵包括近端肌病變(proximal myopathy)、無月 經(amenorrhea)、白血球減少、增加深部靜脈栓塞(deep vein thrombosis)及肺栓塞(pulmonary embolism)風險等", "C": "原發性皮質醛固酮症(Primary aldosteronism, PA)的病因，單側腎上腺腫瘤 (adrenal adenoma)約 佔60%，雙側腎上腺(小結節)皮質增生(bilateral (micronodular) adrenal hyperplasia)約佔40%", "D": "血管張力素轉化酶抑制劑(angiotensin converting enzyme inhibitors, ACEIs)會使醛固酮對腎素比 值(aldosterone renin ratio, ARR)上升，而乙型阻斷劑(β blockers)會使ARR 下降", "E": "糖皮素缺乏(glucocorticoid deficiency)病人可能有肌肉痠痛、關節痛、發燒、貧血、淋巴球增加、甲 促素(thyroid stimulating hormone, TSH)下降等臨床表徵"}, "answer": "A", "is_endocrine": true, "subtopic": "Adrenal", "explanation": "A 對：mineralocorticoid (aldosterone) 主要由 RAAS 調控 (不受 ACTH 強烈調控)，下視丘-腦垂體損傷不顯著影響 aldosterone (但會影響 cortisol)。B 錯：Cushing 為「白血球增多」(neutrophilia + lymphopenia + eosinopenia)，非減少。C 錯：PA 中 adrenal adenoma 約 30-40%，bilateral hyperplasia 約 60% (老共識)。D 錯：ACEI 使 renin 上升 → ARR 「下降」；β-blocker 使 renin 下降 → ARR 「上升」(假陽性)。E 錯：glucocorticoid 缺乏為 normocytic anemia、TSH 略升 (非下降)。", "evidence": "Endocrine Society Primary Aldosteronism Guideline 2016; Adrenal Insufficiency Guideline 2016"}, {"year": 114, "no": 102, "stem": "有關嗜鉻細胞瘤(pheochromocytoma)的描述, 下列哪一項最正確?", "choices": {"A": "嗜鉻細胞瘤的好發年紀約為40 歲。過去所謂的”rule of tens” 是指約10% 為腎上腺雙側腫瘤、10%為 腎上腺以外腫瘤、10%為良性腫瘤", "B": "嗜鉻細胞瘤被稱為”偉大的偽裝者”( the great masquerader ) ，常見的臨床表現包括頭痛、冒汗、心 悸、高血壓、焦慮、恐慌、低血壓等，但嗜鉻細胞瘤也可能數年皆無症狀", "C": "為避免造成血壓的急遽變化，嗜鉻細胞瘤的診斷定位最好安排無顯影劑(non-contrast)的電腦斷層或 核磁共振檢查", "D": "嗜鉻細胞瘤的治療以手術切除為首選，開刀前應該先以甲型阻斷劑(α-blockers)控制血壓、補充水 分、再視需要加上乙型阻斷劑(β-blockers)。為避免副作用，最好不用鈣離子通道阻斷劑(calcium channel blockers)或血管張力素轉化酶抑制劑(angiotensin converting enzyme inhibitors, ACEIs)", "E": "第2A型多發性內分泌腫瘤（multiple endocrine neoplasia, MEN）以甲狀腺髓質癌(medullary thyroid carcinoma, MTC)、嗜鉻細胞瘤及副甲狀腺功能亢進為主。而第 2B 型 MEN 通常不包括 MTC"}, "answer": "B", "is_endocrine": true, "subtopic": "Thyroid", "explanation": "B 對：嗜鉻細胞瘤稱「the great masquerader」(罕見但症狀多樣)，可能無症狀達數年。A 錯：rule of tens 是「10% 雙側、10% 腎上腺外、10% 惡性、10% 兒童、10% 家族遺傳 (現已知 40% 家族)」，不是「10% 良性」(應為 90% 良性)。C 錯：CT 顯影劑現代非碘化造影劑安全 + α-blocker 預治療後即可。D 對 (但 B 更明確) 整體 surgical preparation。E 錯：MEN 2A 與 2B 都包含 MTC (兩種 MEN type 都有 MTC，不同處在 hyperPT 在 2A、mucosal neuromas 在 2B)。", "evidence": "Endocrine Society Pheochromocytoma Guideline 2014; ATA MTC/MEN Guidelines 2015"}, {"year": 114, "no": 103, "stem": "下列哪一項描述最正確?", "choices": {"A": "一位58歲男性病人，有月亮臉、中樞性肥胖、水牛肩、腹部紫斑、血壓高、血糖高等表徵，他的促 腎上腺皮質激素(Adrenocorticotropic hormone, ACTH)及皮質醇(cortisol)皆高於正常參考值，他最可 能的診斷是醫源性庫欣氏症候群(iatrogenic Cushing’s syndrome)", "B": "一位58歲女性病人被送至急診，她的血壓低、血糖低、血鈉低，身體診察顯示乳暈變淡、腋毛及陰 毛稀少，她最可能的血液檢查結果是ACTH高、cortisol低", "C": "一位58歲男性病人，有月亮臉、中樞性肥胖、水牛肩、腹部紫斑、血壓高、血糖高、近端肌肉無力 等表徵，他的血鉀偏低、LDH 偏高，ACTH 及cortisol偏高且沒有晝夜變化、high dose dexamethasone test 結果為non-suppressible，最適當的影像學檢查是腦垂體核磁共振檢查", "D": "腎上腺偶發瘤 (adrenal incidentaloma) 應該先檢測是否有內分泌功能異常，再安排電腦斷層等影像學 檢查。如果腫瘤≧4cm 且<20 HU，極可能是adrenal cancer", "E": "大約60-70% 的腎上腺皮質癌(adrenal cortical carcinoma, ACC) 有類固醇過量的表現。ACC staging分類中，T2N0M0 為 stage II，而 T2 是指腫瘤大於 5公分"}, "answer": "E", "is_endocrine": true, "subtopic": "Adrenal", "explanation": "E 對：adrenal cortical carcinoma (ACC) 約 60-70% 有 functional steroid 過量表現 (cortisol、aldosterone、androgen、estrogen 任一或多種)；AJCC ACC staging T2 為腫瘤 >5 cm 無 invasion，T2N0M0 = Stage II。A 錯：endogenous Cushing's (ACTH + cortisol 都高) 為 ACTH-dependent Cushing，非 iatrogenic (iatrogenic 是外源性 cortisol → ACTH 被壓抑為低)。B 錯：應為 ACTH 高 + cortisol 低 (Addison's, primary AI 標準)。C 錯：non-suppressible + ACTH 高應做胸 CT 找 ectopic ACTH source (small cell lung 等)。D 錯：incidentaloma 若 ≥4 cm 且「>20 HU + 不均勻」才高度懷疑 ACC，<20 HU 為 lipid-rich adenoma 良性。", "evidence": "ESE/ENSAT Adrenal Carcinoma Guidelines 2018 (Fassnacht et al.)"}, {"year": 114, "no": 104, "stem": "下列有關骨質疏鬆(osteoporosis)的描述，哪一項最正確?", "choices": {"A": "年紀大、男性、白種人、吸菸、喝酒(alcoholism) 等都會增加骨質疏鬆骨折的風險", "B": "庫欣氏症候群、副甲狀腺功能亢進、甲狀腺功能亢進、腎上腺功能不足、肢端肥大症、泌乳激素增加 等內分泌疾病都會增加骨質疏鬆的風險", "C": "Cyclosporine、aluminum、heparin 等藥物會增加骨質疏鬆的風險，而 lithium 可以減少骨質疏鬆風 險", "D": "骨密度(bone mineral density)檢查，”Z-score” 是與同種族、性別的年輕人相較，而”T-score”是與同 年紀、性別的人相較", "E": "臨床上可用serum osteocalcin做為骨生成(bone formation)的生化指標(biochemical marker)，而serum bone-specific alkaline phosphatase則是骨吸收(bone resorption)的生化指標"}, "answer": "B", "is_endocrine": true, "subtopic": "Calcium-Bone", "explanation": "B 對：所有列出的內分泌疾病皆「增加」骨質疏鬆風險：Cushing's (cortisol 抑制 osteoblast)、HPT (PTH 過度刺激破骨)、hyperthyroid (T3 加速骨轉換)、adrenal insufficiency (低 cortisol 影響 bone — 治療用 steroid 反增風險)、acromegaly (GH/IGF-1 vertebral fracture)、prolactinoma (低 estrogen)。A 錯：應為「女性 + 白種人 + 黃種人」(非男性) 風險高。C 錯：lithium 「增加」(非減少) 骨質疏鬆風險。D 錯：定義相反——T-score 與「年輕同性別」相比 (用於診斷)；Z-score 與「同年齡同性別」相比 (用於評估二次原因)。E 錯：osteocalcin 與 BSAP「都」是 bone formation marker；bone resorption marker 為 CTx、NTx、urine deoxypyridinoline。", "evidence": "ISCD/ASBMR Osteoporosis Guidelines; AACE Postmenopausal Osteoporosis Guidelines 2020"}, {"year": 114, "no": 105, "stem": "糖尿病與肥胖常同時出現，被稱為糖胖症（Diabesity），兩者在代謝疾病中息息相關。以下關於這兩種疾 病的敘述，何者錯誤？", "choices": {"A": "根據長期研究顯示，透過規劃良好的飲食與充足規律的運動，可有效降低糖尿病的發生率，主要機轉 在於體重控制", "B": "運動在控制體重方面扮演關鍵角色，且研究指出，運動強度愈高，不僅能降低糖尿病發病風險，亦有 助於減少心血管疾病的死亡率", "C": "美國國家衛生研究院（NIH）進行的 LOOK AHEAD 生活型態研究，針對糖尿病患者實施營養與體重 管理介入，雖有助於血糖與 HbA1c 控制，但研究並未證實此方式能降低糖尿病患者的心血管死亡 率", "D": "除了常見的身體質量指數（Body Mass Index, BMI）之外，與心血管風險更密切相關的肥胖類型為中 央型腹部肥胖（central abdominal obesity）", "E": "根據糖尿病飲食控制的原則，當透過計畫性飲食與運動使體重減輕時，減少的主要為脂肪組織，有助 於延緩病情惡化"}, "answer": "B", "is_endocrine": true, "subtopic": "Other-Endocrine", "explanation": "B 錯：運動強度愈高並非「線性」降低 DM 與 CV mortality。最佳是「中等強度有氧 150 min/wk + 阻力訓練」(ADA/ACSM)；高強度雖部分研究顯示 HIIT 益處，但過強反增 ortho 傷害。A 對：lifestyle 介入主機轉 = 體重控制 (DPP/DPS)。C 對：LookAHEAD 雖改善 HbA1c 但 CV mortality 未顯著降低。D 對：central abdominal obesity 與 CV 風險最相關 (waist circumference > BMI)。E 對：適當減重主減脂肪而非肌肉。", "evidence": "ADA Standards of Care 2024 Lifestyle; LookAHEAD Trial NEJM 2013"}, {"year": 114, "no": 106, "stem": "下列哪一項糖尿病治療藥物，會造成骨質疏鬆(Osteoporosis) 的風險?", "choices": {"A": "Sulfonylurea", "B": "Sodium glucose cotransporter 2 (SGLT2) inhibitor", "C": "Metformin", "D": "Thiazolidinedione (TZD)", "E": "Insulin"}, "answer": "D", "is_endocrine": true, "subtopic": "DM", "explanation": "D 對：TZD (pioglitazone, rosiglitazone) 活化 PPAR-γ → 抑制 osteoblast 生成 + 促進 marrow adipocyte differentiation → 骨密度下降 + fracture 風險上升 (尤其女性末梢骨折)，ADOPT/ACCORD 證實。其他降糖藥對骨密度多為中性。SGLT-2i 早期 CANVAS 顯示 canagliflozin 略增 fracture 但 EMPA-REG 未顯示，整體 SGLT2i 骨骼風險低。", "evidence": "Loke YK et al. CMAJ 2009 TZD and Fracture Risk; ADA Standards of Care 2024"}, {"year": 114, "no": 107, "stem": "在內科臨床血糖控制策略中，胰島素（Insulin）與 GLP-1 受體促效劑（GLP-1 receptor agonist, GLP-1 RA）兩者皆屬於注射型的重要藥物。針對這兩類藥物的臨床應用，下列何者為錯誤的敘述？", "choices": {"A": "GLP-1 RA 與基礎胰島素併用之聯合治療有助於提升血糖控制成效", "B": "對第一型糖尿病的治療，GLP-1 RA 宜合併Insulin 使用，降低胰島素用量", "C": "GLP-1 RA 治療中常見副作用為腸胃不適如噁心與腹脹，而胰島素治療最常見的不良反應為低血糖", "D": "臨床研究指出，GLP-1 RA 在有效降低血糖的同時，可以大幅減輕患者之體重", "E": "基礎型胰島素（Basal insulin）起始劑量的建議通常為每日每公斤體重 0.2 單位（unit/kg/day）"}, "answer": "B", "is_endocrine": true, "subtopic": "DM", "explanation": "B 錯：GLP-1 RA 目前 FDA/EMA 未核准用於 T1DM (因 T1DM 缺 β-cell，GLP-1 機轉受限)。雖少數研究在 T1DM + 肥胖併用可輔助 reduce insulin 劑量，但「非標準療法」。A/C/D/E 對：basal insulin + GLP-1 RA 為標準合療、GI 副作用、體重下降、basal initiation 0.1-0.2 unit/kg/day。", "evidence": "ADA Standards of Care 2024 Insulin and Pharmacologic Therapy"}, {"year": 114, "no": 108, "stem": "陳先生，72歲，糖尿病病史為20年，五年前因冠狀動脈疾病進行心導管置放支架，目前使用藥物包括: 預 混型胰島素 (Ryzodeg insulin)，高血壓藥物為每日 Valsartan 160mg/amlodipine 5mg/Bisoprolol 2.5mg ，膽固醇藥物為 atorvastatin 每日20mg。目前HbA1c 為 6.8%，LDL cholesterol 為 46 mg/dL，HDL cholesterol 39 mg/dL，Triglyceride 為 625 mg/dL，尿液檢查正常，無微量白蛋白尿，但患有背景型視網 膜病變 (Background retinopathy)，目前應該增加使用下列哪一項藥物?", "choices": {"A": "SGLT-2 inhibitor", "B": "Pioglitazone", "C": "PCSK9 inhibitor", "D": "Ezetimibe", "E": "Fenofibrate"}, "answer": "E", "is_endocrine": true, "subtopic": "Lipid", "explanation": "E 對：本例 LDL 已 46 達標 (高危 <70)、TG 625 mg/dL 嚴重高 (>500 屬「胰臟炎風險區」)，應加用 fenofibrate 降 TG 預防 acute pancreatitis (REDUCE-IT 也支持 icosapent ethyl 作為替代)。A SGLT2i 與 LDL/TG 關係小 (但對 DM/HF 益處)。B Pioglitazone 提高 HDL 但對 TG 影響不大且有水腫風險。C PCSK9i 主降 LDL，TG 影響小。D Ezetimibe 降 LDL 不降 TG。", "evidence": "ADA Standards of Care 2024 Lipid; REDUCE-IT NEJM 2019"}, {"year": 114, "no": 109, "stem": "一位83歲男性因感到倦怠前來就診，無糖尿病史，初診身體檢查顯示：BMI 為 28 kg/m²，血壓為 130/90 mmHg，下肢可見輕微水腫，其餘並無明顯異常。抽血檢查結果為：肌酸酐（Cre）2.3 mg/dL、eGFR 為 28ml/min/1.73 m²、AST 30 U/L、ALT 25 U/L、糖化血色素（HbA1c）8.6%、空腹血糖 160 mg/dL，餐 後血糖為 223 mg/dL。尿液檢查顯示明顯巨量之微白蛋白尿(microalbuminuria)。除了建議調整生活型態 與飲食控制之外，下列藥物處置何者最適當？", "choices": {"A": "Metformin", "B": "Empagliflozin, SGLT-2 inhibitor (sodium-glucose co-transporter 2 inhibitor)", "C": "Linagliptin, DPP-4 inhibitor (dipeptidyl peptidase-4 inhibitor)", "D": "Glimepiride, Sulfonylurea", "E": "Pioglitazone, Thiazolidinedione (TZD)"}, "answer": "C", "is_endocrine": true, "subtopic": "DM", "explanation": "C 對：83 歲 + eGFR 28 (CKD G4) + HbA1c 8.6% + 蛋白尿 → DPP-4i (linagliptin) 為較安全選擇 (linagliptin 不經腎排，無需 dose adjustment)，且 well-tolerated 在老人。A 錯：Metformin eGFR <30 禁忌。B 錯：empagliflozin 在 eGFR 28 仍可考慮但起始劑量 + 監測 (現指引 eGFR ≥20 可用)；不過老人 + 脫水風險先選 DPP-4i 較穩妥。D 錯：SU (glimepiride) 在 CKD/老人易低血糖。E 錯：TZD 加重水腫不適合。", "evidence": "ADA Standards of Care 2024 Older Adults; KDIGO Diabetes in CKD 2022"}, {"year": 114, "no": 110, "stem": "Metformin 為 Biguanides 類藥物，目前被國際多數糖尿病治療指引列為第一線用藥。關於 Metformin 的 下列敘述，何者不正確？", "choices": {"A": "Metformin 有可能導致維生素 B12 吸收不良，進而造成B12之缺乏", "B": "雖然乳酸中毒是 Metformin 罕見的副作用，但一旦發生，其死亡率可高達 50%", "C": "Metformin 的使用可延緩糖尿病的發展與惡化", "D": "在懷孕期間，Metformin 為可考慮之糖尿病治療選項之一", "E": "對於腎功能不全患者， eGFR 小於 30 ml / min / 1.73㎡，Metformin 的使用是安全的"}, "answer": "E", "is_endocrine": true, "subtopic": "DM", "explanation": "E 錯：Metformin 在 eGFR <30 「禁忌」(lactic acidosis 風險)，不是「安全」。A 對：B12 malabsorption 已知 (長期使用 30% 缺乏)。B 對：MALA 死亡率 30-50%。C 對：DPP/DPS 證實延緩 DM。D 對：metformin 是妊娠期 DM 的可考慮選項 (但傳統首選為胰島素，metformin 替代逐漸接受)。", "evidence": "ADA Standards of Care 2024 Metformin; FDA Metformin Label"}, {"year": 114, "no": 111, "stem": "一位68歲男性，患有第二型糖尿病超過15年，近日主訴夜間頻尿與視力模糊。身高170 cm，體重78公 斤，血壓138/86 mmHg。抽血檢查結果為：HbA1c 8.2%，eGFR 40 mL/min/1.73m²，尿液檢查顯示 albumin-to-creatinine ratio (UACR) 為 210 mg/g。眼底檢查顯示非增殖型視網膜病變（NPDR）。目前使 用藥物為 Metformin 1000 mg BID 及 Sitagliptin 100 mg QD。有關此病人治療建議的敘述，何者為錯 誤？", "choices": {"A": "考慮合併使用 SGLT2 抑制劑可延緩腎功能惡化，有助於減少心血管事件發生", "B": "病人已有中度腎病變，Metformin 可繼續使用，但須定期監測腎功能", "C": "GLP-1 receptor agonist 可做為合併治療選項，有助於血糖及體重控制", "D": "DPP-4 抑制劑及 GLP-1 receptor agonist 屬 incretin 類藥物，合併使用可加強血糖控制", "E": "病人之 UACR > 200 mg/g，即使血壓未超過140/90 mmHg，仍應考慮使用 ACEi 或 ARB 作為腎臟 保護"}, "answer": "D", "is_endocrine": true, "subtopic": "DM", "explanation": "D 錯：DPP-4i 與 GLP-1 RA 雖都屬「incretin pathway」，但「不應併用」(機轉重複、無臨床益處、增加副作用機會 + 經濟負擔)。ADA 明確不建議共用。A/B/C/E 對：SGLT2i 在 CKD/CV 有益、metformin eGFR 40 可繼續、GLP-1 RA 適合 obese DM、UACR >300 + DM 應用 ACEi/ARB 即使 BP 正常。", "evidence": "ADA Standards of Care 2024; AACE DM Guidelines 2023"}, {"year": 114, "no": 112, "stem": "一位75歲男性，有第二型糖尿病與心臟衰竭病史（LVEF 38%，HFrEF）。現用藥包括 Metformin 、Bisoprolol 、 Sacubitril / Valsartan、Furosemide 與 Atorvastatin。近來出現下肢水腫惡化與輕度呼吸 困難，體重增加2公斤。實驗室數據顯示：HbA1c 8.4%，eGFR 58 mL / min / 1.73m²，NT-proBNP 明顯 上升。以下哪一項治療策略最不適合？", "choices": {"A": "SGLT2 抑制劑可改善血糖及心衰之病程，並進一步降低心血管死亡與住院風險", "B": "目前持續使用 Metformin 為安全且合適的選擇，不會增加心衰惡化風險", "C": "針對血糖控制，可考慮加上 saxagliptin (DPP-4 抑制劑)", "D": "考量體液滯留與心衰惡化，目前不應使用 Thiazolidinedione (Pioglitazone)", "E": "針對血糖控制，當其他藥物無效或有禁忌時，胰島素可作為後線使用的選擇"}, "answer": "C", "is_endocrine": true, "subtopic": "DM", "explanation": "C 不適合：DPP-4i 中 saxagliptin 在 SAVOR-TIMI 53 trial 顯示「增加 HF hospitalization 風險」(2014 FDA Safety Warning)，故有 HF 病史不應用。其他 DPP-4i (linagliptin、sitagliptin) 也應謹慎。A 對：SGLT2i 對 HFrEF 強烈推薦 (DAPA-HF/EMPEROR-Reduced)。B 對：Metformin eGFR 58 安全。D 對：TZD 致水腫不用於 HF。E 對：insulin 為 backup 選項。", "evidence": "SAVOR-TIMI 53 NEJM 2013; FDA Drug Safety Communication on Saxagliptin"}, {"year": 114, "no": 113, "stem": "一位60歲男性，體重72公斤，罹患黑色素惡性腫瘤，接受免疫療法後出現肝炎。治療上給予高劑量類固 醇： methylprednisolone 160 mg / 日，使用2天後改為80 mg/日持續4週。關於類固醇的使用，下列何者 正確？", "choices": {"A": "因疫情控制良好，可立即停止使用類固醇", "B": "類固醇副作用多，因此不適合本病人使用", "C": "類固醇應由高劑量逐漸減量至低劑量，之後再停藥", "D": "當劑量減至20 mg/日時可直接停藥", "E": "當劑量減至10 mg/日時可直接停藥"}, "answer": "C", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 114, "no": 114, "stem": "承接上題，下列敘述何者正確？(1) 此病人接受免疫療法後，可能出現免疫相關副作用（immune-related adverse events, irAE）。(2) 免疫相關副作用不會侵犯腦下垂體（hypophysis cerebri）。(3) 此病人的免 疫相關副作用最常侵犯皮膚。 (4) 此病人的免疫相關副作用不會造成白斑症（vitiligo）。(5) 此病人的免 疫相關副作用不會侵犯心臟。", "choices": {"A": "(1)+(2)", "B": "(1)+(3)", "C": "(2)+(3)", "D": "(2)+(4)", "E": "(3)+(5)"}, "answer": "B", "is_endocrine": true, "subtopic": "Pituitary", "explanation": "B 對 (1)+(3)。免疫療法 (ICI, immune checkpoint inhibitor) 治療癌症: (1) 對：irAEs 確可發生 (任何器官)。(3) 對：皮膚是 irAEs 最常受侵犯器官 (rash, vitiligo, pruritus)。(2) 錯：hypophysitis (anti-CTLA-4 ipilimumab 約 5-10%) + 甲狀腺炎 + adrenal insufficiency 都常見。(4) 錯：vitiligo 確為 irAEs 的皮膚表現 (T-cell-mediated melanocyte 破壞，特別 anti-PD1 治療 melanoma 病人)。(5) 錯：immune myocarditis 雖罕見但 mortality 高。", "evidence": "ESMO Clinical Practice Guidelines for Immune-related Adverse Events 2017"}, {"year": 114, "no": 115, "stem": "一位68歲女性因腹痛、偶發性發燒及體重減輕而住院。腹部電腦斷層（CT）檢查顯示腹膜後有腫塊，臨 床醫師懷疑為IgG4相關疾病（IgG4-RD）。下列關於IgG4-RD的敘述，何者正確？", "choices": {"A": "IgG4-RD患者的血清IgG4濃度必定會升高", "B": "組織切片中顯示IgG4+/IgG+ 漿細胞比例 > 40%", "C": "組織切片中顯示IgG4+/IgG+ 漿細胞比例 > 10%", "D": "血清IgG4大於15 mg/dL有助於診斷IgG4-RD", "E": "血清IgG4大於35 mg/dL有助於診斷IgG4-RD"}, "answer": "B", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 114, "no": 116, "stem": "一位 61 歲男性，早期類風濕性關節炎（RA），合併高 CRP 與 ESR，且 RF 與 anti-CCP 抗體皆為陽 性。經過 2 個月的 DMARDs 治療後，RA 症狀改善，但病人開始出現乾咳與呼吸困難，無發燒現象。醫 師懷疑為肺間質性疾病（ILD）。下列何者敘述正確？", "choices": {"A": "肺間質性疾病（ILD）大多屬於慢性阻塞性肺病", "B": "診斷肺間質性疾病（ILD）最好的檢查是胸部超音波", "C": "診斷肺間質性疾病（ILD）最有效的檢查方法是高解析度電腦斷層掃描（HRCT）", "D": "肺間質性疾病（ILD）不會與自體免疫疾病併發", "E": "類風濕性關節炎導致肺間質性疾病（ILD）的致病機轉已完全明瞭"}, "answer": "C", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 114, "no": 117, "stem": "第一型干擾素（Type I Interferon）被認為是系統性紅斑性狼瘡（SLE）致病機轉中的一個重要因素。下 列有關其敘述，何者正確？", "choices": {"A": "美國FDA尚未核准以抗第一型干擾素受體 IFNAR1抗體anifrolumab治療紅斑性狼瘡", "B": "血中第一型干擾素的濃度與紅斑性狼瘡的疾病活動度呈正相關", "C": "在紅斑性狼瘡病人的血中測不到第一型干擾素", "D": "紅斑性狼瘡病人之末梢血液中的血球無法測得與第一型干擾素相關的基因表現", "E": "血中第一型干擾素濃度升高與狼瘡性腎炎的發生不呈正相關"}, "answer": "B", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 114, "no": 118, "stem": "一位2週大的男性新生兒被發現在雙側臉部出現環狀斑塊型皮疹，邊緣腫脹且中央結痂。嬰兒之母過去無 任何疾病史。下列哪一項敘述正確？", "cho %，lymphocyte 63%，monocyte 11%，eosinophil 1%，platelet 14 K / μL，骨髓檢查 顯示造血細胞極度減少，但無異常細胞的浸潤；肝、腎功能正常。下列何者為最適當之治療？", "choices": {"A": "Allogeneic hematopoietic stem cell transplantation", "B": "Anti-thymocyte globulin", "C": "Steroid", "D": "Anabolic hormone", "E": "Alpha-interferon"}, "answer": "B", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 114, "no": 130, "stem": "一位50歲婦人因為左上腹脹痛求診，血液檢查顯示Hb 10.5 gm/dL，WBC 322380/μL，血小板156 K/μL；血液抹片如圖所示。此病人最可能的診斷為？", "choices": {"A": "Acute myeloid leukemia", "B": "Acute lymphoblastic leukemia", "C": "Chronic myeloid leukemia", "D": "Chronic myelomonocytic leukemia", "E": "Chronic neutrophilic leukemia"}, "answer": "C", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 114, "no": 131, "stem": "一位33歲女性在例行體檢中發現Hb為 9.3 gm/dL，RBC 5.51x10⁶/μL，Hct 31.2%，WBC 4220/μL，platelet 166 K/μL，血液抹片如圖所示。這位病人最可能的診斷為？", "choices": {"A": "Anemia of chronic disorder", "B": "Autoimmune hemolytic anemia", "C": "Iron deficiency anemia", "D": "Thalassemia", "E": "Folic acid deficiency anemia"}, "answer": "D", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 114, "no": 132, "stem": "一位70歲病人被發現白血球數目增多，其Hb為13.2 gm/dL，白血球72800/μL，其中lymphocyte 86%，neutrophil 11.5%，monocyte 1.5%，eosinophil 1%, 血小板165 K/μL。身體檢查顯示頸部及腋下 淋巴結腫大，約2~3公分，脾臟在左肋下緣1指幅可觸摸到；流氏細胞儀分析證實為B細胞慢性淋巴性白血 病，病人無特殊不適。下列何者為對此病人最適當的治療？", "choices": {"A": "Ibrutinib", "B": "Venetoclax", "C": "Chlorambucil", "D": "Steroid", "E": "Watchful waiting"}, "answer": "E", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 114, "no": 133, "stem": "一位65歲病人因腹痛被送到急診室，電腦斷層顯示retroperitoneal hematoma。抽血檢查顯示Hb 10 gm/dL，WBC 10500/μL，platelet 165 K/μL；PT INR 1.1，aPTT 40” (正常對照27”)，mixing test與正常 血漿混合後aPTT 37”。這位病人腹部出血的原因最可能為?", "choices": {"A": "Hereditary factor VIII deficiency", "B": "Hereditary factor VII deficiency", "C": "Acquired inhibitor to factor VIII", "D": "Acquired inhibitor to factor VII", "E": "Antiphospholipid antibody syndrome"}, "answer": "C", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 114, "no": 134, "stem": "一位35歲男性被診斷得了急性淋巴芽細胞白血病(ALL)，白血病細胞基因檢測發現有BCR::ABL不正常的融 合基因，下列敘述何者有誤？", "choices": {"A": "這個基因變異在成人ALL的發生率較孩童ALL高", "B": "病人的ALL細胞表面有CD3的表現", "C": "染色體檢查可發現有t(9;22)", "D": "Dasatinib治療此病很有效", "E": "異體造血幹細胞移植可以改善病人的預後"}, "answer": "B", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 114, "no": 135, "stem": "急性骨髓性白血病人帶有下列何種染色體或基因突變者預後較差？ (1) t(6;9)(p23;q34) (2) t(9;22)(q34;q11) (3) inv(3)(q21q26) (4) mutated TP53", "choices": {"A": "(1)+(2)", "B": "(2)+(4)", "C": "(1)+(2)+(3)", "D": "(2)+(3)+(4)", "E": "(1)+(2)+(3)+(4)"}, "answer": "E", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 114, "no": 137, "stem": "除了腫瘤負荷(tumor burden)之外，影響治療結果的第二個主要因素是病人的生理儲備能力（physiologic reserve）。在罹癌之前就長期臥床的病人，即使癌症分期相同，其預後通常會比完全活動自如的病人 差。生理儲備能力決定了一位病人能否承受癌症及其治療所帶來的生理壓力。然而，這項因素難以直接評 估，因此臨床上會參考其他替代指標，例如ECOG體能狀態評估（ECOG performance status, PS）或病 人的年齡。ECOG PS 分數在3分以上的病人，通常預後不佳，除非體能狀態差是腫瘤造成的且是可逆轉 的情況。下列描述相對應屬於哪一級的 ECOG 體能狀態（PS）？「病人可行走並能完成所有自我照 護，但無法從事正常工作活動。有超過一半的清醒時間中，病人是可以起身活動的。」", "choices": {"A": "ECOG PS 0", "B": "ECOG PS 1", "C": "ECOG PS 2", "D": "ECOG PS 3", "E": "ECOG PS 4"}, "answer": "C", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 114, "no": 138, "stem": "只有某些癌症可以抽血檢測某些特定物質來偵測腫瘤的存在或負荷量(loads)，稱之為「腫瘤標記」(tumor markers)。下列何者屬於甲狀腺髓質癌(Medullary cancer of the thyroid)特定的「腫瘤標記」?", "choices": {"A": "Catecholamines", "B": "Human chorionic gonadotropin", "C": "Neuron-specific enolase", "D": "Calcitonin", "E": "Monoclonal immunoglobulin"}, "answer": "D", "is_endocrine": true, "subtopic": "Thyroid", "explanation": "D 對：Calcitonin 為甲狀腺 C-cell 分泌的荷爾蒙，是 medullary thyroid cancer (MTC) 的特異 tumor marker，用於 (1) 診斷 (basal + pentagastrin/calcium-stimulated)、(2) 監測復發、(3) 篩檢 MEN2 家族成員。A Catecholamines 為 pheochromocytoma。B hCG 為 trophoblastic/germ cell tumor。C NSE 為 small cell lung、neuroblastoma。E monoclonal Ig 為 multiple myeloma。", "evidence": "ATA Medullary Thyroid Cancer Guidelines 2015 (Wells SA)"}, {"year": 114, "no": 139, "stem": "人類乳突病毒(HPV)疫苗接種可用於降低子宮頸癌的發生。下列何者為與人類子宮頸癌(Cervical cancer)發生「致癌性最高」的兩個HPV亞種(strains)?", "choices": {"A": "HPV亞種6, 11", "B": "HPV亞種16, 18", "C": "HPV亞種11, 31", "D": "HPV亞種31, 33", "E": "HPV亞種45, 52"}, "answer": "B", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 114, "no": 140, "stem": "大多數乳癌為雌激素受體(ER)陽性。當乳癌在第一線荷爾蒙治療後，出現腫瘤惡化(progressive disease) 時，約有 40% 的病人會出現雌激素受體基因(ESR1)的突變。選擇性雌激素受體降解劑(SERDs, Selective estrogen receptor degraders)是一類新興的口服藥物，透過標靶野生型與突變型的雌激素受體，阻斷其訊 號傳遞並促使其在細胞內被降解。目前已有數種此類SERDs藥物正在臨床開發中，以下哪一項為新一代 口服選擇性雌激素受體降解劑（Oral SERD）？", "choices": {"A": "Tamoxifen", "B": "Arimidex", "C": "Letrozole", "D": "Camizestrant", "E": "Palbociclib"}, "answer": "D", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 114, "no": 142, "stem": "胰腺導管腺癌(PDAC, Pancreatic ductal adenocarcinoma)的分子特徵顯示，有數個基因常見突變或失去 活性。確定特定突變類型非常重要，因為特定突變可能對應特定藥物療法。下列哪一個基因在胰腺導管腺 癌(PDAC)中出現突變之機率最高？", "choices": {"A": "TP53", "B": "KRAS", "C": "DPC4/MADH4", "D": "BRCA1", "E": "BRCA2"}, "answer": "B", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 114, "no": 143, "stem": "在癌症精準醫療的發展中，「跨癌別」（tumor-agnostic）的生物標記可指引特定抗癌藥物的使用，並已 獲得美國FDA的核准。這些跨癌別生物標記不依腫瘤原發部位，而是依分子特徵選擇治療。 下列何者是腫瘤藥物治療學歷史上「第一個」被美國FDA核准的「跨癌別」生物標記？", "choices": {"A": "EGFR 突變", "B": "BRAF V600E 突變", "C": "RET 融合", "D": "NTRK融合", "E": "MSI-H/dMMR（微衛星不穩定性高／錯配修復缺陷）"}, "answer": "E", "is_endocrine": false, "subtopic": null, "explanation": null, "evidence": null}, {"year": 114, "no": 144, "stem": "染色體改變為癌症中的基因變化提供了重要線索。染色體轉位（translocations）常見於液態腫瘤（liquid tumors），尤其是在血癌與淋巴腫瘤（lymphoid tumors）較為常見。人體實體腫瘤（solid tumors）中的 染色體改變具有異質性且相當複雜，通常由於這些腫瘤中常見的染色體不穩定性所造成的。近年來，在幾 種實 const $ = (id) => document.getElementById(id);
const main = $('questions');

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
}

function highlight(text, term) {
  if (!term) return escapeHtml(text);
  const re = new RegExp(`(${term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`, 'gi');
  return escapeHtml(text).replace(re, '<mark>$1</mark>');
}

const TOPIC_LABELS = {"DM": "糖尿病 (DM)", "Thyroid": "甲狀腺 (Thyroid)", "Pituitary": "腦下垂體 (Pituitary)", "Adrenal": "腎上腺 (Adrenal)", "Calcium-Bone": "鈣磷骨代謝 (Ca/Bone)", "Lipid": "血脂 (Lipid)", "Reproductive": "生殖內分泌 (Reproductive)", "Other-Endocrine": "其他內分泌 (Other)"};
const YEAR_LABELS = {"109": "109 年 (2020)", "110": "110 年 (2021)", "111": "111 年 (2022)", "112": "112 年 (2023)", "113": "113 年 (2024)", "114": "114 年 (2025)"};

function renderQuestion(r, term) {
  const choices = ['A','B','C','D','E'].map(L => {
    const txt = r.choices[L];
    if (!txt) return '';
    const cls = (r.answer === L) ? 'correct' : '';
    return `<li class="${cls}"><span class="letter">${L}.</span> ${highlight(txt, term)}</li>`;
  }).join('');

  const topicChip = r.is_endocrine && r.subtopic
    ? `<span class="topic-chip">${TOPIC_LABELS[r.subtopic] || r.subtopic}</span>` : '';

  const explBlock = r.explanation
    ? `<details class="expl"><summary>📖 詳解</summary>
         <div class="body">${escapeHtml(r.explanation)}</div>
         ${r.evidence ? `<div class="evidence">📎 依據：${escapeHtml(r.evidence)}</div>` : ''}
       </details>` : '';

  return `<article class="question ${r.is_endocrine ? 'endo' : ''}">
    <div class="q-head">
      <span class="year-chip">${YEAR_LABELS[r.year] || (r.year + ' 年')}</span>
      <span class="no-chip">第 ${r.no} 題</span>
      ${topicChip}
      <span class="ans-chip">答 ${r.answer}</span>
    </div>
    <div class="stem">${highlight(r.stem, term)}</div>
    <ol class="choices">${choices}</ol>
    ${explBlock}
  </article>`;
}

function render() {
  const y = $('f-year').value;
  const t = $('f-topic').value;
  const endoOnly = $('f-endo').classList.contains('active');
  const term = $('f-search').value.trim();

  const filtered = RECORDS.filter(r => {
    if (y !== 'all' && String(r.year) !== y) return false;
    if (t !== 'all' && r.subtopic !== t) return false;
    if (endoOnly && !r.is_endocrine) return false;
    if (term) {
      const hay = (r.stem + ' ' + Object.values(r.choices).join(' ')).toLowerCase();
      if (!hay.includes(term.toLowerCase())) return false;
    }
    return true;
  });

  if (filtered.length === 0) {
    main.innerHTML = '<div class="empty">沒有符合條件的題目。</div>';
  } else {
    main.innerHTML = filtered.map(r => renderQuestion(r, term)).join('');
  }
  $('stats').textContent = `顯示 ${filtered.length} / ${RECORDS.length} 題`;
}

$('f-year').addEventListener('change', render);
$('f-topic').addEventListener('change', render);
$('f-endo').addEventListener('click', () => {
  $('f-endo').classList.toggle('active');
  render();
});
$('f-search').addEventListener('input', render);

// Initial: show endocrine only by default
$('f-endo').classList.add('active');
render();
</script>
