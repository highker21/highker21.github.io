<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>內心的力量（需密碼）</title>
<style>
  :root{ --accent:#2fa4e7; --ink:#333; --muted:#777; --line:#e3e3e3; --bg:#fff; --card:#fafbfc; }
  @media (prefers-color-scheme: dark){
    :root{ --ink:#e6e6e6; --muted:#9aa0a6; --line:#333; --bg:#1b1c1d; --card:#242526; }
  }
  *{ box-sizing:border-box; }
  body{ margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
        padding:1.5rem; background:var(--bg); color:var(--ink);
        font:16px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC",Arial,sans-serif; }
  .box{ width:100%; max-width:400px; background:var(--card); border:1px solid var(--line);
        border-top:4px solid var(--accent); border-radius:8px; padding:1.75rem 1.5rem; }
  h1{ margin:0 0 .35rem; font-size:1.25rem; }
  .sub{ margin:0 0 1.25rem; color:var(--muted); font-size:.88rem; }
  label{ display:block; font-size:.85rem; color:var(--muted); margin-bottom:.35rem; }
  input{ width:100%; padding:.6rem .7rem; font-size:1rem; border:1px solid var(--line);
         border-radius:5px; background:var(--bg); color:var(--ink); }
  input:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  button{ width:100%; margin-top:.85rem; padding:.62rem; font-size:1rem; font-weight:600;
          color:#fff; background:var(--accent); border:0; border-radius:5px; cursor:pointer; }
  button:disabled{ opacity:.55; cursor:progress; }
  .msg{ margin-top:.85rem; font-size:.86rem; min-height:1.3em; }
  .err{ color:#c0392b; }
  .ok{ color:var(--muted); }
  .back{ display:inline-block; margin-top:1.1rem; color:var(--accent); font-size:.84rem; text-decoration:none; }
</style>
</head>
<body>
<div class="box">
  <h1>內心的力量</h1>
  <p class="sub">個人學習筆記，內容已加密。請輸入密碼閱讀。</p>
  <form id="f" autocomplete="off">
    <label for="pw">密碼</label>
    <input id="pw" type="password" autocomplete="current-password" autofocus>
    <button id="go" type="submit">開啟筆記</button>
  </form>
  <p class="msg" id="m"></p>
  <a class="back" href="./">← 回課程筆記目錄</a>
</div>

<script>
// 內容以 AES-256-GCM 加密存在 inner-power.enc.json，金鑰由密碼經 PBKDF2-SHA256（60 萬次）導出。
// 沒有密碼就只有密文——這不是「用 JS 蓋一層輸入框」的假保護。
const $ = id => document.getElementById(id);
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
let cache = null;

async function load() {
  if (cache) return cache;
  $('m').className = 'msg ok'; $('m').textContent = '下載中（約 6.8 MB）…';
  const r = await fetch('inner-power.enc.json', { cache: 'force-cache' });
  if (!r.ok) throw new Error('讀取失敗 HTTP ' + r.status);
  cache = await r.json();
  return cache;
}

$('f').addEventListener('submit', async e => {
  e.preventDefault();
  const pw = $('pw').value;
  if (!pw) return;
  $('go').disabled = true;
  try {
    const d = await load();
    $('m').className = 'msg ok'; $('m').textContent = '解密中…';
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: b64(d.salt), iterations: d.iter, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(d.iv) }, key, b64(d.ct));
    const html = new TextDecoder().decode(plain);
    document.open(); document.write(html); document.close();
  } catch (err) {
    $('go').disabled = false;
    $('m').className = 'msg err';
    $('m').textContent = /operation-specific|OperationError|decrypt/i.test(String(err))
      ? '密碼不對。' : ('出錯了：' + err.message);
  }
});
</script>
</body>
</html>
